<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>乘客队列记录工具测试</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      margin: 0;
      padding: 24px;
      color: #202938;
      background: #f6f8fb;
    }

    h1 {
      margin-top: 0;
    }

    #summary {
      padding: 12px 16px;
      border-radius: 8px;
      background: #e8edf4;
      font-weight: 700;
    }

    #summary.pass {
      color: #166534;
      background: #dcfce7;
    }

    #summary.fail {
      color: #991b1b;
      background: #fee2e2;
    }

    #results {
      padding-left: 24px;
    }

    #results li {
      margin: 10px 0;
    }

    .pass {
      color: #16803c;
    }

    .fail {
      color: #c33b32;
    }

    iframe {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>
<body data-status="running" data-failures="0">
  <h1>乘客队列记录工具测试</h1>
  <p id="summary">正在等待生产页面加载...</p>
  <ol id="results"></ol>
  <iframe id="app" title="乘客队列记录工具"></iframe>

  <script>
    const results = document.querySelector('#results');
    const summary = document.querySelector('#summary');
    let passed = 0;
    let failed = 0;
    let suiteFinished = false;
    let timeoutId;
    const STORAGE_KEY = 'passenger-queue-recorder-state-v5';
    const originalStoredState = localStorage.getItem(STORAGE_KEY);
    let loadPhase = 'initial';
    const DEFAULT_COLORS = [
      { name: '红色', value: 1, hex: '#e54c4c' },
      { name: '黄色', value: 2, hex: '#f3bd3d' },
      { name: '蓝色', value: 3, hex: '#3478f6' },
      { name: '绿色', value: 4, hex: '#32a852' },
      { name: '粉色', value: 5, hex: '#ec71a5' },
      { name: '紫色', value: 6, hex: '#8b5cf6' },
      { name: '天蓝色', value: 7, hex: '#58bde9' },
      { name: '棕色', value: 8, hex: '#8b5a3c' },
      { name: '橙色', value: 9, hex: '#f97316' },
      { name: '黑色', value: 10, hex: '#202529' },
      { name: '白色', value: 11, hex: '#f7f7f2' }
    ];
    const EMPTY_SECTIONS = { conveyor: [], left: [], right: [] };

    function assert(condition, message) {
      if (!condition) throw new Error(message);
    }

    function normalize(value) {
      if (Array.isArray(value)) {
        return value.map(normalize);
      }
      if (value && typeof value === 'object') {
        return Object.keys(value).sort().reduce((normalized, key) => {
          normalized[key] = normalize(value[key]);
          return normalized;
        }, {});
      }
      return value;
    }

    function serialize(value) {
      return JSON.stringify(normalize(value));
    }

    function clone(value) {
      return JSON.parse(JSON.stringify(value));
    }

    function withStoredState(value, operation) {
      const previousValue = localStorage.getItem(STORAGE_KEY);
      try {
        if (value === null) {
          localStorage.removeItem(STORAGE_KEY);
        } else {
          localStorage.setItem(STORAGE_KEY, value);
        }
        return operation();
      } finally {
        if (previousValue === null) {
          localStorage.removeItem(STORAGE_KEY);
        } else {
          localStorage.setItem(STORAGE_KEY, previousValue);
        }
      }
    }

    function restoreOriginalStoredState() {
      if (originalStoredState === null) {
        localStorage.removeItem(STORAGE_KEY);
      } else {
        localStorage.setItem(STORAGE_KEY, originalStoredState);
      }
    }

    window.addEventListener('pagehide', restoreOriginalStoredState);

    function equal(actual, expected, message) {
      assert(
        serialize(actual) === serialize(expected),
        `${message}，期望：${serialize(expected)}，实际：${serialize(actual)}`
      );
    }

    function assertPure(label, input, operation) {
      const inputSnapshot = clone(input);
      const output = operation();
      equal(input, inputSnapshot, `${label} 突变了输入状态`);
      return output;
    }

    function addResult(kind, name, detail) {
      const item = document.createElement('li');
      item.className = kind;
      item.append(`${kind.toUpperCase()}：${name}`);
      if (detail) {
        item.append(document.createElement('br'), detail);
      }
      results.append(item);
    }

    function test(name, fn) {
      try {
        fn();
        passed += 1;
        addResult('pass', name);
      } catch (error) {
        failed += 1;
        addResult('fail', name, error.message);
      }
    }

    function finish() {
      if (suiteFinished) return;
      suiteFinished = true;
      clearTimeout(timeoutId);
      restoreOriginalStoredState();
      const status = failed === 0 ? 'pass' : 'fail';
      document.body.dataset.status = status;
      document.body.dataset.failures = String(failed);
      summary.className = status;
      summary.textContent = `汇总：PASS ${passed} / FAIL ${failed}`;
    }

    function failSuite(name, error) {
      if (suiteFinished) return;
      failed += 1;
      addResult('fail', name, error instanceof Error ? error.message : String(error));
      finish();
    }

    window.addEventListener('error', event => {
      failSuite('测试页脚本异常', event.error || event.message);
    });

    window.addEventListener('unhandledrejection', event => {
      failSuite('测试页 Promise 异常', event.reason);
    });

    timeoutId = setTimeout(() => {
      failSuite('测试页执行超时', '生产页面加载回调未在限定时间内完成');
    }, 3000);

    const appFrame = document.querySelector('#app');

    appFrame.addEventListener('load', () => {
      if (suiteFinished) return;

      try {
        const appWindow = appFrame.contentWindow;
        const appDocument = appWindow.document;
        const core = appWindow.QueueRecorderCore;
        const app = appWindow.QueueRecorderApp;

        if (loadPhase === 'restore-right') {
          test('刷新后恢复 right 阶段、队列色块和乘客数量', () => {
            assert(app, '刷新后 QueueRecorderApp 不存在');
            equal(app.getState().activeStage, 'right', '刷新后未恢复 right 阶段');
            equal(app.getState().queues.right, [3], '刷新后未恢复 right 队列');
            assert(appDocument.querySelector('.stage-button[data-stage="right"]').classList.contains('is-active'), '刷新后 right 导航未高亮');
            equal(appDocument.querySelector('.sequence-chip[data-index="0"]').textContent, '3', '刷新后序列色块错误');
            equal(appDocument.querySelector('.count-card strong').textContent, '1', '刷新后乘客数量错误');
          });

          if (!app) {
            finish();
            return;
          }

          localStorage.setItem(STORAGE_KEY, JSON.stringify({ ...app.getState(), activeStage: 'configs' }));
          loadPhase = 'restore-configs';
          appWindow.location.reload();
          return;
        }

        if (loadPhase === 'restore-configs') {
          test('刷新后恢复 configs 高亮和配置渲染', () => {
            assert(app, 'configs 刷新后 QueueRecorderApp 不存在');
            equal(app.getState().activeStage, 'configs', '刷新后未恢复 configs 阶段');
            assert(appDocument.querySelector('.stage-button[data-stage="configs"]').classList.contains('is-active'), '刷新后 configs 导航未高亮');
            assert(appDocument.querySelector('[data-config-key="right"] .config-value'), '刷新后 configs 配置卡片缺失');
            equal(appDocument.querySelector('[data-config-key="right"] .config-value').textContent, '3', '刷新后 configs 右侧配置错误');
          });

          finish();
          return;
        }

        test('页面暴露核心状态 API', () => {
          assert(core, 'QueueRecorderCore 不存在');
        });

        if (!core) {
          finish();
          return;
        }

        test('初始状态包含默认颜色、空区域和默认阶段', () => {
          const state = core.createInitialState();
          equal(state.colors, DEFAULT_COLORS, '默认颜色错误');
          equal(state.queues, EMPTY_SECTIONS, '初始队列应为空');
          equal(state.histories, EMPTY_SECTIONS, '初始撤销历史应为空');
          assert(!Object.prototype.hasOwnProperty.call(state, 'parking'), '初始状态不应再包含车位记录');
          assert(!Object.prototype.hasOwnProperty.call(state, 'script'), '初始状态不应再包含剧本还原数据');
          equal(state.activeStage, 'conveyor', '初始阶段错误');
        });

        test('立即结算模拟器初始状态包含文本输入和空结果', () => {
          const state = core.createInitialState();
          equal(state.simulation, {
            levelName: '',
            conveyorCapacity: '',
            passengerQueueText: '',
            vehicleTableText: '',
            clickSequenceText: '',
            screenshotDataUrl: '',
            hotspots: [],
            nextHotspotId: 1,
            result: null,
            errors: []
          }, '模拟器初始状态错误');
          assert(core.saveState(state), '包含模拟器状态时应允许保存');
        });

        test('追加、删除和撤销只影响当前区域', () => {
          let state = core.createInitialState();
          state = core.appendValue(state, 'left', 3);
          state = core.appendValue(state, 'right', 2);
          state = core.appendValue(state, 'conveyor', 1);
          state = core.appendValue(state, 'conveyor', 2);
          equal(state.queues, { conveyor: [1, 2], left: [3], right: [2] }, '追加结果错误');
          state = core.removeAt(state, 'conveyor', 0);
          equal(state.queues, { conveyor: [2], left: [3], right: [2] }, '删除影响了其他区域');
          state = core.undo(state, 'conveyor');
          equal(state.queues, { conveyor: [1, 2], left: [3], right: [2] }, '撤销影响了其他区域');
        });

        test('删除中间项按索引移除目标乘客', () => {
          let state = core.createInitialState();
          state = core.appendValue(state, 'conveyor', 1);
          state = core.appendValue(state, 'conveyor', 2);
          state = core.appendValue(state, 'conveyor', 3);
          state = core.removeAt(state, 'conveyor', 1);
          equal(state.queues.conveyor, [1, 3], '删除中间项失败');
        });

        test('连续撤销逐层回退，空历史撤销保持状态不变', () => {
          let state = core.createInitialState();
          state = core.appendValue(state, 'left', 1);
          state = core.appendValue(state, 'left', 2);
          state = core.appendValue(state, 'left', 3);
          state = core.undo(state, 'left');
          equal(state.queues.left, [1, 2], '第一次撤销追加失败');
          state = core.undo(state, 'left');
          equal(state.queues.left, [1], '第二次撤销追加失败');
          state = core.undo(state, 'left');
          equal(state.queues.left, [], '第三次撤销追加失败');
          const emptyHistoryState = clone(state);
          state = core.undo(state, 'left');
          equal(state, emptyHistoryState, '历史为空时继续撤销不应改变状态');
        });

        test('三个区域交错编辑后分别撤销，区域历史互相独立', () => {
          let state = core.createInitialState();
          state = core.appendValue(state, 'conveyor', 1);
          state = core.appendValue(state, 'left', 2);
          state = core.appendValue(state, 'right', 3);
          state = core.appendValue(state, 'conveyor', 2);
          state = core.appendValue(state, 'left', 1);
          state = core.appendValue(state, 'right', 2);
          state = core.undo(state, 'left');
          equal(state.queues, { conveyor: [1, 2], left: [2], right: [3, 2] }, '左侧撤销影响了其他区域');
          state = core.undo(state, 'conveyor');
          equal(state.queues, { conveyor: [1], left: [2], right: [3, 2] }, '传送带撤销影响了其他区域');
          state = core.undo(state, 'right');
          equal(state.queues, { conveyor: [1], left: [2], right: [3] }, '右侧撤销影响了其他区域');
        });

        test('新增颜色自动使用最大映射值加一', () => {
          const initialState = core.createInitialState();
          const stateWithGap = {
            ...initialState,
            colors: [...initialState.colors, { name: '映射色 18', hex: '#546e7a', value: 18 }]
          };
          const colorsBeforeAdd = clone(stateWithGap.colors);
          const state = core.addColor(stateWithGap, '  紫色  ', '#8b5cf6');
          equal(state.colors.at(-1), { name: '紫色', hex: '#8b5cf6', value: 19 }, '新增颜色属性错误');
          equal(state.colors.slice(0, -1), colorsBeforeAdd, '新增颜色不应修改已有颜色');
        });

        test('追加只接受已有颜色的正整数映射值', () => {
          const initialState = core.createInitialState();
          equal(core.appendValue(initialState, 'left', { value: 1 }), initialState, '对象映射值不应追加');
          equal(core.appendValue(initialState, 'left', 99), initialState, '未知整数映射值不应追加');
          equal(core.appendValue(initialState, 'left', 1.5), initialState, '小数映射值不应追加');
          const unsafeValue = Number.MAX_SAFE_INTEGER + 1;
          const stateWithUnsafeColor = {
            ...initialState,
            colors: [...initialState.colors, { name: '越界色', value: unsafeValue, hex: '#111111' }]
          };
          equal(core.appendValue(stateWithUnsafeColor, 'left', unsafeValue), stateWithUnsafeColor, '非安全整数映射值不应追加');
        });

        test('颜色快捷数量追加只产生一条撤销历史', () => {
          let state = core.createInitialState();
          state = core.appendBatchValues(state, 'conveyor', [1, 2, 3]);
          equal(state.queues.conveyor, [1, 2, 3], '批量追加失败');
          equal(state.histories.conveyor, [[]], '批量追加应只记录一条历史');
          state = core.appendBatchValues(state, 'conveyor', [4, 5]);
          state = core.undo(state, 'conveyor');
          equal(state.queues.conveyor, [1, 2, 3], '撤销批量追加失败');
          equal(core.appendBatchValues(state, 'conveyor', [1, 99]), state, '批量追加遇到未知值应保持 no-op');
        });

        test('颜色快捷数量删除按颜色从队尾移除并可撤销', () => {
          let state = core.createInitialState();
          state = core.appendBatchValues(state, 'conveyor', [1, 2, 1, 3, 1]);
          state = core.removeBatchValues(state, 'conveyor', 1, 2);
          equal(state.queues.conveyor, [1, 2, 3], '快捷删除应从队尾移除指定颜色');
          state = core.undo(state, 'conveyor');
          equal(state.queues.conveyor, [1, 2, 1, 3, 1], '撤销快捷删除失败');
          equal(core.removeBatchValues(state, 'conveyor', 1, 0), state, '删除数量小于 1 应保持 no-op');
          equal(core.removeBatchValues(state, 'unknown', 1, 1), state, '未知区域快捷删除应保持 no-op');
        });

        test('核心队列操作遇到畸形状态时保持 no-op', () => {
          const malformedSections = { colors: [], queues: {}, histories: {} };
          const missingColors = { queues: clone(EMPTY_SECTIONS), histories: clone(EMPTY_SECTIONS) };
          equal(core.appendValue(null, 'left', 1), null, '空状态追加不应抛异常');
          equal(core.removeAt(malformedSections, 'left', 0), malformedSections, '畸形状态删除不应抛异常');
          equal(core.undo(malformedSections, 'left'), malformedSections, '畸形状态撤销不应抛异常');
          equal(core.appendValue(missingColors, 'left', 1), missingColors, '缺少颜色列表时追加不应抛异常');
        });

        test('新增颜色拒绝非法名称和非法 hex', () => {
          const initialState = core.createInitialState();
          equal(core.addColor(initialState, null, '#32a852'), initialState, '非字符串名称不应新增颜色');
          equal(core.addColor(initialState, '   ', '#32a852'), initialState, '空名称不应新增颜色');
          equal(core.addColor(initialState, '绿色', '#xyzxyz'), initialState, '非法 hex 不应新增颜色');
        });

        test('映射值达到安全整数上限时不再新增颜色', () => {
          const initialState = core.createInitialState();
          const stateAtLimit = {
            ...initialState,
            colors: [...initialState.colors, { name: '极限色', value: Number.MAX_SAFE_INTEGER, hex: '#111111' }]
          };
          equal(core.addColor(stateAtLimit, '越界色', '#222222'), stateAtLimit, '达到安全整数上限后不应新增颜色');
        });

        test('整体配置按传送带、左侧、右侧顺序拼接', () => {
          let state = core.createInitialState();
          state = core.appendValue(state, 'left', 2);
          state = core.appendValue(state, 'right', 3);
          state = core.appendValue(state, 'conveyor', 1);
          equal(
            core.getConfigs(state),
            { conveyor: '1', left: '2', right: '3', combined: '1,2,3' },
            '配置输出错误'
          );
          equal(
            core.getConfigs(core.createInitialState()),
            { conveyor: '', left: '', right: '', combined: '' },
            '空区域配置应输出空字符串'
          );
        });

        test('开始下一关保留颜色并清空队列', () => {
          let state = core.addColor(core.createInitialState(), '绿色', '#32a852');
          state = core.appendValue(state, 'conveyor', 1);
          state = core.appendValue(state, 'left', 2);
          state = core.appendValue(state, 'right', 4);
          state = { ...state, activeStage: 'right' };
          const colorsBeforeNextLevel = clone(state.colors);
          const nextState = core.startNextLevel(state);
          equal(nextState.colors, colorsBeforeNextLevel, '颜色列表未完整保留');
          equal(nextState.queues, EMPTY_SECTIONS, '队列未清空');
          equal(nextState.histories, EMPTY_SECTIONS, '撤销历史未清空');
          equal(nextState.activeStage, 'conveyor', '下一关应恢复到传送带阶段');
          equal(nextState.simulation, state.simulation, '开始下一关不应丢失模拟器状态');
          assert(core.saveState(nextState), '开始下一关后的状态应允许保存');
        });

        test('彻底重置恢复默认颜色和空队列', () => {
          let state = core.addColor(core.createInitialState(), '绿色', '#32a852');
          state = core.appendValue(state, 'left', 4);
          state = { ...state, activeStage: 'right' };
          state = core.resetEverything();
          equal(state.colors, DEFAULT_COLORS, '默认颜色未恢复');
          equal(state.queues, EMPTY_SECTIONS, '队列未清空');
          equal(state.histories, EMPTY_SECTIONS, '撤销历史未清空');
          assert(!Object.prototype.hasOwnProperty.call(state, 'parking'), '彻底重置后不应再包含车位记录');
          assert(!Object.prototype.hasOwnProperty.call(state, 'script'), '彻底重置后不应再包含剧本还原数据');
          equal(state.activeStage, 'conveyor', '彻底重置应恢复到传送带阶段');
        });

        test('车辆表解析并报告非法行', () => {
          const table = [
            '车辆id\t车颜色\t车座位\t深度\t前方车辆id\t后方车辆id',
            '1\t1\t10\t0\t\t3,6',
            '2\t3\t6\t2\t7\t5,8',
            '2\t4\t5\t1\t\t'
          ].join('\n');
          const parsed = core.parseScriptVehicleTable(table);
          equal(parsed.vehicles, [
            { id: 1, colorValue: 1, capacity: 10, depth: 0, frontVehicleIds: [], backVehicleIds: [3, 6] },
            { id: 2, colorValue: 3, capacity: 6, depth: 2, frontVehicleIds: [7], backVehicleIds: [5, 8] }
          ], '车辆表解析结果错误');
          assert(parsed.errors.some(error => error.includes('第 4 行')), '非法行未报告行号');
          assert(parsed.errors.some(error => error.includes('重复')), '重复 id 未报告');
          assert(parsed.errors.some(error => error.includes('座位')), '非法座位未报告');
        });

        test('车辆表支持解析带引号的 CSV', () => {
          const table = [
            '车辆id,车颜色,车座位,深度,前方车辆id,后方车辆id',
            '1,0,10,1,,"3,6"',
            '2,2,6,2,7,"5,8"'
          ].join('\n');
          const parsed = core.parseScriptVehicleTable(table);
          equal(parsed.vehicles, [
            { id: 1, colorValue: 3, capacity: 10, depth: 1, frontVehicleIds: [], backVehicleIds: [3, 6] },
            { id: 2, colorValue: 5, capacity: 6, depth: 2, frontVehicleIds: [7], backVehicleIds: [5, 8] }
          ], 'CSV 车辆表解析结果错误');
          equal(parsed.errors, [], '合法 CSV 不应产生解析错误');
        });

        test('车辆 CSV 颜色映射会转换为乘客队列颜色映射', () => {
          const table = [
            '车辆id,车辆色,车座位,深度,前方车辆id,后方车辆id,车机制',
            '1,0,4,0,,,',
            '2,4,6,0,,,',
            '3,5,10,0,,,',
            '4,9,4,0,,,',
            '5,10,4,0,,,'
          ].join('\n');
          const parsed = core.parseScriptVehicleTable(table);
          equal(parsed.errors, [], '合法车辆 CSV 不应产生解析错误');
          equal(parsed.vehicles.map(vehicle => vehicle.colorValue), [3, 1, 2, 11, 10], '车辆 CSV 颜色映射未转换为队列颜色映射');
        });

        test('车辆 CSV 允许车机制文本列且不当作依赖车辆解析', () => {
          const table = [
            '车辆id,车辆色,车座位,深度,前方车辆id,后方车辆id,车机制',
            '1,0,4,0,,,问号车',
            '2,4,6,0,,1,带锁车'
          ].join('\n');
          const parsed = core.parseScriptVehicleTable(table);
          equal(parsed.errors, [], '车机制文本列不应被解析为依赖车辆 id');
          equal(parsed.vehicles, [
            { id: 1, colorValue: 3, capacity: 4, depth: 0, frontVehicleIds: [], backVehicleIds: [] },

          equal(app.getState().queues.conveyor, [1, 1, 1], '+3 未追加三个当前颜色');
          appDocument.querySelector('.color-quick-button[data-value="1"][data-delta="-1"]').click();
          equal(app.getState().queues.conveyor, [1, 1], '-1 未删除一个当前颜色');

          equal(app.getState().queues.conveyor, [1, 1, 2], '撤销快捷删除失败');
        });

        test('配置页生成四份可单独复制的逗号分隔配置', () => {

          equal(appDocument.querySelector('[data-config-key="combined"] .config-value').textContent, '1,2,3,1', '整体配置错误');

        test('开始下一关清空队列但保留颜色映射', () => {
          const mappingBeforeNextLevel = clone(app.getState().colors);
          appDocument.querySelector('[data-action="next-level"]').click();
          equal(app.getState().queues, { conveyor: [], left: [], right: [] }, '下一关未清空三段队列');
          equal(app.getState().histories, { conveyor: [], left: [], right: [] }, '下一关未清空撤销记录');
          equal(app.getState().colors, mappingBeforeNextLevel, '下一关不应清空颜色映射');

        test('彻底重置需要确认并恢复默认状态', () => {
          let customState = core.addColor(core.createInitialState(), '绿色', '#32a852');
          customState = core.appendValue(customState, 'left', 4);
          app.updateState({ ...customState, activeStage: 'configs' });
          const originalConfirm = appWindow.confirm;
          appWindow.confirm = () => false;
          appDocument.querySelector('[data-action="reset-everything"]').click();
          equal(app.getState().queues.left, [4], '取消确认后不应重置');
          appWindow.confirm = () => true;
          appDocument.querySelector('[data-action="reset-everything"]').click();
          equal(app.getState(), core.createInitialState(), '确认后未恢复默认状态');
          appWindow.confirm = originalConfirm;
        });

        test('立即结算模拟页面支持文本输入、运行和清空', () => {
          appDocument.querySelector('.stage-button[data-stage="simulation"]').click();
          equal(app.getState().activeStage, 'simulation', '未进入立即结算模拟页面');
          equal(appDocument.querySelector('.workspace-title').textContent, '立即结算模拟', '页面标题错误');
          equal(appDocument.querySelector('.count-card strong').textContent, '0', '未运行时步骤数应为 0');
          const fields = ['levelName', 'conveyorCapacity', 'passengerQueueText', 'vehicleTableText', 'clickSequenceText'];
          fields.forEach(field => {
            assert(appDocument.querySelector(`.simulation-input[data-simulation-field="${field}"]`), `缺少 ${field} 输入控件`);
          });
          const csvFileInput = appDocument.querySelector('#simulationVehicleCsvFile');
          assert(csvFileInput && csvFileInput.accept.includes('.csv'), '立即结算模拟车辆表 CSV 文件导入控件缺失');
          const recordMdInput = appDocument.querySelector('#simulationRecordMdFiles');
          assert(recordMdInput && recordMdInput.accept.includes('.md'), '旧模拟记录 MD 导入控件缺失');
          assert(recordMdInput.multiple, '旧模拟记录 MD 导入控件应支持多选');
          const recordVehicleCsvInput = appDocument.querySelector('#simulationRecordVehicleCsvFile');
          assert(recordVehicleCsvInput && recordVehicleCsvInput.accept.includes('.csv'), '旧记录标注导出车辆 CSV 导入控件缺失');
          assert(recordVehicleCsvInput.multiple, '旧记录标注导出车辆 CSV 导入控件应支持多选并按关卡匹配');
          assert(appDocument.querySelector('.stable-simulation-record-vehicle-source'), '旧记录标注导出车辆 CSV 状态提示缺失');
          assert(!appDocument.querySelector('[data-action="fit-stable-simulation-queue"]'), '立即结算模拟不应包含拟合队列按钮');

          appDocument.querySelector('.simulation-input[data-simulation-field="conveyorCapacity"]').value = '4';
          appDocument.querySelector('.simulation-input[data-simulation-field="passengerQueueText"]').value = '1,1,1,1,3,3';
          appDocument.querySelector('.simulation-input[data-simulation-field="vehicleTableText"]').value = '车辆id\t车颜色\t车座位\t深度\n1\t1\t4\t0';
          appDocument.querySelector('.simulation-input[data-simulation-field="clickSequenceText"]').value = '1';
          appDocument.querySelector('[data-action="run-stable-simulation"]').click();

          const reportText = appDocument.querySelector('.script-report').textContent;
          assert(reportText.includes('#1红色4'), '报告缺少车辆描述');
          assert(reportText.includes('进车位 1'), '报告缺少进车位 1');
          assert(reportText.includes('上客 4'), '报告缺少上客 4');
          assert(reportText.includes('开走'), '报告缺少开走');
          assert(reportText.includes('最终车位：空'), '报告缺少最终车位为空');
          equal(appDocument.querySelector('.count-card strong').textContent, '1', '运行后步骤数应为 1');

          const downloadButton = appDocument.querySelector('[data-action="download-stable-simulation-md"]');
          assert(downloadButton, '缺少导出 MD 按钮');
          let capturedBlob = null;
          let capturedDownload = '';
          let capturedHref = '';
          let revokedUrl = '';
          const originalCreateObjectURL = appWindow.URL.createObjectURL;
          const originalRevokeObjectURL = appWindow.URL.revokeObjectURL;
          const originalAnchorClick = appWindow.HTMLAnchorElement.prototype.click;
          appWindow.URL.createObjectURL = blob => {
            capturedBlob = blob;
            return 'blob:stable-simulation-report';
          };
          appWindow.URL.revokeObjectURL = url => {
            revokedUrl = url;
          };
          appWindow.HTMLAnchorElement.prototype.click = function click() {
            capturedDownload = this.download;
            capturedHref = this.href;
          };
          downloadButton.click();
          appWindow.URL.createObjectURL = originalCreateObjectURL;
          appWindow.URL.revokeObjectURL = originalRevokeObjectURL;
          appWindow.HTMLAnchorElement.prototype.click = originalAnchorClick;
          assert(capturedBlob instanceof appWindow.Blob, '导出 MD 未生成 Blob');
          assert(capturedBlob.type.includes('text/markdown'), '导出 Blob 类型不是 Markdown');
          equal(capturedBlob.size, new appWindow.Blob([reportText], { type: 'text/markdown;charset=utf-8' }).size, '导出内容大小应与报告文本一致');
          equal(capturedDownload, '未命名关卡-立即结算模拟.md', '导出文件名错误');
          equal(capturedHref, 'blob:stable-simulation-report', '导出未使用创建的对象 URL');
          equal(revokedUrl, 'blob:stable-simulation-report', '导出后未释放对象 URL');

          const originalConfirm = appWindow.confirm;
          appWindow.confirm = () => true;
          appDocument.querySelector('[data-action="clear-stable-simulation"]').click();
          appWindow.confirm = originalConfirm;
          equal(app.getState().simulation, core.createInitialState().simulation, '清空模拟状态失败');
        });

        test('立即结算模拟页面可点击车辆按钮追加序列并显示当前状态', () => {
          appDocument.querySelector('.stage-button[data-stage="simulation"]').click();
          appDocument.querySelector('.simulation-input[data-simulation-field="conveyorCapacity"]').value = '4';
          appDocument.querySelector('.simulation-input[data-simulation-field="passengerQueueText"]').value = '1,1,1,1,3,3';
          appDocument.querySelector('.simulation-input[data-simulation-field="vehicleTableText"]').value = '车辆id\t车颜色\t车座位\t深度\n1\t1\t4\t0\n2\t3\t6\t0';
          appDocument.querySelector('[data-action="run-stable-simulation"]').click();

          const vehicleButton = appDocument.querySelector('[data-action="append-stable-simulation-click"][data-vehicle-id="1"]');
          assert(vehicleButton, '未生成车辆按钮 #1');
          assert(vehicleButton.textContent.includes('#1红色4'), '车辆按钮文案错误');
          vehicleButton.click();

          equal(app.getState().simulation.clickSequenceText, '1', '点击车辆按钮未追加序列');
          equal(appDocument.querySelector('.simulation-input[data-simulation-field="clickSequenceText"]').value, '1', '点击车辆后文本框未同步');
          assert(appDocument.querySelector('.stable-simulation-slots').textContent.includes('空'), '未显示当前车位状态');
          assert(appDocument.querySelector('.stable-simulation-belt').textContent.includes('3,3'), '未显示当前传送带状态');
          assert(appDocument.querySelector('.script-report').textContent.includes('#1红色4'), '报告未显示点击车辆');
        });

        test('拟合队列页面独立于立即结算模拟', () => {
          appDocument.querySelector('.stage-button[data-stage="queueFit"]').click();
          equal(app.getState().activeStage, 'queueFit', '未进入拟合队列页面');
          equal(appDocument.querySelector('.workspace-title').textContent, '拟合队列', '拟合队列页面标题错误');
          ['levelName', 'conveyorCapacity', 'passengerQueueText', 'vehicleTableText', 'targetRecordText', 'targetVehicleTableText'].forEach(field => {
            assert(appDocument.querySelector(`.queue-fit-input[data-queue-fit-field="${field}"]`), `缺少拟合 ${field} 输入控件`);
          });
          const recordMdInput = appDocument.querySelector('#queueFitRecordMdFile');
          assert(recordMdInput && recordMdInput.accept.includes('.md'), '缺少竞品结算模拟记录 MD 导入控件');
          const targetVehicleCsvInput = appDocument.querySelector('#queueFitTargetVehicleCsvFile');
          assert(targetVehicleCsvInput && targetVehicleCsvInput.accept.includes('.csv'), '缺少竞品车辆数据表 CSV 导入控件');
          assert(appDocument.querySelector('[data-action="run-queue-fit"]'), '缺少运行拟合按钮');
          assert(appDocument.querySelector('.queue-fit-output'), '缺少拟合输出区');
        });

        test('立即结算模拟页面支持点击截图标记记录选车', () => {
          let state = core.createInitialState();
          state = core.setStableSimulationInput(state, {
            conveyorCapacity: '4',
            passengerQueueText: '1,1,1,1,3,3',
            vehicleTableText: '车辆id\t车颜色\t车座位\t深度\n1\t1\t4\t0\n2\t3\t6\t0',
            clickSequenceText: ''
          });
          state = core.setStableSimulationScreenshot(state, 'data:image/png;base64,abc');
          app.updateState({ ...state, activeStage: 'simulation' });
          assert(appDocument.querySelector('#simulationScreenshotFile'), '缺少截图导入控件');
          assert(appDocument.querySelector('.stable-simulation-screenshot'), '未显示停车场截图');

          appDocument.querySelector('#simulationManualVehicleId').value = '1';
          const wrap = appDocument.querySelector('.stable-simulation-screenshot-wrap');
          wrap.getBoundingClientRect = () => ({
            left: 0,
            top: 0,
            width: 200,
            height: 100,
            right: 200,
            bottom: 100,
            x: 0,
            y: 0,
            toJSON: () => ({})
          });
          wrap.dispatchEvent(new appWindow.MouseEvent('click', {
            bubbles: true,
            clientX: 50,
            clientY: 40
          }));
          equal(app.getState().simulation.hotspots, [{ id: 1, vehicleId: 1, xPercent: 25, yPercent: 40 }], '截图点击未新增车辆标记');

          const marker = appDocument.querySelector('[data-action="append-stable-simulation-hotspot-click"][data-hotspot-id="1"]');
          assert(marker, '未渲染可点击车辆标记');
          assert(marker.textContent.includes('#1'), '车辆标记未显示 id');
          marker.click();
          equal(app.getState().simulation.clickSequenceText, '1', '点击截图标记未追加选车顺序');
          equal(appDocument.querySelector('.simulation-input[data-simulation-field="clickSequenceText"]').value, '1', '截图选车后文本框未同步');
          assert(appDocument.querySelector('.script-report').textContent.includes('#1红色4'), '截图选车后报告未更新');
          const clickedMarker = appDocument.querySelector('[data-action="append-stable-simulation-hotspot-click"][data-hotspot-id="1"]');
          assert(clickedMarker.textContent.includes('✓'), '点击后的车辆标记应显示打勾');
          assert(clickedMarker.disabled, '点击后的车辆标记应禁用，避免重复记录');

          appDocument.querySelector('[data-action="delete-stable-simulation-hotspot"][data-hotspot-id="1"]').click();
          equal(app.getState().simulation.hotspots, [], '删除截图标记失败');
        });

        test('立即结算模拟页面支持撤销、删除步骤和清空点击记录', () => {
          appDocument.querySelector('.stage-button[data-stage="simulation"]').click();
          appDocument.querySelector('.simulation-input[data-simulation-field="conveyorCapacity"]').value = '4';
          appDocument.querySelector('.simulation-input[data-simulation-field="passengerQueueText"]').value = '1,1,1,1,3,3';
          appDocument.querySelector('.simulation-input[data-simulation-field="vehicleTableText"]').value = '车辆id\t车颜色\t车座位\t深度\n1\t1\t4\t0\n2\t3\t6\t0';
          appDocument.querySelector('.simulation-input[data-simulation-field="clickSequenceText"]').value = '';
          appDocument.querySelector('[data-action="run-stable-simulation"]').click();
          appDocument.querySelector('[data-action="append-stable-simulation-click"][data-vehicle-id="1"]').click();
          appDocument.querySelector('[data-action="append-stable-simulation-click"][data-vehicle-id="2"]').click();
          equal(app.getState().simulation.clickSequenceText, '1,2', '前置点击序列错误');

          const undoButton = appDocument.querySelector('[data-action="undo-stable-simulation-click"]');
          assert(undoButton, '缺少撤销上一步按钮');
          undoButton.click();
          equal(app.getState().simulation.clickSequenceText, '1', '撤销按钮未删除最后一步');

          appDocument.querySelector('[data-action="append-stable-simulation-click"][data-vehicle-id="2"]').click();
          const deleteButton = appDocument.querySelector('[data-action="delete-stable-simulation-step"][data-step-index="0"]');
          assert(deleteButton, '步骤日志缺少删除按钮');
          deleteButton.click();
          equal(app.getState().simulation.clickSequenceText, '2', '删除第 1 步按钮未重建序列');

          const originalConfirm = appWindow.confirm;
          appWindow.confirm = () => true;
          appDocument.querySelector('[data-action="clear-stable-simulation-clicks"]').click();
          appWindow.confirm = originalConfirm;
          equal(app.getState().simulation.clickSequenceText, '', '清空点击记录按钮未清空序列');
          equal(app.getState().simulation.conveyorCapacity, '4', '清空点击记录不应清空基础输入');
        });

        const restoreRightState = {
          ...core.appendValue(core.createInitialState(), 'right', 3),
          activeStage: 'right'
        };
        localStorage.setItem(STORAGE_KEY, JSON.stringify(restoreRightState));
        loadPhase = 'restore-right';
        appWindow.location.reload();
      } catch (error) {
        failSuite('测试页脚本异常', error);
      }
    });

    localStorage.removeItem(STORAGE_KEY);
    appFrame.src = `../index.html?test=${Date.now()}`;
  </script>
