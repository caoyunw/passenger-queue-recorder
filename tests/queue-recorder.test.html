<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>乘客队列记录工具测试</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      margin: 0;
      padding: 24px;
      color: #202938;
      background: #f6f8fb;
    }

    h1 {
      margin-top: 0;
    }

    #summary {
      padding: 12px 16px;
      border-radius: 8px;
      background: #e8edf4;
      font-weight: 700;
    }

    #summary.pass {
      color: #166534;
      background: #dcfce7;
    }

    #summary.fail {
      color: #991b1b;
      background: #fee2e2;
    }

    #results {
      padding-left: 24px;
    }

    #results li {
      margin: 10px 0;
    }

    .pass {
      color: #16803c;
    }

    .fail {
      color: #c33b32;
    }

    iframe {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>
<body data-status="running" data-failures="0">
  <h1>乘客队列记录工具测试</h1>
  <p id="summary">正在等待生产页面加载...</p>
  <ol id="results"></ol>
  <iframe id="app" title="乘客队列记录工具"></iframe>

  <script>
    const results = document.querySelector('#results');
    const summary = document.querySelector('#summary');
    let passed = 0;
    let failed = 0;
    let suiteFinished = false;
    let timeoutId;
    const STORAGE_KEY = 'passenger-queue-recorder-state-v5';
    const originalStoredState = localStorage.getItem(STORAGE_KEY);
    let loadPhase = 'initial';
    const DEFAULT_COLORS = [
      { name: '红色', value: 1, hex: '#e54c4c' },
      { name: '黄色', value: 2, hex: '#f3bd3d' },
      { name: '蓝色', value: 3, hex: '#3478f6' },
      { name: '绿色', value: 4, hex: '#32a852' },
      { name: '粉色', value: 5, hex: '#ec71a5' },
      { name: '紫色', value: 6, hex: '#8b5cf6' },
      { name: '天蓝色', value: 7, hex: '#58bde9' },
      { name: '棕色', value: 8, hex: '#8b5a3c' },
      { name: '橙色', value: 9, hex: '#f97316' },
      { name: '黑色', value: 10, hex: '#202529' },
      { name: '白色', value: 11, hex: '#f7f7f2' }
    ];
    const EMPTY_SECTIONS = { conveyor: [], left: [], right: [] };

    function assert(condition, message) {
      if (!condition) throw new Error(message);
    }

    function normalize(value) {
      if (Array.isArray(value)) {
        return value.map(normalize);
      }
      if (value && typeof value === 'object') {
        return Object.keys(value).sort().reduce((normalized, key) => {
          normalized[key] = normalize(value[key]);
          return normalized;
        }, {});
      }
      return value;
    }

    function serialize(value) {
      return JSON.stringify(normalize(value));
    }

    function clone(value) {
      return JSON.parse(JSON.stringify(value));
    }

    function withStoredState(value, operation) {
      const previousValue = localStorage.getItem(STORAGE_KEY);
      try {
        if (value === null) {
          localStorage.removeItem(STORAGE_KEY);
        } else {
          localStorage.setItem(STORAGE_KEY, value);
        }
        return operation();
      } finally {
        if (previousValue === null) {
          localStorage.removeItem(STORAGE_KEY);
        } else {
          localStorage.setItem(STORAGE_KEY, previousValue);
        }
      }
    }

    function restoreOriginalStoredState() {
      if (originalStoredState === null) {
        localStorage.removeItem(STORAGE_KEY);
      } else {
        localStorage.setItem(STORAGE_KEY, originalStoredState);
      }
    }

    window.addEventListener('pagehide', restoreOriginalStoredState);

    function equal(actual, expected, message) {
      assert(
        serialize(actual) === serialize(expected),
        `${message}，期望：${serialize(expected)}，实际：${serialize(actual)}`
      );
    }

    function assertPure(label, input, operation) {
      const inputSnapshot = clone(input);
      const output = operation();
      equal(input, inputSnapshot, `${label} 突变了输入状态`);
      return output;
    }

    function addResult(kind, name, detail) {
      const item = document.createElement('li');
      item.className = kind;
      item.append(`${kind.toUpperCase()}：${name}`);
      if (detail) {
        item.append(document.createElement('br'), detail);
      }
      results.append(item);
    }

    function test(name, fn) {
      try {
        fn();
        passed += 1;
        addResult('pass', name);
      } catch (error) {
        failed += 1;
        addResult('fail', name, error.message);
      }
    }

    function finish() {
      if (suiteFinished) return;
      suiteFinished = true;
      clearTimeout(timeoutId);
      restoreOriginalStoredState();
      const status = failed === 0 ? 'pass' : 'fail';
      document.body.dataset.status = status;
      document.body.dataset.failures = String(failed);
      summary.className = status;
      summary.textContent = `汇总：PASS ${passed} / FAIL ${failed}`;
    }

    function failSuite(name, error) {
      if (suiteFinished) return;
      failed += 1;
      addResult('fail', name, error instanceof Error ? error.message : String(error));
      finish();
    }

    window.addEventListener('error', event => {
      failSuite('测试页脚本异常', event.error || event.message);
    });

    window.addEventListener('unhandledrejection', event => {
      failSuite('测试页 Promise 异常', event.reason);
    });

    timeoutId = setTimeout(() => {
      failSuite('测试页执行超时', '生产页面加载回调未在限定时间内完成');
    }, 60000);

    const appFrame = document.querySelector('#app');

    appFrame.addEventListener('load', () => {
      if (suiteFinished) return;

      try {
        const appWindow = appFrame.contentWindow;
        const appDocument = appWindow.document;
        const core = appWindow.QueueRecorderCore;
        const pressureCore = appWindow.PressureQueueCore;
        const app = appWindow.QueueRecorderApp;
        const makePressureInput = (overrides = {}) => ({
          conveyorCapacity: 4,
          passengers: [3, 3, 3, 3, 4, 4, 4, 4, 1, 1, 1, 1, 2, 2, 2, 2],
          vehicles: [
            { id: 1, colorValue: 3, capacity: 4, frontVehicleIds: [], backVehicleIds: [2] },
            { id: 2, colorValue: 4, capacity: 4, frontVehicleIds: [1], backVehicleIds: [] },
            { id: 3, colorValue: 1, capacity: 4, frontVehicleIds: [], backVehicleIds: [] },
            { id: 4, colorValue: 2, capacity: 4, frontVehicleIds: [], backVehicleIds: [] }
          ],
          path: [1, 2, 3, 4],
          annotations: [],
          ...overrides
        });
        const makePressureWorkspaceSlice = (overrides = {}) => ({
          ...core.createInitialState().pressureQueue,
          levelName: '线路甲',
          conveyorCapacity: '4',
          passengerQueueText: [
            ...Array(4).fill('1'),
            ...Array(6).fill('2'),
            ...Array(10).fill('3')
          ].join(','),
          vehicleTableText: [
            '车辆id\t车颜色\t车座位\t深度\t前方车辆id\t后方车辆id',
            '1\t1\t4\t0\t\t2',
            '2\t2\t6\t1\t1\t3',
            '3\t3\t10\t2\t2\t'
          ].join('\n'),
          clickSequenceText: '1,2,3',
          searchBudget: '64',
          seed: '7',
          ...overrides
        });
        const makeSafePressureFailureResult = (overrides = {}) => ({
          status: 'budget_exhausted',
          layout: null,
          errors: [pressureCore.createIssue('budget_exhausted', 'test_budget', '测试预算耗尽')],
          expanded: 8,
          budget: 64,
          ...overrides
        });

        function makeGenuinePressureState(levelName = '真实持久化线路') {
          const base = core.createInitialState();
          const pressureQueue = makePressureWorkspaceSlice({
            levelName,
            annotations: [
              pressureCore.createAnnotation(1),
              pressureCore.createAnnotation(2),
              pressureCore.createAnnotation(3)
            ]
          });
          const candidate = { ...base, activeStage: 'pressureQueue', pressureQueue };
          const parsed = core.parsePressureQueueModel(candidate);
          const result = pressureCore.generate(parsed.model, {
            budget: parsed.model.searchBudget,
            seed: parsed.model.seed
          });
          return {
            ...candidate,
            pressureQueue: { ...pressureQueue, result, errors: [] }
          };
        }

        function makeLongPressureWorkspace(overrides = {}) {
          const vehicleIds = Array.from({ length: 80 }, (_, index) => index + 1);
          const base = core.createInitialState();
          const annotations = overrides.annotations
            || vehicleIds.map(vehicleId => pressureCore.createAnnotation(vehicleId));
          return {
            ...base,
            activeStage: 'pressureQueue',
            pressureQueue: makePressureWorkspaceSlice({
              conveyorCapacity: '4',
              passengerQueueText: Array(320).fill('1').join(','),
              vehicleTableText: [
                '车辆id\t车颜色\t车座位\t深度\t前方车辆id\t后方车辆id',
                ...vehicleIds.map(vehicleId => `${vehicleId}\t1\t4\t0\t\t`)
              ].join('\n'),
              clickSequenceText: vehicleIds.join(','),
              annotations,
              ...overrides
            })
          };
        }

        function showPressureWorkspace(overrides = {}) {
          const current = core.createInitialState();
          return app.updateState({
            ...current,
            pressureQueue: makePressureWorkspaceSlice(overrides),
            activeStage: 'pressureQueue'
          });
        }

        function dispatchChange(element) {
          element.dispatchEvent(new appWindow.Event('change', { bubbles: true }));
        }

        const waitForPressureCondition = (predicate, callback, attempts = 400) => {
          if (predicate() || attempts <= 0) {
            callback();
            return;
          }
          appWindow.setTimeout(() => waitForPressureCondition(predicate, callback, attempts - 1), 0);
        };

        const isStructuredPressureFailure = result => Boolean(
          result
          && ['input_error', 'constraint_conflict', 'budget_exhausted'].includes(result.status)
          && result.layout === null
          && Number.isSafeInteger(result.expanded)
          && result.expanded >= 0
          && Number.isSafeInteger(result.budget)
          && result.budget >= 0
          && Array.isArray(result.errors)
        );

        const seedPressureQualityPhase = () => {
          const pressurePhaseBase = core.createInitialState();
          localStorage.setItem(STORAGE_KEY, JSON.stringify({
            ...pressurePhaseBase,
            activeStage: 'pressureQueue',
            pressureQueue: makePressureWorkspaceSlice({
              levelName: '异步线路',
              annotations: [
                pressureCore.createAnnotation(1),
                pressureCore.createAnnotation(2),
                pressureCore.createAnnotation(3)
              ]
            })
          }));
          loadPhase = 'pressure-quality-async';
          appWindow.location.reload();
        };

        if (loadPhase === 'pressure-persistence-status') {
          test('刷新加载拒绝仅含 status 的伪 success 且不显示成功', () => {
            const result = app.getState().pressureQueue.result;
            assert(result === null || isStructuredPressureFailure(result), '仅含 status 的伪 success 刷新后仍被信任');
            const progress = appDocument.querySelector('#pressureQueueProgress');
            const summary = appDocument.querySelector('.pressure-result-summary');
            assert(progress && !progress.textContent.includes('生成成功'), '仅含 status 的伪 success 刷新后仍在进度区显示生成成功');
            assert(summary && !summary.textContent.includes('生成成功'), '仅含 status 的伪 success 刷新后仍在结果区显示生成成功');
          });

          const forgedLayoutState = makeGenuinePressureState('刷新伪布局');
          forgedLayoutState.pressureQueue.result = {
            ...forgedLayoutState.pressureQueue.result,
            layout: { belt: [99, 99, 99, 99], left: [], right: [] },
            verification: { errors: [] }
          };
          localStorage.setItem(STORAGE_KEY, JSON.stringify(forgedLayoutState));
          loadPhase = 'pressure-persistence-forged-layout';
          appWindow.location.reload();
          return;
        }

        if (loadPhase === 'pressure-persistence-forged-layout') {
          test('刷新加载独立验证并拒绝结构完整但不满足模型的伪 success', () => {
            const result = app.getState().pressureQueue.result;
            assert(result === null || isStructuredPressureFailure(result), '伪造布局 success 刷新后仍被信任');
            const progress = appDocument.querySelector('#pressureQueueProgress');
            const summary = appDocument.querySelector('.pressure-result-summary');
            assert(progress && !progress.textContent.includes('生成成功'), '伪造布局 success 刷新后仍在进度区显示生成成功');
            assert(summary && !summary.textContent.includes('生成成功'), '伪造布局 success 刷新后仍在结果区显示生成成功');
          });

          localStorage.setItem(STORAGE_KEY, JSON.stringify(makeGenuinePressureState('刷新真实成功')));
          loadPhase = 'pressure-persistence-genuine';
          appWindow.location.reload();
          return;
        }

        if (loadPhase === 'pressure-persistence-genuine') {
          test('刷新加载保留真实 success、规范 verification、JSON 稳定性和引用分离', () => {
            const loaded = app.getState();
            const result = loaded.pressureQueue.result;
            equal(result.status, 'success', '刷新后真实 success 未保留');
            const parsed = core.parsePressureQueueModel(loaded);
            const strict = pressureCore.verify(
              parsed.model,
              pressureCore.compileConstraints(parsed.model),
              result.layout
            );
            equal(result.verification, strict, '刷新后 success verification 不是规范严格验证');
            equal(JSON.parse(JSON.stringify(result)), result, '刷新后的真实 success 不能稳定 JSON 往返');
            const rawStored = JSON.parse(localStorage.getItem(STORAGE_KEY));
            const loadedLayout = clone(result.layout);
            assert(result !== rawStored.pressureQueue.result, '刷新加载结果共享存储解析对象引用');
            rawStored.pressureQueue.result.layout.belt[0] = 99;
            equal(result.layout, loadedLayout, '存储副本修改污染了刷新加载结果');
          });

          seedPressureQualityPhase();
          return;
        }

        if (loadPhase === 'pressure-quality-async') {
          const originalPressureCore = appWindow.PressureQueueCore;
          const originalFileReader = appWindow.FileReader;
          const nativeSetTimeout = appWindow.setTimeout.bind(appWindow);
          const nativeClearTimeout = appWindow.clearTimeout.bind(appWindow);
          const nativeRequestAnimationFrame = appWindow.requestAnimationFrame;
          const nativeCancelAnimationFrame = appWindow.cancelAnimationFrame;
          const qualityUnhandled = [];
          const pendingReaders = [];

          const onQualityUnhandled = event => {
            event.preventDefault();
            qualityUnhandled.push(event.reason);
          };
          appWindow.addEventListener('unhandledrejection', onQualityUnhandled);

          class ControlledPressureFileReader {
            constructor() {
              this.result = null;
              this.error = null;
              this.listeners = { load: [], error: [] };
            }

            addEventListener(type, listener) {
              if (this.listeners[type]) this.listeners[type].push(listener);
            }

            readAsText(file) {
              this.file = file;
              pendingReaders.push(this);
            }

            resolve(text) {
              this.result = text;
              this.listeners.load.forEach(listener => listener(new appWindow.Event('load')));
            }

            reject(message) {
              this.error = new appWindow.Error(message);
              this.listeners.error.forEach(listener => listener(new appWindow.Event('error')));
            }
          }

          const waitForQualityCondition = async (predicate, attempts = 400) => {
            for (let attempt = 0; attempt < attempts; attempt += 1) {
              if (predicate()) return true;
              await new Promise(resolve => nativeSetTimeout(resolve, 0));
            }
            return predicate();
          };

          const nextQualityTurn = () => new Promise(resolve => nativeSetTimeout(resolve, 0));

          const resetQualityWorkspace = (overrides = {}) => {
            const base = core.createInitialState();
            qualityUnhandled.length = 0;
            return app.updateState({
              ...base,
              activeStage: 'pressureQueue',
              pressureQueue: makePressureWorkspaceSlice({
                levelName: '质量审查线路',
                annotations: [
                  originalPressureCore.createAnnotation(1),
                  originalPressureCore.createAnnotation(2),
                  originalPressureCore.createAnnotation(3)
                ],
                ...overrides
              })
            });
          };

          const installQualitySession = createSearchSession => {
            appWindow.PressureQueueCore = Object.freeze({
              ...originalPressureCore,
              createSearchSession
            });
          };

          const assertStructuredPressureFailure = label => {
            const result = app.getState().pressureQueue.result;
            assert(result && result.status !== 'success' && result.status !== 'running', `${label} 未存储结构化非成功终态`);
            equal(result.layout, null, `${label} 未清空不可信 layout`);
            assert(Array.isArray(result.errors) && result.errors.length > 0, `${label} 未保存结构化错误`);
            equal(JSON.parse(JSON.stringify(result)), result, `${label} 终态不能稳定 JSON 往返`);
            equal(JSON.parse(localStorage.getItem(STORAGE_KEY)).pressureQueue.result, result, `${label} 终态未安全持久化`);
            const runButton = appDocument.querySelector('[data-action="run-pressure-queue"]');
            const cancelButton = appDocument.querySelector('[data-action="cancel-pressure-queue"]');
            assert(runButton && !runButton.disabled, `${label} 后运行按钮未恢复`);
            assert(cancelButton && cancelButton.disabled, `${label} 后取消按钮未恢复`);
            assert(!appDocument.querySelector('#pressureQueueProgress').textContent.includes('搜索中'), `${label} 后仍停留在运行状态`);
          };

          const beginControlledImport = filename => {
            const fileInput = appDocument.querySelector('#pressureQueueVehicleCsvFile');
            const file = new appWindow.File([filename], filename, { type: 'text/tab-separated-values' });
            Object.defineProperty(fileInput, 'files', { configurable: true, value: [file] });
            dispatchChange(fileInput);
            return pendingReaders.at(-1);
          };

          void (async () => {
            try {
              resetQualityWorkspace();
              installQualitySession(() => ({
                advance: () => ({
                  status: 'success',
                  layout: null,
                  verification: { errors: [{ category: 'constraint_conflict', code: 'forged', message: 'forged failure' }] },
                  errors: [],
                  expanded: 1,
                  budget: 64
                })
              }));
              appDocument.querySelector('[data-action="run-pressure-queue"]').click();
              await waitForQualityCondition(() => Boolean(app.getState().pressureQueue.result));
              test('声明 success 但 layout 为空或 verification 含错时拒绝成功终态', () => {
                assertStructuredPressureFailure('空布局伪成功');
                assert(!appDocument.querySelector('#pressureQueueProgress').textContent.includes('生成成功'), '空布局伪成功仍显示成功');
              });

              resetQualityWorkspace();
              installQualitySession(() => ({
                advance: () => ({
                  status: 'success',
                  layout: { belt: [99, 99, 99, 99], left: [], right: [] },
                  verification: { errors: [] },
                  errors: [],
                  expanded: 1,
                  budget: 64
                })
              }));
              appDocument.querySelector('[data-action="run-pressure-queue"]').click();
              await waitForQualityCondition(() => Boolean(app.getState().pressureQueue.result));
              test('独立严格验证拒绝声明 verification 无错但布局伪造的 success', () => {
                assertStructuredPressureFailure('伪造布局成功');
              });

              resetQualityWorkspace();
              installQualitySession(() => {
                throw new appWindow.Error('session constructor boom');
              });
              appDocument.querySelector('[data-action="run-pressure-queue"]').click();
              await waitForQualityCondition(() => Boolean(app.getState().pressureQueue.result) || qualityUnhandled.length > 0);
              test('createSearchSession 抛错时安全收敛且恢复运行控制', () => {
                equal(qualityUnhandled, [], 'createSearchSession 抛错产生未处理 Promise rejection');
                assertStructuredPressureFailure('会话创建异常');
              });

              resetQualityWorkspace();
              let throwingAdvanceCount = 0;
              installQualitySession(() => ({
                advance() {
                  throwingAdvanceCount += 1;
                  if (throwingAdvanceCount === 1) {
                    return { status: 'running', layout: null, errors: [], expanded: 1, budget: 64, frontier: 1 };
                  }
                  throw new appWindow.Error('advance boom');
                }
              }));
              appDocument.querySelector('[data-action="run-pressure-queue"]').click();
              await waitForQualityCondition(() => Boolean(app.getState().pressureQueue.result) || qualityUnhandled.length > 0);
              test('advance 在协作让出后抛错时安全收敛且不滞留运行态', () => {
                equal(throwingAdvanceCount, 2, 'advance 抛错场景未跨过一次协作让出');
                equal(qualityUnhandled, [], 'advance 抛错产生未处理 Promise rejection');
                assertStructuredPressureFailure('推进异常');
              });

              resetQualityWorkspace();
              installQualitySession(() => ({ advance: () => null }));
              appDocument.querySelector('[data-action="run-pressure-queue"]').click();
              await waitForQualityCondition(() => Boolean(app.getState().pressureQueue.result) || qualityUnhandled.length > 0);
              test('空或畸形 advance 结果被拒绝为结构化非成功终态', () => {
                equal(qualityUnhandled, [], '畸形 advance 结果产生未处理 Promise rejection');
                assertStructuredPressureFailure('畸形推进结果');
              });

              resetQualityWorkspace();
              installQualitySession(() => ({
                advance: () => ({
                  status: 'mystery_status',
                  layout: { belt: [1], left: [], right: [] },
                  errors: [],
                  expanded: 1,
                  budget: 64,
                  unsafe() {}
                })
              }));
              appDocument.querySelector('[data-action="run-pressure-queue"]').click();
              await waitForQualityCondition(() => Boolean(app.getState().pressureQueue.result) || qualityUnhandled.length > 0);
              test('未知状态与非 JSON 安全终态被拒绝且不污染持久化', () => {
                equal(qualityUnhandled, [], '未知非 JSON 终态产生未处理 Promise rejection');
                assertStructuredPressureFailure('未知非 JSON 终态');
              });

              appWindow.PressureQueueCore = originalPressureCore;
              appWindow.FileReader = ControlledPressureFileReader;

              const importAnnotations = [
                { ...originalPressureCore.createAnnotation(1), initialOccupy: { mode: 'medium', count: null, duration: null } },
                originalPressureCore.createAnnotation(2),
                originalPressureCore.createAnnotation(3)
              ];
              resetQualityWorkspace({ levelName: '导入前线路', annotations: importAnnotations });
              const pendingEditReader = beginControlledImport('pending-edit.tsv');
              const editedLevel = appDocument.querySelector('[data-pressure-field="levelName"]');
              editedLevel.value = '导入等待期间的新线路';
              editedLevel.dispatchEvent(new appWindow.Event('input', { bubbles: true }));
              dispatchChange(editedLevel);
              const pendingEditTable = '车辆id\t车颜色\t车座位\t深度\n9\t1\t4\t0';
              pendingEditReader.resolve(pendingEditTable);
              await waitForQualityCondition(() => app.getState().pressureQueue.vehicleTableText === pendingEditTable);
              test('文件导入完成仅补丁车辆表并保留等待期间的最新字段与标注', () => {
                equal(app.getState().pressureQueue.levelName, '导入等待期间的新线路', '迟到导入覆盖了等待期间的字段编辑');
                equal(app.getState().pressureQueue.annotations, importAnnotations, '迟到导入改写了已有标注');
                equal(app.getState().pressureQueue.vehicleTableText, pendingEditTable, '迟到导入未写入车辆表');
              });

              resetQualityWorkspace({ levelName: '双导入线路', annotations: importAnnotations });
              const olderReader = beginControlledImport('older.tsv');
              const newerReader = beginControlledImport('newer.tsv');
              const newerTable = '车辆id\t车颜色\t车座位\t深度\n22\t1\t4\t0';

        test('压力队列问题 helper 递归隔离恶意 detail 且永远可 JSON 保存', () => {
          let getterCalls = 0;
          const symbolKey = Symbol('hidden');
          const detail = {
            category: 'overridden',
            code: 'overridden',
            message: 'overridden',
            nested: { keep: 'value', invalidBigInt: 10n, invalidNumber: Number.NaN },
            dense: [null, true, 'text', 2.5, { keep: 3 }],
            sparse: [, 1],
            invalidArray: [1, 2n],
            invalidUndefined: undefined,
            invalidFunction: () => 'bad',
            invalidInfinity: Number.POSITIVE_INFINITY,
            toJSON() {
              throw new Error('toJSON 不得被保留或调用');
            }
          };
          detail.self = detail;
          detail[symbolKey] = 'symbol value';
          Object.defineProperty(detail, 'hidden', { enumerable: false, value: 'hidden value' });
          Object.defineProperty(detail, 'dangerous', {
            enumerable: true,
            get() {
              getterCalls += 1;
              throw new Error('getter 不得执行');
            }
          });

          const issue = pressureCore.createIssue('input_error', 'safe_code', '安全消息', detail);
          equal(issue, {
            category: 'input_error',
            code: 'safe_code',
            message: '安全消息',
            nested: { keep: 'value' },
            dense: [null, true, 'text', 2.5, { keep: 3 }]
          }, '恶意 detail 未被严格过滤');
          equal(getterCalls, 0, 'detail getter 被执行');
          assert(issue.nested !== detail.nested, '嵌套对象引用未隔离');
          assert(issue.dense !== detail.dense && issue.dense[4] !== detail.dense[4], '嵌套数组引用未隔离');
          assert(Object.getPrototypeOf(issue.nested) === Object.getPrototypeOf(issue), '嵌套对象未使用输出 realm 的普通原型');
          equal(JSON.parse(JSON.stringify(issue)), issue, '过滤后 issue 仍不能 JSON 往返');
        });

            observer.disconnect();

          assert(appDocument.querySelector('[data-action="download-path-solver-md"]'), '关卡求解页缺少导出 MD 按钮');
          const pathSolveStatus = appDocument.querySelector('.path-solve-status');
          assert(pathSolveStatus, '关卡求解页缺少搜索状态显示');
          assert(pathSolveStatus.textContent.includes('尚未运行求解'), '关卡求解状态初始文案错误');

          appDocument.querySelector('.path-solve-input[data-path-solve-field="levelName"]').value = '第9关';
          appDocument.querySelector('.path-solve-input[data-path-solve-field="conveyorCapacity"]').value = '4';
          appDocument.querySelector('.path-solve-input[data-path-solve-field="beltQueueText"]').value = '3,3,3,3';
          appDocument.querySelector('.path-solve-input[data-path-solve-field="leftQueueText"]').value = '1,1,1,1';
          appDocument.querySelector('.path-solve-input[data-path-solve-field="rightQueueText"]').value = '2,2,2,2';
          appDocument.querySelector('.path-solve-input[data-path-solve-field="beamWidth"]').value = '16';
          appDocument.querySelector('.path-solve-input[data-path-solve-field="branchLimit"]').value = '8';
          appDocument.querySelector('.path-solve-input[data-path-solve-field="vehicleTableText"]').value = [
            '车辆id\t车颜色\t车座位\t深度\t前方车辆id\t后方车辆id',
            '28\t1\t4\t3\t44\t',
            '41\t2\t4\t3\t44\t',
            '44\t3\t4\t0\t\t28,41'
          ].join('\n');
          appDocument.querySelector('[data-action="run-path-solver"]').click();

          const report = appDocument.querySelector('.path-solve-report').textContent;
          assert(report.includes('状态：solved'), '路径求解应成功');
          assert(report.includes('点击顺序：44,'), '路径应先点击 #44');
          assert(report.includes('可点击车辆'), '路径证明应包含可点击车辆');

          let capturedBlob = null;
          let capturedDownload = '';
          let capturedHref = '';
          let revokedUrl = '';
          const originalCreateObjectURL = appWindow.URL.createObjectURL;
          const originalRevokeObjectURL = appWindow.URL.revokeObjectURL;
          const originalAnchorClick = appWindow.HTMLAnchorElement.prototype.click;
          appWindow.URL.createObjectURL = blob => {
            capturedBlob = blob;
            return 'blob:path-solver-report';
          };
          appWindow.URL.revokeObjectURL = url => {
            revokedUrl = url;
          };
          appWindow.HTMLAnchorElement.prototype.click = function click() {
            capturedDownload = this.download;
            capturedHref = this.href;
          };
          appDocument.querySelector('[data-action="download-path-solver-md"]').click();
          appWindow.URL.createObjectURL = originalCreateObjectURL;
          appWindow.URL.revokeObjectURL = originalRevokeObjectURL;
          appWindow.HTMLAnchorElement.prototype.click = originalAnchorClick;
          assert(capturedBlob instanceof appWindow.Blob, '关卡求解导出 MD 未生成 Blob');
          assert(capturedBlob.type.includes('text/markdown'), '关卡求解导出 Blob 类型不是 Markdown');
          equal(capturedBlob.size, new appWindow.Blob([report], { type: 'text/markdown;charset=utf-8' }).size, '关卡求解导出内容大小应与报告文本一致');
          equal(capturedDownload, '第9关-关卡求解证明.md', '关卡求解导出文件名错误');
          equal(capturedHref, 'blob:path-solver-report', '关卡求解导出未使用创建的对象 URL');
          equal(revokedUrl, 'blob:path-solver-report', '关卡求解导出后未释放对象 URL');
        });

        test('立即结算模拟页面支持点击截图标记记录选车', () => {
          let state = core.createInitialState();
          state = core.setStableSimulationInput(state, {
            conveyorCapacity: '4',
            passengerQueueText: '1,1,1,1,3,3',
            vehicleTableText: '车辆id\t车颜色\t车座位\t深度\n1\t1\t4\t0\n2\t3\t6\t0',
            clickSequenceText: ''
          });
          state = core.setStableSimulationScreenshot(state, 'data:image/png;base64,abc');
          app.updateState({ ...state, activeStage: 'simulation' });
          assert(appDocument.querySelector('#simulationScreenshotFile'), '缺少截图导入控件');
          assert(appDocument.querySelector('.stable-simulation-screenshot'), '未显示停车场截图');

          appDocument.querySelector('#simulationManualVehicleId').value = '1';
          const wrap = appDocument.querySelector('.stable-simulation-screenshot-wrap');
          wrap.getBoundingClientRect = () => ({
            left: 0,
            top: 0,
            width: 200,
            height: 100,
            right: 200,
            bottom: 100,
            x: 0,
            y: 0,
            toJSON: () => ({})
          });
          wrap.dispatchEvent(new appWindow.MouseEvent('click', {
            bubbles: true,
            clientX: 50,
            clientY: 40
          }));
          equal(app.getState().simulation.hotspots, [{ id: 1, vehicleId: 1, xPercent: 25, yPercent: 40, isClicked: false }], '截图点击未新增车辆标记');

          const marker = appDocument.querySelector('[data-action="append-stable-simulation-hotspot-click"][data-hotspot-id="1"]');
          assert(marker, '未渲染可点击车辆标记');
          assert(marker.textContent.includes('#1'), '车辆标记未显示 id');
          marker.click();
          equal(app.getState().simulation.clickSequenceText, '1', '点击截图标记未追加选车顺序');
          equal(appDocument.querySelector('.simulation-input[data-simulation-field="clickSequenceText"]').value, '1', '截图选车后文本框未同步');
          assert(appDocument.querySelector('.script-report').textContent.includes('#1红色4'), '截图选车后报告未更新');
          const clickedMarker = appDocument.querySelector('[data-action="append-stable-simulation-hotspot-click"][data-hotspot-id="1"]');
          assert(clickedMarker.textContent.includes('✓'), '点击后的车辆标记应显示打勾');
          assert(clickedMarker.disabled, '点击后的车辆标记应禁用，避免重复记录');

          appDocument.querySelector('[data-action="delete-stable-simulation-hotspot"][data-hotspot-id="1"]').click();
          equal(app.getState().simulation.hotspots, [], '删除截图标记失败');
        });

        test('立即结算模拟页面支持撤销、删除步骤和清空点击记录', () => {
          appDocument.querySelector('.stage-button[data-stage="simulation"]').click();
          appDocument.querySelector('.simulation-input[data-simulation-field="conveyorCapacity"]').value = '4';
          appDocument.querySelector('.simulation-input[data-simulation-field="beltQueueText"]').value = '1,1,1,1';
          appDocument.querySelector('.simulation-input[data-simulation-field="leftQueueText"]').value = '3,3';
          appDocument.querySelector('.simulation-input[data-simulation-field="rightQueueText"]').value = '';
          appDocument.querySelector('.simulation-input[data-simulation-field="vehicleTableText"]').value = '车辆id\t车颜色\t车座位\t深度\n1\t1\t4\t0\n2\t3\t6\t0';
          appDocument.querySelector('.simulation-input[data-simulation-field="clickSequenceText"]').value = '';
          appDocument.querySelector('[data-action="run-stable-simulation"]').click();
          appDocument.querySelector('[data-action="append-stable-simulation-click"][data-vehicle-id="1"]').click();
          appDocument.querySelector('[data-action="append-stable-simulation-click"][data-vehicle-id="2"]').click();
          equal(app.getState().simulation.clickSequenceText, '1,2', '前置点击序列错误');

          const undoButton = appDocument.querySelector('[data-action="undo-stable-simulation-click"]');
          assert(undoButton, '缺少撤销上一步按钮');
          undoButton.click();
          equal(app.getState().simulation.clickSequenceText, '1', '撤销按钮未删除最后一步');

          appDocument.querySelector('[data-action="append-stable-simulation-click"][data-vehicle-id="2"]').click();
          const deleteButton = appDocument.querySelector('[data-action="delete-stable-simulation-step"][data-step-index="0"]');
          assert(deleteButton, '步骤日志缺少删除按钮');
          deleteButton.click();
          equal(app.getState().simulation.clickSequenceText, '2', '删除第 1 步按钮未重建序列');

          const originalConfirm = appWindow.confirm;
          appWindow.confirm = () => true;
          appDocument.querySelector('[data-action="clear-stable-simulation-clicks"]').click();
          appWindow.confirm = originalConfirm;
          equal(app.getState().simulation.clickSequenceText, '', '清空点击记录按钮未清空序列');
          equal(app.getState().simulation.conveyorCapacity, '4', '清空点击记录不应清空基础输入');
        });

        const pressurePhaseBase = core.createInitialState();
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          ...pressurePhaseBase,
          activeStage: 'pressureQueue',
          pressureQueue: makePressureWorkspaceSlice({
            levelName: '刷新仅 status 伪成功',
            result: { status: 'success' }
          })
        }));
        loadPhase = 'pressure-persistence-status';
        appWindow.location.reload();
      } catch (error) {
        failSuite('测试页脚本异常', error);
      }
    });

    localStorage.removeItem(STORAGE_KEY);
    appFrame.src = `../index.html?test=${Date.now()}`;
  </script>
