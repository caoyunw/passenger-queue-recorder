<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>乘客队列记录工具测试</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      margin: 0;
      padding: 24px;
      color: #202938;
      background: #f6f8fb;
    }

    h1 {
      margin-top: 0;
    }

    #summary {
      padding: 12px 16px;
      border-radius: 8px;
      background: #e8edf4;
      font-weight: 700;
    }

    #summary.pass {
      color: #166534;
      background: #dcfce7;
    }

    #summary.fail {
      color: #991b1b;
      background: #fee2e2;
    }

    #results {
      padding-left: 24px;
    }

    #results li {
      margin: 10px 0;
    }

    .pass {
      color: #16803c;
    }

    .fail {
      color: #c33b32;
    }

    iframe {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>
<body data-status="running" data-failures="0">
  <h1>乘客队列记录工具测试</h1>
  <p id="summary">正在等待生产页面加载...</p>
  <ol id="results"></ol>
  <iframe id="app" title="乘客队列记录工具"></iframe>

  <script>
    const results = document.querySelector('#results');
    const summary = document.querySelector('#summary');
    let passed = 0;
    let failed = 0;
    let suiteFinished = false;
    let timeoutId;
    const STORAGE_KEY = 'passenger-queue-recorder-state-v5';
    const originalStoredState = localStorage.getItem(STORAGE_KEY);
    let loadPhase = 'initial';
    const DEFAULT_COLORS = [
      { name: '红色', value: 1, hex: '#e54c4c' },
      { name: '黄色', value: 2, hex: '#f3bd3d' },
      { name: '蓝色', value: 3, hex: '#3478f6' },
      { name: '绿色', value: 4, hex: '#32a852' },
      { name: '粉色', value: 5, hex: '#ec71a5' },
      { name: '紫色', value: 6, hex: '#8b5cf6' },
      { name: '天蓝色', value: 7, hex: '#58bde9' },
      { name: '棕色', value: 8, hex: '#8b5a3c' },
      { name: '橙色', value: 9, hex: '#f97316' },
      { name: '黑色', value: 10, hex: '#202529' },
      { name: '白色', value: 11, hex: '#f7f7f2' }
    ];
    const EMPTY_SECTIONS = { conveyor: [], left: [], right: [] };

    function assert(condition, message) {
      if (!condition) throw new Error(message);
    }

    function normalize(value) {
      if (Array.isArray(value)) {
        return value.map(normalize);
      }
      if (value && typeof value === 'object') {
        return Object.keys(value).sort().reduce((normalized, key) => {
          normalized[key] = normalize(value[key]);
          return normalized;
        }, {});
      }
      return value;
    }

    function serialize(value) {
      return JSON.stringify(normalize(value));
    }

    function clone(value) {
      return JSON.parse(JSON.stringify(value));
    }

    function withStoredState(value, operation) {
      const previousValue = localStorage.getItem(STORAGE_KEY);
      try {
        if (value === null) {
          localStorage.removeItem(STORAGE_KEY);
        } else {
          localStorage.setItem(STORAGE_KEY, value);
        }
        return operation();
      } finally {
        if (previousValue === null) {
          localStorage.removeItem(STORAGE_KEY);
        } else {
          localStorage.setItem(STORAGE_KEY, previousValue);
        }
      }
    }

    function restoreOriginalStoredState() {
      if (originalStoredState === null) {
        localStorage.removeItem(STORAGE_KEY);
      } else {
        localStorage.setItem(STORAGE_KEY, originalStoredState);
      }
    }

    window.addEventListener('pagehide', restoreOriginalStoredState);

    function equal(actual, expected, message) {
      assert(
        serialize(actual) === serialize(expected),
        `${message}，期望：${serialize(expected)}，实际：${serialize(actual)}`
      );
    }

    function assertPure(label, input, operation) {
      const inputSnapshot = clone(input);
      const output = operation();
      equal(input, inputSnapshot, `${label} 突变了输入状态`);
      return output;
    }

    function addResult(kind, name, detail) {
      const item = document.createElement('li');
      item.className = kind;
      item.append(`${kind.toUpperCase()}：${name}`);
      if (detail) {
        item.append(document.createElement('br'), detail);
      }
      results.append(item);
    }

    function test(name, fn) {
      try {
        fn();
        passed += 1;
        addResult('pass', name);
      } catch (error) {
        failed += 1;
        addResult('fail', name, error.message);
      }
    }

    function finish() {
      if (suiteFinished) return;
      suiteFinished = true;
      clearTimeout(timeoutId);
      restoreOriginalStoredState();
      const status = failed === 0 ? 'pass' : 'fail';
      document.body.dataset.status = status;
      document.body.dataset.failures = String(failed);
      summary.className = status;
      summary.textContent = `汇总：PASS ${passed} / FAIL ${failed}`;
    }

    function failSuite(name, error) {
      if (suiteFinished) return;
      failed += 1;
      addResult('fail', name, error instanceof Error ? error.message : String(error));
      finish();
    }

    window.addEventListener('error', event => {
      failSuite('测试页脚本异常', event.error || event.message);
    });

    window.addEventListener('unhandledrejection', event => {
      failSuite('测试页 Promise 异常', event.reason);
    });

    timeoutId = setTimeout(() => {
      failSuite('测试页执行超时', '生产页面加载回调未在限定时间内完成');
    }, 3000);

    const appFrame = document.querySelector('#app');

    appFrame.addEventListener('load', () => {
      if (suiteFinished) return;

      try {
        const appWindow = appFrame.contentWindow;
        const appDocument = appWindow.document;
        const core = appWindow.QueueRecorderCore;
        const pressureCore = appWindow.PressureQueueCore;
        const app = appWindow.QueueRecorderApp;

        if (loadPhase === 'restore-right') {
          test('刷新后恢复 right 阶段、队列色块和乘客数量', () => {
            assert(app, '刷新后 QueueRecorderApp 不存在');
            equal(app.getState().activeStage, 'right', '刷新后未恢复 right 阶段');
            equal(app.getState().queues.right, [3], '刷新后未恢复 right 队列');
            assert(appDocument.querySelector('.stage-button[data-stage="right"]').classList.contains('is-active'), '刷新后 right 导航未高亮');
            equal(appDocument.querySelector('.sequence-chip[data-index="0"]').textContent, '3', '刷新后序列色块错误');
            equal(appDocument.querySelector('.count-card strong').textContent, '1', '刷新后乘客数量错误');
          });

          if (!app) {
            finish();
            return;
          }

          localStorage.setItem(STORAGE_KEY, JSON.stringify({ ...app.getState(), activeStage: 'configs' }));
          loadPhase = 'restore-configs';
          appWindow.location.reload();
          return;
        }

        if (loadPhase === 'restore-configs') {
          test('刷新后恢复 configs 高亮和配置渲染', () => {
            assert(app, 'configs 刷新后 QueueRecorderApp 不存在');
            equal(app.getState().activeStage, 'configs', '刷新后未恢复 configs 阶段');
            assert(appDocument.querySelector('.stage-button[data-stage="configs"]').classList.contains('is-active'), '刷新后 configs 导航未高亮');
            assert(appDocument.querySelector('[data-config-key="right"] .config-value'), '刷新后 configs 配置卡片缺失');
            equal(appDocument.querySelector('[data-config-key="right"] .config-value').textContent, '3', '刷新后 configs 右侧配置错误');
          });

          finish();
          return;
        }

        test('页面暴露核心状态 API', () => {
          assert(core, 'QueueRecorderCore 不存在');
        });

        test('压力队列核心 API 可从 iframe 读取且常量被冻结', () => {
          assert(pressureCore, 'PressureQueueCore 不存在');
          equal(pressureCore.SETTLEMENT_TARGETS, ['normal', 'instant', 'empty', 'partial'], '结算目标常量错误');
          equal(pressureCore.STRENGTH_MODES, ['low', 'medium', 'high', 'custom'], '强度模式常量错误');
          equal(pressureCore.OCCUPY_PRESETS, {
            low: { ratio: 0.20, duration: 1 },
            medium: { ratio: 0.35, duration: 3 },
            high: { ratio: 0.50, duration: 5 }
          }, '占带预设错误');
          equal(pressureCore.PREVIEW_PRESETS, { low: 2, medium: 6, high: 10 }, '预告预设错误');
          assert(Object.isFrozen(pressureCore), 'PressureQueueCore 顶层 API 未冻结');
          assert(Object.isFrozen(pressureCore.SETTLEMENT_TARGETS), '结算目标常量未冻结');
          assert(Object.isFrozen(pressureCore.STRENGTH_MODES), '强度模式常量未冻结');
          assert(Object.isFrozen(pressureCore.OCCUPY_PRESETS), '占带预设未冻结');
          assert(Object.isFrozen(pressureCore.OCCUPY_PRESETS.low), '占带低强度预设未冻结');
          assert(Object.isFrozen(pressureCore.PREVIEW_PRESETS), '预告预设未冻结');
        });

        test('压力队列默认车辆标注包含全部空标签', () => {
          assert(pressureCore, 'PressureQueueCore 不存在');
          equal(pressureCore.createAnnotation(35), {
            vehicleId: 35,
            settlementTarget: 'normal',
            remainingSeats: null,
            pressureSlot: false,
            pathUnlock: false,
            initialOccupy: null,
            laterOccupy: null,
            rightPreview: null,
            releaseTriggerVehicleId: null
          }, '默认标注错误');
        });

        test('压力队列强度基础结构接受空值和合法模式并拒绝非法对象', () => {
          assert(pressureCore, 'PressureQueueCore 不存在');
          assert(pressureCore.isStrength(null), '空强度应合法');
          assert(pressureCore.isStrength({ mode: 'low' }), '低强度应合法');
          assert(pressureCore.isStrength({ mode: 'medium', count: null, duration: null }), '带空占位字段的预设强度应合法');
          assert(pressureCore.isStrength({ mode: 'custom', count: 0 }), '仅含人数的自定义预告强度应合法');
          assert(pressureCore.isStrength({ mode: 'custom', count: 4, duration: 2 }), '含人数和持续步数的自定义占带强度应合法');
          assert(!pressureCore.isStrength({ mode: 'custom' }), '缺少自定义人数不应合法');
          assert(!pressureCore.isStrength({ mode: 'custom', count: -1 }), '负数自定义人数不应合法');
          assert(!pressureCore.isStrength({ mode: 'custom', count: 1, duration: 0 }), '非正持续步数不应合法');
          assert(!pressureCore.isStrength({ mode: 'unknown' }), '未知强度模式不应合法');
          assert(!pressureCore.isStrength([]), '数组不应被识别为强度');
        });

        test('压力队列标注校验拒绝非法释放车辆 ID 并保留 partial 待严格校验', () => {
          assert(pressureCore, 'PressureQueueCore 不存在');
          const partial = { ...pressureCore.createAnnotation(7), settlementTarget: 'partial' };
          assert(pressureCore.isAnnotation(partial), 'partial 缺少剩余座位应留给后续严格验证');
          assert(!pressureCore.isAnnotation({ ...partial, remainingSeats: 0 }), '明显非法的剩余座位不应通过基础校验');
          assert(!pressureCore.isAnnotation({ ...partial, releaseTriggerVehicleId: -1 }), '负数释放车辆 ID 不应合法');
          assert(!pressureCore.isAnnotation({ ...partial, releaseTriggerVehicleId: 1.5 }), '非整数释放车辆 ID 不应合法');
          assert(pressureCore.isAnnotation({ ...partial, remainingSeats: 2, releaseTriggerVehicleId: 0 }), '合法释放车辆 ID 应通过校验');
        });

        test('压力队列同步标注按车辆顺序保留、补全和移除且不泄漏引用', () => {
          assert(pressureCore, 'PressureQueueCore 不存在');
          const retained = {
            ...pressureCore.createAnnotation(7),
            settlementTarget: 'instant',
            pressureSlot: true,
            initialOccupy: { mode: 'low' }
          };
          const removed = { ...pressureCore.createAnnotation(5), pathUnlock: true };
          const existing = [retained, removed];
          const synced = pressureCore.syncAnnotations([9, 7], existing);

          equal(synced, [pressureCore.createAnnotation(9), retained], '同步标注未正确保留、补全或移除');
          assert(synced[1] !== retained, '同步结果泄漏了已有标注对象引用');
          assert(synced[1].initialOccupy !== retained.initialOccupy, '同步结果泄漏了嵌套强度对象引用');
          synced[1].initialOccupy.mode = 'high';
          equal(retained.initialOccupy, { mode: 'low' }, '修改同步结果影响了调用方已有标注');
          const secondSync = pressureCore.syncAnnotations([7], synced);
          assert(secondSync[0] !== synced[1], '重复同步泄漏了上次返回的标注对象引用');
          assert(secondSync[0].initialOccupy !== synced[1].initialOccupy, '重复同步泄漏了上次返回的嵌套引用');
        });

        test('压力队列占带低中高强度按容量向上取整并使用预设持续步数', () => {
          assert(pressureCore, 'PressureQueueCore 不存在');
          equal(pressureCore.resolveOccupyStrength({ mode: 'low' }, 13), { count: 3, duration: 1 }, '低强度换算错误');
          equal(pressureCore.resolveOccupyStrength({ mode: 'medium' }, 13), { count: 5, duration: 3 }, '中强度换算错误');
          equal(pressureCore.resolveOccupyStrength({ mode: 'high' }, 13), { count: 7, duration: 5 }, '高强度换算错误');
        });

        test('压力队列自定义占带严格限制人数和持续步数边界', () => {
          assert(pressureCore, 'PressureQueueCore 不存在');
          equal(pressureCore.resolveOccupyStrength({ mode: 'custom', count: 0, duration: 1 }, 12), { count: 0, duration: 1 }, '自定义占带下界错误');
          equal(pressureCore.resolveOccupyStrength({ mode: 'custom', count: 12, duration: 3 }, 12), { count: 12, duration: 3 }, '自定义占带上界错误');
          equal(pressureCore.resolveOccupyStrength({ mode: 'custom', count: 13, duration: 3 }, 12), null, '超容量人数应无效');
          equal(pressureCore.resolveOccupyStrength({ mode: 'custom', count: 1, duration: 0 }, 12), null, '零持续步数应无效');
          equal(pressureCore.resolveOccupyStrength({ mode: 'custom', count: 1.5, duration: 2 }, 12), null, '非整数人数应无效');
          equal(pressureCore.resolveOccupyStrength(null, 12), null, '空占带强度应无法换算');
          equal(pressureCore.resolveOccupyStrength({ mode: 'low' }, -1), null, '负容量应无效');
        });

        test('压力队列右侧预告换算为 2、6、10 并严格限制自定义边界', () => {
          assert(pressureCore, 'PressureQueueCore 不存在');
          equal(['low', 'medium', 'high'].map(mode => pressureCore.resolvePreviewStrength({ mode })), [2, 6, 10], '预告预设强度错误');
          equal(pressureCore.resolvePreviewStrength({ mode: 'custom', count: 0 }), 0, '自定义预告下界错误');
          equal(pressureCore.resolvePreviewStrength({ mode: 'custom', count: 10 }), 10, '自定义预告上界错误');
          equal(pressureCore.resolvePreviewStrength({ mode: 'custom', count: -1 }), null, '低于预告下界应无效');
          equal(pressureCore.resolvePreviewStrength({ mode: 'custom', count: 11 }), null, '超过预告上界应无效');
          equal(pressureCore.resolvePreviewStrength({ mode: 'custom', count: 1.5 }), null, '非整数预告人数应无效');
          equal(pressureCore.resolvePreviewStrength(null), null, '空预告强度应无法换算');
        });

        if (!core) {
          finish();
          return;
        }

        test('初始状态包含默认颜色、空区域和默认阶段', () => {
          const state = core.createInitialState();
          equal(state.colors, DEFAULT_COLORS, '默认颜色错误');
          equal(state.queues, EMPTY_SECTIONS, '初始队列应为空');
          equal(state.histories, EMPTY_SECTIONS, '初始撤销历史应为空');
          assert(!Object.prototype.hasOwnProperty.call(state, 'parking'), '初始状态不应再包含车位记录');
          assert(!Object.prototype.hasOwnProperty.call(state, 'script'), '初始状态不应再包含剧本还原数据');
          equal(state.activeStage, 'conveyor', '初始阶段错误');
        });

        test('立即结算模拟器初始状态包含文本输入和空结果', () => {
          const state = core.createInitialState();
          equal(state.simulation, {
            levelName: '',
            conveyorCapacity: '',
            beltQueueText: '',
            leftQueueText: '',
            rightQueueText: '',
            passengerQueueText: '',
            vehicleTableText: '',
            clickSequenceText: '',
            screenshotDataUrl: '',
            hotspots: [],
            nextHotspotId: 1,
            result: null,
            errors: []
          }, '模拟器初始状态错误');
          assert(core.saveState(state), '包含模拟器状态时应允许保存');
        });

        test('路径求解器初始状态包含输入、结果和错误', () => {
          const state = core.createInitialState();
          equal(state.pathSolve, {
            levelName: '',
            conveyorCapacity: '',
            beltQueueText: '',
            leftQueueText: '',
            rightQueueText: '',
            vehicleTableText: '',
            clickSequenceText: '',
            beamWidth: '192',
            branchLimit: '24',
            result: null,
            errors: []
          }, '路径求解器初始状态错误');
          assert(core.saveState(state), '包含路径求解器状态时应允许保存');
        });

        test('追加、删除和撤销只影响当前区域', () => {
          let state = core.createInitialState();
          state = core.appendValue(state, 'left', 3);
          state = core.appendValue(state, 'right', 2);
          state = core.appendValue(state, 'conveyor', 1);
          state = core.appendValue(state, 'conveyor', 2);
          equal(state.queues, { conveyor: [1, 2], left: [3], right: [2] }, '追加结果错误');
          state = core.removeAt(state, 'conveyor', 0);
          equal(state.queues, { conveyor: [2], left: [3], right: [2] }, '删除影响了其他区域');
          state = core.undo(state, 'conveyor');
          equal(state.queues, { conveyor: [1, 2], left: [3], right: [2] }, '撤销影响了其他区域');
        });

        test('删除中间项按索引移除目标乘客', () => {
          let state = core.createInitialState();
          state = core.appendValue(state, 'conveyor', 1);
          state = core.appendValue(state, 'conveyor', 2);
          state = core.appendValue(state, 'conveyor', 3);
          state = core.removeAt(state, 'conveyor', 1);
          equal(state.queues.conveyor, [1, 3], '删除中间项失败');
        });

        test('连续撤销逐层回退，空历史撤销保持状态不变', () => {
          let state = core.createInitialState();
          state = core.appendValue(state, 'left', 1);
          state = core.appendValue(state, 'left', 2);
          state = core.appendValue(state, 'left', 3);
          state = core.undo(state, 'left');
          equal(state.queues.left, [1, 2], '第一次撤销追加失败');
          state = core.undo(state, 'left');
          equal(state.queues.left, [1], '第二次撤销追加失败');
          state = core.undo(state, 'left');
          equal(state.queues.left, [], '第三次撤销追加失败');
          const emptyHistoryState = clone(state);
          state = core.undo(state, 'left');
          equal(state, emptyHistoryState, '历史为空时继续撤销不应改变状态');
        });

        test('三个区域交错编辑后分别撤销，区域历史互相独立', () => {
          let state = core.createInitialState();
          state = core.appendValue(state, 'conveyor', 1);
          state = core.appendValue(state, 'left', 2);
          state = core.appendValue(state, 'right', 3);
          state = core.appendValue(state, 'conveyor', 2);
          state = core.appendValue(state, 'left', 1);
          state = core.appendValue(state, 'right', 2);
          state = core.undo(state, 'left');
          equal(state.queues, { conveyor: [1, 2], left: [2], right: [3, 2] }, '左侧撤销影响了其他区域');
          state = core.undo(state, 'conveyor');
          equal(state.queues, { conveyor: [1], left: [2], right: [3, 2] }, '传送带撤销影响了其他区域');
          state = core.undo(state, 'right');
          equal(state.queues, { conveyor: [1], left: [2], right: [3] }, '右侧撤销影响了其他区域');
        });

        test('新增颜色自动使用最大映射值加一', () => {
          const initialState = core.createInitialState();
          const stateWithGap = {
            ...initialState,
            colors: [...initialState.colors, { name: '映射色 18', hex: '#546e7a', value: 18 }]
          };
          const colorsBeforeAdd = clone(stateWithGap.colors);
          const state = core.addColor(stateWithGap, '  紫色  ', '#8b5cf6');
          equal(state.colors.at(-1), { name: '紫色', hex: '#8b5cf6', value: 19 }, '新增颜色属性错误');
          equal(state.colors.slice(0, -1), colorsBeforeAdd, '新增颜色不应修改已有颜色');
        });

        test('追加只接受已有颜色的正整数映射值', () => {
          const initialState = core.createInitialState();
          equal(core.appendValue(initialState, 'left', { value: 1 }), initialState, '对象映射值不应追加');
          equal(core.appendValue(initialState, 'left', 99), initialState, '未知整数映射值不应追加');
          equal(core.appendValue(initialState, 'left', 1.5), initialState, '小数映射值不应追加');
          const unsafeValue = Number.MAX_SAFE_INTEGER + 1;
          const stateWithUnsafeColor = {
            ...initialState,
            colors: [...initialState.colors, { name: '越界色', value: unsafeValue, hex: '#111111' }]
          };
          equal(core.appendValue(stateWithUnsafeColor, 'left', unsafeValue), stateWithUnsafeColor, '非安全整数映射值不应追加');
        });

        test('颜色快捷数量追加只产生一条撤销历史', () => {
          let state = core.createInitialState();
          state = core.appendBatchValues(state, 'conveyor', [1, 2, 3]);
          equal(state.queues.conveyor, [1, 2, 3], '批量追加失败');
          equal(state.histories.conveyor, [[]], '批量追加应只记录一条历史');
          state = core.appendBatchValues(state, 'conveyor', [4, 5]);
          state = core.undo(state, 'conveyor');
          equal(state.queues.conveyor, [1, 2, 3], '撤销批量追加失败');

          appDocument.querySelector('.stage-button[data-stage="simulation"]').click();

          appDocument.querySelector('.simulation-input[data-simulation-field="beltQueueText"]').value = '1,1,1,1';

          appDocument.querySelector('[data-action="append-stable-simulation-click"][data-vehicle-id="2"]').click();

      }
