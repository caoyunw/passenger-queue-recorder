<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>乘客队列记录工具</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #172126;
      --muted: #65757d;
      --paper: #f3f1e9;
      --panel: #fffdf7;
      --line: #c9cec8;
      --rail: #1e2b30;
      --rail-soft: #2d3c41;
      --signal: #f2bd43;
      --signal-dark: #785610;
      --ok: #39775d;
      --danger: #b4483f;
      --shadow: 0 14px 30px rgba(31, 43, 48, 0.14);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background-color: var(--paper);
      background-image:
        linear-gradient(rgba(44, 61, 66, 0.055) 1px, transparent 1px),
        linear-gradient(90deg, rgba(44, 61, 66, 0.055) 1px, transparent 1px);
      background-size: 22px 22px;
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    button:focus-visible,
    input:focus-visible,
    textarea:focus-visible,
    select:focus-visible {
      outline: 3px solid var(--signal);
      outline-offset: 3px;
    }

    .app-shell {
      display: grid;
      grid-template-columns: 252px minmax(0, 1fr);
      min-height: 100vh;
    }

    .sidebar {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      padding: 24px 18px 18px;
      color: #f4f1e7;
      background: var(--rail);
      border-right: 4px solid var(--signal);
    }

    .brand-kicker,
    .eyebrow,
    .stage-code,
    .panel-label {
      margin: 0;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .brand-kicker {
      color: var(--signal);
    }

    .brand-title {
      margin: 8px 0 0;
      font-size: 23px;
      line-height: 1.18;
      letter-spacing: 0.04em;
    }

    .brand-subtitle {
      margin: 12px 0 0;
      color: #bec9c6;
      font-size: 13px;
      line-height: 1.7;
    }

    #stageNav {
      display: grid;
      gap: 8px;
      margin-top: 34px;
    }

    .stage-button {
      display: grid;
      grid-template-columns: 34px 1fr;
      gap: 10px;
      align-items: center;
      min-height: 58px;
      padding: 10px;
      color: #d9e0de;
      text-align: left;
      background: transparent;
      border: 1px solid rgba(222, 231, 228, 0.18);
      border-radius: 4px;
      transition: background 160ms ease, border-color 160ms ease, transform 160ms ease;
    }

    .stage-button:hover {
      background: rgba(255, 255, 255, 0.06);
      border-color: rgba(242, 189, 67, 0.54);
      transform: translateX(2px);
    }

    .stage-button.is-active {
      color: #172126;
      background: var(--signal);
      border-color: var(--signal);
    }

    .stage-index {
      display: grid;
      width: 30px;
      height: 30px;
      place-items: center;
      font-size: 12px;
      font-weight: 900;
      border: 1px solid currentColor;
      border-radius: 50%;
    }

    .stage-name {
      display: block;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 0.05em;
    }

    .stage-code {
      display: block;
      margin-top: 3px;
      color: inherit;
      opacity: 0.62;
      font-size: 9px;
    }

    .save-panel {
      margin-top: auto;
      padding-top: 18px;
      border-top: 1px solid rgba(222, 231, 228, 0.2);
    }

    #saveState {
      display: flex;
      gap: 8px;
      align-items: center;
      margin: 0;
      color: #d1dcda;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    #saveState::before {
      width: 9px;
      height: 9px;
      content: "";
      background: var(--signal);
      border-radius: 50%;
      box-shadow: 0 0 0 3px rgba(242, 189, 67, 0.16);
    }

    #saveState.is-saved::before {
      background: #7bcba4;
      box-shadow: 0 0 0 3px rgba(123, 203, 164, 0.16);
    }

    #saveState.is-error::before {
      background: #ef766c;
      box-shadow: 0 0 0 3px rgba(239, 118, 108, 0.16);
    }

    .workspace {
      width: min(1180px, 100%);
      padding: 34px 38px 42px;
    }

    .workspace-header {
      display: flex;
      gap: 24px;
      align-items: end;
      justify-content: space-between;
      padding-bottom: 18px;
      border-bottom: 2px solid var(--ink);
    }

    .eyebrow,
    .panel-label {
      color: var(--signal-dark);
    }

    .workspace-title {
      margin: 7px 0 0;
      font-size: clamp(29px, 4vw, 44px);
      line-height: 1;
      letter-spacing: 0.03em;
    }

    .count-card {
      min-width: 126px;
      padding: 12px 16px;
      text-align: right;
      background: var(--ink);
      color: #fffdf7;
      border-radius: 3px;
      box-shadow: 5px 5px 0 rgba(242, 189, 67, 0.72);
    }

    .count-card span {
      display: block;
      color: #bdcac8;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.12em;
    }

    .count-card strong {
      display: block;
      margin-top: 2px;
      font-size: 34px;
      line-height: 1;
    }

    .work-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 280px;
      gap: 18px;
      margin-top: 22px;
    }

    .panel {
      background: rgba(255, 253, 247, 0.94);
      border: 1px solid var(--line);
      border-radius: 4px;
      box-shadow: var(--shadow);
    }

    .input-panel {
      padding: 20px;
    }

    .help-panel {
      padding: 18px;
      background: #e8ece7;
      box-shadow: none;
    }

    .help-panel h2,
    .sequence-panel h2 {
      margin: 7px 0 0;
      font-size: 17px;
    }

    .help-panel p {
      margin: 12px 0 0;
      color: #56666c;
      font-size: 13px;
      line-height: 1.8;
    }

    .key-list {
      display: grid;
      gap: 9px;
      margin-top: 16px;
    }

    .key-line {
      display: flex;
      gap: 8px;
      align-items: center;
      color: #46555b;
      font-size: 12px;
    }

    kbd {
      min-width: 30px;
      padding: 4px 6px;
      color: #fffdf7;
      text-align: center;
      background: var(--rail);
      border: 1px solid #66777b;
      border-bottom-width: 3px;
      border-radius: 3px;
      font-size: 11px;
      font-weight: 800;
    }

    .color-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(136px, 1fr));
      gap: 10px;
      margin-top: 14px;
    }

    .color-button,
    .add-color-button {
      min-height: 88px;
      padding: 12px 14px;
      text-align: left;
      border: 2px solid rgba(23, 33, 38, 0.48);
      border-radius: 4px;
      box-shadow: 0 4px 0 rgba(23, 33, 38, 0.18);
      transition: transform 120ms ease, box-shadow 120ms ease;
    }

    .color-card {
      display: grid;
      grid-template-rows: minmax(88px, auto) auto;
      gap: 7px;
      min-width: 0;
    }

    .color-button:hover,
    .add-color-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 0 rgba(23, 33, 38, 0.18);
    }

    .color-button:active,
    .add-color-button:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 rgba(23, 33, 38, 0.18);
    }

    .color-button {
      color: #fff;
      background: var(--button-color);
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.36);
    }

    .color-button.uses-dark-text,
    .sequence-chip.uses-dark-text {
      color: var(--ink);
      text-shadow: none;
    }

    .color-button span,
    .add-color-button span {
      display: block;
      font-size: 20px;
      font-weight: 900;
      letter-spacing: 0.06em;
    }

    .color-button small,
    .add-color-button small {
      display: block;
      margin-top: 7px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.09em;
    }

    .add-color-button {
      color: var(--ink);
      background:
        linear-gradient(135deg, rgba(242, 189, 67, 0.22) 25%, transparent 25%) -8px 0 / 16px 16px,
        linear-gradient(225deg, rgba(242, 189, 67, 0.22) 25%, transparent 25%) -8px 0 / 16px 16px,
        #fff9e8;
      border-style: dashed;
    }

    .color-quick-row {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 4px;
    }

    .color-quick-button {
      min-width: 0;
      min-height: 30px;
      padding: 0 4px;
      color: var(--ink);
      background: #fffdf7;
      border: 1px solid rgba(23, 33, 38, 0.42);
      border-radius: 3px;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0;
      box-shadow: 0 2px 0 rgba(23, 33, 38, 0.12);
    }

    .color-quick-button.is-remove {
      color: #fffdf7;
      background: var(--danger);
      border-color: rgba(23, 33, 38, 0.5);
    }

    .color-quick-button:hover {
      transform: translateY(-1px);
    }

    .sequence-panel {
      margin-top: 18px;
      padding: 20px;
    }

    .sequence-strip {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      min-height: 74px;
      margin-top: 16px;
      padding: 12px;
      background: #edf0eb;
      border: 1px dashed #9da8a4;
      border-radius: 4px;
    }

    .sequence-chip {
      display: grid;
      width: 54px;
      height: 54px;
      place-items: center;
      color: #fff;
      background: var(--chip-color);
      border: 3px solid #fff;
      border-radius: 50%;
      box-shadow: 0 0 0 2px var(--ink), 0 4px 0 rgba(23, 33, 38, 0.22);
      font-size: 15px;
      font-weight: 900;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.46);
      transition: transform 120ms ease;
    }

    .sequence-chip:hover {
      transform: translateY(-3px) scale(1.04);
    }

    .empty-sequence {
      align-self: center;
      margin: 0;
      color: #718087;
      font-size: 13px;
    }

    .action-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: space-between;
      margin-top: 18px;
    }

    .action-button {
      min-height: 46px;
      padding: 0 18px;
      border: 1px solid var(--ink);
      border-radius: 3px;
      font-size: 14px;
      font-weight: 900;
      letter-spacing: 0.05em;
    }

    .action-button.secondary {
      color: var(--ink);
      background: #fffdf7;
    }

    .action-button.primary {
      color: #fff;
      background: var(--ink);
    }

    .action-button:disabled {
      cursor: not-allowed;
      opacity: 0.42;
    }

    .config-output {
      max-width: 1080px;
      padding: 28px;
      background: rgba(255, 253, 247, 0.94);
      border: 1px solid var(--line);
      border-left: 7px solid var(--signal);
      box-shadow: var(--shadow);
    }

    .config-output h1 {
      margin: 8px 0 0;
      font-size: clamp(28px, 4vw, 42px);
    }

    .config-output > p {
      margin: 17px 0 0;
      color: var(--muted);
      line-height: 1.8;
    }

    .config-stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 1px;
      margin-top: 24px;
      overflow: hidden;
      background: var(--line);
      border: 1px solid var(--line);
    }

    .config-stat {
      padding: 14px;
      background: #f8f5ed;
    }

    .config-stat span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    .config-stat strong {
      display: block;
      margin-top: 6px;
      font-size: 24px;
    }

    .config-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      margin-top: 20px;
    }

    .config-card {
      padding: 16px;
      background: #fffdf7;
      border: 1px solid var(--line);
      border-top: 5px solid var(--rail);
    }

    .config-card-header,
    .config-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .config-card h2 {
      margin: 0;
      font-size: 18px;
    }

    .config-count {
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    .config-value {
      min-height: 57px;
      margin: 14px 0;
      padding: 12px;
      overflow-wrap: anywhere;
      color: #f7f4e9;
      background: var(--ink);
      border: 1px solid #0e171b;
      font-family: Consolas, "Courier New", monospace;
      font-size: 14px;
      line-height: 1.55;
    }

    .copy-button {
      min-height: 38px;
      padding: 0 14px;
      color: #fff;
      background: var(--rail);
      border: 1px solid var(--ink);
      border-radius: 3px;
      font-size: 13px;
      font-weight: 900;
    }

    .config-footer {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: space-between;
      margin-top: 22px;
      padding-top: 18px;
      border-top: 1px solid var(--line);
    }

    .action-button.danger {
      color: #fff;
      background: #9c2f2f;
      border-color: #6f2020;
    }

    .script-page {
      display: grid;
      gap: 18px;
    }

    .script-reconstruction-grid {
      display: grid;
      grid-template-columns: minmax(420px, 1.35fr) minmax(340px, 0.85fr);
      gap: 18px;
      align-items: start;
    }

    .script-left-stack,
    .script-right-stack {
      display: grid;
      gap: 18px;
      align-items: start;
    }

    .script-right-stack {
      position: sticky;
      top: 18px;
    }

    .script-field-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .script-field {
      display: grid;
      gap: 6px;
      color: #39484d;
      font-size: 13px;
      font-weight: 800;
    }

    .script-input,
    .script-textarea {
      width: 100%;
      color: var(--ink);
      background: #fff;
      border: 1px solid #899793;
      border-radius: 3px;
      font: inherit;
    }

    .script-input {
      min-height: 40px;
      padding: 8px 10px;
    }

    .script-textarea {
      min-height: 132px;
      padding: 10px 12px;
      resize: vertical;
      font-family: "Cascadia Mono", "Consolas", monospace;
      font-size: 13px;
      line-height: 1.55;
    }


    .script-list {
      display: grid;
      gap: 10px;
      margin-top: 12px;
    }

    .script-list-card {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: center;
      padding: 10px;
      background: #fffdf7;
      border: 1px solid var(--line);
    }

    .stable-simulation-screenshot-stage {
      position: relative;
      display: grid;
      place-items: center;
      min-height: 220px;
      margin-top: 12px;
      overflow: hidden;
      color: #eef3f1;
      background: #2f3335;
      border: 3px solid var(--ink);
      box-shadow: inset 0 0 0 3px rgba(255, 255, 255, 0.72);
    }

    .stable-simulation-screenshot-wrap {
      position: relative;
      display: inline-block;
      max-width: 100%;
      line-height: 0;
      cursor: crosshair;
    }

    .stable-simulation-screenshot {
      display: block;
      max-width: 100%;
      height: auto;
      user-select: none;
    }

    .stable-simulation-hotspot {
      position: absolute;
      transform: translate(-50%, -50%);
      min-width: 42px;
      min-height: 32px;
      padding: 4px 8px;
      color: var(--ink);
      background: rgba(242, 189, 67, 0.9);
      border: 2px solid #fffdf7;
      border-radius: 999px;
      box-shadow: 0 0 0 3px rgba(23, 33, 38, 0.38);
      font-size: 12px;
      font-weight: 900;
      line-height: 1;
      cursor: pointer;
    }

    .stable-simulation-hotspot:disabled {
      color: #fff;
      background: rgba(34, 139, 84, 0.95);
      cursor: default;
      opacity: 1;
    }

    .stable-simulation-empty-image {
      padding: 24px;
      text-align: center;
    }

    .script-report {
      min-height: 260px;
      max-height: 520px;
      margin: 12px 0 0;
      padding: 14px;
      overflow: auto;
      white-space: pre-wrap;
      background: #fff;
      border: 1px solid var(--line);
      font-family: "Cascadia Mono", "Consolas", monospace;
      font-size: 12px;
      line-height: 1.65;
    }

    @media (max-width: 720px) {
      .config-grid {
        grid-template-columns: 1fr;
      }

      .script-reconstruction-grid,
      .script-field-grid {
        grid-template-columns: 1fr;
      }

      .script-right-stack {
        position: static;
      }
    }

    dialog {
      width: min(430px, calc(100vw - 32px));
      padding: 0;
      color: var(--ink);
      background: #fffdf7;
      border: 2px solid var(--ink);
      border-radius: 4px;
      box-shadow: 10px 10px 0 rgba(23, 33, 38, 0.25);
    }

    dialog::backdrop {
      background: rgba(23, 33, 38, 0.58);
    }

    .dialog-form {
      padding: 22px;
    }

    .dialog-form h2 {
      margin: 7px 0 0;
      font-size: 26px;
    }

    .dialog-note {
      margin: 9px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .dialog-field {
      display: grid;
      gap: 7px;
      margin-top: 18px;
      color: #39484d;
      font-size: 13px;
      font-weight: 800;
    }

    .dialog-field input[type="text"] {
      width: 100%;
      padding: 10px 11px;
      color: var(--ink);
      background: #fff;
      border: 1px solid #899793;
      border-radius: 3px;
    }

    .dialog-field input[type="color"] {
      width: 100%;
      height: 44px;
      padding: 4px;
      background: #fff;
      border: 1px solid #899793;
      border-radius: 3px;
    }

    #colorError {
      min-height: 20px;
      margin: 10px 0 0;
      color: var(--danger);
      font-size: 13px;
      font-weight: 800;
    }

    .dialog-actions {
      display: flex;
      gap: 9px;
      justify-content: flex-end;
      margin-top: 14px;
    }

    @media (max-width: 760px) {
      .app-shell {
        display: block;
      }

      .sidebar {
        min-height: auto;
        padding: 18px 16px 14px;
        border-right: 0;
        border-bottom: 4px solid var(--signal);
      }

      .brand-subtitle {
        display: none;
      }

      #stageNav {
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
        margin-top: 16px;
      }

      .stage-button {
        flex: 1 1 132px;
        min-height: 48px;
        padding: 8px;
      }

      .stage-index {
        width: 27px;
        height: 27px;
      }

      .save-panel {
        margin-top: 14px;
        padding-top: 12px;
      }

      .workspace {
        padding: 24px 16px 34px;
      }

      .work-grid {
        grid-template-columns: 1fr;
      }

      .help-panel {
        order: -1;
      }

      .color-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div>
        <p class="brand-kicker">BUS LEVEL / QUEUE LOG</p>
        <h1 class="brand-title">乘客队列<br>记录工作台</h1>
        <p class="brand-subtitle">按流程录入三个区域的乘客颜色，状态将在每次操作后自动保存。</p>
      </div>

      <nav id="stageNav" aria-label="录入流程">
        <button class="stage-button is-active" type="button" data-stage="conveyor" aria-current="step">
          <span class="stage-index">01</span>
          <span><span class="stage-name">传送带</span><small class="stage-code">CONVEYOR</small></span>
        </button>
        <button class="stage-button" type="button" data-stage="left">
          <span class="stage-index">02</span>
          <span><span class="stage-name">左侧队列</span><small class="stage-code">LEFT QUEUE</small></span>
        </button>
        <button class="stage-button" type="button" data-stage="right">
          <span class="stage-index">03</span>
          <span><span class="stage-name">右侧队列</span><small class="stage-code">RIGHT QUEUE</small></span>
        </button>
        <button class="stage-button" type="button" data-stage="configs">
          <span class="stage-index">04</span>
          <span><span class="stage-name">全部配置</span><small class="stage-code">CONFIGS</small></span>
        </button>
        <button class="stage-button" type="button" data-stage="simulation">
          <span class="stage-index">05</span>
          <span><span class="stage-name">立即结算模拟</span><small class="stage-code">STABLE SIM</small></span>
        </button>
        <button class="stage-button" type="button" data-stage="queueFit">
          <span class="stage-index">06</span>
          <span><span class="stage-name">拟合队列</span><small class="stage-code">QUEUE FIT</small></span>
        </button>
      </nav>

      <div class="save-panel">
        <p id="saveState" role="status" aria-live="polite">状态已载入</p>
      </div>
    </aside>

    <main id="workspace" class="workspace"></main>
  </div>

  <dialog id="addColorDialog" aria-labelledby="addColorTitle">
    <form class="dialog-form" method="dialog">
      <p class="eyebrow">COLOR MAPPING</p>
      <h2 id="addColorTitle">新增颜色映射</h2>
      <p class="dialog-note">下一可用映射值：<strong id="nextColorValue">4</strong></p>

      <label class="dialog-field">
        颜色名称
        <input id="colorName" name="colorName" type="text" autocomplete="off" placeholder="例如：绿色">
      </label>

      <label class="dialog-field">
        颜色值
        <input id="colorHex" name="colorHex" type="color" value="#32a852">
      </label>

      <p id="colorError" role="alert"></p>

      <div class="dialog-actions">
        <button class="action-button secondary" type="button" data-action="cancel-color">取消</button>
        <button class="action-button primary" type="submit">保存颜色</button>
      </div>
    </form>
  </dialog>

  <script>
    const STORAGE_KEY = 'passenger-queue-recorder-state-v5';
    const SECTIONS = ['conveyor', 'left', 'right'];
    const STAGES = [...SECTIONS, 'configs', 'simulation', 'queueFit'];
    const STATE_KEYS = ['colors', 'queues', 'histories', 'simulation', 'queueFit', 'activeStage'];
    const COLOR_KEYS = ['name', 'value', 'hex'];
    const SIMULATION_KEYS = ['levelName', 'conveyorCapacity', 'passengerQueueText', 'vehicleTableText', 'clickSequenceText', 'screenshotDataUrl', 'hotspots', 'nextHotspotId', 'result', 'errors'];
    const QUEUE_FIT_KEYS = ['levelName', 'conveyorCapacity', 'passengerQueueText', 'vehicleTableText', 'targetRecordFilename', 'targetRecordText', 'fittedPassengerQueueText', 'fittedClickSequenceText', 'score', 'roleSummary', 'errors'];
    const SIMULATION_HOTSPOT_KEYS = ['id', 'vehicleId', 'xPercent', 'yPercent'];
    const VEHICLE_CAPACITIES = [4, 6, 10];
    const STABLE_SIMULATION_ROLE_ORDER = ['等待占位车', '补清触发车', '连锁释放车', '即时清空车', '尾段收尾车'];
    const STABLE_SIMULATION_PATH_ROLE_ORDER = ['核心入口解锁车', '入口分支解锁车', '中继大分支解锁车', '中继小分支解锁车', '深层终点车', '普通被解锁车', '独立可点车', '未提供路径数据'];
    const HEX_PATTERN = /^#[0-9a-fA-F]{6}$/;
    const VEHICLE_CSV_COLOR_TO_QUEUE_COLOR = [3, 4, 5, 6, 1, 2, 9, 7, 8, 11, 10];
    const DEFAULT_COLORS = [
      { name: '红色', value: 1, hex: '#e54c4c' },
      { name: '黄色', value: 2, hex: '#f3bd3d' },
      { name: '蓝色', value: 3, hex: '#3478f6' },
      { name: '绿色', value: 4, hex: '#32a852' },
      { name: '粉色', value: 5, hex: '#ec71a5' },
      { name: '紫色', value: 6, hex: '#8b5cf6' },
      { name: '天蓝色', value: 7, hex: '#58bde9' },
      { name: '棕色', value: 8, hex: '#8b5a3c' },
      { name: '橙色', value: 9, hex: '#f97316' },
      { name: '黑色', value: 10, hex: '#202529' },
      { name: '白色', value: 11, hex: '#f7f7f2' }
    ];

    function createEmptySections() {
      return { conveyor: [], left: [], right: [] };
    }

    function createEmptySimulation() {
      return {
        levelName: '',
        conveyorCapacity: '',
        passengerQueueText: '',
        vehicleTableText: '',
        clickSequenceText: '',
        screenshotDataUrl: '',
        hotspots: [],
        nextHotspotId: 1,
        result: null,
        errors: []
      };
    }

    function createEmptyQueueFit() {
      return {
        levelName: '',
        conveyorCapacity: '',
        passengerQueueText: '',
        vehicleTableText: '',
        targetRecordFilename: '',
        targetRecordText: '',
        fittedPassengerQueueText: '',
        fittedClickSequenceText: '',
        score: 0,
        roleSummary: [],
        errors: []
      };
    }

    function createInitialState() {
      return {
        colors: DEFAULT_COLORS.map(color => ({ ...color })),
        queues: createEmptySections(),
        histories: createEmptySections(),
        simulation: createEmptySimulation(),
        queueFit: createEmptyQueueFit(),
        activeStage: 'conveyor'
      };
    }

    function hasSection(state, section) {
      return Boolean(state
        && typeof state === 'object'
        && state.queues
        && state.histories
        && SECTIONS.includes(section)
        && Array.isArray(state.queues[section])
        && Array.isArray(state.histories[section]));
    }

    function updateSection(state, section, nextQueue) {
      if (!hasSection(state, section)) return state;

      return {
        ...state,
        queues: {
          ...state.queues,
          [section]: nextQueue
        },
        histories: {
          ...state.histories,
          [section]: [...state.histories[section], [...state.queues[section]]]
        }
      };
    }

    function appendValue(state, section, value) {
      if (!hasSection(state, section) || !isMappedValue(state, value)) return state;
      return updateSection(state, section, [...state.queues[section], value]);
    }

    function hasBatchValues(state, values) {
      return isDenseArray(values)
        && values.length > 0
        && values.every(value => isMappedValue(state, value));
    }

    function appendBatchValues(state, section, values) {
      if (!hasSection(state, section) || !hasBatchValues(state, values)) return state;
      return updateSection(state, section, [...state.queues[section], ...values]);
    }

    function removeBatchValues(state, section, value, count) {
      if (!hasSection(state, section)
        || !isMappedValue(state, value)
        || !Number.isInteger(count)
        || count < 1) {
        return state;
      }

      let remaining = count;
      const nextQueue = [...state.queues[section]];
      for (let index = nextQueue.length - 1; index >= 0 && remaining > 0; index -= 1) {
        if (nextQueue[index] === value) {
          nextQueue.splice(index, 1);
          remaining -= 1;
        }
      }

      if (nextQueue.length === state.queues[section].length) return state;
      return updateSection(state, section, nextQueue);
    }

    function removeAt(state, section, index) {
      if (!hasSection(state, section)
        || !Number.isInteger(index)
        || index < 0
        || index >= state.queues[section].length) {
        return state;
      }

      return updateSection(state, section, state.queues[section].filter((_, itemIndex) => itemIndex !== index));
    }

    function undo(state, section) {
      if (!hasSection(state, section) || state.histories[section].length === 0) return state;

      const history = state.histories[section];
      return {
        ...state,
        queues: {
          ...state.queues,
          [section]: [...history.at(-1)]
        },
        histories: {
          ...state.histories,
          [section]: history.slice(0, -1)
        }
      };
    }

    function addColor(state, name, hex) {
      if (!state
        || !Array.isArray(state.colors)
        || state.colors.some(color => !color || !Number.isSafeInteger(color.value) || color.value <= 0)
        || typeof name !== 'string'
        || name.trim() === ''
        || typeof hex !== 'string'
        || !HEX_PATTERN.test(hex)) {
        return state;
      }

      const maxValue = state.colors.reduce((max, color) => Math.max(max, color.value), 0);
      if (maxValue >= Number.MAX_SAFE_INTEGER) return state;

      return {
        ...state,
        colors: [
          ...state.colors,
          { name: name.trim(), value: maxValue + 1, hex }
        ]
      };
    }

    function getConfigs(state) {
      const conveyor = state.queues.conveyor.join(',');
      const left = state.queues.left.join(',');
      const right = state.queues.right.join(',');
      return {
        conveyor,
        left,
        right,
        combined: [...state.queues.conveyor, ...state.queues.left, ...state.queues.right].join(',')
      };
    }

    function startNextLevel(state) {
      return {
        colors: state.colors.map(color => ({ ...color })),
        queues: createEmptySections(),
        histories: createEmptySections(),
        simulation: state.simulation,
        activeStage: 'conveyor'
      };
    }

    function resetEverything() {
      return createInitialState();
    }

    function getColorName(state, value) {
      const color = state.colors.find(item => item.value === value);
      return color ? color.name : `映射${value}`;
    }

    function parsePositiveInteger(value) {
      if (typeof value !== 'string' && typeof value !== 'number') return null;
      const text = String(value).trim();
      if (!/^\d+$/.test(text)) return null;
      const number = Number(text);
      return Number.isSafeInteger(number) && number > 0 ? number : null;
    }

    function parseNonNegativeInteger(value) {
      if (typeof value !== 'string' && typeof value !== 'number') return null;
      const text = String(value).trim();
      if (!/^\d+$/.test(text)) return null;
      const number = Number(text);
      return Number.isSafeInteger(number) && number >= 0 ? number : null;
    }

    function parseVehicleId(value) {
      return parseNonNegativeInteger(value);
    }

    function isScriptColorValue(state, value) {
      return isMappedValue(state, value);
    }

    function getScriptColorName(state, value) {
      if (isScriptColorValue(state, value)) return getColorName(state, value);
      return `颜色${value}`;
    }

    function formatConsumption(state, consumption) {
      const parts = [...consumption.entries()]
        .filter(([, count]) => count > 0)
        .map(([colorValue, count]) => `${getScriptColorName(state, colorValue)}x${count}`);
      return parts.length ? parts.join('、') : '无';
    }

    function parseScriptIdList(value) {
      if (typeof value !== 'string' || value.trim() === '') return { values: [], errors: [] };
      const values = [];
      const errors = [];
      value.split(',').map(item => item.trim()).filter(Boolean).forEach(item => {
        const id = parseVehicleId(item);
        if (id === null) {
          errors.push(`依赖车辆 id「${item}」不是非负整数`);
          return;
        }
        values.push(id);
      });
      return { values, errors };
    }

    function splitCsvLine(line) {
      const cells = [];
      let cell = '';
      let inQuotes = false;

      for (let index = 0; index < line.length; index += 1) {
        const char = line[index];
        if (char === '"') {
          if (inQuotes && line[index + 1] === '"') {
            cell += '"';
            index += 1;
          } else {
            inQuotes = !inQuotes;
          }
        } else if (char === ',' && !inQuotes) {
          cells.push(cell);
          cell = '';
        } else {
          cell += char;
        }
      }

      cells.push(cell);
      return cells.map(item => item.replace(/^\uFEFF/, '').trim());
    }

    function splitScriptTableRow(line) {
      const tabCells = line.split('\t').map(cell => cell.replace(/^\uFEFF/, '').trim());
      if (tabCells.length > 1) return tabCells;
      if (line.includes(',')) {
        return splitCsvLine(line);
      }
      return line.trim().split(/\s+/).map(cell => cell.replace(/^\uFEFF/, '').trim());
    }

    function mapVehicleCsvColorValue(value) {
      return Number.isSafeInteger(value) && value >= 0 && value < VEHICLE_CSV_COLOR_TO_QUEUE_COLOR.length
        ? VEHICLE_CSV_COLOR_TO_QUEUE_COLOR[value]
        : null;
    }

    function parseScriptVehicleTable(text) {
      if (typeof text !== 'string') return { vehicles: [], errors: ['车辆表必须是文本'] };

      const vehicles = [];
      const errors = [];
      const seenIds = new Set();
      const lines = text.replace(/\r/g, '').split('\n');

      lines.forEach((line, lineIndex) => {
        if (line.trim() === '') return;
        const isCsvRow = !line.includes('\t') && line.includes(',');
        const cells = splitScriptTableRow(line);
        const lineNumber = lineIndex + 1;
        const maybeHeader = lineNumber === 1 && parseVehicleId(cells[0]) === null;
        if (maybeHeader) return;

        const rowErrors = [];
        if (cells.length < 4) rowErrors.push('字段不足，至少需要车辆id、车颜色、车座位、深度');

        const id = parseVehicleId(cells[0]);
        const rawColorValue = parseNonNegativeInteger(cells[1]);
        const colorValue = rawColorValue !== null && isCsvRow ? mapVehicleCsvColorValue(rawColorValue) : rawColorValue;
        const capacity = parsePositiveInteger(cells[2]);
        const depth = parseNonNegativeInteger(cells[3]);
        const front = parseScriptIdList(cells[4] || '');
        const back = parseScriptIdList(cells[5] || '');

        if (id === null) rowErrors.push('车辆id必须是非负整数');
        if (id !== null && seenIds.has(id)) rowErrors.push(`车辆id ${id} 重复`);
        if (rawColorValue === null) rowErrors.push('车颜色必须是非负整数映射值');
        if (rawColorValue !== null && colorValue === null) rowErrors.push('CSV 车颜色必须是 0-10 的车辆颜色映射值');
        if (!VEHICLE_CAPACITIES.includes(capacity)) rowErrors.push('车座位必须是 4、6 或 10');
        if (depth === null) rowErrors.push('深度必须是非负整数');
        rowErrors.push(...front.errors, ...back.errors);

        if (rowErrors.length > 0) {
          errors.push(`第 ${lineNumber} 行：${rowErrors.join('；')}`);
          return;
        }

        seenIds.add(id);
        vehicles.push({
          id,
          colorValue,
          capacity,
          depth,
          frontVehicleIds: front.values,
          backVehicleIds: back.values
        });
      });

      return { vehicles, errors };
    }

    function parseStableSimulationClickSequence(text) {
      if (typeof text !== 'string' || text.trim() === '') return { values: [], errors: [] };
      const values = [];
      const errors = [];
      text.split(',').map(item => item.trim()).filter(Boolean).forEach(item => {
        const id = parseVehicleId(item);
        if (id === null) {
          errors.push(`点击车辆 id「${item}」不是非负整数`);
          return;
        }
        values.push(id);
      });
      return { values, errors };
    }

    function parseStableSimulationPassengerQueue(state, text) {
      if (typeof text !== 'string' || text.trim() === '') return { values: [], errors: [] };
      const values = [];
      const errors = [];
      text.split(',').forEach((rawItem, index) => {
        const item = rawItem.trim();
        if (item === '') {
          errors.push(`乘客队列第 ${index + 1} 项为空`);
          return;
        }

        const value = parseNonNegativeInteger(item);
        if (value === null) {
          errors.push(`乘客队列 token「${item}」不是非负整数`);
          return;
        }

        values.push(value);
        if (!isScriptColorValue(state, value)) {
          errors.push(`乘客颜色 ${value} 不存在`);
        }
      });
      return { values, errors };
    }

    function parseStableSimulationInput(state, input) {
      const conveyorCapacity = parsePositiveInteger(input && input.conveyorCapacity);
      const parsedPassengerQueue = parseStableSimulationPassengerQueue(state, input && input.passengerQueueText);
      const passengerQueue = parsedPassengerQueue.values;
      const vehicleText = input && typeof input.vehicleTableText === 'string' ? input.vehicleTableText : '';
      const parsedVehicles = parseScriptVehicleTable(vehicleText);
      const vehicles = parsedVehicles.vehicles.filter(vehicle => isScriptColorValue(state, vehicle.colorValue));
      const clickSequence = parseStableSimulationClickSequence(input && input.clickSequenceText);
      const errors = [...parsedPassengerQueue.errors, ...parsedVehicles.errors, ...clickSequence.errors];

      if (conveyorCapacity === null) errors.push('传送带容量必须是正整数');
      if (conveyorCapacity !== null && passengerQueue.length < conveyorCapacity) errors.push('乘客队列数量不能少于传送带容量');
      parsedVehicles.vehicles
        .filter(vehicle => !isScriptColorValue(state, vehicle.colorValue))
        .forEach(vehicle => errors.push(`车辆 ${vehicle.id} 的颜色映射 ${vehicle.colorValue} 不存在`));
      const vehicleIds = new Set(vehicles.map(vehicle => vehicle.id));
      clickSequence.values.forEach(id => {
        if (!vehicleIds.has(id)) errors.push(`点击车辆 ${id} 不存在于车辆表`);
      });

      return {
        conveyorCapacity,
        passengerQueue,
        belt: conveyorCapacity === null ? [] : passengerQueue.slice(0, conveyorCapacity),
        reserveQueue: conveyorCapacity === null ? [] : passengerQueue.slice(conveyorCapacity),
        vehicles,
        clickSequence: clickSequence.values,
        errors
      };
    }

    function countStableSimulationValues(values) {
      const counts = new Map();
      values.forEach(value => counts.set(value, (counts.get(value) || 0) + 1));
      return counts;
    }

    function formatStableSimulationValues(values) {
      return values.join(',');
    }

    function getStableSimulationDependencyOrder(vehicles) {
      const byId = new Map(vehicles.map(vehicle => [vehicle.id, vehicle]));
      const remaining = new Set(vehicles.map(vehicle => vehicle.id));
      const order = [];

      while (remaining.size > 0) {
        const ready = [...remaining].filter(id => (
          byId.get(id).frontVehicleIds.every(frontId => !remaining.has(frontId))
        ));
        if (ready.length === 0) {
          return { values: order, errors: [`车辆依赖存在环或缺少可点击入口：${[...remaining].join(',')}`] };
        }

        ready.sort((a, b) => {
          const vehicleA = byId.get(a);
          const vehicleB = byId.get(b);
          return vehicleA.depth - vehicleB.depth
            || vehicleB.backVehicleIds.length - vehicleA.backVehicleIds.length
            || a - b;
        });
        const nextId = ready[0];
        order.push(nextId);
        remaining.delete(nextId);
      }

      return { values: order, errors: [] };
    }

    function addStableSimulationFittedPassengers(queue, colorValue, count) {
      for (let index = 0; index < count; index += 1) queue.push(colorValue);
    }

    function buildStableSimulationFittedQueue(order, vehiclesById, splits) {
      const splitBySourceIndex = new Map();
      splits.forEach(split => {
        const list = splitBySourceIndex.get(split.sourceIndex) || [];
        list.push(split);
        splitBySourceIndex.set(split.sourceIndex, list);
      });

      const chunks = order.map(vehicleId => {
        const vehicle = vehiclesById.get(vehicleId);
        return { colorValue: vehicle.colorValue, baseCount: vehicle.capacity, extras: [] };
      });

      splitBySourceIndex.forEach((list, sourceIndex) => {
        const source = chunks[sourceIndex];
        const totalRemaining = list.reduce((sum, split) => sum + split.remainingCount, 0);
        source.baseCount -= totalRemaining;
        list.forEach(split => {
          chunks[split.targetIndex].extras.push({
            colorValue: source.colorValue,
            count: split.remainingCount
          });
        });
      });

      const queue = [];
      chunks.forEach(chunk => {
        addStableSimulationFittedPassengers(queue, chunk.colorValue, chunk.baseCount);
        chunk.extras.forEach(extra => addStableSimulationFittedPassengers(queue, extra.colorValue, extra.count));
      });
      return queue;
    }

    function getStableSimulationRoleCount(result, role) {
      const group = result && Array.isArray(result.roleSummary)
        ? result.roleSummary.find(item => item.role === role)
        : null;
      return group ? group.vehicleIds.length : 0;
    }

    function isStableSimulationFitResultValid(result) {
      return result
        && Array.isArray(result.steps)
        && result.errors.length === 0
        && result.steps.every(step => step.enteredSlot !== null && step.warnings.length === 0)
        && result.finalSlots.every(slot => slot === null)
        && result.finalBelt.length === 0
        && result.finalReserveQueue.length === 0;
    }

    function countStableSimulationRoleSummary(roleSummary) {
      const counts = new Map();
      if (!Array.isArray(roleSummary)) return counts;
      roleSummary.forEach(group => {
        if (group && typeof group.role === 'string' && Array.isArray(group.vehicleIds)) {
          counts.set(group.role, group.vehicleIds.length);
        }
      });
      return counts;
    }

    function scoreStableSimulationRoleDistance(resultRoleSummary, targetRoleSummary) {
      const targetCounts = countStableSimulationRoleSummary(targetRoleSummary);
      if (targetCounts.size === 0) return 0;

      const resultCounts = countStableSimulationRoleSummary(resultRoleSummary);
      const roles = new Set([...targetCounts.keys(), ...resultCounts.keys()]);
      let distance = 0;
      roles.forEach(role => {
        distance += Math.abs((targetCounts.get(role) || 0) - (resultCounts.get(role) || 0));
      });
      return distance;
    }

    function getQueueFitTargetRoleSummary(state, input) {
      const targetRecordText = input && typeof input.targetRecordText === 'string' ? input.targetRecordText.trim() : '';
      if (!targetRecordText) return { roleSummary: [], errors: [] };

      const annotated = annotateStableSimulationReportMarkdown(
        input && typeof input.targetRecordFilename === 'string' ? input.targetRecordFilename : 'target.md',
        targetRecordText,
        '',
        state
      );
      return {
        roleSummary: annotated.roleSummary || [],
        errors: annotated.errors.length > 0
          ? annotated.errors.map(error => `竞品结算模拟记录解析失败：${error}`)
          : []
      };
    }

    function scoreStableSimulationFitResult(result, targetRoleSummary = []) {
      const waiting = getStableSimulationRoleCount(result, '等待占位车');
      const trigger = getStableSimulationRoleCount(result, '补清触发车');
      const chain = getStableSimulationRoleCount(result, '连锁释放车');
      const rhythmScore = waiting * 4 + trigger * 5 + chain * 8;
      if (!Array.isArray(targetRoleSummary) || targetRoleSummary.length === 0) return rhythmScore;
      return 10000 - scoreStableSimulationRoleDistance(result.roleSummary, targetRoleSummary) * 100 + rhythmScore;
    }

    function getStableSimulationCandidateSplitIndexes(order, vehiclesById) {
      const waitingIndexes = [];
      const triggerIndexes = [];
      order.forEach((vehicleId, index) => {
        const vehicle = vehiclesById.get(vehicleId);
        const pathRole = getStableSimulationPathRole(vehicle);
        if (index < order.length - 2 && vehicle.capacity > 1) {
          if (pathRole !== '深层终点车') waitingIndexes.push(index);
        }
        if (index > 1 && (
          vehicle.backVehicleIds.length >= 4
          || pathRole === '中继大分支解锁车'
          || pathRole === '深层终点车'
          || index >= order.length - 5
        )) {
          triggerIndexes.push(index);
        }
      });
      return { waitingIndexes, triggerIndexes };
    }

    function createStableSimulationFitRandom(seed) {
      let value = seed >>> 0;
      return () => {
        value = (value * 1664525 + 1013904223) >>> 0;
        return value / 4294967296;
      };
    }

    function createStableSimulationRandomSplits(order, vehiclesById, waitingIndexes, triggerIndexes, random) {
      const splits = [];
      const shuffled = [...waitingIndexes].sort(() => random() - 0.5);
      const splitCount = Math.min(shuffled.length, 2 + Math.floor(random() * 8));
      const usedSourceIndexes = new Set();

      for (let index = 0; index < splitCount; index += 1) {
        const sourceIndex = shuffled[index];
        if (usedSourceIndexes.has(sourceIndex)) continue;
        const vehicle = vehiclesById.get(order[sourceIndex]);
        const possibleTargets = triggerIndexes.filter(targetIndex => targetIndex > sourceIndex + 1);
        if (possibleTargets.length === 0) continue;
        const targetIndex = possibleTargets[Math.floor(random() * possibleTargets.length)];
        const maxRemaining = Math.min(
          vehicle.capacity - 1,
          vehicle.capacity >= 10 ? 6 : (vehicle.capacity >= 6 ? 4 : 2)
        );
        const remainingCount = 1 + Math.floor(random() * maxRemaining);
        if (vehicle.capacity - remainingCount <= 0) continue;
        splits.push({ sourceIndex, targetIndex, remainingCount });
        usedSourceIndexes.add(sourceIndex);
      }

      return splits;
    }

    function fitStableSimulationPassengerQueue(state, input) {
      const conveyorCapacity = parsePositiveInteger(input && input.conveyorCapacity);
      const parsedPassengerQueue = parseStableSimulationPassengerQueue(state, input && input.passengerQueueText);
      const vehicleText = input && typeof input.vehicleTableText === 'string' ? input.vehicleTableText : '';
      const parsedVehicles = parseScriptVehicleTable(vehicleText);
      const vehicles = parsedVehicles.vehicles.filter(vehicle => isScriptColorValue(state, vehicle.colorValue));
      const errors = [...parsedPassengerQueue.errors, ...parsedVehicles.errors];

      if (conveyorCapacity === null) errors.push('传送带容量必须是正整数');
      parsedVehicles.vehicles
        .filter(vehicle => !isScriptColorValue(state, vehicle.colorValue))
        .forEach(vehicle => errors.push(`车辆 ${vehicle.id} 的颜色映射 ${vehicle.colorValue} 不存在`));
      const target = getQueueFitTargetRoleSummary(state, input);
      errors.push(...target.errors);
      if (errors.length > 0) {
        return { passengerQueueText: '', clickSequenceText: '', score: 0, roleSummary: [], errors };
      }

      const order = getStableSimulationDependencyOrder(vehicles);
      if (order.errors.length > 0) {
        return { passengerQueueText: '', clickSequenceText: '', score: 0, roleSummary: [], errors: order.errors };
      }

      const sourceCounts = countStableSimulationValues(parsedPassengerQueue.values);
      const targetQueue = [];
      vehicles.forEach(vehicle => addStableSimulationFittedPassengers(targetQueue, vehicle.colorValue, vehicle.capacity));
      const targetCounts = countStableSimulationValues(targetQueue);
      const countErrors = [];
      const allColors = new Set([...sourceCounts.keys(), ...targetCounts.keys()]);
      allColors.forEach(colorValue => {
        if ((sourceCounts.get(colorValue) || 0) !== (targetCounts.get(colorValue) || 0)) {
          countErrors.push(`颜色 ${colorValue} 数量不匹配：队列 ${sourceCounts.get(colorValue) || 0} / 车辆座位 ${targetCounts.get(colorValue) || 0}`);
        }
      });
      if (countErrors.length > 0) {
        return { passengerQueueText: '', clickSequenceText: order.values.join(','), score: 0, roleSummary: [], errors: countErrors };
      }

      const vehiclesById = new Map(vehicles.map(vehicle => [vehicle.id, vehicle]));
      const baseQueue = buildStableSimulationFittedQueue(order.values, vehiclesById, []);
      const clickSequenceText = order.values.join(',');
      let best = {
        queue: baseQueue,
        result: runStableSimulation(state, {
          ...input,
          conveyorCapacity: String(conveyorCapacity),
          passengerQueueText: formatStableSimulationValues(baseQueue),
          vehicleTableText: vehicleText,
          clickSequenceText
        }),
        score: -Infinity
      };
      if (isStableSimulationFitResultValid(best.result)) best.score = scoreStableSimulationFitResult(best.result, target.roleSummary);

      const { waitingIndexes, triggerIndexes } = getStableSimulationCandidateSplitIndexes(order.values, vehiclesById);
      const random = createStableSimulationFitRandom(110011);
      for (let iteration = 0; iteration < 1200; iteration += 1) {
        const splits = createStableSimulationRandomSplits(order.values, vehiclesById, waitingIndexes, triggerIndexes, random);
        const queue = buildStableSimulationFittedQueue(order.values, vehiclesById, splits);
        const result = runStableSimulation(state, {
          ...input,
          conveyorCapacity: String(conveyorCapacity),
          passengerQueueText: formatStableSimulationValues(queue),
          vehicleTableText: vehicleText,
          clickSequenceText
        });
        if (!isStableSimulationFitResultValid(result)) continue;
        const score = scoreStableSimulationFitResult(result, target.roleSummary);
        if (score > best.score) best = { queue, result, score };
      }

      if (!isStableSimulationFitResultValid(best.result)) {
        return {
          passengerQueueText: formatStableSimulationValues(baseQueue),
          clickSequenceText,
          score: 0,
          roleSummary: [],
          errors: ['未能找到可完整结算的拟合队列']
        };
      }

      return {
        passengerQueueText: formatStableSimulationValues(best.queue),
        clickSequenceText,
        score: best.score,
        roleSummary: best.result.roleSummary,
        errors: []
      };
    }

    function cloneSimulationSlot(slot) {
      return slot ? { ...slot } : null;
    }

    function formatStableSimulationVehicle(state, vehiclesById, vehicleId) {
      const vehicle = vehiclesById.get(vehicleId);
      if (!vehicle) return `#${vehicleId}`;
      return `#${vehicle.id}${getScriptColorName(state, vehicle.colorValue)}${vehicle.capacity}`;
    }

    function findStableSimulationTargetSlot(slots, colorValue) {
      return slots.findIndex(slot => slot && slot.colorValue === colorValue && slot.remaining > 0);
    }

    function settleStableSimulationStep(working) {
      const consumption = new Map();
      const departedVehicleIds = [];
      const warnings = [];
      let guard = 0;
      let moved = true;

      while (moved && guard < 10000) {
        guard += 1;
        moved = false;
        for (let index = 0; index < working.belt.length; index += 1) {
          const colorValue = working.belt[index];
          const slotIndex = findStableSimulationTargetSlot(working.slots, colorValue);
          if (slotIndex === -1) continue;

          const slot = working.slots[slotIndex];
          slot.remaining -= 1;
          consumption.set(slot.vehicleId, (consumption.get(slot.vehicleId) || 0) + 1);
          working.belt.splice(index, 1);
          if (working.reserveQueue.length > 0) working.belt.push(working.reserveQueue.shift());
          if (slot.remaining === 0) {
            departedVehicleIds.push(slot.vehicleId);
            working.slots[slotIndex] = null;
          }
          moved = true;
          break;
        }
      }

      if (guard >= 10000) warnings.push('结算超过安全上限，已停止本步模拟');
      return {
        consumption: [...consumption.entries()].map(([vehicleId, count]) => ({ vehicleId, count })),
        departedVehicleIds,
        warnings
      };
    }

    function createStableSimulationRoleSummary(steps) {
      const grouped = new Map();
      steps.forEach(step => {
        if (!step.role) return;
        const group = grouped.get(step.role) || [];
        group.push(step.clickedVehicleId);
        grouped.set(step.role, group);
      });

      const extraRoles = [...grouped.keys()].filter(role => !STABLE_SIMULATION_ROLE_ORDER.includes(role));
      return [...STABLE_SIMULATION_ROLE_ORDER, ...extraRoles]
        .filter(role => grouped.has(role))
        .map(role => ({ role, vehicleIds: grouped.get(role) }));
    }

    function annotateStableSimulationRoles(steps) {
      const departureStepByVehicleId = new Map();
      steps.forEach(step => {
        step.departedVehicleIds.forEach(vehicleId => {
          if (!departureStepByVehicleId.has(vehicleId)) departureStepByVehicleId.set(vehicleId, step.step);
        });
      });

      const tailStartStep = Math.max(1, steps.length - 2);
      const annotatedSteps = steps.map(step => {
        const triggeredVehicleIds = step.departedVehicleIds.filter(id => id !== step.clickedVehicleId);
        const clickedDeparted = step.departedVehicleIds.includes(step.clickedVehicleId);
        const departureStep = departureStepByVehicleId.get(step.clickedVehicleId) || null;
        const tags = [];
        let role = '异常点击';

        if (step.enteredSlot === null) {
          tags.push('未进车');
        } else if (!clickedDeparted) {
          role = '等待占位车';
          tags.push('残座等待');
          tags.push(departureStep && departureStep > step.step ? `被第${departureStep}步补清` : '未开走占位');
        } else if (triggeredVehicleIds.length >= 2) {
          role = '连锁释放车';
          tags.push('当步开走', `触发补清:${triggeredVehicleIds.map(id => `#${id}`).join('/')}`);
        } else if (triggeredVehicleIds.length === 1) {
          role = '补清触发车';
          tags.push('当步开走', `触发补清:#${triggeredVehicleIds[0]}`);
        } else if (step.step >= tailStartStep) {
          role = '尾段收尾车';
          tags.push('当步开走', '尾段');
        } else {
          role = '即时清空车';
          tags.push('当步开走');
        }

        return {
          ...step,
          role,
          tags,
          triggeredVehicleIds,
          departureStep,
          waitingSteps: departureStep && departureStep > step.step ? departureStep - step.step : null
        };
      });

      return {
        steps: annotatedSteps,
        roleSummary: createStableSimulationRoleSummary(annotatedSteps)
      };
    }

    function getStableSimulationPathRole(vehicle) {
      if (!vehicle) return '未提供路径数据';
      const frontCount = vehicle.frontVehicleIds.length;
      const backCount = vehicle.backVehicleIds.length;
      if (frontCount === 0 && backCount >= 8) return '核心入口解锁车';
      if (frontCount === 0 && backCount > 0) return '入口分支解锁车';
      if (frontCount === 0) return '独立可点车';
      if (frontCount > 0 && backCount >= 4) return '中继大分支解锁车';
      if (frontCount > 0 && backCount > 0) return '中继小分支解锁车';
      if (vehicle.depth >= 5 || frontCount >= 5) return '深层终点车';
      return '普通被解锁车';
    }

    function createStableSimulationPathSummary(steps) {
      const grouped = new Map();
      steps.forEach(step => {
        if (!step.pathRole) return;
        const group = grouped.get(step.pathRole) || [];
        group.push(step.clickedVehicleId);
        grouped.set(step.pathRole, group);
      });

      const extraRoles = [...grouped.keys()].filter(role => !STABLE_SIMULATION_PATH_ROLE_ORDER.includes(role));
      return [...STABLE_SIMULATION_PATH_ROLE_ORDER, ...extraRoles]
        .filter(role => grouped.has(role))
        .map(role => ({ role, vehicleIds: grouped.get(role) }));
    }

    function getStableSimulationLayerLabel(depth) {
      return Number.isSafeInteger(depth) ? `L${depth}` : 'L?';
    }

    function getStableSimulationLayeredVehicleId(vehicleId, vehicle) {
      return `${getStableSimulationLayerLabel(vehicle ? vehicle.depth : null)}:#${vehicleId}`;
    }

    function createStableSimulationLayerSummary(steps) {
      const grouped = new Map();
      steps.forEach(step => {
        const layerLabel = getStableSimulationLayerLabel(step.depth);
        const group = grouped.get(layerLabel) || {
          layerLabel,
          depth: Number.isSafeInteger(step.depth) ? step.depth : null,
          vehicleIds: []
        };
        group.vehicleIds.push(step.clickedVehicleId);
        grouped.set(layerLabel, group);
      });

      return [...grouped.values()].sort((a, b) => {
        if (a.depth === null && b.depth === null) return a.layerLabel.localeCompare(b.layerLabel);
        if (a.depth === null) return 1;
        if (b.depth === null) return -1;
        return a.depth - b.depth;
      });
    }

    function getStableSimulationPathTags(vehicle) {
      if (!vehicle) return ['未提供车辆表路径数据'];
      return [
        `深度${vehicle.depth}`,
        `前方${vehicle.frontVehicleIds.length}`,
        `后方${vehicle.backVehicleIds.length}`
      ];
    }

    function annotateStableSimulationPathRoles(steps, vehiclesById) {
      const annotatedSteps = steps.map(step => {
        const vehicle = vehiclesById.get(step.clickedVehicleId);
        return {
          ...step,
          pathRole: getStableSimulationPathRole(vehicle),
          pathTags: getStableSimulationPathTags(vehicle),
          layeredVehicleId: getStableSimulationLayeredVehicleId(step.clickedVehicleId, vehicle),
          depth: vehicle ? vehicle.depth : null,
          frontVehicleIds: vehicle ? [...vehicle.frontVehicleIds] : [],
          backVehicleIds: vehicle ? [...vehicle.backVehicleIds] : []
        };
      });
      const keyPathVehicles = annotatedSteps
        .filter(step => step.pathRole === '核心入口解锁车'
          || step.pathRole === '中继大分支解锁车'
          || step.backVehicleIds.length >= 4)
        .map(step => ({
          vehicleId: step.clickedVehicleId,
          backCount: step.backVehicleIds.length,
          frontCount: step.frontVehicleIds.length,
          depth: step.depth
        }));
      const deepDependencyVehicles = annotatedSteps
        .filter(step => step.depth >= 5 || step.frontVehicleIds.length >= 5)
        .map(step => ({
          vehicleId: step.clickedVehicleId,
          backCount: step.backVehicleIds.length,
          frontCount: step.frontVehicleIds.length,
          depth: step.depth
        }));

      return {
        steps: annotatedSteps,
        pathSummary: createStableSimulationPathSummary(annotatedSteps),
        layerSummary: createStableSimulationLayerSummary(annotatedSteps),
        keyPathVehicles,
        deepDependencyVehicles
      };
    }

    function getStableSimulationLayoutSignature(step, vehicle) {
      if (!vehicle) return null;
      const frontCount = vehicle.frontVehicleIds.length;
      const backCount = vehicle.backVehicleIds.length;
      return [
        `color:${vehicle.colorValue}`,
        `capacity:${vehicle.capacity}`,
        `settle:${step ? step.role : '未点击'}`,
        `path:${step ? step.pathRole : getStableSimulationPathRole(vehicle)}`,
        `depth:${vehicle.depth}`,
        `front:${frontCount}`,
        `back:${backCount}`,
        `wait:${step && step.waitingSteps !== null ? step.waitingSteps : 0}`,
        `trigger:${step ? step.triggeredVehicleIds.length : 0}`
      ].join('|');
    }

    function getStableSimulationRigidReason(step, vehicle) {
      if (!vehicle) return '';
      const pathRole = step ? step.pathRole : getStableSimulationPathRole(vehicle);
      const reasons = [];
      if (pathRole === '核心入口解锁车') reasons.push(pathRole);
      if (step && ['等待占位车', '补清触发车', '连锁释放车'].includes(step.role)) reasons.push(step.role);
      if (vehicle.backVehicleIds.length >= 8) reasons.push(`后方${vehicle.backVehicleIds.length}辆`);
      if (vehicle.depth >= 5 && vehicle.frontVehicleIds.length >= 2) reasons.push('深层多前置依赖');
      return [...new Set(reasons)].join(' / ');
    }

    function analyzeStableSimulationLayoutFreedom(steps, vehicles) {
      const safeSteps = Array.isArray(steps) ? steps : [];
      const safeVehicles = Array.isArray(vehicles) ? vehicles : [];
      const stepByVehicleId = new Map(safeSteps.map(step => [step.clickedVehicleId, step]));
      const grouped = new Map();
      const freelyPlaceableVehicleIds = [];
      const rigidVehicles = [];

      safeVehicles.forEach(vehicle => {
        const step = stepByVehicleId.get(vehicle.id) || null;
        const signature = getStableSimulationLayoutSignature(step, vehicle);
        if (signature) {
          const group = grouped.get(signature) || {
            signature,
            vehicleIds: [],
            reason: step
              ? `${step.role} / ${step.pathRole} / ${getStableSimulationLayerLabel(vehicle.depth)} / 同色同座`
              : `未点击 / ${getStableSimulationPathRole(vehicle)} / ${getStableSimulationLayerLabel(vehicle.depth)} / 同色同座`
          };
          group.vehicleIds.push(vehicle.id);
          grouped.set(signature, group);
        }

        const rigidReason = getStableSimulationRigidReason(step, vehicle);
        if (rigidReason) {
          rigidVehicles.push({ vehicleId: vehicle.id, reason: rigidReason });
        }

        if (!step
          && vehicle.frontVehicleIds.length === 0
          && vehicle.backVehicleIds.length === 0
          && getStableSimulationPathRole(vehicle) === '独立可点车') {
          freelyPlaceableVehicleIds.push(vehicle.id);
        }
      });

      const swappableGroups = [...grouped.values()]
        .filter(group => group.vehicleIds.length > 1)
        .map(group => ({
          ...group,
          vehicleIds: group.vehicleIds.sort((a, b) => a - b)
        }))
        .sort((a, b) => a.vehicleIds[0] - b.vehicleIds[0]);

      return {
        swappableGroups,
        freelyPlaceableVehicleIds: freelyPlaceableVehicleIds.sort((a, b) => a - b),
        rigidVehicles: rigidVehicles.sort((a, b) => a.vehicleId - b.vehicleId),
        confidence: '静态推断：乘客队列一致时成立，交换后仍建议重放验证'
      };
    }

    function getStableSimulationRecordVehicleIds(text) {
      return [...String(text || '').matchAll(/#(\d+)/g)]
        .map(match => parseVehicleId(match[1]))
        .filter(vehicleId => vehicleId !== null);
    }

    function collectStableSimulationRecordVehicleLabels(labelsById, text) {
      [...String(text || '').matchAll(/#(\d+)[^\s#、，,；;\t|]*/g)].forEach(match => {
        const vehicleId = parseVehicleId(match[1]);
        if (vehicleId !== null && !labelsById.has(vehicleId)) labelsById.set(vehicleId, match[0]);
      });
    }

    function getStableSimulationAnnotatedRecordFilename(filename) {
      const rawName = String(filename || '').trim() || '模拟记录.md';
      const withoutExtension = rawName.replace(/\.md$/i, '');
      return `${withoutExtension.endsWith('-带角色标注') ? withoutExtension : `${withoutExtension}-带角色标注`}.md`;
    }

    function formatStableSimulationRoleSummaryByLabels(roleSummary, labelsById) {
      if (!Array.isArray(roleSummary) || roleSummary.length === 0) return '无';
      return roleSummary
        .map(group => `${group.role}：${group.vehicleIds.map(id => labelsById.get(id) || `#${id}`).join('、')}`)
        .join('；');
    }

    function formatStableSimulationPathSummaryByLabels(pathSummary, labelsById) {
      if (!Array.isArray(pathSummary) || pathSummary.length === 0) return '无';
      return pathSummary
        .map(group => `${group.role}：${group.vehicleIds.map(id => labelsById.get(id) || `#${id}`).join('、')}`)
        .join('；');
    }

    function formatStableSimulationLayerSummaryByLabels(layerSummary, labelsById) {
      if (!Array.isArray(layerSummary) || layerSummary.length === 0) return '无';
      return layerSummary
        .map(group => `${group.layerLabel}：${group.vehicleIds.map(id => labelsById.get(id) || `#${id}`).join('、')}`)
        .join('；');
    }

    function formatStableSimulationKeyPathVehiclesByLabels(vehicles, labelsById) {
      if (!Array.isArray(vehicles) || vehicles.length === 0) return '无';
      return vehicles
        .map(vehicle => `${labelsById.get(vehicle.vehicleId) || `#${vehicle.vehicleId}`}（后方${vehicle.backCount}）`)
        .join('、');
    }

    function formatStableSimulationDeepDependencyVehiclesByLabels(vehicles, labelsById) {
      if (!Array.isArray(vehicles) || vehicles.length === 0) return '无';
      return vehicles
        .map(vehicle => `${labelsById.get(vehicle.vehicleId) || `#${vehicle.vehicleId}`}（深度${vehicle.depth}/前方${vehicle.frontCount}）`)
        .join('、');
    }

    function formatStableSimulationSwappableGroupsByLabels(layoutFreedom, labelsById) {
      const groups = layoutFreedom && Array.isArray(layoutFreedom.swappableGroups) ? layoutFreedom.swappableGroups : [];
      if (groups.length === 0) return '无';
      return groups
        .map(group => `${group.vehicleIds.map(id => labelsById.get(id) || `#${id}`).join(' ↔ ')}（${group.reason}）`)
        .join('；');
    }

    function formatStableSimulationFreeVehiclesByLabels(layoutFreedom, labelsById) {
      const vehicleIds = layoutFreedom && Array.isArray(layoutFreedom.freelyPlaceableVehicleIds)
        ? layoutFreedom.freelyPlaceableVehicleIds
        : [];
      return vehicleIds.length > 0 ? vehicleIds.map(id => labelsById.get(id) || `#${id}`).join('、') : '无';
    }

    function formatStableSimulationRigidVehiclesByLabels(layoutFreedom, labelsById) {
      const vehicles = layoutFreedom && Array.isArray(layoutFreedom.rigidVehicles) ? layoutFreedom.rigidVehicles : [];
      if (vehicles.length === 0) return '无';
      return vehicles
        .map(vehicle => `${labelsById.get(vehicle.vehicleId) || `#${vehicle.vehicleId}`}（${vehicle.reason}）`)
        .join('、');
    }

    function parseStableSimulationMarkdownRecordSteps(lines, headerIndex, headerCells) {
      const errors = [];
      const labelsById = new Map();
      const columnIndex = name => headerCells.indexOf(name);
      const stepIndex = columnIndex('步骤');
      const clickedIndex = columnIndex('点击车辆');
      const enteredIndex = columnIndex('进入车位');
      const departedIndex = columnIndex('开走车辆');

      [
        ['步骤', stepIndex],
        ['点击车辆', clickedIndex],
        ['进入车位', enteredIndex],
        ['开走车辆', departedIndex]
      ].forEach(([name, index]) => {
        if (index === -1) errors.push(`步骤日志缺少「${name}」列`);
      });

      if (errors.length > 0) return { rows: [], steps: [], labelsById, errors };

      const rows = [];
      const steps = [];
      for (let lineIndex = headerIndex + 1; lineIndex < lines.length; lineIndex += 1) {
        const line = lines[lineIndex];
        if (line.startsWith('## ')) break;
        if (line.trim() === '') break;

        const cells = line.split('\t');
        const step = parsePositiveInteger(cells[stepIndex]);
        if (step === null) continue;

        const clickedVehicleIds = getStableSimulationRecordVehicleIds(cells[clickedIndex]);
        const clickedVehicleId = clickedVehicleIds[0];
        if (clickedVehicleId === undefined) {
          errors.push(`第 ${step} 步：点击车辆缺少 #id`);
          continue;
        }

        collectStableSimulationRecordVehicleLabels(labelsById, cells[clickedIndex]);
        collectStableSimulationRecordVehicleLabels(labelsById, cells[departedIndex]);

        const enteredText = cells[enteredIndex] || '';
        const enteredSlotMatch = enteredText.match(/进车位\s*(\d+)/);
        const enteredSlot = enteredText.includes('失败') ? null : (enteredSlotMatch ? Number(enteredSlotMatch[1]) : null);
        const departedVehicleIds = getStableSimulationRecordVehicleIds(cells[departedIndex]);
        const warnings = cells[headerCells.indexOf('警告')] && cells[headerCells.indexOf('警告')] !== '无'
          ? String(cells[headerCells.indexOf('警告')]).split('；').filter(Boolean)
          : [];

        rows.push({ lineIndex, cells, step });
        steps.push({
          step,
          clickedVehicleId,
          enteredSlot,
          consumption: [],
          departedVehicleIds,
          slots: [],
          belt: [],
          reserveQueueRemaining: 0,
          warnings
        });
      }

      return { rows, steps, labelsById, errors };
    }

    function upsertStableSimulationMarkdownRoleSummary(lines, roleSummaryLines) {
      const summaryLines = Array.isArray(roleSummaryLines) ? roleSummaryLines : [roleSummaryLines];
      let summaryIndex = lines.findIndex(line => line.trim() === '## 总览');
      if (summaryIndex === -1) {
        if (lines.length > 0 && lines[lines.length - 1].trim() !== '') lines.push('');
        lines.push('## 总览', ...summaryLines);
        return;
      }

      let summaryEnd = lines.length;
      for (let index = summaryIndex + 1; index < lines.length; index += 1) {
        if (lines[index].startsWith('## ')) {
          summaryEnd = index;
          break;
        }
      }

      for (let index = summaryEnd - 1; index > summaryIndex; index -= 1) {
        if (lines[index].startsWith('功能角色：')
          || lines[index].startsWith('结算角色：')
          || lines[index].startsWith('路径角色：')
          || lines[index].startsWith('分层车辆汇总：')
          || lines[index].startsWith('关键路径车辆：')
          || lines[index].startsWith('深层依赖车辆：')
          || lines[index].startsWith('可互换车辆组：')
          || lines[index].startsWith('自由摆放候选：')
          || lines[index].startsWith('刚性车辆：')) {
          lines.splice(index, 1);
          summaryEnd -= 1;
        }
      }

      const preferredPrefixes = ['车辆对表校验：', '停车场剩余车辆：', '未开走占位车辆：', '开走车辆数：'];
      const insertAfter = preferredPrefixes
        .map(prefix => lines.findIndex((line, index) => index > summaryIndex && index < summaryEnd && line.startsWith(prefix)))
        .find(index => index !== -1);
      const remainingPassengerIndex = lines.findIndex((line, index) => index > summaryIndex && index < summaryEnd && line.startsWith('剩余乘客：'));
      const insertIndex = insertAfter !== undefined
        ? insertAfter + 1
        : (remainingPassengerIndex !== -1 ? remainingPassengerIndex : summaryIndex + 1);
      lines.splice(insertIndex, 0, ...summaryLines);
    }

    function annotateStableSimulationReportMarkdown(filename, markdown, vehicleTableText = '', currentState = null) {
      const sourceText = typeof markdown === 'string' ? markdown : '';
      const lines = sourceText.split(/\r?\n/);
      const headerIndex = lines.findIndex(line => {
        const cells = line.split('\t');
        return cells.includes('步骤') && cells.includes('点击车辆');
      });
      const outputFilename = getStableSimulationAnnotatedRecordFilename(filename);

      if (headerIndex === -1) {
        return {
          filename: outputFilename,
          text: sourceText,
          steps: [],
          roleSummary: [],
          pathSummary: [],
          errors: ['未找到步骤日志表头']
        };
      }

      const headerCells = lines[headerIndex].split('\t');
      const originalHeaderCells = [...headerCells];
      const parsed = parseStableSimulationMarkdownRecordSteps(lines, headerIndex, headerCells);
      const vehicleText = typeof vehicleTableText === 'string' ? vehicleTableText.trim() : '';
      const parsedVehicles = vehicleText
        ? parseScriptVehicleTable(vehicleText)
        : { vehicles: [], errors: [] };
      if (parsed.errors.length > 0 || parsedVehicles.errors.length > 0) {
        return {
          filename: outputFilename,
          text: sourceText,
          steps: [],
          roleSummary: [],
          pathSummary: [],
          errors: [...parsed.errors, ...parsedVehicles.errors]
        };
      }

      const vehiclesById = new Map(parsedVehicles.vehicles.map(vehicle => [vehicle.id, vehicle]));
      const annotated = annotateStableSimulationRoles(parsed.steps);
      const pathAnnotated = annotateStableSimulationPathRoles(annotated.steps, vehiclesById);
      const layoutFreedom = analyzeStableSimulationLayoutFreedom(pathAnnotated.steps, parsedVehicles.vehicles);
      const roleByStep = new Map(pathAnnotated.steps.map(step => [step.step, step.role]));
      const layeredByStep = new Map(pathAnnotated.steps.map(step => [step.step, step.layeredVehicleId]));
      const pathRoleByStep = new Map(pathAnnotated.steps.map(step => [step.step, step.pathRole]));
      const clickedColumnIndex = headerCells.indexOf('点击车辆');
      let layeredColumnIndex = headerCells.indexOf('分层车辆id');
      if (layeredColumnIndex === -1) {
        layeredColumnIndex = clickedColumnIndex + 1;
        headerCells.splice(layeredColumnIndex, 0, '分层车辆id');
      }
      let roleColumnIndex = headerCells.indexOf('结算角色');
      const oldRoleColumnIndex = headerCells.indexOf('功能角色');
      if (roleColumnIndex === -1 && oldRoleColumnIndex !== -1) {
        roleColumnIndex = oldRoleColumnIndex;
        headerCells[roleColumnIndex] = '结算角色';
      }
      if (roleColumnIndex === -1) {
        roleColumnIndex = layeredColumnIndex + 1;
        headerCells.splice(roleColumnIndex, 0, '结算角色');
      }
      let pathRoleColumnIndex = headerCells.indexOf('路径角色');
      if (pathRoleColumnIndex === -1) {
        pathRoleColumnIndex = roleColumnIndex + 1;
        headerCells.splice(pathRoleColumnIndex, 0, '路径角色');
      }
      lines[headerIndex] = headerCells.join('\t');

      parsed.rows.forEach(row => {
        const cellsByHeader = new Map();
        originalHeaderCells.forEach((name, index) => {
          if (name === '功能角色') return;
          cellsByHeader.set(name, row.cells[index] || '');
        });
        cellsByHeader.set('分层车辆id', layeredByStep.get(row.step) || 'L?:#?');
        cellsByHeader.set('结算角色', roleByStep.get(row.step) || '未标注');
        cellsByHeader.set('路径角色', pathRoleByStep.get(row.step) || '未标注');
        lines[row.lineIndex] = headerCells.map(name => cellsByHeader.get(name) || '').join('\t');
      });

      upsertStableSimulationMarkdownRoleSummary(
        lines,
        [
          `结算角色：${formatStableSimulationRoleSummaryByLabels(annotated.roleSummary, parsed.labelsById)}`,
          `路径角色：${formatStableSimulationPathSummaryByLabels(pathAnnotated.pathSummary, parsed.labelsById)}`,
          `分层车辆汇总：${formatStableSimulationLayerSummaryByLabels(pathAnnotated.layerSummary, parsed.labelsById)}`,
          `关键路径车辆：${formatStableSimulationKeyPathVehiclesByLabels(pathAnnotated.keyPathVehicles, parsed.labelsById)}`,
          `深层依赖车辆：${formatStableSimulationDeepDependencyVehiclesByLabels(pathAnnotated.deepDependencyVehicles, parsed.labelsById)}`,
          `可互换车辆组：${formatStableSimulationSwappableGroupsByLabels(layoutFreedom, parsed.labelsById)}`,
          `自由摆放候选：${formatStableSimulationFreeVehiclesByLabels(layoutFreedom, parsed.labelsById)}`,
          `刚性车辆：${formatStableSimulationRigidVehiclesByLabels(layoutFreedom, parsed.labelsById)}`
        ]
      );

      return {
        filename: outputFilename,
        text: lines.join('\n'),
        steps: pathAnnotated.steps,
        roleSummary: annotated.roleSummary,
        pathSummary: pathAnnotated.pathSummary,
        layerSummary: pathAnnotated.layerSummary,
        keyPathVehicles: pathAnnotated.keyPathVehicles,
        deepDependencyVehicles: pathAnnotated.deepDependencyVehicles,
        layoutFreedom,
        errors: []
      };
    }

    function normalizeStableSimulationRecordText(text) {
      return String(text || '').replace(/[０-９]/g, digit => String(digit.charCodeAt(0) - 0xff10));
    }

    function getStableSimulationRecordLevelKey(filename = '', sourceText = '') {
      const candidates = [];
      const normalizedFilename = normalizeStableSimulationRecordText(filename);
      const normalizedSource = normalizeStableSimulationRecordText(sourceText);
      if (normalizedFilename.trim()) candidates.push(normalizedFilename);

      const levelLine = normalizedSource.match(/(?:关卡|level|lv)[^：:\r\n]*[：:]\s*([^\r\n]+)/i);
      if (levelLine) candidates.push(levelLine[1]);

      const heading = normalizedSource.match(/^#\s*([^\r\n]+)/m);
      if (heading) candidates.push(heading[1]);

      for (const candidate of candidates) {
        const explicit = candidate.match(/(?:level|lv|关卡|第)\s*[_\-\s#]*(\d{1,4})/i);
        if (explicit) return String(Number(explicit[1]));
      }

      for (const candidate of candidates) {
        const leading = candidate.match(/^\s*(\d{1,4})(?=\D|$)/);
        if (leading) return String(Number(leading[1]));
      }

      return '';
    }

    function runStableSimulation(state, input) {
      const parsed = parseStableSimulationInput(state, input);
      if (parsed.errors.length > 0) {
        return {
          steps: [],
          summary: [],
          roleSummary: [],
          pathSummary: [],
          layerSummary: [],
          keyPathVehicles: [],
          deepDependencyVehicles: [],
          finalBelt: parsed.belt,
          finalReserveQueue: parsed.reserveQueue,
          finalSlots: [null, null, null, null],
          errors: parsed.errors
        };
      }

      const vehiclesById = new Map(parsed.vehicles.map(vehicle => [vehicle.id, vehicle]));
      const working = {
        belt: [...parsed.belt],
        reserveQueue: [...parsed.reserveQueue],
        slots: [null, null, null, null]
      };
      const steps = [];
      const allDepartedIds = [];
      const clickedVehicleIds = new Set();

      parsed.clickSequence.forEach((vehicleId, index) => {
        const vehicle = vehiclesById.get(vehicleId);
        const warnings = [];
        let enteredSlot = null;
        if (clickedVehicleIds.has(vehicleId)) {
          warnings.push(`车辆 ${vehicleId} 重复点击：已被点击`);
        } else {
          clickedVehicleIds.add(vehicleId);
          const emptySlotIndex = working.slots.findIndex(slot => slot === null);
          if (emptySlotIndex === -1) {
            warnings.push(`车辆 ${vehicleId} 点击失败：没有空车位`);
          } else {
            enteredSlot = emptySlotIndex + 1;
            working.slots[emptySlotIndex] = {
              vehicleId: vehicle.id,
              colorValue: vehicle.colorValue,
              capacity: vehicle.capacity,
              remaining: vehicle.capacity
            };
          }
        }

        const settled = settleStableSimulationStep(working);
        warnings.push(...settled.warnings);
        allDepartedIds.push(...settled.departedVehicleIds);
        steps.push({
          step: index + 1,
          clickedVehicleId: vehicleId,
          enteredSlot,
          consumption: settled.consumption,
          departedVehicleIds: settled.departedVehicleIds,
          slots: working.slots.map(cloneSimulationSlot),
          belt: [...working.belt],
          reserveQueueRemaining: working.reserveQueue.length,
          warnings
        });
      });

      const annotatedResult = annotateStableSimulationRoles(steps);
      const pathAnnotatedResult = annotateStableSimulationPathRoles(annotatedResult.steps, vehiclesById);
      const annotatedSteps = pathAnnotatedResult.steps;
      const roleSummary = annotatedResult.roleSummary;
      const pathSummary = pathAnnotatedResult.pathSummary;
      const layoutFreedom = analyzeStableSimulationLayoutFreedom(annotatedSteps, parsed.vehicles);
      const occupied = working.slots.filter(Boolean);
      const remainingPassengerCounts = new Map();
      [...working.belt, ...working.reserveQueue].forEach(value => {
        remainingPassengerCounts.set(value, (remainingPassengerCounts.get(value) || 0) + 1);
      });
      const remainingParkingVehicles = parsed.vehicles
        .filter(vehicle => !clickedVehicleIds.has(vehicle.id))
        .sort((a, b) => a.id - b.id);
      const summary = [
        `总点击数：${parsed.clickSequence.length}`,
        `成功进车数：${steps.filter(step => step.enteredSlot !== null).length}`,
        `开走车辆数：${allDepartedIds.length}`,
        `未开走占位车辆：${occupied.map(slot => formatStableSimulationVehicle(state, vehiclesById, slot.vehicleId)).join('、') || '无'}`,
        `停车场剩余车辆：${remainingParkingVehicles.map(vehicle => formatStableSimulationVehicle(state, vehiclesById, vehicle.id)).join('、') || '无'}`,
        `车辆对表校验：${remainingParkingVehicles.length === 0 ? '点击车辆与车辆表全部对上' : `仍有 ${remainingParkingVehicles.length} 辆表内车辆未点击`}`,
        `结算角色：${formatStableSimulationRoleSummary(state, vehiclesById, roleSummary)}`,
        `路径角色：${formatStableSimulationPathSummary(state, vehiclesById, pathSummary)}`,
        `分层车辆汇总：${formatStableSimulationLayerSummary(state, vehiclesById, pathAnnotatedResult.layerSummary)}`,
        `关键路径车辆：${formatStableSimulationKeyPathVehicles(state, vehiclesById, pathAnnotatedResult.keyPathVehicles)}`,
        `深层依赖车辆：${formatStableSimulationDeepDependencyVehicles(state, vehiclesById, pathAnnotatedResult.deepDependencyVehicles)}`,
        `可互换车辆组：${formatStableSimulationSwappableGroups(state, vehiclesById, layoutFreedom)}`,
        `自由摆放候选：${formatStableSimulationFreeVehicles(state, vehiclesById, layoutFreedom)}`,
        `刚性车辆：${formatStableSimulationRigidVehicles(state, vehiclesById, layoutFreedom)}`,
        `剩余乘客：${formatConsumption(state, remainingPassengerCounts)}`,
        `警告步骤：${annotatedSteps.filter(step => step.warnings.length > 0).map(step => step.step).join(',') || '无'}`
      ];

      return {
        steps: annotatedSteps,
