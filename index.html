        && data.hotspots.every(isValidScriptHotspot)
        && Number.isSafeInteger(data.nextHotspotId)
        && data.nextHotspotId > 0
        && (data.activeHotspotId === null
          || (Number.isSafeInteger(data.activeHotspotId)
            && data.hotspots.some(hotspot => hotspot.id === data.activeHotspotId)))
        && isDenseArray(data.slots)
        && data.slots.length === 4
        && data.slots.every(slot => isValidScriptSlot(slot, mappedValues))
        && isDenseArray(data.batches)
        && data.batches.every(isValidScriptBatch)
        && hasExactKeys(data.pending, SCRIPT_PENDING_KEYS)
        && isDenseArray(data.pending.selectedVehicleIds)
        && data.pending.selectedVehicleIds.every(id => Number.isSafeInteger(id) && id > 0)
        && isDenseArray(data.pending.enteredSlots)
        && data.pending.enteredSlots.every(isValidScriptEnteredSlot)
        && isDenseArray(data.pending.departedVehicleIds)
        && data.pending.departedVehicleIds.every(id => Number.isSafeInteger(id) && id > 0)
        && ['idle', 'loading', 'done', 'error'].includes(data.ocrStatus)
        && typeof data.ocrError === 'string';
    }

    function isValidScript(script, mappedValues) {
      return hasExactKeys(script, SCRIPT_KEYS)
        && isValidScriptWorkspaceData({
          levelName: script.levelName,
          queuesText: script.queuesText,
          vehicleTableText: script.vehicleTableText,
          vehicles: script.vehicles,
          vehicleErrors: script.vehicleErrors,
          screenshotDataUrl: script.screenshotDataUrl,
          hotspots: script.hotspots,
          nextHotspotId: script.nextHotspotId,
          activeHotspotId: script.activeHotspotId,
          slots: script.slots,
          batches: script.batches,
          pending: script.pending,
          ocrStatus: script.ocrStatus,
          ocrError: script.ocrError
        }, mappedValues)
        && isDenseArray(script.savedLevels)
        && script.savedLevels.every(level => hasExactKeys(level, SCRIPT_LEVEL_KEYS)
          && Number.isSafeInteger(level.id)
          && level.id > 0
          && typeof level.name === 'string'
          && level.name.trim() !== ''
          && typeof level.savedAt === 'string'
          && isValidScriptWorkspaceData(level.data, mappedValues))
        && Number.isSafeInteger(script.nextLevelId)
        && script.nextLevelId > 0;
    }

    function isValidState(candidate) {
      if (!hasExactKeys(candidate, STATE_KEYS)
        || !isDenseArray(candidate.colors)
        || candidate.colors.length === 0) {
        return false;
      }

      const mappedValues = new Set();
      const hasValidColors = candidate.colors.every(color => {
        const isValid = hasExactKeys(color, COLOR_KEYS)
          && typeof color.name === 'string'
          && color.name.trim() !== ''
          && Number.isSafeInteger(color.value)
          && color.value > 0
          && !mappedValues.has(color.value)
          && typeof color.hex === 'string'
          && HEX_PATTERN.test(color.hex);

        if (isValid) mappedValues.add(color.value);
        return isValid;
      });

      return hasValidColors
        && isValidSections(candidate.queues, mappedValues, false)
        && isValidSections(candidate.histories, mappedValues, true)
        && isValidParking(candidate.parking, mappedValues)
        && isValidScript(candidate.script, mappedValues)
        && STAGES.includes(candidate.activeStage);
    }

    function normalizeScriptHotspotsForCurrentVersion(hotspots) {
      return Array.isArray(hotspots)
        ? hotspots.map(hotspot => {
          if (!hotspot || typeof hotspot !== 'object') return hotspot;
          return {
            ...hotspot,
            status: hotspot.status === 'editing' || hotspot.status === 'saved'
              ? hotspot.status
              : (Number.isSafeInteger(hotspot.vehicleId) && hotspot.vehicleId > 0 ? 'saved' : 'editing')
          };
        })
        : hotspots;
    }

    function normalizeScriptForCurrentVersion(script) {
      if (!script || typeof script !== 'object') return createEmptyScript();
      const activeHotspotId = Number.isSafeInteger(script.activeHotspotId) && script.activeHotspotId > 0
        ? script.activeHotspotId
        : null;
      const hotspots = normalizeScriptHotspotsForCurrentVersion(script.hotspots);
      const savedLevels = Array.isArray(script.savedLevels)
        ? script.savedLevels.map(level => {
          if (!level || typeof level !== 'object' || !level.data || typeof level.data !== 'object') return level;
          return {
            ...level,
            data: {
              ...level.data,
              hotspots: normalizeScriptHotspotsForCurrentVersion(level.data.hotspots),
              activeHotspotId: Number.isSafeInteger(level.data.activeHotspotId) && level.data.activeHotspotId > 0
                ? level.data.activeHotspotId
                : null
            }
          };
        })
        : script.savedLevels;
      return {
        ...script,
        hotspots,
        activeHotspotId,
        savedLevels
      };
    }

    function normalizeLoadedState(candidate) {
      if (!candidate || typeof candidate !== 'object') return createInitialState();
      const candidateWithScript = {
        ...candidate,
        script: normalizeScriptForCurrentVersion(candidate.script || createEmptyScript())
      };
      return isValidState(candidateWithScript) ? candidateWithScript : createInitialState();
    }

    function loadState() {
      try {
        const storedState = JSON.parse(localStorage.getItem(STORAGE_KEY));
        return normalizeLoadedState(storedState);
      } catch {
        return createInitialState();
      }
    }

    function saveState(nextState) {
      if (!isValidState(nextState)) return false;

      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(nextState));
        return true;
      } catch {
        return false;
      }
    }

    });

    function usesDarkText(hex) {
      const red = Number.parseInt(hex.slice(1, 3), 16);
      const green = Number.parseInt(hex.slice(3, 5), 16);
      const blue = Number.parseInt(hex.slice(5, 7), 16);
      return (red * 299 + green * 587 + blue * 114) / 1000 > 170;
    }

    function fallbackCopyText(text) {
      const textarea = document.createElement('textarea');
      textarea.value = text;
      textarea.setAttribute('readonly', '');
      textarea.style.position = 'fixed';
      textarea.style.left = '-9999px';
      document.body.append(textarea);

      try {
        textarea.select();
        if (!document.execCommand('copy')) throw new Error('Clipboard fallback failed.');
      } finally {
        textarea.remove();
      }
    }

    async function copyText(text, button) {
      try {
        if (navigator.clipboard && typeof navigator.clipboard.writeText === 'function') {
          try {
            await navigator.clipboard.writeText(text);
          } catch (error) {
            fallbackCopyText(text);
          }
        } else {
          fallbackCopyText(text);
        }

        const previousLabel = button.textContent;
        button.textContent = '已复制';
        window.setTimeout(() => {
          if (button.isConnected) button.textContent = previousLabel;
        }, 1200);
        return true;
      } catch (error) {
        button.textContent = '复制失败';
        return false;
      }
    }

    function readFileAsDataUrl(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.addEventListener('load', () => resolve(String(reader.result || '')));
        reader.addEventListener('error', () => reject(reader.error || new Error('图片读取失败')));
        reader.readAsDataURL(file);
      });
    }

    function loadExternalScript(src) {
      return new Promise((resolve, reject) => {
        const existing = document.querySelector(`script[src="${src}"]`);
        if (existing) {
          existing.addEventListener('load', resolve, { once: true });
          existing.addEventListener('error', reject, { once: true });
          if (window.Tesseract) resolve();
          return;
        }
        const scriptElement = document.createElement('script');
        scriptElement.src = src;
        scriptElement.async = true;
        scriptElement.addEventListener('load', resolve, { once: true });
        scriptElement.addEventListener('error', () => reject(new Error('OCR 库加载失败')), { once: true });
        document.head.append(scriptElement);
      });
    }

    function getImageNaturalSize(dataUrl) {
      return new Promise((resolve, reject) => {
        const image = new Image();
        image.addEventListener('load', () => resolve({ width: image.naturalWidth, height: image.naturalHeight }), { once: true });
        image.addEventListener('error', () => reject(new Error('截图尺寸读取失败')), { once: true });
        image.src = dataUrl;
      });
    }

    function getImageElement(dataUrl) {
      return new Promise((resolve, reject) => {
        const image = new Image();
        image.addEventListener('load', () => resolve(image), { once: true });
        image.addEventListener('error', () => reject(new Error('截图读取失败')), { once: true });
        image.src = dataUrl;
      });
    }

    async function detectScriptVehicleRegions(dataUrl) {
      const image = await getImageElement(dataUrl);
      const width = image.naturalWidth;
      const height = image.naturalHeight;
      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      const context = canvas.getContext('2d', { willReadFrequently: true });
      context.drawImage(image, 0, 0);
      const pixels = context.getImageData(0, 0, width, height).data;
      const mask = new Uint8Array(width * height);

      for (let y = 0; y < height; y += 1) {
        for (let x = 0; x < width; x += 1) {
          const offset = (y * width + x) * 4;
          const red = pixels[offset];
          const green = pixels[offset + 1];
          const blue = pixels[offset + 2];
          const max = Math.max(red, green, blue);
          const min = Math.min(red, green, blue);
          const saturation = max === 0 ? 0 : (max - min) / max;
          const brightWhite = max > 215 && min > 190;
          const coloredVehiclePixel = saturation > 0.42 && max > 70 && !brightWhite;
          if (coloredVehiclePixel) mask[y * width + x] = 1;
        }
      }

      const visited = new Uint8Array(width * height);
      const regions = [];
      const queue = [];
      for (let start = 0; start < mask.length; start += 1) {
        if (!mask[start] || visited[start]) continue;
        visited[start] = 1;
        queue.length = 0;
        queue.push(start);
        let head = 0;
        let count = 0;
        let minX = width;
        let minY = height;
        let maxX = 0;
        let maxY = 0;
        while (head < queue.length) {
          const index = queue[head];
          head += 1;
          count += 1;
          const x = index % width;
          const y = Math.floor(index / width);
          minX = Math.min(minX, x);
          minY = Math.min(minY, y);
          maxX = Math.max(maxX, x);
          maxY = Math.max(maxY, y);
          [
            index - 1,
            index + 1,
            index - width,
            index + width,
            index - width - 1,
            index - width + 1,
            index + width - 1,
            index + width + 1
          ].forEach(next => {
            if (next < 0 || next >= mask.length || visited[next] || !mask[next]) return;
            const nextX = next % width;
            if (Math.abs(nextX - x) > 1) return;
            visited[next] = 1;
            queue.push(next);
          });
        }

        const boxWidth = maxX - minX + 1;
        const boxHeight = maxY - minY + 1;
        const boxArea = boxWidth * boxHeight;
        const fillRatio = count / boxArea;
        if (count < 80 || boxWidth < 10 || boxHeight < 10 || boxWidth > width * 0.35 || boxHeight > height * 0.35 || fillRatio < 0.25) {
          continue;
        }
        regions.push({
          vehicleId: 0,
          xPercent: ((minX + maxX) / 2 / width) * 100,
          yPercent: ((minY + maxY) / 2 / height) * 100,
          widthPercent: Math.max(4, (boxWidth / width) * 120),
          heightPercent: Math.max(4, (boxHeight / height) * 120),
          confidence: null,
          pixelCount: count
        });
      }

      return regions
        .sort((a, b) => b.pixelCount - a.pixelCount)
        .slice(0, 80);
    }

    function collectOcrDetections(data, imageWidth, imageHeight) {
      const items = [
        ...(data && Array.isArray(data.words) ? data.words : []),
        ...(data && Array.isArray(data.symbols) ? data.symbols : [])
      ];
      return items.map(item => {
        const text = String(item.text || '').replace(/\D/g, '');
        const vehicleId = Number(text);
        const box = item.bbox || {};
        if (!Number.isSafeInteger(vehicleId)
          || vehicleId <= 0
          || !Number.isFinite(box.x0)
          || !Number.isFinite(box.y0)
          || !Number.isFinite(box.x1)
          || !Number.isFinite(box.y1)) {
          return null;
        }
        return {
          vehicleId,
          xPercent: ((box.x0 + box.x1) / 2 / imageWidth) * 100,
          yPercent: ((box.y0 + box.y1) / 2 / imageHeight) * 100,
          widthPercent: Math.max(5, ((box.x1 - box.x0) / imageWidth) * 220),
          heightPercent: Math.max(5, ((box.y1 - box.y0) / imageHeight) * 220),
          confidence: Number.isFinite(Number(item.confidence)) ? Number(item.confidence) : null
        };
      }).filter(Boolean);
    }

    function mergeOcrDetectionsWithRegions(detections, regions) {
      const merged = regions.map(region => ({ ...region }));
      detections.forEach(detection => {
        const match = merged.find(region => Math.abs(region.xPercent - detection.xPercent) <= Math.max(region.widthPercent / 2, 6)
          && Math.abs(region.yPercent - detection.yPercent) <= Math.max(region.heightPercent / 2, 6)
          && region.vehicleId === 0);
        if (match) {
          match.vehicleId = detection.vehicleId;
          match.confidence = detection.confidence;
        } else {
          merged.push(detection);
        }
      });
      return merged;
    }

    async function runScriptOcr(button) {
      if (!state.script.screenshotDataUrl) {
        updateState(setScriptOcrStatus(state, 'error', '请先上传截图'));
        return;
      }

      button.disabled = true;
      updateState(setScriptOcrStatus(state, 'loading'));
      let regionDetections = [];
      try {
        regionDetections = await detectScriptVehicleRegions(state.script.screenshotDataUrl);
        await loadExternalScript('https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js');
        if (!window.Tesseract || typeof window.Tesseract.recognize !== 'function') {
          throw new Error('OCR 库不可用');
        }
        const result = await window.Tesseract.recognize(state.script.screenshotDataUrl, 'eng');
        const size = await getImageNaturalSize(state.script.screenshotDataUrl);
        const ocrDetections = collectOcrDetections(result ? result.data : null, size.width, size.height);
        const detections = mergeOcrDetectionsWithRegions(ocrDetections, regionDetections);
        updateState(setScriptOcrStatus(applyScriptOcrDetections(state, detections), detections.length > 0 ? 'done' : 'error', detections.length > 0 ? '' : '未识别到车辆热区，可手动标定'));
      } catch (error) {
        if (regionDetections.length > 0) {
          updateState(setScriptOcrStatus(
            applyScriptOcrDetections(state, regionDetections),
            'done',
            `文字识别失败，已生成待填ID热区：${error && error.message ? error.message : 'OCR 识别失败'}`
          ));
        } else {
          updateState(setScriptOcrStatus(state, 'error', error && error.message ? error.message : 'OCR 识别失败'));
        }
      } finally {
        if (button.isConnected) button.disabled = false;
      }
    }

        const hotspot = state.script.hotspots.find(item => item.id === hotspotId);
        if (hotspot && hotspot.status !== 'saved' && state.script.activeHotspotId === hotspotId) {
          const idInput = workspace.querySelector(`.script-list-card[data-script-hotspot-card="${hotspotId}"] .script-hotspot-field[data-hotspot-field="vehicleId"]`);
          if (idInput instanceof HTMLInputElement) idInput.focus();
          return;
        }
        let nextState = setScriptActiveHotspot(state, hotspotId);
        if (hotspot && hotspot.status === 'saved' && hotspot.vehicleId > 0) {
          nextState = selectScriptVehicle(nextState, hotspot.vehicleId);
        }
        updateState(nextState);
      } else if (target.matches('[data-action="focus-script-hotspot"][data-hotspot-id]')) {
        updateState(setScriptActiveHotspot(state, Number(target.dataset.hotspotId)));
      } else if (target.matches('[data-action="save-script-hotspot"][data-hotspot-id]')) {
        updateState(saveScriptHotspotFromFields(state, Number(target.dataset.hotspotId)));
      } else if (target.matches('[data-action="edit-script-hotspot"][data-hotspot-id]')) {
        updateState(updateScriptHotspot(state, Number(target.dataset.hotspotId), { status: 'editing' }));
      } else if (target.matches('[data-action="save-all-script-hotspots"]')) {
        updateState(saveAllScriptHotspotsFromFields(state));
      } else if (target.matches('[data-action="select-script-vehicle"][data-vehicle-id]')) {
        const hotspotId = target.dataset.hotspotId ? Number(target.dataset.hotspotId) : null;
        const focusedState = hotspotId === null ? state : setScriptActiveHotspot(state, hotspotId);
        const hotspot = hotspotId === null ? null : focusedState.script.hotspots.find(item => item.id === hotspotId);
        if (hotspot && hotspot.status !== 'saved') {
          updateState(focusedState);
          return;
        }
        const vehicleId = hotspot ? hotspot.vehicleId : Number(target.dataset.vehicleId);
        updateState(selectScriptVehicle(focusedState, vehicleId));
      } else if (target.matches('[data-action="delete-script-hotspot"][data-hotspot-id]')) {
        updateState(deleteScriptHotspot(state, Number(target.dataset.hotspotId)));
      } else if (target.matches('[data-action="depart-script-slot"][data-slot-index]')) {
        updateState(departScriptSlot(state, Number(target.dataset.slotIndex)));
      } else if (target.matches('[data-action="record-script-batch"]')) {
        updateState(recordScriptBatch(state, workspace.querySelector('#scriptBatchNote').value));
      } else if (target.matches('[data-action="copy-script-report"]')) {
        void copyText(getScriptReportText(state), target);
      } else if (target.matches('[data-action="save-script-level"]')) {
        updateState(saveScriptLevel(state, workspace.querySelector('#scriptLevelName').value));
      } else if (target.matches('[data-action="load-script-level"][data-level-id]')) {
        updateState(loadScriptLevel(state, Number(target.dataset.levelId)));
      } else if (target.matches('[data-action="delete-script-level"][data-level-id]')) {
        updateState(deleteScriptLevel(state, Number(target.dataset.levelId)));
      } else if (target.matches('[data-action="clear-script-workspace"]')
        && window.confirm('确定要清空当前剧本还原工作区吗？已保存关卡会保留。')) {
        updateState(clearScriptWorkspace(state));
      } else if (target.matches('[data-action="run-script-ocr"]')) {
        void runScriptOcr(target);
      }
    });

    workspace.addEventListener('change', event => {
      const target = event.target;
      if (target instanceof HTMLInputElement && target.matches('.remaining-input[data-slot-index]')) {
        updateState(updateVehicleRemaining(state, Number(target.dataset.slotIndex), Number(target.value)));
      } else if (target instanceof HTMLInputElement && target.matches('.script-remaining-input[data-slot-index]')) {
        updateState(updateScriptSlotRemaining(state, Number(target.dataset.slotIndex), Number(target.value)));
      } else if (target instanceof HTMLInputElement && target.matches('#scriptLevelName')) {
        updateState(setScriptLevelName(state, target.value));
      } else if (target instanceof HTMLInputElement && target.matches('#scriptScreenshotFile') && target.files && target.files[0]) {
        void readFileAsDataUrl(target.files[0]).then(dataUrl => {
          updateState(setScriptScreenshot(state, dataUrl));
        }).catch(error => {
          updateState(setScriptOcrStatus(state, 'error', error && error.message ? error.message : '图片读取失败'));
        });
      }
    });

    addColorDialog.querySelector('[data-action="cancel-color"]').addEventListener('click', () => {
      addColorDialog.close();
    });

    addColorForm.addEventListener('submit', event => {
      event.preventDefault();
      if (colorName.value.trim() === '') {
        colorError.textContent = '请输入颜色名称。';
        colorName.focus();
        return;
      }

      const nextState = addColor(state, colorName.value, colorHex.value);
      if (nextState === state) {
        colorError.textContent = '颜色保存失败，请检查输入。';
        return;
      }

      addColorDialog.close();
      updateState(nextState);
    });

    document.addEventListener('keydown', event => {
      if (addColorDialog.open
        || !SECTIONS.includes(state.activeStage)
        || (event.target instanceof Element && event.target.closest('input, textarea, select'))) {
        return;
      }

      if (event.ctrlKey && event.key.toLowerCase() === 'z') {
        event.preventDefault();
        updateState(undo(state, state.activeStage));
        return;
      }

      if (!event.ctrlKey && !event.metaKey && !event.altKey && /^[0-9]$/.test(event.key)) {
        updateState(appendValue(state, state.activeStage, Number(event.key)));
      }
    });

    window.QueueRecorderApp = Object.freeze({
      getState: () => state,
      updateState,
      render,
      copyText
    });

    render();
  </script>
</body>
</html>
