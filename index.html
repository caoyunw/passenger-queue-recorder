    function scoreStableSimulationRoleDistance(resultRoleSummary, targetRoleSummary) {
      const targetCounts = countStableSimulationRoleSummary(targetRoleSummary);
      if (targetCounts.size === 0) return 0;

      const resultCounts = countStableSimulationRoleSummary(resultRoleSummary);
      const roles = new Set([...targetCounts.keys(), ...resultCounts.keys()]);
      let distance = 0;
      roles.forEach(role => {
        distance += Math.abs((targetCounts.get(role) || 0) - (resultCounts.get(role) || 0));
      });
      return distance;
    }

    function getQueueFitTargetRoleSummary(state, input) {
      const targetRecordText = input && typeof input.targetRecordText === 'string' ? input.targetRecordText.trim() : '';
      if (!targetRecordText) return { roleSummary: [], errors: [] };
      const hasStepLogHeader = targetRecordText.split(/\r?\n/).some(line => {
        const cells = line.split('\t');
        return cells.includes('步骤') && cells.includes('点击车辆');
      });
      if (!hasStepLogHeader) return { roleSummary: [], errors: [] };

      const annotated = annotateStableSimulationReportMarkdown(
        input && typeof input.targetRecordFilename === 'string' ? input.targetRecordFilename : 'target.md',
        targetRecordText,
        '',
        state
      );
      return {
        roleSummary: annotated.roleSummary || [],
        errors: annotated.errors.length > 0
          ? annotated.errors.map(error => `竞品结算模拟记录解析失败：${error}`)
          : []
      };
    }

    function scoreStableSimulationFitResult(result, targetRoleSummary = []) {
      const waiting = getStableSimulationRoleCount(result, '等待占位车');
      const trigger = getStableSimulationRoleCount(result, '补清触发车');
      const chain = getStableSimulationRoleCount(result, '连锁释放车');
      const rhythmScore = waiting * 4 + trigger * 5 + chain * 8;
      if (Array.isArray(targetRoleSummary) && targetRoleSummary.length > 0) {
        return 10000 - scoreStableSimulationRoleDistance(result.roleSummary, targetRoleSummary) * 100 + rhythmScore;
      }
      return rhythmScore;
    }

    function getStableSimulationCandidateSplitIndexes(order, vehiclesById) {
      const waitingIndexes = [];
      const triggerIndexes = [];
      order.forEach((vehicleId, index) => {
        const vehicle = vehiclesById.get(vehicleId);
        const pathRole = getStableSimulationPathRole(vehicle);
        if (index < order.length - 2 && vehicle.capacity > 1) {
          if (pathRole !== '深层终点车') waitingIndexes.push(index);
        }
        if (index > 1 && (
          vehicle.backVehicleIds.length >= 4
          || pathRole === '中继大分支解锁车'
          || pathRole === '深层终点车'
          || index >= order.length - 5
        )) {
          triggerIndexes.push(index);
        }
      });
      return { waitingIndexes, triggerIndexes };
    }

    function createStableSimulationFitRandom(seed) {
      let value = seed >>> 0;
      return () => {
        value = (value * 1664525 + 1013904223) >>> 0;
        return value / 4294967296;
      };
    }

    function createStableSimulationRandomSplits(order, vehiclesById, waitingIndexes, triggerIndexes, random) {
      const splits = [];
      const shuffled = [...waitingIndexes].sort(() => random() - 0.5);
      const splitCount = Math.min(shuffled.length, 2 + Math.floor(random() * 8));
      const usedSourceIndexes = new Set();

      for (let index = 0; index < splitCount; index += 1) {
        const sourceIndex = shuffled[index];
        if (usedSourceIndexes.has(sourceIndex)) continue;
        const vehicle = vehiclesById.get(order[sourceIndex]);
        const possibleTargets = triggerIndexes.filter(targetIndex => targetIndex > sourceIndex + 1);
        if (possibleTargets.length === 0) continue;
        const targetIndex = possibleTargets[Math.floor(random() * possibleTargets.length)];
        const maxRemaining = Math.min(
          vehicle.capacity - 1,
          vehicle.capacity >= 10 ? 6 : (vehicle.capacity >= 6 ? 4 : 2)
        );
        const remainingCount = 1 + Math.floor(random() * maxRemaining);
        if (vehicle.capacity - remainingCount <= 0) continue;
        splits.push({ sourceIndex, targetIndex, remainingCount });
        usedSourceIndexes.add(sourceIndex);
      }

      return splits;
    }

    function getStableSimulationQueueRunCount(values) {
      let runCount = 0;
      let previous = null;
      values.forEach(value => {
        if (value !== previous) {
          runCount += 1;
          previous = value;
        }
      });
      return runCount;
    }

    function scoreStableSimulationBeltProfileDistance(queue, targetBeltValues, conveyorCapacity) {
      if (!Array.isArray(targetBeltValues) || targetBeltValues.length === 0 || !conveyorCapacity) return 0;
      const beltLength = Math.min(conveyorCapacity, targetBeltValues.length, queue.length);
      const fittedBelt = queue.slice(0, beltLength);
      const targetBelt = targetBeltValues.slice(0, beltLength);
      const fittedCounts = countStableSimulationValues(fittedBelt);
      const targetCounts = countStableSimulationValues(targetBelt);
      const colors = new Set([...fittedCounts.keys(), ...targetCounts.keys()]);
      let countDistance = 0;
      colors.forEach(colorValue => {
        countDistance += Math.abs((fittedCounts.get(colorValue) || 0) - (targetCounts.get(colorValue) || 0));
      });
      let positionDistance = 0;
      for (let index = 0; index < beltLength; index += 1) {
        if (fittedBelt[index] !== targetBelt[index]) positionDistance += 1;
      }
      const fittedDistinct = new Set(fittedBelt).size;
      const targetDistinct = new Set(targetBelt).size;
      const fittedRuns = getStableSimulationQueueRunCount(fittedBelt);
      const targetRuns = getStableSimulationQueueRunCount(targetBelt);
      return countDistance * 1000
        + positionDistance * 100
        + Math.abs(fittedDistinct - targetDistinct) * 100
        + Math.abs(fittedRuns - targetRuns) * 10;
    }

    function createStableSimulationBeltProfileVariant(queue, targetBeltValues, conveyorCapacity) {
      if (!Array.isArray(targetBeltValues) || targetBeltValues.length === 0 || !conveyorCapacity) return null;
      const beltLength = Math.min(conveyorCapacity, targetBeltValues.length, queue.length);
      const values = [...queue];
      const targetBelt = targetBeltValues.slice(0, beltLength);
      const originalDistance = scoreStableSimulationBeltProfileDistance(values, targetBelt, conveyorCapacity);
      if (originalDistance <= 0) return null;

      let changed = false;

      for (let prefixIndex = 0; prefixIndex < beltLength; prefixIndex += 1) {
        const targetColor = targetBelt[prefixIndex];
        if (values[prefixIndex] === targetColor) continue;
        const reserveIndex = values.findIndex((value, index) => index > prefixIndex && value === targetColor);
        if (reserveIndex === -1) break;
        const reserveValue = values[reserveIndex];
        values[reserveIndex] = values[prefixIndex];
        values[prefixIndex] = reserveValue;
        changed = true;
      }

      return changed && scoreStableSimulationBeltProfileDistance(values, targetBelt, conveyorCapacity) < originalDistance
        ? values
        : null;
    }

    function createStableSimulationExactBeltProfileVariant(queue, targetBeltValues, conveyorCapacity) {
      if (!Array.isArray(targetBeltValues) || targetBeltValues.length === 0 || !conveyorCapacity) return null;
      const beltLength = Math.min(conveyorCapacity, targetBeltValues.length, queue.length);
      const targetBelt = targetBeltValues.slice(0, beltLength);
      const remaining = [...queue];
      const prefix = [];

      for (const colorValue of targetBelt) {
        const index = remaining.indexOf(colorValue);
        if (index === -1) return null;
        prefix.push(colorValue);
        remaining.splice(index, 1);
      }

      const variant = [...prefix, ...remaining];
      return scoreStableSimulationBeltProfileDistance(variant, targetBelt, conveyorCapacity)
        < scoreStableSimulationBeltProfileDistance(queue, targetBelt, conveyorCapacity)
        ? variant
        : null;
    }

    function countReachableVehicleIds(vehicle, vehiclesById, directionKey) {
      const seen = new Set();
      const stack = [...vehicle[directionKey]];
      while (stack.length > 0) {
        const id = stack.pop();
        if (seen.has(id)) continue;
        seen.add(id);
        const next = vehiclesById.get(id);
        if (next) stack.push(...next[directionKey]);
      }
      return seen.size;
    }

    function getQueueFitVehicleStructureSignature(vehicle, vehiclesById) {
      const frontCapacities = vehicle.frontVehicleIds
        .map(id => vehiclesById.get(id))
        .filter(Boolean)
        .map(front => front.capacity)
        .sort((a, b) => a - b)
        .join(',');
      const backCapacities = vehicle.backVehicleIds
        .map(id => vehiclesById.get(id))
        .filter(Boolean)
        .map(back => back.capacity)
        .sort((a, b) => a - b)
        .join(',');
      return [
        vehicle.capacity,
        vehicle.depth,
        vehicle.frontVehicleIds.length,
        vehicle.backVehicleIds.length,
        countReachableVehicleIds(vehicle, vehiclesById, 'frontVehicleIds'),
        countReachableVehicleIds(vehicle, vehiclesById, 'backVehicleIds'),
        frontCapacities,
        backCapacities
      ].join('|');
    }

    function groupQueueFitVehiclesByStructure(vehicles) {
      const vehiclesById = new Map(vehicles.map(vehicle => [vehicle.id, vehicle]));
      const groups = new Map();
      vehicles.forEach(vehicle => {
        const signature = getQueueFitVehicleStructureSignature(vehicle, vehiclesById);
        const list = groups.get(signature) || [];
        list.push(vehicle);
        groups.set(signature, list);
      });
      return groups;
    }

    function addQueueFitColorMapping(colorMap, targetColor, sourceColor) {
      if (!Number.isSafeInteger(targetColor) || !Number.isSafeInteger(sourceColor)) return;
      if (colorMap.has(targetColor) && colorMap.get(targetColor) !== sourceColor) {
        colorMap.set(targetColor, null);
      } else if (!colorMap.has(targetColor)) {
        colorMap.set(targetColor, sourceColor);
      }
    }

    function buildQueueFitTargetColorMap(sourceVehicles, targetVehicles) {
      if (!Array.isArray(sourceVehicles) || !Array.isArray(targetVehicles)
        || sourceVehicles.length === 0 || targetVehicles.length === 0) {
        return new Map();
      }

      const sourceGroups = groupQueueFitVehiclesByStructure(sourceVehicles);
      const targetGroups = groupQueueFitVehiclesByStructure(targetVehicles);
      const colorMap = new Map();

      targetGroups.forEach((targetList, signature) => {
        const sourceList = sourceGroups.get(signature);
        if (!sourceList || sourceList.length !== targetList.length) return;

        if (targetList.length === 1) {
          addQueueFitColorMapping(colorMap, targetList[0].colorValue, sourceList[0].colorValue);
          return;
        }

        const targetColors = new Set(targetList.map(vehicle => vehicle.colorValue));
        const sourceColors = new Set(sourceList.map(vehicle => vehicle.colorValue));
        if (targetColors.size === 1 && sourceColors.size === 1) {
          addQueueFitColorMapping(colorMap, targetList[0].colorValue, sourceList[0].colorValue);
        }
      });

      [...colorMap.entries()].forEach(([targetColor, sourceColor]) => {
        if (sourceColor === null) colorMap.delete(targetColor);
      });
      return colorMap;
    }

    function translateQueueFitTargetValues(values, colorMap) {
      if (!Array.isArray(values) || !(colorMap instanceof Map) || colorMap.size === 0) return values;
      return values.map(value => colorMap.has(value) ? colorMap.get(value) : value);
    }

    function fitStableSimulationPassengerQueue(state, input) {
      const conveyorCapacity = parsePositiveInteger(input && input.conveyorCapacity);
      const parsedPassengerQueue = parseStableSimulationPassengerQueue(state, input && input.passengerQueueText);
      const vehicleText = input && typeof input.vehicleTableText === 'string' ? input.vehicleTableText : '';
      const targetVehicleText = input && typeof input.targetVehicleTableText === 'string' ? input.targetVehicleTableText : '';
      const parsedVehicles = parseScriptVehicleTable(vehicleText);
      const parsedTargetVehicles = targetVehicleText.trim()
        ? parseScriptVehicleTable(targetVehicleText)
        : { vehicles: [], errors: [] };
      const vehicles = parsedVehicles.vehicles.filter(vehicle => isScriptColorValue(state, vehicle.colorValue));
      const errors = [
        ...parsedPassengerQueue.errors,
        ...parsedVehicles.errors,
        ...parsedTargetVehicles.errors.map(error => `竞品车辆数据表：${error}`)
      ];

      if (conveyorCapacity === null) errors.push('传送带容量必须是正整数');
      parsedVehicles.vehicles
        .filter(vehicle => !isScriptColorValue(state, vehicle.colorValue))
        .forEach(vehicle => errors.push(`车辆 ${vehicle.id} 的颜色映射 ${vehicle.colorValue} 不存在`));
      const targetRecord = getQueueFitTargetRoleSummary(state, input);
      const targetColorMap = buildQueueFitTargetColorMap(vehicles, parsedTargetVehicles.vehicles);
      const rawTargetQueueParts = getQueueFitTargetQueueParts(input && input.targetRecordText);
      const targetQueueParts = {
        ...rawTargetQueueParts,
        beltValues: translateQueueFitTargetValues(rawTargetQueueParts.beltValues, targetColorMap)
      };
      errors.push(...targetRecord.errors);
      if (errors.length > 0) {
        return { passengerQueueText: '', clickSequenceText: '', score: 0, roleSummary: [], errors };
      }

      const order = getStableSimulationDependencyOrder(vehicles);
      if (order.errors.length > 0) {
        return { passengerQueueText: '', clickSequenceText: '', score: 0, roleSummary: [], errors: order.errors };
      }

      const sourceCounts = countStableSimulationValues(parsedPassengerQueue.values);
      const targetQueue = [];
      vehicles.forEach(vehicle => addStableSimulationFittedPassengers(targetQueue, vehicle.colorValue, vehicle.capacity));
      const targetCounts = countStableSimulationValues(targetQueue);
      const countErrors = [];
      const allColors = new Set([...sourceCounts.keys(), ...targetCounts.keys()]);
      allColors.forEach(colorValue => {
        if ((sourceCounts.get(colorValue) || 0) !== (targetCounts.get(colorValue) || 0)) {
          countErrors.push(`颜色 ${colorValue} 数量不匹配：队列 ${sourceCounts.get(colorValue) || 0} / 车辆座位 ${targetCounts.get(colorValue) || 0}`);
        }
      });
      if (countErrors.length > 0) {
        return { passengerQueueText: '', clickSequenceText: order.values.join(','), score: 0, roleSummary: [], errors: countErrors };
      }

      const vehiclesById = new Map(vehicles.map(vehicle => [vehicle.id, vehicle]));
      const baseQueue = buildStableSimulationFittedQueue(order.values, vehiclesById, []);
      const clickSequenceText = order.values.join(',');
      let best = {
        queue: baseQueue,
        result: null,
        score: -Infinity,
        rhythmScore: -Infinity,
        profileDistance: Number.POSITIVE_INFINITY
      };
      const seenQueues = new Set();
      const evaluateQueue = queue => {
        const queueKey = formatStableSimulationValues(queue);
        if (seenQueues.has(queueKey)) return;
        seenQueues.add(queueKey);
        const result = runStableSimulation(state, {
          ...input,
          conveyorCapacity: String(conveyorCapacity),
          passengerQueueText: queueKey,
          vehicleTableText: vehicleText,
          clickSequenceText
        });
        if (!isStableSimulationFitResultValid(result)) return;
        const profileDistance = scoreStableSimulationBeltProfileDistance(
          queue,
          targetQueueParts.beltValues,
          conveyorCapacity
        );
        const rhythmScore = scoreStableSimulationFitResult(
          result,
          targetRecord.roleSummary
        );
        const score = Math.max(0, rhythmScore);
        if (profileDistance < best.profileDistance
          || (profileDistance === best.profileDistance && rhythmScore > best.rhythmScore)) {
          best = { queue, result, score, rhythmScore, profileDistance };
        }
      };
      const evaluateQueueWithProfileVariant = queue => {
        evaluateQueue(queue);
        const exactVariant = createStableSimulationExactBeltProfileVariant(
          queue,
          targetQueueParts.beltValues,
          conveyorCapacity
        );
        if (exactVariant) evaluateQueue(exactVariant);
        const variant = createStableSimulationBeltProfileVariant(
          queue,
          targetQueueParts.beltValues,
          conveyorCapacity
        );
        if (variant) evaluateQueue(variant);
      };
      evaluateQueueWithProfileVariant(baseQueue);

      const { waitingIndexes, triggerIndexes } = getStableSimulationCandidateSplitIndexes(order.values, vehiclesById);
      const random = createStableSimulationFitRandom(110011);
      for (let iteration = 0; iteration < 1200; iteration += 1) {
        const splits = createStableSimulationRandomSplits(order.values, vehiclesById, waitingIndexes, triggerIndexes, random);
        const queue = buildStableSimulationFittedQueue(order.values, vehiclesById, splits);
        evaluateQueueWithProfileVariant(queue);
      }

      if (!isStableSimulationFitResultValid(best.result)) {
        return {
          passengerQueueText: formatStableSimulationValues(baseQueue),
          clickSequenceText,
          score: 0,
          roleSummary: [],
          errors: ['未能找到可完整结算的拟合队列']
        };
      }

      return {
        passengerQueueText: formatStableSimulationValues(best.queue),
        clickSequenceText,
        score: best.score,
        roleSummary: best.result.roleSummary,
        errors: []
      };
    }

    function cloneSimulationSlot(slot) {
      return slot ? { ...slot } : null;
    }

    function formatStableSimulationVehicle(state, vehiclesById, vehicleId) {
      const vehicle = vehiclesById.get(vehicleId);
      if (!vehicle) return `#${vehicleId}`;
      return `#${vehicle.id}${getScriptColorName(state, vehicle.colorValue)}${vehicle.capacity}`;
    }

    function findStableSimulationTargetSlot(slots, colorValue) {
      return slots.findIndex(slot => slot && slot.colorValue === colorValue && slot.remaining > 0);
    }

    function settleStableSimulationStep(working) {
      const consumption = new Map();
      const departedVehicleIds = [];
      const warnings = [];
      let guard = 0;
      let moved = true;

      while (moved && guard < 10000) {
        guard += 1;
        moved = false;
        for (let index = 0; index < working.belt.length; index += 1) {
          const colorValue = working.belt[index];
          const slotIndex = findStableSimulationTargetSlot(working.slots, colorValue);
          if (slotIndex === -1) continue;

          const slot = working.slots[slotIndex];
          slot.remaining -= 1;
          consumption.set(slot.vehicleId, (consumption.get(slot.vehicleId) || 0) + 1);
          working.belt.splice(index, 1);
          if (working.reserveQueue.length > 0) working.belt.push(working.reserveQueue.shift());
          if (slot.remaining === 0) {
            departedVehicleIds.push(slot.vehicleId);
            working.slots[slotIndex] = null;
          }
          moved = true;
          break;
        }
      }

      if (guard >= 10000) warnings.push('结算超过安全上限，已停止本步模拟');
      return {
        consumption: [...consumption.entries()].map(([vehicleId, count]) => ({ vehicleId, count })),
        departedVehicleIds,
        warnings
      };
    }

    function createStableSimulationRoleSummary(steps) {
      const grouped = new Map();
      steps.forEach(step => {
        if (!step.role) return;
        const group = grouped.get(step.role) || [];
        group.push(step.clickedVehicleId);
        grouped.set(step.role, group);
      });

      const extraRoles = [...grouped.keys()].filter(role => !STABLE_SIMULATION_ROLE_ORDER.includes(role));
      return [...STABLE_SIMULATION_ROLE_ORDER, ...extraRoles]
        .filter(role => grouped.has(role))
        .map(role => ({ role, vehicleIds: grouped.get(role) }));
    }

    function annotateStableSimulationRoles(steps) {
      const departureStepByVehicleId = new Map();
      steps.forEach(step => {
        step.departedVehicleIds.forEach(vehicleId => {
          if (!departureStepByVehicleId.has(vehicleId)) departureStepByVehicleId.set(vehicleId, step.step);
        });
      });

      const tailStartStep = Math.max(1, steps.length - 2);
      const annotatedSteps = steps.map(step => {
        const triggeredVehicleIds = step.departedVehicleIds.filter(id => id !== step.clickedVehicleId);
        const clickedDeparted = step.departedVehicleIds.includes(step.clickedVehicleId);
        const departureStep = departureStepByVehicleId.get(step.clickedVehicleId) || null;
        const tags = [];
        let role = '异常点击';

        if (step.enteredSlot === null) {
          tags.push('未进车');
        } else if (!clickedDeparted) {
          role = '等待占位车';
          tags.push('残座等待');
          tags.push(departureStep && departureStep > step.step ? `被第${departureStep}步补清` : '未开走占位');
        } else if (triggeredVehicleIds.length >= 2) {
          role = '连锁释放车';
          tags.push('当步开走', `触发补清:${triggeredVehicleIds.map(id => `#${id}`).join('/')}`);
        } else if (triggeredVehicleIds.length === 1) {
          role = '补清触发车';
          tags.push('当步开走', `触发补清:#${triggeredVehicleIds[0]}`);
        } else if (step.step >= tailStartStep) {
          role = '尾段收尾车';
          tags.push('当步开走', '尾段');
        } else {
          role = '即时清空车';
          tags.push('当步开走');
        }

        return {
          ...step,
          role,
          tags,
          triggeredVehicleIds,
          departureStep,
          waitingSteps: departureStep && departureStep > step.step ? departureStep - step.step : null
        };
      });

      return {
        steps: annotatedSteps,
        roleSummary: createStableSimulationRoleSummary(annotatedSteps)
      };
    }

    function getStableSimulationPathRole(vehicle) {
      if (!vehicle) return '未提供路径数据';
      const frontCount = vehicle.frontVehicleIds.length;
      const backCount = vehicle.backVehicleIds.length;
      if (frontCount === 0 && backCount >= 8) return '核心入口解锁车';
      if (frontCount === 0 && backCount > 0) return '入口分支解锁车';
      if (frontCount === 0) return '独立可点车';
      if (frontCount > 0 && backCount >= 4) return '中继大分支解锁车';
      if (frontCount > 0 && backCount > 0) return '中继小分支解锁车';
      if (vehicle.depth >= 5 || frontCount >= 5) return '深层终点车';
      return '普通被解锁车';
    }

    function createStableSimulationPathSummary(steps) {
      const grouped = new Map();
      steps.forEach(step => {
        if (!step.pathRole) return;
        const group = grouped.get(step.pathRole) || [];
        group.push(step.clickedVehicleId);
        grouped.set(step.pathRole, group);
      });

      const extraRoles = [...grouped.keys()].filter(role => !STABLE_SIMULATION_PATH_ROLE_ORDER.includes(role));
      return [...STABLE_SIMULATION_PATH_ROLE_ORDER, ...extraRoles]
        .filter(role => grouped.has(role))
        .map(role => ({ role, vehicleIds: grouped.get(role) }));
    }

    function getStableSimulationLayerLabel(depth) {
      return Number.isSafeInteger(depth) ? `L${depth}` : 'L?';
    }

    function getStableSimulationLayeredVehicleId(vehicleId, vehicle) {
      return `${getStableSimulationLayerLabel(vehicle ? vehicle.depth : null)}:#${vehicleId}`;
    }

    function createStableSimulationLayerSummary(steps) {
      const grouped = new Map();
      steps.forEach(step => {
        const layerLabel = getStableSimulationLayerLabel(step.depth);
        const group = grouped.get(layerLabel) || {
          layerLabel,
          depth: Number.isSafeInteger(step.depth) ? step.depth : null,
          vehicleIds: []
        };
        group.vehicleIds.push(step.clickedVehicleId);
        grouped.set(layerLabel, group);
      });

      return [...grouped.values()].sort((a, b) => {
        if (a.depth === null && b.depth === null) return a.layerLabel.localeCompare(b.layerLabel);
        if (a.depth === null) return 1;
        if (b.depth === null) return -1;
        return a.depth - b.depth;
      });
    }

    function getStableSimulationPathTags(vehicle) {
      if (!vehicle) return ['未提供车辆表路径数据'];
      return [
        `深度${vehicle.depth}`,
        `前方${vehicle.frontVehicleIds.length}`,
        `后方${vehicle.backVehicleIds.length}`
      ];
    }

    function annotateStableSimulationPathRoles(steps, vehiclesById) {
      const annotatedSteps = steps.map(step => {
        const vehicle = vehiclesById.get(step.clickedVehicleId);
        return {
          ...step,
          pathRole: getStableSimulationPathRole(vehicle),
          pathTags: getStableSimulationPathTags(vehicle),
          layeredVehicleId: getStableSimulationLayeredVehicleId(step.clickedVehicleId, vehicle),
          depth: vehicle ? vehicle.depth : null,
          frontVehicleIds: vehicle ? [...vehicle.frontVehicleIds] : [],
          backVehicleIds: vehicle ? [...vehicle.backVehicleIds] : []
        };
      });
      const keyPathVehicles = annotatedSteps
        .filter(step => step.pathRole === '核心入口解锁车'
          || step.pathRole === '中继大分支解锁车'
          || step.backVehicleIds.length >= 4)
        .map(step => ({
          vehicleId: step.clickedVehicleId,
          backCount: step.backVehicleIds.length,
          frontCount: step.frontVehicleIds.length,
          depth: step.depth
        }));
      const deepDependencyVehicles = annotatedSteps
        .filter(step => step.depth >= 5 || step.frontVehicleIds.length >= 5)
        .map(step => ({
          vehicleId: step.clickedVehicleId,
          backCount: step.backVehicleIds.length,
          frontCount: step.frontVehicleIds.length,
          depth: step.depth
        }));

      return {
        steps: annotatedSteps,
        pathSummary: createStableSimulationPathSummary(annotatedSteps),
        layerSummary: createStableSimulationLayerSummary(annotatedSteps),
        keyPathVehicles,
        deepDependencyVehicles
      };
    }

    function getStableSimulationLayoutSignature(step, vehicle) {
      if (!vehicle) return null;
      const frontCount = vehicle.frontVehicleIds.length;
      const backCount = vehicle.backVehicleIds.length;
      return [
        `color:${vehicle.colorValue}`,
        `capacity:${vehicle.capacity}`,
        `settle:${step ? step.role : '未点击'}`,
        `path:${step ? step.pathRole : getStableSimulationPathRole(vehicle)}`,
        `depth:${vehicle.depth}`,
        `front:${frontCount}`,
        `back:${backCount}`,
        `wait:${step && step.waitingSteps !== null ? step.waitingSteps : 0}`,
        `trigger:${step ? step.triggeredVehicleIds.length : 0}`
      ].join('|');
    }

    function getStableSimulationRigidReason(step, vehicle) {
      if (!vehicle) return '';
      const pathRole = step ? step.pathRole : getStableSimulationPathRole(vehicle);
      const reasons = [];
      if (pathRole === '核心入口解锁车') reasons.push(pathRole);
      if (step && ['等待占位车', '补清触发车', '连锁释放车'].includes(step.role)) reasons.push(step.role);
      if (vehicle.backVehicleIds.length >= 8) reasons.push(`后方${vehicle.backVehicleIds.length}辆`);
      if (vehicle.depth >= 5 && vehicle.frontVehicleIds.length >= 2) reasons.push('深层多前置依赖');
      return [...new Set(reasons)].join(' / ');
    }

    function analyzeStableSimulationLayoutFreedom(steps, vehicles) {
      const safeSteps = Array.isArray(steps) ? steps : [];
      const safeVehicles = Array.isArray(vehicles) ? vehicles : [];
      const stepByVehicleId = new Map(safeSteps.map(step => [step.clickedVehicleId, step]));
      const grouped = new Map();
      const freelyPlaceableVehicleIds = [];
      const rigidVehicles = [];

      safeVehicles.forEach(vehicle => {
        const step = stepByVehicleId.get(vehicle.id) || null;
        const signature = getStableSimulationLayoutSignature(step, vehicle);
        if (signature) {
          const group = grouped.get(signature) || {
            signature,
            vehicleIds: [],
            reason: step
              ? `${step.role} / ${step.pathRole} / ${getStableSimulationLayerLabel(vehicle.depth)} / 同色同座`
              : `未点击 / ${getStableSimulationPathRole(vehicle)} / ${getStableSimulationLayerLabel(vehicle.depth)} / 同色同座`
          };
          group.vehicleIds.push(vehicle.id);
          grouped.set(signature, group);
        }

        const rigidReason = getStableSimulationRigidReason(step, vehicle);
        if (rigidReason) {
          rigidVehicles.push({ vehicleId: vehicle.id, reason: rigidReason });
        }

        if (!step
          && vehicle.frontVehicleIds.length === 0
          && vehicle.backVehicleIds.length === 0
          && getStableSimulationPathRole(vehicle) === '独立可点车') {
          freelyPlaceableVehicleIds.push(vehicle.id);
        }
      });

      const swappableGroups = [...grouped.values()]
        .filter(group => group.vehicleIds.length > 1)
        .map(group => ({
          ...group,
          vehicleIds: group.vehicleIds.sort((a, b) => a - b)
        }))
        .sort((a, b) => a.vehicleIds[0] - b.vehicleIds[0]);

      return {
        swappableGroups,
        freelyPlaceableVehicleIds: freelyPlaceableVehicleIds.sort((a, b) => a - b),
        rigidVehicles: rigidVehicles.sort((a, b) => a.vehicleId - b.vehicleId),
        confidence: '静态推断：乘客队列一致时成立，交换后仍建议重放验证'
      };
    }

    function getStableSimulationRecordVehicleIds(text) {
      return [...String(text || '').matchAll(/#(\d+)/g)]
        .map(match => parseVehicleId(match[1]))
        .filter(vehicleId => vehicleId !== null);
    }

    function collectStableSimulationRecordVehicleLabels(labelsById, text) {
      [...String(text || '').matchAll(/#(\d+)[^\s#、，,；;\t|]*/g)].forEach(match => {
        const vehicleId = parseVehicleId(match[1]);
        if (vehicleId !== null && !labelsById.has(vehicleId)) labelsById.set(vehicleId, match[0]);
      });
    }

    function getStableSimulationAnnotatedRecordFilename(filename) {
      const rawName = String(filename || '').trim() || '模拟记录.md';
      const withoutExtension = rawName.replace(/\.md$/i, '');
      return `${withoutExtension.endsWith('-带角色标注') ? withoutExtension : `${withoutExtension}-带角色标注`}.md`;
    }

    function formatStableSimulationRoleSummaryByLabels(roleSummary, labelsById) {
      if (!Array.isArray(roleSummary) || roleSummary.length === 0) return '无';
      return roleSummary
        .map(group => `${group.role}：${group.vehicleIds.map(id => labelsById.get(id) || `#${id}`).join('、')}`)
        .join('；');
    }

    function formatStableSimulationPathSummaryByLabels(pathSummary, labelsById) {
      if (!Array.isArray(pathSummary) || pathSummary.length === 0) return '无';
      return pathSummary
        .map(group => `${group.role}：${group.vehicleIds.map(id => labelsById.get(id) || `#${id}`).join('、')}`)
        .join('；');
    }

    function formatStableSimulationLayerSummaryByLabels(layerSummary, labelsById) {
      if (!Array.isArray(layerSummary) || layerSummary.length === 0) return '无';
      return layerSummary
        .map(group => `${group.layerLabel}：${group.vehicleIds.map(id => labelsById.get(id) || `#${id}`).join('、')}`)
        .join('；');
    }

    function formatStableSimulationKeyPathVehiclesByLabels(vehicles, labelsById) {
      if (!Array.isArray(vehicles) || vehicles.length === 0) return '无';
      return vehicles
        .map(vehicle => `${labelsById.get(vehicle.vehicleId) || `#${vehicle.vehicleId}`}（后方${vehicle.backCount}）`)
        .join('、');
    }

    function formatStableSimulationDeepDependencyVehiclesByLabels(vehicles, labelsById) {
      if (!Array.isArray(vehicles) || vehicles.length === 0) return '无';
      return vehicles
        .map(vehicle => `${labelsById.get(vehicle.vehicleId) || `#${vehicle.vehicleId}`}（深度${vehicle.depth}/前方${vehicle.frontCount}）`)
        .join('、');
    }

    function formatStableSimulationSwappableGroupsByLabels(layoutFreedom, labelsById) {
      const groups = layoutFreedom && Array.isArray(layoutFreedom.swappableGroups) ? layoutFreedom.swappableGroups : [];
      if (groups.length === 0) return '无';
      return groups
        .map(group => `${group.vehicleIds.map(id => labelsById.get(id) || `#${id}`).join(' ↔ ')}（${group.reason}）`)
        .join('；');
    }

    function formatStableSimulationFreeVehiclesByLabels(layoutFreedom, labelsById) {
      const vehicleIds = layoutFreedom && Array.isArray(layoutFreedom.freelyPlaceableVehicleIds)
        ? layoutFreedom.freelyPlaceableVehicleIds
        : [];
      return vehicleIds.length > 0 ? vehicleIds.map(id => labelsById.get(id) || `#${id}`).join('、') : '无';
    }

    function formatStableSimulationRigidVehiclesByLabels(layoutFreedom, labelsById) {
      const vehicles = layoutFreedom && Array.isArray(layoutFreedom.rigidVehicles) ? layoutFreedom.rigidVehicles : [];
      if (vehicles.length === 0) return '无';
      return vehicles
        .map(vehicle => `${labelsById.get(vehicle.vehicleId) || `#${vehicle.vehicleId}`}（${vehicle.reason}）`)
        .join('、');
    }

    function parseStableSimulationMarkdownRecordSteps(lines, headerIndex, headerCells) {
      const errors = [];
      const labelsById = new Map();
      const columnIndex = name => headerCells.indexOf(name);
      const stepIndex = columnIndex('步骤');
      const clickedIndex = columnIndex('点击车辆');
      const enteredIndex = columnIndex('进入车位');
      const departedIndex = columnIndex('开走车辆');

      [
        ['步骤', stepIndex],
        ['点击车辆', clickedIndex],
        ['进入车位', enteredIndex],
        ['开走车辆', departedIndex]
      ].forEach(([name, index]) => {
        if (index === -1) errors.push(`步骤日志缺少「${name}」列`);
      });

      if (errors.length > 0) return { rows: [], steps: [], labelsById, errors };

      const rows = [];
      const steps = [];
      for (let lineIndex = headerIndex + 1; lineIndex < lines.length; lineIndex += 1) {
        const line = lines[lineIndex];
        if (line.startsWith('## ')) break;
        if (line.trim() === '') break;

        const cells = line.split('\t');
        const step = parsePositiveInteger(cells[stepIndex]);
        if (step === null) continue;

        const clickedVehicleIds = getStableSimulationRecordVehicleIds(cells[clickedIndex]);
        const clickedVehicleId = clickedVehicleIds[0];
        if (clickedVehicleId === undefined) {
          errors.push(`第 ${step} 步：点击车辆缺少 #id`);
          continue;
        }

        collectStableSimulationRecordVehicleLabels(labelsById, cells[clickedIndex]);
        collectStableSimulationRecordVehicleLabels(labelsById, cells[departedIndex]);

        const enteredText = cells[enteredIndex] || '';
        const enteredSlotMatch = enteredText.match(/进车位\s*(\d+)/);
        const enteredSlot = enteredText.includes('失败') ? null : (enteredSlotMatch ? Number(enteredSlotMatch[1]) : null);
        const departedVehicleIds = getStableSimulationRecordVehicleIds(cells[departedIndex]);
        const warnings = cells[headerCells.indexOf('警告')] && cells[headerCells.indexOf('警告')] !== '无'
          ? String(cells[headerCells.indexOf('警告')]).split('；').filter(Boolean)
          : [];

        rows.push({ lineIndex, cells, step });
        steps.push({
          step,
          clickedVehicleId,
          enteredSlot,
          consumption: [],
          departedVehicleIds,
          slots: [],
          belt: [],
          reserveQueueRemaining: 0,
          warnings
        });
      }

      return { rows, steps, labelsById, errors };
    }

    function upsertStableSimulationMarkdownRoleSummary(lines, roleSummaryLines) {
      const summaryLines = Array.isArray(roleSummaryLines) ? roleSummaryLines : [roleSummaryLines];
      let summaryIndex = lines.findIndex(line => line.trim() === '## 总览');
      if (summaryIndex === -1) {
        if (lines.length > 0 && lines[lines.length - 1].trim() !== '') lines.push('');
        lines.push('## 总览', ...summaryLines);
        return;
      }

      let summaryEnd = lines.length;
      for (let index = summaryIndex + 1; index < lines.length; index += 1) {
        if (lines[index].startsWith('## ')) {
          summaryEnd = index;
          break;
        }
      }

      for (let index = summaryEnd - 1; index > summaryIndex; index -= 1) {
        if (lines[index].startsWith('功能角色：')
          || lines[index].startsWith('结算角色：')
          || lines[index].startsWith('路径角色：')
          || lines[index].startsWith('分层车辆汇总：')
          || lines[index].startsWith('关键路径车辆：')
          || lines[index].startsWith('深层依赖车辆：')
          || lines[index].startsWith('可互换车辆组：')
          || lines[index].startsWith('自由摆放候选：')
          || lines[index].startsWith('刚性车辆：')) {
          lines.splice(index, 1);
          summaryEnd -= 1;
        }
      }

      const preferredPrefixes = ['车辆对表校验：', '停车场剩余车辆：', '未开走占位车辆：', '开走车辆数：'];
      const insertAfter = preferredPrefixes
        .map(prefix => lines.findIndex((line, index) => index > summaryIndex && index < summaryEnd && line.startsWith(prefix)))
        .find(index => index !== -1);
      const remainingPassengerIndex = lines.findIndex((line, index) => index > summaryIndex && index < summaryEnd && line.startsWith('剩余乘客：'));
      const insertIndex = insertAfter !== undefined
        ? insertAfter + 1
        : (remainingPassengerIndex !== -1 ? remainingPassengerIndex : summaryIndex + 1);
      lines.splice(insertIndex, 0, ...summaryLines);
    }

    function annotateStableSimulationReportMarkdown(filename, markdown, vehicleTableText = '', currentState = null) {
      const sourceText = typeof markdown === 'string' ? markdown : '';
      const lines = sourceText.split(/\r?\n/);
      const headerIndex = lines.findIndex(line => {
        const cells = line.split('\t');
        return cells.includes('步骤') && cells.includes('点击车辆');
      });
      const outputFilename = getStableSimulationAnnotatedRecordFilename(filename);

      if (headerIndex === -1) {
        return {
          filename: outputFilename,
          text: sourceText,
          steps: [],
          roleSummary: [],
          pathSummary: [],
          errors: ['未找到步骤日志表头']
        };
      }

      const headerCells = lines[headerIndex].split('\t');
      const originalHeaderCells = [...headerCells];
      const parsed = parseStableSimulationMarkdownRecordSteps(lines, headerIndex, headerCells);
      const vehicleText = typeof vehicleTableText === 'string' ? vehicleTableText.trim() : '';
      const parsedVehicles = vehicleText
        ? parseScriptVehicleTable(vehicleText)
        : { vehicles: [], errors: [] };
      if (parsed.errors.length > 0 || parsedVehicles.errors.length > 0) {
        return {
          filename: outputFilename,
          text: sourceText,
          steps: [],
          roleSummary: [],
          pathSummary: [],
          errors: [...parsed.errors, ...parsedVehicles.errors]
        };
      }

      const vehiclesById = new Map(parsedVehicles.vehicles.map(vehicle => [vehicle.id, vehicle]));
      const annotated = annotateStableSimulationRoles(parsed.steps);
      const pathAnnotated = annotateStableSimulationPathRoles(annotated.steps, vehiclesById);
      const layoutFreedom = analyzeStableSimulationLayoutFreedom(pathAnnotated.steps, parsedVehicles.vehicles);
      const roleByStep = new Map(pathAnnotated.steps.map(step => [step.step, step.role]));
      const layeredByStep = new Map(pathAnnotated.steps.map(step => [step.step, step.layeredVehicleId]));
      const pathRoleByStep = new Map(pathAnnotated.steps.map(step => [step.step, step.pathRole]));
      const clickedColumnIndex = headerCells.indexOf('点击车辆');
      let layeredColumnIndex = headerCells.indexOf('分层车辆id');
      if (layeredColumnIndex === -1) {
        layeredColumnIndex = clickedColumnIndex + 1;
        headerCells.splice(layeredColumnIndex, 0, '分层车辆id');
      }
      let roleColumnIndex = headerCells.indexOf('结算角色');
      const oldRoleColumnIndex = headerCells.indexOf('功能角色');
      if (roleColumnIndex === -1 && oldRoleColumnIndex !== -1) {
        roleColumnIndex = oldRoleColumnIndex;
        headerCells[roleColumnIndex] = '结算角色';
      }
      if (roleColumnIndex === -1) {
        roleColumnIndex = layeredColumnIndex + 1;
        headerCells.splice(roleColumnIndex, 0, '结算角色');
      }
      let pathRoleColumnIndex = headerCells.indexOf('路径角色');
      if (pathRoleColumnIndex === -1) {
        pathRoleColumnIndex = roleColumnIndex + 1;
        headerCells.splice(pathRoleColumnIndex, 0, '路径角色');
      }
      lines[headerIndex] = headerCells.join('\t');

      parsed.rows.forEach(row => {
        const cellsByHeader = new Map();
        originalHeaderCells.forEach((name, index) => {
          if (name === '功能角色') return;
          cellsByHeader.set(name, row.cells[index] || '');
        });
        cellsByHeader.set('分层车辆id', layeredByStep.get(row.step) || 'L?:#?');
        cellsByHeader.set('结算角色', roleByStep.get(row.step) || '未标注');
        cellsByHeader.set('路径角色', pathRoleByStep.get(row.step) || '未标注');
        lines[row.lineIndex] = headerCells.map(name => cellsByHeader.get(name) || '').join('\t');
      });

      upsertStableSimulationMarkdownRoleSummary(
        lines,
        [
          `结算角色：${formatStableSimulationRoleSummaryByLabels(annotated.roleSummary, parsed.labelsById)}`,
          `路径角色：${formatStableSimulationPathSummaryByLabels(pathAnnotated.pathSummary, parsed.labelsById)}`,
          `分层车辆汇总：${formatStableSimulationLayerSummaryByLabels(pathAnnotated.layerSummary, parsed.labelsById)}`,
          `关键路径车辆：${formatStableSimulationKeyPathVehiclesByLabels(pathAnnotated.keyPathVehicles, parsed.labelsById)}`,
          `深层依赖车辆：${formatStableSimulationDeepDependencyVehiclesByLabels(pathAnnotated.deepDependencyVehicles, parsed.labelsById)}`,
          `可互换车辆组：${formatStableSimulationSwappableGroupsByLabels(layoutFreedom, parsed.labelsById)}`,
          `自由摆放候选：${formatStableSimulationFreeVehiclesByLabels(layoutFreedom, parsed.labelsById)}`,
          `刚性车辆：${formatStableSimulationRigidVehiclesByLabels(layoutFreedom, parsed.labelsById)}`
        ]
      );

      return {
        filename: outputFilename,
        text: lines.join('\n'),
        steps: pathAnnotated.steps,
        roleSummary: annotated.roleSummary,
        pathSummary: pathAnnotated.pathSummary,
        layerSummary: pathAnnotated.layerSummary,
        keyPathVehicles: pathAnnotated.keyPathVehicles,
        deepDependencyVehicles: pathAnnotated.deepDependencyVehicles,
        layoutFreedom,
        errors: []
      };
    }

    function normalizeStableSimulationRecordText(text) {
      return String(text || '').replace(/[０-９]/g, digit => String(digit.charCodeAt(0) - 0xff10));
    }

    function getStableSimulationRecordLevelKey(filename = '', sourceText = '') {
      const candidates = [];
      const normalizedFilename = normalizeStableSimulationRecordText(filename);
      const normalizedSource = normalizeStableSimulationRecordText(sourceText);
      if (normalizedFilename.trim()) candidates.push(normalizedFilename);

      const levelLine = normalizedSource.match(/(?:关卡|level|lv)[^：:\r\n]*[：:]\s*([^\r\n]+)/i);
      if (levelLine) candidates.push(levelLine[1]);

      const heading = normalizedSource.match(/^#\s*([^\r\n]+)/m);
      if (heading) candidates.push(heading[1]);

      for (const candidate of candidates) {
        const explicit = candidate.match(/(?:level|lv|关卡|第)\s*[_\-\s#]*(\d{1,4})/i);
        if (explicit) return String(Number(explicit[1]));
      }

      for (const candidate of candidates) {
        const leading = candidate.match(/^\s*(\d{1,4})(?=\D|$)/);
        if (leading) return String(Number(leading[1]));
      }

      return '';
    }

    function runStableSimulation(state, input) {
      const parsed = parseStableSimulationInput(state, input);
      if (parsed.errors.length > 0) {
        return {
          steps: [],
          summary: [],
          roleSummary: [],
          pathSummary: [],
          layerSummary: [],
          keyPathVehicles: [],
          deepDependencyVehicles: [],
          finalBelt: parsed.belt,
          finalReserveQueue: parsed.reserveQueue,
          finalSlots: [null, null, null, null],
          errors: parsed.errors
        };
      }

      const vehiclesById = new Map(parsed.vehicles.map(vehicle => [vehicle.id, vehicle]));
      const working = {
        belt: [...parsed.belt],
        reserveQueue: [...parsed.reserveQueue],
        slots: [null, null, null, null]
      };
      const steps = [];
      const allDepartedIds = [];
      const clickedVehicleIds = new Set();

      parsed.clickSequence.forEach((vehicleId, index) => {
        const vehicle = vehiclesById.get(vehicleId);
        const warnings = [];
        let enteredSlot = null;
        if (clickedVehicleIds.has(vehicleId)) {
          warnings.push(`车辆 ${vehicleId} 重复点击：已被点击`);
        } else {
          clickedVehicleIds.add(vehicleId);
          const emptySlotIndex = working.slots.findIndex(slot => slot === null);
          if (emptySlotIndex === -1) {
            warnings.push(`车辆 ${vehicleId} 点击失败：没有空车位`);
          } else {
            enteredSlot = emptySlotIndex + 1;
            working.slots[emptySlotIndex] = {
              vehicleId: vehicle.id,
              colorValue: vehicle.colorValue,
              capacity: vehicle.capacity,
              remaining: vehicle.capacity
            };
          }
        }

        const settled = settleStableSimulationStep(working);
        warnings.push(...settled.warnings);
        allDepartedIds.push(...settled.departedVehicleIds);
        steps.push({
          step: index + 1,
          clickedVehicleId: vehicleId,
          enteredSlot,
          consumption: settled.consumption,
          departedVehicleIds: settled.departedVehicleIds,
          slots: working.slots.map(cloneSimulationSlot),
          belt: [...working.belt],
          reserveQueueRemaining: working.reserveQueue.length,
          warnings
        });
      });

      const annotatedResult = annotateStableSimulationRoles(steps);
      const pathAnnotatedResult = annotateStableSimulationPathRoles(annotatedResult.steps, vehiclesById);
      const annotatedSteps = pathAnnotatedResult.steps;
      const roleSummary = annotatedResult.roleSummary;
      const pathSummary = pathAnnotatedResult.pathSummary;
      const layoutFreedom = analyzeStableSimulationLayoutFreedom(annotatedSteps, parsed.vehicles);
      const occupied = working.slots.filter(Boolean);
      const remainingPassengerCounts = new Map();
      [...working.belt, ...working.reserveQueue].forEach(value => {
        remainingPassengerCounts.set(value, (remainingPassengerCounts.get(value) || 0) + 1);
      });
      const remainingParkingVehicles = parsed.vehicles
        .filter(vehicle => !clickedVehicleIds.has(vehicle.id))
        .sort((a, b) => a.id - b.id);
      const summary = [
        `总点击数：${parsed.clickSequence.length}`,
        `成功进车数：${steps.filter(step => step.enteredSlot !== null).length}`,
        `开走车辆数：${allDepartedIds.length}`,
        `未开走占位车辆：${occupied.map(slot => formatStableSimulationVehicle(state, vehiclesById, slot.vehicleId)).join('、') || '无'}`,
        `停车场剩余车辆：${remainingParkingVehicles.map(vehicle => formatStableSimulationVehicle(state, vehiclesById, vehicle.id)).join('、') || '无'}`,
        `车辆对表校验：${remainingParkingVehicles.length === 0 ? '点击车辆与车辆表全部对上' : `仍有 ${remainingParkingVehicles.length} 辆表内车辆未点击`}`,
        `结算角色：${formatStableSimulationRoleSummary(state, vehiclesById, roleSummary)}`,
        `路径角色：${formatStableSimulationPathSummary(state, vehiclesById, pathSummary)}`,
        `分层车辆汇总：${formatStableSimulationLayerSummary(state, vehiclesById, pathAnnotatedResult.layerSummary)}`,
        `关键路径车辆：${formatStableSimulationKeyPathVehicles(state, vehiclesById, pathAnnotatedResult.keyPathVehicles)}`,
        `深层依赖车辆：${formatStableSimulationDeepDependencyVehicles(state, vehiclesById, pathAnnotatedResult.deepDependencyVehicles)}`,
        `可互换车辆组：${formatStableSimulationSwappableGroups(state, vehiclesById, layoutFreedom)}`,
        `自由摆放候选：${formatStableSimulationFreeVehicles(state, vehiclesById, layoutFreedom)}`,
        `刚性车辆：${formatStableSimulationRigidVehicles(state, vehiclesById, layoutFreedom)}`,
        `剩余乘客：${formatConsumption(state, remainingPassengerCounts)}`,
        `警告步骤：${annotatedSteps.filter(step => step.warnings.length > 0).map(step => step.step).join(',') || '无'}`
      ];

      return {
        steps: annotatedSteps,
        summary,
        roleSummary,
        pathSummary,
        layerSummary: pathAnnotatedResult.layerSummary,
        keyPathVehicles: pathAnnotatedResult.keyPathVehicles,
        deepDependencyVehicles: pathAnnotatedResult.deepDependencyVehicles,
        layoutFreedom,
        finalBelt: [...working.belt],
        finalReserveQueue: [...working.reserveQueue],
        finalSlots: working.slots.map(cloneSimulationSlot),
        errors: []
      };
    }

    function setStableSimulationInput(state, input) {
      if (!isValidState(state) || !input || typeof input !== 'object') return state;
      const nextFields = {
        levelName: typeof input.levelName === 'string' ? input.levelName.trim() : state.simulation.levelName,
        conveyorCapacity: typeof input.conveyorCapacity === 'string' ? input.conveyorCapacity.trim() : state.simulation.conveyorCapacity,
        beltQueueText: typeof input.beltQueueText === 'string' ? input.beltQueueText.trim() : state.simulation.beltQueueText,
        leftQueueText: typeof input.leftQueueText === 'string' ? input.leftQueueText.trim() : state.simulation.leftQueueText,
        rightQueueText: typeof input.rightQueueText === 'string' ? input.rightQueueText.trim() : state.simulation.rightQueueText,
        vehicleTableText: typeof input.vehicleTableText === 'string' ? input.vehicleTableText.trim() : state.simulation.vehicleTableText,
        clickSequenceText: typeof input.clickSequenceText === 'string' ? input.clickSequenceText.trim() : state.simulation.clickSequenceText
      };
      nextFields.passengerQueueText = typeof input.passengerQueueText === 'string'
        ? input.passengerQueueText.trim()
        : getStableSimulationMergedPassengerQueueText(nextFields);
      const inputChanged = nextFields.levelName !== state.simulation.levelName
        || nextFields.conveyorCapacity !== state.simulation.conveyorCapacity
        || nextFields.beltQueueText !== state.simulation.beltQueueText
        || nextFields.leftQueueText !== state.simulation.leftQueueText
        || nextFields.rightQueueText !== state.simulation.rightQueueText
        || nextFields.passengerQueueText !== state.simulation.passengerQueueText
        || nextFields.vehicleTableText !== state.simulation.vehicleTableText
        || nextFields.clickSequenceText !== state.simulation.clickSequenceText;
      return {
        ...state,
        simulation: {
          ...state.simulation,
          ...nextFields,
          result: inputChanged ? null : state.simulation.result,
          errors: inputChanged ? [] : state.simulation.errors
        }
      };
    }

    function clampPercent(value) {
      return Number.isFinite(value) ? Math.min(100, Math.max(0, value)) : null;
    }

    function setStableSimulationScreenshot(state, dataUrl) {
      if (!isValidState(state) || typeof dataUrl !== 'string') return state;
      return {
        ...state,
        simulation: {
          ...state.simulation,
          screenshotDataUrl: dataUrl
        }
      };
    }

    function addStableSimulationHotspot(state, input) {
      if (!isValidState(state) || !input || typeof input !== 'object') return state;
      const vehicleId = parseVehicleId(input.vehicleId);
      const xPercent = clampPercent(Number(input.xPercent));
      const yPercent = clampPercent(Number(input.yPercent));
      if (vehicleId === null || xPercent === null || yPercent === null) return state;

      const hotspot = {
        id: state.simulation.nextHotspotId,
        vehicleId,
        xPercent,
        yPercent,
        isClicked: false
      };
      return {
        ...state,
        simulation: {
          ...state.simulation,
          hotspots: [...state.simulation.hotspots, hotspot],
          nextHotspotId: state.simulation.nextHotspotId + 1
        }
      };
    }

    function deleteStableSimulationHotspot(state, hotspotId) {
      if (!isValidState(state) || !Number.isSafeInteger(hotspotId)) return state;
      return {
        ...state,
        simulation: {
          ...state.simulation,
          hotspots: state.simulation.hotspots.filter(hotspot => hotspot.id !== hotspotId)
        }
      };
    }

    function runStableSimulationState(state) {
      if (!isValidState(state)) return state;
      const result = runStableSimulation(state, state.simulation);
      return {
        ...state,
        simulation: {
          ...state.simulation,
          result: result.errors.length > 0 ? null : result,
          errors: result.errors
        }
      };
    }

    function clearStableSimulation(state) {
      if (!isValidState(state)) return state;
      return { ...state, simulation: createEmptySimulation() };
    }

    function splitQueueTextValues(text) {
      return typeof text === 'string' && text.trim() !== ''
        ? text.split(/[,\uFF0C|\s]+/).map(token => token.trim()).filter(Boolean)
        : [];
    }

    function joinQueueTextValues(values) {
      return values.join(',');
    }

    function cleanQueueLabelText(text) {
      return text
        .replace(/^[>\-\s]+/, '')
        .replace(/\*\*/g, '')
        .replace(/`/g, '')
        .trim();
    }

    function readQueueLineValue(line, labels) {
      const trimmed = line.trim();
      if (!trimmed) return null;

      if (trimmed.startsWith('|')) {
        const cells = trimmed
          .split('|')
          .map(cell => cleanQueueLabelText(cell))
          .filter(Boolean);
        for (let index = 0; index < cells.length - 1; index += 1) {
          if (labels.includes(cells[index])) return cells[index + 1];
        }
      }

      const normalized = cleanQueueLabelText(trimmed);
      for (const label of labels) {
        if (!normalized.startsWith(label)) continue;
        const rest = normalized.slice(label.length).trimStart();
        if (rest.startsWith('：') || rest.startsWith(':') || rest.startsWith('=')) {
          return rest.slice(1).trim();
        }
      }

      return null;
    }

    function getQueueFitTargetQueueParts(targetRecordText) {
      if (typeof targetRecordText !== 'string' || targetRecordText.trim() === '') {
        return { beltValues: [], leftLength: null, rightLength: null };
      }
      const readQueueValues = labels => {
        for (const line of targetRecordText.split(/\r?\n/)) {
          const valueText = readQueueLineValue(line, labels);
          if (valueText !== null) {
            const values = splitQueueTextValues(valueText);
            if (values.length > 0 || valueText === '' || valueText === '空') return values.map(value => Number(value)).filter(Number.isFinite);
          }
        }
        return [];
      };
      const leftValues = readQueueValues(['左侧队列', '竞品左侧队列', '左侧']);
      const rightValues = readQueueValues(['右侧队列', '竞品右侧队列', '右侧']);
      return {
        beltValues: readQueueValues(['传送带', '竞品传送带']),
        leftLength: leftValues.length > 0 ? leftValues.length : null,
        rightLength: rightValues.length > 0 ? rightValues.length : null
      };
    }

    function getQueueFitTargetSideLengths(targetRecordText) {
      const parts = getQueueFitTargetQueueParts(targetRecordText);
      return { leftLength: parts.leftLength, rightLength: parts.rightLength };
    }

    function getStableSimulationMergedPassengerQueueText(simulation) {
      return joinQueueTextValues([
        ...splitQueueTextValues(simulation.beltQueueText),
        ...splitQueueTextValues(simulation.leftQueueText),
        ...splitQueueTextValues(simulation.rightQueueText)
      ]);
    }

    function getStableSimulationReportQueueParts(simulation) {
      if (simulation.beltQueueText || simulation.leftQueueText || simulation.rightQueueText) {
        return {
          beltQueueText: simulation.beltQueueText,
          leftQueueText: simulation.leftQueueText,
          rightQueueText: simulation.rightQueueText
        };
      }
      const values = splitQueueTextValues(simulation.passengerQueueText);
      const beltLength = parsePositiveInteger(simulation.conveyorCapacity) || 0;
      return {
        beltQueueText: joinQueueTextValues(values.slice(0, beltLength)),
        leftQueueText: '',
        rightQueueText: joinQueueTextValues(values.slice(beltLength))
      };
    }

    function splitQueueFitResult(queueFit, passengerQueueText) {
      const values = splitQueueTextValues(passengerQueueText);
      const beltLength = parsePositiveInteger(queueFit.conveyorCapacity) || 0;
      const reserveValues = values.slice(beltLength);
      const targetLengths = getQueueFitTargetSideLengths(queueFit.targetRecordText);
      const targetSideTotal = (targetLengths.leftLength || 0) + (targetLengths.rightLength || 0);
      const leftLength = targetSideTotal > 0
        ? Math.min(Math.round(reserveValues.length * (targetLengths.leftLength || 0) / targetSideTotal), reserveValues.length)
        : Math.ceil(reserveValues.length / 2);
      return {
        fittedBeltQueueText: joinQueueTextValues(values.slice(0, beltLength)),
        fittedLeftQueueText: joinQueueTextValues(reserveValues.slice(0, leftLength)),
        fittedRightQueueText: joinQueueTextValues(reserveValues.slice(leftLength))
      };
    }

    function setQueueFitInput(state, input) {
      if (!isValidState(state) || !input || typeof input !== 'object') return state;
      const nextFields = {
        levelName: typeof input.levelName === 'string' ? input.levelName.trim() : state.queueFit.levelName,
        conveyorCapacity: typeof input.conveyorCapacity === 'string' ? input.conveyorCapacity.trim() : state.queueFit.conveyorCapacity,
        passengerQueueText: typeof input.passengerQueueText === 'string' ? input.passengerQueueText.trim() : state.queueFit.passengerQueueText,
        vehicleTableText: typeof input.vehicleTableText === 'string' ? input.vehicleTableText.trim() : state.queueFit.vehicleTableText,
        targetVehicleTableText: typeof input.targetVehicleTableText === 'string' ? input.targetVehicleTableText.trim() : state.queueFit.targetVehicleTableText,
        targetRecordFilename: typeof input.targetRecordFilename === 'string' ? input.targetRecordFilename.trim() : state.queueFit.targetRecordFilename,
        targetRecordText: typeof input.targetRecordText === 'string' ? input.targetRecordText.trim() : state.queueFit.targetRecordText
      };
      const inputChanged = nextFields.levelName !== state.queueFit.levelName
        || nextFields.conveyorCapacity !== state.queueFit.conveyorCapacity
        || nextFields.passengerQueueText !== state.queueFit.passengerQueueText
        || nextFields.vehicleTableText !== state.queueFit.vehicleTableText
        || nextFields.targetVehicleTableText !== state.queueFit.targetVehicleTableText
        || nextFields.targetRecordFilename !== state.queueFit.targetRecordFilename
        || nextFields.targetRecordText !== state.queueFit.targetRecordText;
      return {
        ...state,
        queueFit: {
          ...state.queueFit,
          ...nextFields,
          fittedBeltQueueText: inputChanged ? '' : state.queueFit.fittedBeltQueueText,
          fittedLeftQueueText: inputChanged ? '' : state.queueFit.fittedLeftQueueText,
          fittedRightQueueText: inputChanged ? '' : state.queueFit.fittedRightQueueText,
          fittedPassengerQueueText: inputChanged ? '' : state.queueFit.fittedPassengerQueueText,
          fittedClickSequenceText: inputChanged ? '' : state.queueFit.fittedClickSequenceText,
          score: inputChanged ? 0 : state.queueFit.score,
          roleSummary: inputChanged ? [] : state.queueFit.roleSummary,
          errors: inputChanged ? [] : state.queueFit.errors
        }
      };
    }

    function runQueueFitState(state) {
      if (!isValidState(state)) return state;
      const fitted = fitStableSimulationPassengerQueue(state, state.queueFit);
      const splitResult = fitted.errors.length > 0
        ? { fittedBeltQueueText: '', fittedLeftQueueText: '', fittedRightQueueText: '' }
        : splitQueueFitResult(state.queueFit, fitted.passengerQueueText);
      return {
        ...state,
        queueFit: {
          ...state.queueFit,
          ...splitResult,
          fittedPassengerQueueText: fitted.errors.length > 0 ? '' : fitted.passengerQueueText,
          fittedClickSequenceText: fitted.errors.length > 0 ? '' : fitted.clickSequenceText,
          score: fitted.errors.length > 0 ? 0 : fitted.score,
          roleSummary: fitted.errors.length > 0 ? [] : fitted.roleSummary,
          errors: fitted.errors
        }
      };
    }

    function clearQueueFit(state) {
      if (!isValidState(state)) return state;
      return { ...state, queueFit: createEmptyQueueFit() };
    }

    function setPathSolveInput(state, input) {
      if (!isValidState(state) || !input || typeof input !== 'object') return state;
      const nextFields = {
        levelName: typeof input.levelName === 'string' ? input.levelName.trim() : state.pathSolve.levelName,
        conveyorCapacity: typeof input.conveyorCapacity === 'string' ? input.conveyorCapacity.trim() : state.pathSolve.conveyorCapacity,
        beltQueueText: typeof input.beltQueueText === 'string' ? input.beltQueueText.trim() : state.pathSolve.beltQueueText,
        leftQueueText: typeof input.leftQueueText === 'string' ? input.leftQueueText.trim() : state.pathSolve.leftQueueText,
        rightQueueText: typeof input.rightQueueText === 'string' ? input.rightQueueText.trim() : state.pathSolve.rightQueueText,
        vehicleTableText: typeof input.vehicleTableText === 'string' ? input.vehicleTableText.trim() : state.pathSolve.vehicleTableText,
        clickSequenceText: typeof input.clickSequenceText === 'string' ? input.clickSequenceText.trim() : state.pathSolve.clickSequenceText,
        beamWidth: typeof input.beamWidth === 'string' ? input.beamWidth.trim() : state.pathSolve.beamWidth,
        branchLimit: typeof input.branchLimit === 'string' ? input.branchLimit.trim() : state.pathSolve.branchLimit
      };
      const inputChanged = nextFields.levelName !== state.pathSolve.levelName
        || nextFields.conveyorCapacity !== state.pathSolve.conveyorCapacity
        || nextFields.beltQueueText !== state.pathSolve.beltQueueText
        || nextFields.leftQueueText !== state.pathSolve.leftQueueText
        || nextFields.rightQueueText !== state.pathSolve.rightQueueText
        || nextFields.vehicleTableText !== state.pathSolve.vehicleTableText
        || nextFields.clickSequenceText !== state.pathSolve.clickSequenceText
        || nextFields.beamWidth !== state.pathSolve.beamWidth
        || nextFields.branchLimit !== state.pathSolve.branchLimit;
      return {
        ...state,
        pathSolve: {
          ...state.pathSolve,
          ...nextFields,
          result: inputChanged ? null : state.pathSolve.result,
          errors: inputChanged ? [] : state.pathSolve.errors
        }
      };
    }

    function getPathSolveSearchInput(pathSolve) {
      return {
        conveyorCapacity: pathSolve.conveyorCapacity,
        beltQueueText: pathSolve.beltQueueText,
        leftQueueText: pathSolve.leftQueueText,
        rightQueueText: pathSolve.rightQueueText,
        vehicleTableText: pathSolve.vehicleTableText,
        clickSequenceText: pathSolve.clickSequenceText,
        beamWidth: pathSolve.beamWidth,
        branchLimit: pathSolve.branchLimit
      };
    }

    function runPathSolveState(state) {
      if (!isValidState(state)) return state;
      const input = getPathSolveSearchInput(state.pathSolve);
      const result = state.pathSolve.clickSequenceText
        ? validateVehiclePath(state, input)
        : solveVehiclePath(state, input);
      return {
        ...state,
        pathSolve: {
          ...state.pathSolve,
          result,
          errors: result.errors
        }
      };
    }

    function clearPathSolve(state) {
      if (!isValidState(state)) return state;
      return { ...state, pathSolve: createEmptyPathSolve() };
    }

    function formatPathSolveNeededColor(state, colorValue) {
      return `${getScriptColorName(state, colorValue)}(${colorValue})`;
    }

    function getPathSolveFailureDiagnosis(state, vehiclesById, result) {
      if (!result || result.status === 'solved' || result.status === 'valid') return [];
      const finalSlots = Array.isArray(result.finalSlots) ? result.finalSlots : [];
      const finalBelt = Array.isArray(result.finalBelt) ? result.finalBelt : [];
      const finalLeftQueue = Array.isArray(result.finalLeftQueue) ? result.finalLeftQueue : [];
      const finalRightQueue = Array.isArray(result.finalRightQueue) ? result.finalRightQueue : [];
      const occupiedSlots = finalSlots.filter(Boolean);
      const neededColors = new Set(occupiedSlots.map(slot => slot.colorValue));
      const diagnosis = [];
      const hasMatchingBeltPassenger = finalBelt.some(value => neededColors.has(value));

      if (finalSlots.length > 0 && occupiedSlots.length === finalSlots.length && occupiedSlots.length >= 4 && !hasMatchingBeltPassenger) {
        diagnosis.push('失败诊断：车位已满，当前传送带没有可给占位车辆上客的乘客');
      }

      if (occupiedSlots.length > 0) {
        diagnosis.push(`占位需求：${occupiedSlots
          .map(slot => `${formatStableSimulationVehicle(state, vehiclesById, slot.vehicleId)} 还需 ${formatPathSolveNeededColor(state, slot.colorValue)}x${slot.remaining}`)
          .join('、')}`);
      }

      if (finalBelt.length > 0 && neededColors.size > 0) {
        const firstConsumableIndex = finalBelt.findIndex(value => neededColors.has(value));
        if (firstConsumableIndex === -1) {
          diagnosis.push(`传送带阻塞：当前 ${finalBelt.length} 个乘客均无法上客`);
        } else if (firstConsumableIndex > 0) {
          diagnosis.push(`传送带阻塞：前 ${firstConsumableIndex} 个乘客无法给占位车辆上客，首个可上客乘客在第 ${firstConsumableIndex + 1} 位`);
        }
      }

      if (finalLeftQueue.length === 0 && finalRightQueue.length > 0 && finalBelt.length > 0 && !hasMatchingBeltPassenger) {
        diagnosis.push(`补充阻塞：左侧队列已空，右侧队列仍有 ${finalRightQueue.length} 人，但传送带无法消耗时无法继续补入`);
      }

      return diagnosis;
    }

    function getPathSolveReportText(pathSolve) {
      const result = pathSolve && pathSolve.result;
      if (!result) return '尚未运行关卡求解。';
      const reportState = {
        colors: DEFAULT_COLORS.map(color => ({ ...color }))
      };
      const title = pathSolve && typeof pathSolve.levelName === 'string' && pathSolve.levelName.trim()
        ? pathSolve.levelName.trim()
        : '未命名关卡';
      const parsedVehicles = parseScriptVehicleTable(pathSolve && pathSolve.vehicleTableText ? pathSolve.vehicleTableText : '');
      const vehiclesById = new Map(parsedVehicles.vehicles.map(vehicle => [vehicle.id, vehicle]));
      const roleAnnotated = annotateStableSimulationRoles(Array.isArray(result.proof) ? result.proof : []);
      const pathAnnotated = annotateStableSimulationPathRoles(roleAnnotated.steps, vehiclesById);
      const search = result.search || {};
      const errors = Array.isArray(result.errors) ? result.errors : [];
      const truncatedText = search.truncated
        ? (result.status === 'solved' || result.status === 'valid'
          ? '是（已找到可用解，不代表失败）'
          : '是（未找到完整解，可能需要提高 Beam/Branch 或调整队列）')
        : '否';
      const path = Array.isArray(result.path) ? result.path : [];
      const finalSlots = Array.isArray(result.finalSlots) ? result.finalSlots : [];
      const finalBelt = Array.isArray(result.finalBelt) ? result.finalBelt : [];
      const finalLeftQueue = Array.isArray(result.finalLeftQueue) ? result.finalLeftQueue : [];
      const finalRightQueue = Array.isArray(result.finalRightQueue) ? result.finalRightQueue : [];
      const lastProofStep = pathAnnotated.steps.length > 0 ? pathAnnotated.steps[pathAnnotated.steps.length - 1] : null;
      const remainingVehicleIds = lastProofStep
        ? lastProofStep.remainingVehicleIds
        : parsedVehicles.vehicles.map(vehicle => vehicle.id).filter(id => !path.includes(id));
      const departedVehicleIds = new Set();
      pathAnnotated.steps.forEach(step => step.departedVehicleIds.forEach(id => departedVehicleIds.add(id)));
      const warningSteps = pathAnnotated.steps
        .filter(step => Array.isArray(step.warnings) && step.warnings.length > 0)
        .map(step => step.step);
      const failureDiagnosis = getPathSolveFailureDiagnosis(reportState, vehiclesById, result);
      const lines = [
        `# ${title} 关卡求解证明`,
        '',
        '## 输入',
        `传送带容量：${pathSolve && pathSolve.conveyorCapacity ? pathSolve.conveyorCapacity : '未填写'}`,
        `传送带：${pathSolve && pathSolve.beltQueueText ? pathSolve.beltQueueText : '未填写'}`,
        `左侧队列：${pathSolve && pathSolve.leftQueueText ? pathSolve.leftQueueText : '未填写'}`,
        `右侧队列：${pathSolve && pathSolve.rightQueueText ? pathSolve.rightQueueText : '未填写'}`,
        `搜索参数：Beam ${pathSolve && pathSolve.beamWidth ? pathSolve.beamWidth : (search.beamWidth || '-')}；Branch ${pathSolve && pathSolve.branchLimit ? pathSolve.branchLimit : (search.branchLimit || '-')}`,
        '',
        '## 步骤日志',
        '步骤\t可点击车辆\t点击车辆\t分层车辆id\t结算角色\t路径角色\t进入车位\t上客统计\t开走车辆\t已解除阻挡\t解锁后方车辆\t车位状态\t传送带\t左侧队列\t右侧队列\t剩余车辆\t警告'
      ];

      if (pathAnnotated.steps.length > 0) {
        pathAnnotated.steps.forEach(step => {
          const stepWarnings = Array.isArray(step.warnings) ? step.warnings : [];
          lines.push([
            step.step,
            step.clickableVehicleIds.map(id => formatStableSimulationVehicle(reportState, vehiclesById, id)).join('、') || '无',
            formatStableSimulationVehicle(reportState, vehiclesById, step.clickedVehicleId),
            step.layeredVehicleId || `L?:#${step.clickedVehicleId}`,
            step.role || '未标注',
            step.pathRole || '未标注',
            step.enteredSlot === null || step.enteredSlot === undefined ? '进车失败' : `进车位 ${step.enteredSlot}`,
            formatStableSimulationConsumption(reportState, vehiclesById, step.consumption || []),
            step.departedVehicleIds.length > 0
              ? `开走 ${step.departedVehicleIds.map(id => formatStableSimulationVehicle(reportState, vehiclesById, id)).join('、')}`
              : '无',
            step.clearedFrontVehicleIds && step.clearedFrontVehicleIds.length > 0
              ? step.clearedFrontVehicleIds.map(id => formatStableSimulationVehicle(reportState, vehiclesById, id)).join('、')
              : '无',
            step.unlockedVehicleIds && step.unlockedVehicleIds.length > 0
              ? step.unlockedVehicleIds.map(id => formatStableSimulationVehicle(reportState, vehiclesById, id)).join('、')
              : '无',
            step.slots.map((slot, index) => formatStableSimulationSlot(reportState, vehiclesById, slot, index)).join(' | '),
            step.belt.join(',') || '空',
            step.leftQueue.join(',') || '空',
            step.rightQueue.join(',') || '空',
            step.remainingVehicleIds.length,
            stepWarnings.join('；') || '无'
          ].join('\t'));
        });
        if (errors.length > 0) lines.push(`错误\t${errors.join('；')}`);
      } else if (errors.length > 0) {
        lines.push(`错误\t${errors.join('；')}`);
      } else {
        lines.push('无\t已运行，0 步');
      }

      lines.push(
        '',
        '## 总览',
        `状态：${result.status}`,
        ...(errors.length > 0 ? [`失败原因：${errors.join('；')}`] : []),
        ...failureDiagnosis,
        `点击顺序：${path.length ? path.join(',') : '无'}`,
        `总点击数：${path.length}`,
        `成功进车数：${pathAnnotated.steps.filter(step => step.enteredSlot !== null && step.enteredSlot !== undefined).length}`,
        `开走车辆数：${departedVehicleIds.size}`,
        `停车场剩余车辆：${remainingVehicleIds.length ? remainingVehicleIds.map(id => formatStableSimulationVehicle(reportState, vehiclesById, id)).join('、') : '无'}`,
        `未开走占位车辆：${finalSlots.filter(Boolean).length ? finalSlots.filter(Boolean).map(slot => `${formatStableSimulationVehicle(reportState, vehiclesById, slot.vehicleId)} 剩${slot.remaining}`).join('、') : '无'}`,
        `最终传送带：${finalBelt.length ? finalBelt.join(',') : '空'}`,
        `最终左侧队列：${finalLeftQueue.length ? finalLeftQueue.join(',') : '空'}`,
        `最终右侧队列：${finalRightQueue.length ? finalRightQueue.join(',') : '空'}`,
        `最终车位：${finalSlots.some(Boolean) ? finalSlots.map((slot, index) => formatStableSimulationSlot(reportState, vehiclesById, slot, index)).join(' | ') : '空'}`,
        `结算角色：${formatStableSimulationRoleSummary(reportState, vehiclesById, roleAnnotated.roleSummary)}`,
        `路径角色：${formatStableSimulationPathSummary(reportState, vehiclesById, pathAnnotated.pathSummary)}`,
        `分层车辆汇总：${formatStableSimulationLayerSummary(reportState, vehiclesById, pathAnnotated.layerSummary)}`,
        `关键路径车辆：${formatStableSimulationKeyPathVehicles(reportState, vehiclesById, pathAnnotated.keyPathVehicles)}`,
        `深层依赖车辆：${formatStableSimulationDeepDependencyVehicles(reportState, vehiclesById, pathAnnotated.deepDependencyVehicles)}`,
        `警告步骤：${warningSteps.length ? warningSteps.join(',') : '无'}`,
        `搜索统计：展开 ${search.expandedStates || 0} 状态；Beam ${search.beamWidth || '-'}；Branch ${search.branchLimit || '-'}`,
        `候选截断：${truncatedText}`
      );
      return lines.join('\n');
    }

    function getPathSolveClickSequenceText(pathSolve) {
      const result = pathSolve && pathSolve.result;
      return result && Array.isArray(result.path) && result.path.length > 0
        ? result.path.join(',')
        : '';
    }

    function getStableSimulationClickTokens(text) {
      return typeof text === 'string' && text.trim() !== ''
        ? text.split(',').map(token => token.trim()).filter(Boolean)
        : [];
    }

    function setStableSimulationClickTokens(state, tokens, runAfterChange = true) {
      const nextState = setStableSimulationInput(state, {
        clickSequenceText: tokens.join(',')
      });
      return runAfterChange && tokens.length > 0
        ? runStableSimulationState(nextState)
        : nextState;
    }

    function appendStableSimulationClick(state, vehicleId) {
      if (!isValidState(state) || parseVehicleId(vehicleId) === null) return state;
      const tokens = getStableSimulationClickTokens(state.simulation.clickSequenceText);
      tokens.push(String(vehicleId));
      return runStableSimulationState(setStableSimulationInput(state, {
        clickSequenceText: tokens.join(',')
      }));
    }

    function appendStableSimulationHotspotClick(state, hotspotId) {
      if (!isValidState(state) || !Number.isSafeInteger(hotspotId)) return state;
      const hotspot = state.simulation.hotspots.find(item => item.id === hotspotId);
      if (!hotspot || hotspot.isClicked) return state;
      const parsedVehicles = parseScriptVehicleTable(state.simulation.vehicleTableText);
      const vehicleExists = parsedVehicles.vehicles.some(vehicle => vehicle.id === hotspot.vehicleId);
      if (!vehicleExists) {
        return {
          ...state,
          simulation: {
            ...state.simulation,
            errors: [`截图标记 #${hotspot.vehicleId} 不存在于车辆表，未写入点击顺序`]
          }
        };
      }
      const nextState = appendStableSimulationClick(state, hotspot.vehicleId);
      return {
        ...nextState,
        simulation: {
          ...nextState.simulation,
          hotspots: nextState.simulation.hotspots.map(item => item.id === hotspotId
            ? { ...item, isClicked: true }
            : item)
        }
      };
    }

    function undoStableSimulationClick(state) {
      if (!isValidState(state)) return state;
      const tokens = getStableSimulationClickTokens(state.simulation.clickSequenceText);
      if (tokens.length === 0) return state;
      const removedVehicleId = parseVehicleId(tokens.pop());
      const nextState = setStableSimulationClickTokens(state, tokens, true);
      if (removedVehicleId === null) return nextState;
      let restored = false;
      return {
        ...nextState,
        simulation: {
          ...nextState.simulation,
          hotspots: [...nextState.simulation.hotspots].reverse().map(item => {
            if (!restored && item.isClicked && item.vehicleId === removedVehicleId) {
              restored = true;
              return { ...item, isClicked: false };
            }
            return item;
          }).reverse()
        }
      };
    }

    function deleteStableSimulationClickAt(state, index) {
      if (!isValidState(state) || !Number.isInteger(index) || index < 0) return state;
      const tokens = getStableSimulationClickTokens(state.simulation.clickSequenceText);
      if (index >= tokens.length) return state;
      const removedVehicleId = parseVehicleId(tokens[index]);
      tokens.splice(index, 1);
      const nextState = setStableSimulationClickTokens(state, tokens, true);
      if (removedVehicleId === null) return nextState;
      let restored = false;
      return {
        ...nextState,
        simulation: {
          ...nextState.simulation,
          hotspots: nextState.simulation.hotspots.map(item => {
            if (!restored && item.isClicked && item.vehicleId === removedVehicleId) {
              restored = true;
              return { ...item, isClicked: false };
            }
            return item;
          })
        }
      };
    }

    function clearStableSimulationClicks(state) {
      if (!isValidState(state)) return state;
      return {
        ...state,
        simulation: {
          ...state.simulation,
          clickSequenceText: '',
          result: null,
          errors: [],
          hotspots: state.simulation.hotspots.map(hotspot => ({ ...hotspot, isClicked: false }))
        }
      };
    }

    function getStableSimulationVehicleOptions(currentState) {
      const parsed = parseScriptVehicleTable(currentState.simulation.vehicleTableText);
      const vehicles = parsed.vehicles
        .filter(vehicle => isScriptColorValue(currentState, vehicle.colorValue))
        .sort((a, b) => a.id - b.id);
      const errors = [
        ...parsed.errors,
        ...parsed.vehicles
          .filter(vehicle => !isScriptColorValue(currentState, vehicle.colorValue))
          .map(vehicle => `车辆 ${vehicle.id} 的颜色映射 ${vehicle.colorValue} 不存在`)
      ];
      return { vehicles, errors };
    }

    function formatStableSimulationSlot(state, vehiclesById, slot, index) {
      if (!slot) return `${index + 1}:空`;
      return `${index + 1}:${formatStableSimulationVehicle(state, vehiclesById, slot.vehicleId)} 剩${slot.remaining}`;
    }

    function formatStableSimulationConsumption(state, vehiclesById, consumption) {
      return consumption.length
        ? consumption.map(item => `上客 ${item.count}（${formatStableSimulationVehicle(state, vehiclesById, item.vehicleId)}）`).join('、')
        : '无';
    }

    function formatStableSimulationRoleSummary(state, vehiclesById, roleSummary) {
      if (!Array.isArray(roleSummary) || roleSummary.length === 0) return '无';
      return roleSummary
