<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>乘客队列记录工具</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #172126;
      --muted: #65757d;
      --paper: #f3f1e9;
      --panel: #fffdf7;
      --line: #c9cec8;
      --rail: #1e2b30;
      --rail-soft: #2d3c41;
      --signal: #f2bd43;
      --signal-dark: #785610;
      --ok: #39775d;
      --danger: #b4483f;
      --shadow: 0 14px 30px rgba(31, 43, 48, 0.14);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background-color: var(--paper);
      background-image:
        linear-gradient(rgba(44, 61, 66, 0.055) 1px, transparent 1px),
        linear-gradient(90deg, rgba(44, 61, 66, 0.055) 1px, transparent 1px);
      background-size: 22px 22px;
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    button:focus-visible,
    input:focus-visible,
    textarea:focus-visible,
    select:focus-visible {
      outline: 3px solid var(--signal);
      outline-offset: 3px;
    }

    .app-shell {
      display: grid;
      grid-template-columns: 252px minmax(0, 1fr);
      min-height: 100vh;
    }

    .sidebar {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      padding: 24px 18px 18px;
      color: #f4f1e7;
      background: var(--rail);
      border-right: 4px solid var(--signal);
    }

    .brand-kicker,
    .eyebrow,
    .stage-code,
    .panel-label {
      margin: 0;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .brand-kicker {
      color: var(--signal);
    }

    .brand-title {
      margin: 8px 0 0;
      font-size: 23px;
      line-height: 1.18;
      letter-spacing: 0.04em;
    }

    .brand-subtitle {
      margin: 12px 0 0;
      color: #bec9c6;
      font-size: 13px;
      line-height: 1.7;
    }

    #stageNav {
      display: grid;
      gap: 8px;
      margin-top: 34px;
    }

    .stage-button {
      display: grid;
      grid-template-columns: 34px 1fr;
      gap: 10px;
      align-items: center;
      min-height: 58px;
      padding: 10px;
      color: #d9e0de;
      text-align: left;
      background: transparent;
      border: 1px solid rgba(222, 231, 228, 0.18);
      border-radius: 4px;
      transition: background 160ms ease, border-color 160ms ease, transform 160ms ease;
    }

    .stage-button:hover {
      background: rgba(255, 255, 255, 0.06);
      border-color: rgba(242, 189, 67, 0.54);
      transform: translateX(2px);
    }

    .stage-button.is-active {
      color: #172126;
      background: var(--signal);
      border-color: var(--signal);
    }

    .stage-index {
      display: grid;
      width: 30px;
      height: 30px;
      place-items: center;
      font-size: 12px;
      font-weight: 900;
      border: 1px solid currentColor;
      border-radius: 50%;
    }

    .stage-name {
      display: block;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 0.05em;
    }

    .stage-code {
      display: block;
      margin-top: 3px;
      color: inherit;
      opacity: 0.62;
      font-size: 9px;
    }

    .save-panel {
      margin-top: auto;
      padding-top: 18px;
      border-top: 1px solid rgba(222, 231, 228, 0.2);
    }

    #saveState {
      display: flex;
      gap: 8px;
      align-items: center;
      margin: 0;
      color: #d1dcda;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    #saveState::before {
      width: 9px;
      height: 9px;
      content: "";
      background: var(--signal);
      border-radius: 50%;
      box-shadow: 0 0 0 3px rgba(242, 189, 67, 0.16);
    }

    #saveState.is-saved::before {
      background: #7bcba4;
      box-shadow: 0 0 0 3px rgba(123, 203, 164, 0.16);
    }

    #saveState.is-error::before {
      background: #ef766c;
      box-shadow: 0 0 0 3px rgba(239, 118, 108, 0.16);
    }

    .workspace {
      width: min(1180px, 100%);
      padding: 34px 38px 42px;
    }

    .workspace-header {
      display: flex;
      gap: 24px;
      align-items: end;
      justify-content: space-between;
      padding-bottom: 18px;
      border-bottom: 2px solid var(--ink);
    }

    .eyebrow,
    .panel-label {
      color: var(--signal-dark);
    }

    .workspace-title {
      margin: 7px 0 0;
      font-size: clamp(29px, 4vw, 44px);
      line-height: 1;
      letter-spacing: 0.03em;
    }

    .count-card {
      min-width: 126px;
      padding: 12px 16px;
      text-align: right;
      background: var(--ink);
      color: #fffdf7;
      border-radius: 3px;
      box-shadow: 5px 5px 0 rgba(242, 189, 67, 0.72);
    }

    .count-card span {
      display: block;
      color: #bdcac8;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.12em;
    }

    .count-card strong {
      display: block;
      margin-top: 2px;
      font-size: 34px;
      line-height: 1;
    }

    .work-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 280px;
      gap: 18px;
      margin-top: 22px;
    }

    .panel {
      background: rgba(255, 253, 247, 0.94);
      border: 1px solid var(--line);
      border-radius: 4px;
      box-shadow: var(--shadow);
    }

    .input-panel {
      padding: 20px;
    }

    .help-panel {
      padding: 18px;
      background: #e8ece7;
      box-shadow: none;
    }

    .help-panel h2,
    .sequence-panel h2 {
      margin: 7px 0 0;
      font-size: 17px;
    }

    .help-panel p {
      margin: 12px 0 0;
      color: #56666c;
      font-size: 13px;
      line-height: 1.8;
    }

    .key-list {
      display: grid;
      gap: 9px;
      margin-top: 16px;
    }

    .key-line {
      display: flex;
      gap: 8px;
      align-items: center;
      color: #46555b;
      font-size: 12px;
    }

    kbd {
      min-width: 30px;
      padding: 4px 6px;
      color: #fffdf7;
      text-align: center;
      background: var(--rail);
      border: 1px solid #66777b;
      border-bottom-width: 3px;
      border-radius: 3px;
      font-size: 11px;
      font-weight: 800;
    }

    .color-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(136px, 1fr));
      gap: 10px;
      margin-top: 14px;
    }

    .color-button,
    .add-color-button {
      min-height: 88px;
      padding: 12px 14px;
      text-align: left;
      border: 2px solid rgba(23, 33, 38, 0.48);
      border-radius: 4px;
      box-shadow: 0 4px 0 rgba(23, 33, 38, 0.18);
      transition: transform 120ms ease, box-shadow 120ms ease;
    }

    .color-card {
      display: grid;
      grid-template-rows: minmax(88px, auto) auto;
      gap: 7px;
      min-width: 0;
    }

    .color-button:hover,
    .add-color-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 0 rgba(23, 33, 38, 0.18);
    }

    .color-button:active,
    .add-color-button:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 rgba(23, 33, 38, 0.18);
    }

    .color-button {
      color: #fff;
      background: var(--button-color);
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.36);
    }

    .color-button.uses-dark-text,
    .sequence-chip.uses-dark-text {
      color: var(--ink);
      text-shadow: none;
    }

    .color-button span,
    .add-color-button span {
      display: block;
      font-size: 20px;
      font-weight: 900;
      letter-spacing: 0.06em;
    }

    .color-button small,
    .add-color-button small {
      display: block;
      margin-top: 7px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.09em;
    }

    .add-color-button {
      color: var(--ink);
      background:
        linear-gradient(135deg, rgba(242, 189, 67, 0.22) 25%, transparent 25%) -8px 0 / 16px 16px,
        linear-gradient(225deg, rgba(242, 189, 67, 0.22) 25%, transparent 25%) -8px 0 / 16px 16px,
        #fff9e8;
      border-style: dashed;
    }

    .color-quick-row {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 4px;
    }

    .color-quick-button {
      min-width: 0;
      min-height: 30px;
      padding: 0 4px;
      color: var(--ink);
      background: #fffdf7;
      border: 1px solid rgba(23, 33, 38, 0.42);
      border-radius: 3px;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0;
      box-shadow: 0 2px 0 rgba(23, 33, 38, 0.12);
    }

    .color-quick-button.is-remove {
      color: #fffdf7;
      background: var(--danger);
      border-color: rgba(23, 33, 38, 0.5);
    }

    .color-quick-button:hover {
      transform: translateY(-1px);
    }

    .sequence-panel {
      margin-top: 18px;
      padding: 20px;
    }

    .sequence-strip {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      min-height: 74px;
      margin-top: 16px;
      padding: 12px;
      background: #edf0eb;
      border: 1px dashed #9da8a4;
      border-radius: 4px;
    }

    .sequence-chip {
      display: grid;
      width: 54px;
      height: 54px;
      place-items: center;
      color: #fff;
      background: var(--chip-color);
      border: 3px solid #fff;
      border-radius: 50%;
      box-shadow: 0 0 0 2px var(--ink), 0 4px 0 rgba(23, 33, 38, 0.22);
      font-size: 15px;
      font-weight: 900;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.46);
      transition: transform 120ms ease;
    }

    .sequence-chip:hover {
      transform: translateY(-3px) scale(1.04);
    }

    .empty-sequence {
      align-self: center;
      margin: 0;
      color: #718087;
      font-size: 13px;
    }

    .action-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: space-between;
      margin-top: 18px;
    }

    .action-button {
      min-height: 46px;
      padding: 0 18px;
      border: 1px solid var(--ink);
      border-radius: 3px;
      font-size: 14px;
      font-weight: 900;
      letter-spacing: 0.05em;
    }

    .action-button.secondary {
      color: var(--ink);
      background: #fffdf7;
    }

    .action-button.primary {
      color: #fff;
      background: var(--ink);
    }

    .action-button:disabled {
      cursor: not-allowed;
      opacity: 0.42;
    }

    .config-output {
      max-width: 1080px;
      padding: 28px;
      background: rgba(255, 253, 247, 0.94);
      border: 1px solid var(--line);
      border-left: 7px solid var(--signal);
      box-shadow: var(--shadow);
    }

    .config-output h1 {
      margin: 8px 0 0;
      font-size: clamp(28px, 4vw, 42px);
    }

    .config-output > p {
      margin: 17px 0 0;
      color: var(--muted);
      line-height: 1.8;
    }

    .config-stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 1px;
      margin-top: 24px;
      overflow: hidden;
      background: var(--line);
      border: 1px solid var(--line);
    }

    .config-stat {
      padding: 14px;
      background: #f8f5ed;
    }

    .config-stat span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    .config-stat strong {
      display: block;
      margin-top: 6px;
      font-size: 24px;
    }

    .config-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      margin-top: 20px;
    }

    .config-card {
      padding: 16px;
      background: #fffdf7;
      border: 1px solid var(--line);
      border-top: 5px solid var(--rail);
    }

    .config-card-header,
    .config-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .config-card h2 {
      margin: 0;
      font-size: 18px;
    }

    .config-count {
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    .config-value {
      min-height: 57px;
      margin: 14px 0;
      padding: 12px;
      overflow-wrap: anywhere;
      color: #f7f4e9;
      background: var(--ink);
      border: 1px solid #0e171b;
      font-family: Consolas, "Courier New", monospace;
      font-size: 14px;
      line-height: 1.55;
    }

    .copy-button {
      min-height: 38px;
      padding: 0 14px;
      color: #fff;
      background: var(--rail);
      border: 1px solid var(--ink);
      border-radius: 3px;
      font-size: 13px;
      font-weight: 900;
    }

    .config-footer {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: space-between;
      margin-top: 22px;
      padding-top: 18px;
      border-top: 1px solid var(--line);
    }

    .action-button.danger {
      color: #fff;
      background: #9c2f2f;
      border-color: #6f2020;
    }

    .script-page {
      display: grid;
      gap: 18px;
    }

    .script-reconstruction-grid {
      display: grid;
      grid-template-columns: minmax(420px, 1.35fr) minmax(340px, 0.85fr);
      gap: 18px;
      align-items: start;
    }

    .script-left-stack,
    .script-right-stack {
      display: grid;
      gap: 18px;
      align-items: start;
    }

    .script-right-stack {
      position: sticky;
      top: 18px;
    }

    .script-field-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .script-field {
      display: grid;
      gap: 6px;
      color: #39484d;
      font-size: 13px;
      font-weight: 800;
    }

    .script-input,
    .script-textarea {
      width: 100%;
      color: var(--ink);
      background: #fff;
      border: 1px solid #899793;
      border-radius: 3px;
      font: inherit;
    }

    .script-input {
      min-height: 40px;
      padding: 8px 10px;
    }

    .script-textarea {
      min-height: 132px;
      padding: 10px 12px;
      resize: vertical;
      font-family: "Cascadia Mono", "Consolas", monospace;
      font-size: 13px;
      line-height: 1.55;
    }


    .script-list {
      display: grid;
      gap: 10px;
      margin-top: 12px;
    }

    .script-list-card {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: center;
      padding: 10px;
      background: #fffdf7;
      border: 1px solid var(--line);
    }

    .stable-simulation-screenshot-stage {
      position: relative;
      display: grid;
      place-items: center;
      min-height: 220px;
      margin-top: 12px;
      overflow: hidden;
      color: #eef3f1;
      background: #2f3335;
      border: 3px solid var(--ink);
      box-shadow: inset 0 0 0 3px rgba(255, 255, 255, 0.72);
    }

    .stable-simulation-screenshot-wrap {
      position: relative;
      display: inline-block;
      max-width: 100%;
      line-height: 0;
      cursor: crosshair;
    }

    .stable-simulation-screenshot {
      display: block;
      max-width: 100%;
      height: auto;
      user-select: none;
    }

    .stable-simulation-hotspot {
      position: absolute;
      transform: translate(-50%, -50%);
      min-width: 42px;
      min-height: 32px;
      padding: 4px 8px;
      color: var(--ink);
      background: rgba(242, 189, 67, 0.9);
      border: 2px solid #fffdf7;
      border-radius: 999px;
      box-shadow: 0 0 0 3px rgba(23, 33, 38, 0.38);
      font-size: 12px;
      font-weight: 900;
      line-height: 1;
      cursor: pointer;
    }

    .stable-simulation-hotspot:disabled {
      color: #fff;
      background: rgba(34, 139, 84, 0.95);
      cursor: default;
      opacity: 1;
    }

    .stable-simulation-empty-image {
      padding: 24px;
      text-align: center;
    }

    .script-report {
      min-height: 260px;
      max-height: 520px;
      margin: 12px 0 0;
      padding: 14px;
      overflow: auto;
      white-space: pre-wrap;
      background: #fff;
      border: 1px solid var(--line);
      font-family: "Cascadia Mono", "Consolas", monospace;
      font-size: 12px;
      line-height: 1.65;
    }

    @media (max-width: 720px) {
      .config-grid {
        grid-template-columns: 1fr;
      }

      .script-reconstruction-grid,
      .script-field-grid {
        grid-template-columns: 1fr;
      }

      .script-right-stack {
        position: static;
      }
    }

    dialog {
      width: min(430px, calc(100vw - 32px));
      padding: 0;
      color: var(--ink);
      background: #fffdf7;
      border: 2px solid var(--ink);
      border-radius: 4px;
      box-shadow: 10px 10px 0 rgba(23, 33, 38, 0.25);
    }

    dialog::backdrop {
      background: rgba(23, 33, 38, 0.58);
    }

    .dialog-form {
      padding: 22px;
    }

    .dialog-form h2 {
      margin: 7px 0 0;
      font-size: 26px;
    }

    .dialog-note {
      margin: 9px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .dialog-field {
      display: grid;
      gap: 7px;
      margin-top: 18px;
      color: #39484d;
      font-size: 13px;
      font-weight: 800;
    }

    .dialog-field input[type="text"] {
      width: 100%;
      padding: 10px 11px;
      color: var(--ink);
      background: #fff;
      border: 1px solid #899793;
      border-radius: 3px;
    }

    .dialog-field input[type="color"] {
      width: 100%;
      height: 44px;
      padding: 4px;
      background: #fff;
      border: 1px solid #899793;
      border-radius: 3px;
    }

    #colorError {
      min-height: 20px;
      margin: 10px 0 0;
      color: var(--danger);
      font-size: 13px;
      font-weight: 800;
    }

    .dialog-actions {
      display: flex;
      gap: 9px;
      justify-content: flex-end;
      margin-top: 14px;
    }

    @media (max-width: 760px) {
      .app-shell {
        display: block;
      }

      .sidebar {
        min-height: auto;
        padding: 18px 16px 14px;
        border-right: 0;
        border-bottom: 4px solid var(--signal);
      }

      .brand-subtitle {
        display: none;
      }

      #stageNav {
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
        margin-top: 16px;
      }

      .stage-button {
        flex: 1 1 132px;
        min-height: 48px;
        padding: 8px;
      }

      .stage-index {
        width: 27px;
        height: 27px;
      }

      .save-panel {
        margin-top: 14px;
        padding-top: 12px;
      }

      .workspace {
        padding: 24px 16px 34px;
      }

      .work-grid {
        grid-template-columns: 1fr;
      }

      .help-panel {
        order: -1;
      }

      .color-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div>
        <p class="brand-kicker">BUS LEVEL / QUEUE LOG</p>
        <h1 class="brand-title">乘客队列<br>记录工作台</h1>
        <p class="brand-subtitle">按流程录入三个区域的乘客颜色，状态将在每次操作后自动保存。</p>
      </div>

      <nav id="stageNav" aria-label="录入流程">
        <button class="stage-button is-active" type="button" data-stage="conveyor" aria-current="step">
          <span class="stage-index">01</span>
          <span><span class="stage-name">传送带</span><small class="stage-code">CONVEYOR</small></span>
        </button>
        <button class="stage-button" type="button" data-stage="left">
          <span class="stage-index">02</span>
          <span><span class="stage-name">左侧队列</span><small class="stage-code">LEFT QUEUE</small></span>
        </button>
        <button class="stage-button" type="button" data-stage="right">
          <span class="stage-index">03</span>
          <span><span class="stage-name">右侧队列</span><small class="stage-code">RIGHT QUEUE</small></span>
        </button>
        <button class="stage-button" type="button" data-stage="configs">
          <span class="stage-index">04</span>
          <span><span class="stage-name">全部配置</span><small class="stage-code">CONFIGS</small></span>
        </button>
        <button class="stage-button" type="button" data-stage="simulation">
          <span class="stage-index">05</span>
          <span><span class="stage-name">立即结算模拟</span><small class="stage-code">STABLE SIM</small></span>
        </button>
        <button class="stage-button" type="button" data-stage="queueFit">
          <span class="stage-index">06</span>
          <span><span class="stage-name">拟合队列</span><small class="stage-code">QUEUE FIT</small></span>
        </button>
        <button class="stage-button" type="button" data-stage="pathSolve">
          <span class="stage-index">07</span>
          <span><span class="stage-name">关卡求解</span><small class="stage-code">LEVEL SOLVE</small></span>
        </button>
        <button class="stage-button" type="button" data-stage="pressureQueue">
          <span class="stage-index">08</span>
          <span><span class="stage-name">压力队列生成</span><small class="stage-code">PRESSURE QUEUE</small></span>
        </button>

      <div class="save-panel">

  <dialog id="addColorDialog" aria-labelledby="addColorTitle">
    <form class="dialog-form" method="dialog">
      <p class="eyebrow">COLOR MAPPING</p>
      <h2 id="addColorTitle">新增颜色映射</h2>
      <p class="dialog-note">下一可用映射值：<strong id="nextColorValue">4</strong></p>

      <label class="dialog-field">
        颜色名称
        <input id="colorName" name="colorName" type="text" autocomplete="off" placeholder="例如：绿色">

        <button class="action-button primary" type="submit">保存颜色</button>

  <script src="pressure-queue-core.js"></script>
  <script>
    const STORAGE_KEY = 'passenger-queue-recorder-state-v5';
    const SECTIONS = ['conveyor', 'left', 'right'];
    const STAGES = [...SECTIONS, 'configs', 'simulation', 'queueFit', 'pathSolve', 'pressureQueue'];
    const STATE_KEYS = ['colors', 'queues', 'histories', 'simulation', 'queueFit', 'pathSolve', 'pressureQueue', 'activeStage'];
    const COLOR_KEYS = ['name', 'value', 'hex'];
    const SIMULATION_KEYS = ['levelName', 'conveyorCapacity', 'beltQueueText', 'leftQueueText', 'rightQueueText', 'passengerQueueText', 'vehicleTableText', 'clickSequenceText', 'screenshotDataUrl', 'hotspots', 'nextHotspotId', 'result', 'errors'];
    const QUEUE_FIT_KEYS = ['levelName', 'conveyorCapacity', 'leftQueueLength', 'beltQueueText', 'leftQueueText', 'rightQueueText', 'passengerQueueText', 'vehicleTableText', 'targetVehicleTableText', 'targetRecordFilename', 'targetRecordText', 'fittedBeltQueueText', 'fittedLeftQueueText', 'fittedRightQueueText', 'fittedPassengerQueueText', 'fittedClickSequenceText', 'score', 'roleSummary', 'errors'];
    const PATH_SOLVE_KEYS = ['levelName', 'conveyorCapacity', 'beltQueueText', 'leftQueueText', 'rightQueueText', 'vehicleTableText', 'clickSequenceText', 'beamWidth', 'branchLimit', 'result', 'errors'];
    const PRESSURE_QUEUE_KEYS = ['levelName', 'conveyorCapacity', 'passengerQueueText', 'vehicleTableText', 'clickSequenceText', 'searchBudget', 'seed', 'annotations', 'result', 'errors'];
    const SIMULATION_HOTSPOT_KEYS = ['id', 'vehicleId', 'xPercent', 'yPercent', 'isClicked'];
    const VEHICLE_CAPACITIES = [4, 6, 10];
    const PATH_SOLVE_ASYNC_SEARCH_BUDGET = 4096;
    const PATH_SOLVE_PROGRESS_INTERVAL_MS = 120;
    const STABLE_SIMULATION_ROLE_ORDER = ['等待占位车', '补清触发车', '连锁释放车', '即时清空车', '尾段收尾车'];
    const STABLE_SIMULATION_PATH_ROLE_ORDER = ['核心入口解锁车', '入口分支解锁车', '中继大分支解锁车', '中继小分支解锁车', '深层终点车', '普通被解锁车', '独立可点车', '未提供路径数据'];
    const HEX_PATTERN = /^#[0-9a-fA-F]{6}$/;
    const VEHICLE_CSV_COLOR_TO_QUEUE_COLOR = [3, 4, 5, 6, 1, 2, 9, 7, 8, 11, 10];
    const DEFAULT_COLORS = [
      { name: '红色', value: 1, hex: '#e54c4c' },
      { name: '黄色', value: 2, hex: '#f3bd3d' },
      { name: '蓝色', value: 3, hex: '#3478f6' },
      { name: '绿色', value: 4, hex: '#32a852' },
      { name: '粉色', value: 5, hex: '#ec71a5' },
      { name: '紫色', value: 6, hex: '#8b5cf6' },
      { name: '天蓝色', value: 7, hex: '#58bde9' },
      { name: '棕色', value: 8, hex: '#8b5a3c' },
      { name: '橙色', value: 9, hex: '#f97316' },
      { name: '黑色', value: 10, hex: '#202529' },
      { name: '白色', value: 11, hex: '#f7f7f2' }
    ];

    function createEmptySections() {
      return { conveyor: [], left: [], right: [] };
    }

    function createEmptySimulation() {
      return {
        levelName: '',
        conveyorCapacity: '',
        beltQueueText: '',
        leftQueueText: '',
        rightQueueText: '',
        passengerQueueText: '',
        vehicleTableText: '',
        clickSequenceText: '',
        screenshotDataUrl: '',
        hotspots: [],
        nextHotspotId: 1,
        result: null,
        errors: []
      };
    }

    function createEmptyQueueFit() {
      return {
        levelName: '',
        conveyorCapacity: '',
        leftQueueLength: '',
        beltQueueText: '',
        leftQueueText: '',
        rightQueueText: '',
        passengerQueueText: '',
        vehicleTableText: '',
        targetVehicleTableText: '',
        targetRecordFilename: '',
        targetRecordText: '',
        fittedBeltQueueText: '',
        fittedLeftQueueText: '',
        fittedRightQueueText: '',
        fittedPassengerQueueText: '',
        fittedClickSequenceText: '',
        score: 0,
        roleSummary: [],
        errors: []
      };
    }

    function createEmptyPathSolve() {
      return {
        levelName: '',
        conveyorCapacity: '',
        beltQueueText: '',
        leftQueueText: '',
        rightQueueText: '',
        vehicleTableText: '',
        clickSequenceText: '',
        beamWidth: '192',
        branchLimit: '24',
        result: null,
        errors: []
      };
    }

    function createEmptyPressureQueue() {
      return {
        levelName: '',
        conveyorCapacity: '',
        passengerQueueText: '',
        vehicleTableText: '',
        clickSequenceText: '',
        searchBudget: '20000',
        seed: '1',
        annotations: [],
        result: null,
        errors: []
      };
    }

    function createInitialState() {
      return {
        colors: DEFAULT_COLORS.map(color => ({ ...color })),
        queues: createEmptySections(),
        histories: createEmptySections(),
        simulation: createEmptySimulation(),
        queueFit: createEmptyQueueFit(),
        pathSolve: createEmptyPathSolve(),
        pressureQueue: createEmptyPressureQueue(),
        activeStage: 'conveyor'
      };
    }

    function hasSection(state, section) {
      return Boolean(state
        && typeof state === 'object'
        && state.queues
        && state.histories
        && SECTIONS.includes(section)
        && Array.isArray(state.queues[section])
        && Array.isArray(state.histories[section]));
    }

    function updateSection(state, section, nextQueue) {
      if (!hasSection(state, section)) return state;

      return {
        ...state,
        queues: {
          ...state.queues,
          [section]: nextQueue
        },
        histories: {
          ...state.histories,
          [section]: [...state.histories[section], [...state.queues[section]]]
        }
      };
    }

    function appendValue(state, section, value) {
      if (!hasSection(state, section) || !isMappedValue(state, value)) return state;
      return updateSection(state, section, [...state.queues[section], value]);
    }

    function hasBatchValues(state, values) {
      return isDenseArray(values)
        && values.length > 0
        && values.every(value => isMappedValue(state, value));
    }

    function appendBatchValues(state, section, values) {
      if (!hasSection(state, section) || !hasBatchValues(state, values)) return state;
      return updateSection(state, section, [...state.queues[section], ...values]);
    }

    function removeBatchValues(state, section, value, count) {
      if (!hasSection(state, section)
        || !isMappedValue(state, value)
        || !Number.isInteger(count)
        || count < 1) {
        return state;
      }

      let remaining = count;
      const nextQueue = [...state.queues[section]];
      for (let index = nextQueue.length - 1; index >= 0 && remaining > 0; index -= 1) {
        if (nextQueue[index] === value) {
          nextQueue.splice(index, 1);
          remaining -= 1;
        }
      }

      if (nextQueue.length === state.queues[section].length) return state;
      return updateSection(state, section, nextQueue);
    }

    function removeAt(state, section, index) {
      if (!hasSection(state, section)
        || !Number.isInteger(index)
        || index < 0
        || index >= state.queues[section].length) {
        return state;
      }

      return updateSection(state, section, state.queues[section].filter((_, itemIndex) => itemIndex !== index));
    }

    function undo(state, section) {
      if (!hasSection(state, section) || state.histories[section].length === 0) return state;

      const history = state.histories[section];
      return {
        ...state,
        queues: {
          ...state.queues,
          [section]: [...history.at(-1)]
        },
        histories: {
          ...state.histories,
          [section]: history.slice(0, -1)
        }
      };
    }

    function addColor(state, name, hex) {
      if (!state
        || !Array.isArray(state.colors)
        || state.colors.some(color => !color || !Number.isSafeInteger(color.value) || color.value <= 0)
        || typeof name !== 'string'
        || name.trim() === ''
        || typeof hex !== 'string'
        || !HEX_PATTERN.test(hex)) {
        return state;
      }

      const maxValue = state.colors.reduce((max, color) => Math.max(max, color.value), 0);
      if (maxValue >= Number.MAX_SAFE_INTEGER) return state;

      return {
        ...state,
        colors: [
          ...state.colors,
          { name: name.trim(), value: maxValue + 1, hex }
        ]
      };
    }

    function getConfigs(state) {
      const conveyor = state.queues.conveyor.join(',');
      const left = state.queues.left.join(',');
      const right = state.queues.right.join(',');
      return {
        conveyor,
        left,
        right,
        combined: [...state.queues.conveyor, ...state.queues.left, ...state.queues.right].join(',')
      };
    }

    function startNextLevel(state) {
      return {
        colors: state.colors.map(color => ({ ...color })),
        queues: createEmptySections(),
        histories: createEmptySections(),
        simulation: state.simulation,
        queueFit: state.queueFit,
        pathSolve: state.pathSolve,
        pressureQueue: state.pressureQueue,
        activeStage: 'conveyor'
      };
    }

    function resetEverything() {
      return createInitialState();
    }

    function getColorName(state, value) {
      const color = state.colors.find(item => item.value === value);
      return color ? color.name : `映射${value}`;
    }

    function parsePositiveInteger(value) {
      if (typeof value !== 'string' && typeof value !== 'number') return null;
      const text = String(value).trim();
      if (!/^\d+$/.test(text)) return null;
      const number = Number(text);
      return Number.isSafeInteger(number) && number > 0 ? number : null;
    }

    function parseNonNegativeInteger(value) {
      if (typeof value !== 'string' && typeof value !== 'number') return null;
      const text = String(value).trim();
      if (!/^\d+$/.test(text)) return null;
      const number = Number(text);
      return Number.isSafeInteger(number) && number >= 0 ? number : null;
    }

    function parseVehicleId(value) {
      return parseNonNegativeInteger(value);
    }

    function isScriptColorValue(state, value) {
      return isMappedValue(state, value);
    }

    function getScriptColorName(state, value) {
      if (isScriptColorValue(state, value)) return getColorName(state, value);
      return `颜色${value}`;
    }

    function formatConsumption(state, consumption) {
      const parts = [...consumption.entries()]
        .filter(([, count]) => count > 0)
        .map(([colorValue, count]) => `${getScriptColorName(state, colorValue)}x${count}`);
      return parts.length ? parts.join('、') : '无';
    }

    function parseScriptIdList(value) {
      if (typeof value !== 'string' || value.trim() === '') return { values: [], errors: [] };
      const values = [];
      const errors = [];
      value.split(',').map(item => item.trim()).filter(Boolean).forEach(item => {
        const id = parseVehicleId(item);
        if (id === null) {
          errors.push(`依赖车辆 id「${item}」不是非负整数`);
          return;
        }
        values.push(id);
      });
      return { values, errors };
    }

    function splitCsvLine(line) {
      const cells = [];
      let cell = '';
      let inQuotes = false;

      for (let index = 0; index < line.length; index += 1) {
        const char = line[index];
        if (char === '"') {
          if (inQuotes && line[index + 1] === '"') {
            cell += '"';
            index += 1;
          } else {
            inQuotes = !inQuotes;
          }
        } else if (char === ',' && !inQuotes) {
          cells.push(cell);
          cell = '';
        } else {
          cell += char;
        }
      }

      cells.push(cell);
      return cells.map(item => item.replace(/^\uFEFF/, '').trim());
    }

    function splitScriptTableRow(line) {
      const tabCells = line.split('\t').map(cell => cell.replace(/^\uFEFF/, '').trim());
      if (tabCells.length > 1) return tabCells;
      if (line.includes(',')) {
        return splitCsvLine(line);
      }
      return line.trim().split(/\s+/).map(cell => cell.replace(/^\uFEFF/, '').trim());
    }

    function mapVehicleCsvColorValue(value) {
      return Number.isSafeInteger(value) && value >= 0 && value < VEHICLE_CSV_COLOR_TO_QUEUE_COLOR.length
        ? VEHICLE_CSV_COLOR_TO_QUEUE_COLOR[value]
        : null;
    }

    function parseScriptVehicleTable(text) {
      if (typeof text !== 'string') return { vehicles: [], errors: ['车辆表必须是文本'] };

      const vehicles = [];
      const errors = [];
      const seenIds = new Set();
      const lines = text.replace(/\r/g, '').split('\n');

      lines.forEach((line, lineIndex) => {
        if (line.trim() === '') return;
        const isCsvRow = !line.includes('\t') && line.includes(',');
        const cells = splitScriptTableRow(line);
        const lineNumber = lineIndex + 1;
        const maybeHeader = lineNumber === 1 && parseVehicleId(cells[0]) === null;
        if (maybeHeader) return;

        const rowErrors = [];
        if (cells.length < 4) rowErrors.push('字段不足，至少需要车辆id、车颜色、车座位、深度');

        const id = parseVehicleId(cells[0]);
        const rawColorValue = parseNonNegativeInteger(cells[1]);
        const colorValue = rawColorValue !== null && isCsvRow ? mapVehicleCsvColorValue(rawColorValue) : rawColorValue;
        const capacity = parsePositiveInteger(cells[2]);
        const depth = parseNonNegativeInteger(cells[3]);
        const front = parseScriptIdList(cells[4] || '');
        const back = parseScriptIdList(cells[5] || '');

        if (id === null) rowErrors.push('车辆id必须是非负整数');
        if (id !== null && seenIds.has(id)) rowErrors.push(`车辆id ${id} 重复`);
        if (rawColorValue === null) rowErrors.push('车颜色必须是非负整数映射值');
        if (rawColorValue !== null && colorValue === null) rowErrors.push('CSV 车颜色必须是 0-10 的车辆颜色映射值');
        if (!VEHICLE_CAPACITIES.includes(capacity)) rowErrors.push('车座位必须是 4、6 或 10');
        if (depth === null) rowErrors.push('深度必须是非负整数');
        rowErrors.push(...front.errors, ...back.errors);

        if (rowErrors.length > 0) {
          errors.push(`第 ${lineNumber} 行：${rowErrors.join('；')}`);
          return;
        }

        seenIds.add(id);
        vehicles.push({
          id,
          colorValue,
          capacity,
          depth,
          frontVehicleIds: front.values,
          backVehicleIds: back.values
        });
      });

      return { vehicles, errors };
    }

    function parseStableSimulationClickSequence(text) {
      if (typeof text !== 'string' || text.trim() === '') return { values: [], errors: [] };
      const values = [];
      const errors = [];
      text.split(',').map(item => item.trim()).filter(Boolean).forEach(item => {
        const id = parseVehicleId(item);
        if (id === null) {
          errors.push(`点击车辆 id「${item}」不是非负整数`);
          return;
        }
        values.push(id);
      });
      return { values, errors };
    }

    function parseStableSimulationPassengerQueue(state, text) {
      if (typeof text !== 'string' || text.trim() === '') return { values: [], errors: [] };
      const values = [];
      const errors = [];
      splitQueueTextValues(text).forEach((item, index) => {
        const value = parseNonNegativeInteger(item);
        if (value === null) {
          errors.push(`乘客队列 token「${item}」不是非负整数`);
          return;
        }

        values.push(value);
        if (!isScriptColorValue(state, value)) {
          errors.push(`乘客颜色 ${value} 不存在`);
        }
      });
      return { values, errors };
    }

    function parsePressureQueueModel(currentState, pressure = currentState.pressureQueue) {
      const source = pressure && typeof pressure === 'object' ? pressure : {};
      const parsedVehicles = parseScriptVehicleTable(source.vehicleTableText);
      const parsedPassengers = parseStableSimulationPassengerQueue(currentState, source.passengerQueueText);
      const parsedPath = parseStableSimulationClickSequence(source.clickSequenceText);
      const conveyorCapacity = parsePositiveInteger(source.conveyorCapacity);
      const searchBudget = parsePositiveInteger(source.searchBudget);
      const seed = parseNonNegativeInteger(source.seed);
      const colorErrors = parsedVehicles.vehicles
        .filter(vehicle => !isScriptColorValue(currentState, vehicle.colorValue))
        .map(vehicle => `车辆 ${vehicle.id} 的颜色映射 ${vehicle.colorValue} 不存在`);
      const optionErrors = [
        ...(conveyorCapacity === null ? ['传送带容量必须是正整数'] : []),
        ...(searchBudget === null ? ['搜索预算必须是正整数'] : []),
        ...(seed === null ? ['搜索种子必须是非负整数'] : [])
      ];
      const model = {
        conveyorCapacity,
        passengers: parsedPassengers.values,
        vehicles: parsedVehicles.vehicles,
        path: parsedPath.values,
        annotations: window.PressureQueueCore.syncAnnotations(parsedPath.values, source.annotations),
        searchBudget,
        seed
      };
      const parseErrorMessages = [
        ...parsedVehicles.errors,
        ...parsedPassengers.errors,
        ...parsedPath.errors,
        ...colorErrors,
        ...optionErrors
      ];
      const parseErrors = parseErrorMessages.map(message => window.PressureQueueCore.createIssue(
        'input_error',
        'parse_error',
        message
      ));
      const baseErrors = parseErrors.length === 0
        ? window.PressureQueueCore.validateBaseInput(model).errors
        : [];

      return { model, errors: [...parseErrors, ...baseErrors] };
    }

    function preparePressureQueueAnnotations(currentState) {
      const parsed = parsePressureQueueModel(currentState);
      return {
        ...currentState,
        pressureQueue: {
          ...currentState.pressureQueue,
          annotations: parsed.model.annotations,
          result: null,
          errors: parsed.errors.map(error => error.message)
        }
      };
    }

    function parseStableSimulationInput(state, input) {
      const conveyorCapacity = parsePositiveInteger(input && input.conveyorCapacity);
      const parsedPassengerQueue = parseStableSimulationPassengerQueue(state, input && input.passengerQueueText);
      const passengerQueue = parsedPassengerQueue.values;
      const vehicleText = input && typeof input.vehicleTableText === 'string' ? input.vehicleTableText : '';
      const parsedVehicles = parseScriptVehicleTable(vehicleText);
      const vehicles = parsedVehicles.vehicles.filter(vehicle => isScriptColorValue(state, vehicle.colorValue));
      const clickSequence = parseStableSimulationClickSequence(input && input.clickSequenceText);
      const errors = [...parsedPassengerQueue.errors, ...parsedVehicles.errors, ...clickSequence.errors];

      if (conveyorCapacity === null) errors.push('传送带容量必须是正整数');
      if (conveyorCapacity !== null && passengerQueue.length < conveyorCapacity) errors.push('乘客队列数量不能少于传送带容量');
      parsedVehicles.vehicles
        .filter(vehicle => !isScriptColorValue(state, vehicle.colorValue))
        .forEach(vehicle => errors.push(`车辆 ${vehicle.id} 的颜色映射 ${vehicle.colorValue} 不存在`));
      const vehicleIds = new Set(vehicles.map(vehicle => vehicle.id));
      clickSequence.values.forEach(id => {
        if (!vehicleIds.has(id)) errors.push(`点击车辆 ${id} 不存在于车辆表`);
      });

      return {
        conveyorCapacity,
        passengerQueue,
        belt: conveyorCapacity === null ? [] : passengerQueue.slice(0, conveyorCapacity),
        reserveQueue: conveyorCapacity === null ? [] : passengerQueue.slice(conveyorCapacity),
        vehicles,
        clickSequence: clickSequence.values,
        errors
      };
    }

    function countStableSimulationValues(values) {
      const counts = new Map();
      values.forEach(value => counts.set(value, (counts.get(value) || 0) + 1));
      return counts;
    }

    function formatStableSimulationValues(values) {
      return values.join(',');
    }

    function getStableSimulationDependencyOrder(vehicles) {
      const byId = new Map(vehicles.map(vehicle => [vehicle.id, vehicle]));
      const remaining = new Set(vehicles.map(vehicle => vehicle.id));
      const order = [];

      while (remaining.size > 0) {
        const ready = [...remaining].filter(id => (
          byId.get(id).frontVehicleIds.every(frontId => !remaining.has(frontId))
        ));
        if (ready.length === 0) {
          return { values: order, errors: [`车辆依赖存在环或缺少可点击入口：${[...remaining].join(',')}`] };
        }

        ready.sort((a, b) => {
          const vehicleA = byId.get(a);
          const vehicleB = byId.get(b);
          return vehicleA.depth - vehicleB.depth
            || vehicleB.backVehicleIds.length - vehicleA.backVehicleIds.length
            || a - b;
        });
        const nextId = ready[0];
        order.push(nextId);
        remaining.delete(nextId);
      }

      return { values: order, errors: [] };
    }

    function parseVehiclePathInput(input) {
      const vehicleText = input && typeof input.vehicleTableText === 'string' ? input.vehicleTableText : '';
      const parsedVehicles = parseScriptVehicleTable(vehicleText);
      const vehicles = parsedVehicles.vehicles;
      const errors = [...parsedVehicles.errors];
      if (vehicles.length === 0) errors.push('车辆表不能为空');
      const vehicleIds = new Set(vehicles.map(vehicle => vehicle.id));
      const missingDependencies = new Map();
      vehicles.forEach(vehicle => {
        vehicle.frontVehicleIds.forEach(frontId => {
          if (!vehicleIds.has(frontId)) {
            const list = missingDependencies.get(frontId) || [];
            list.push(vehicle.id);
            missingDependencies.set(frontId, list);
          }
        });
      });
      missingDependencies.forEach((blockedIds, missingId) => {
        errors.push(`依赖车辆 #${missingId} 不存在，被 ${blockedIds.map(id => `#${id}`).join('、')} 引用`);
      });
      return { vehicles, errors };
    }

    function parseVehiclePuzzleInput(state, input) {
      const parsed = parseVehiclePathInput(input);
      const conveyorCapacity = parsePositiveInteger(input && input.conveyorCapacity);
      const parsedBelt = parseStableSimulationPassengerQueue(state, input && input.beltQueueText);
      const parsedLeftQueue = parseStableSimulationPassengerQueue(state, input && input.leftQueueText);
      const parsedRightQueue = parseStableSimulationPassengerQueue(state, input && input.rightQueueText);
      const errors = [
        ...parsed.errors,
        ...parsedBelt.errors.map(error => `传送带：${error}`),
        ...parsedLeftQueue.errors.map(error => `左侧队列：${error}`),
        ...parsedRightQueue.errors.map(error => `右侧队列：${error}`)
      ];

      if (conveyorCapacity === null) errors.push('传送带容量必须是正整数');
      if (conveyorCapacity !== null && parsedBelt.values.length > conveyorCapacity) {
        errors.push(`传送带初始乘客数 ${parsedBelt.values.length} 超过容量 ${conveyorCapacity}`);
      }

      parsed.vehicles
        .filter(vehicle => !isScriptColorValue(state, vehicle.colorValue))
        .forEach(vehicle => errors.push(`车辆 ${vehicle.id} 的颜色映射 ${vehicle.colorValue} 不存在`));

      const passengerCounts = countStableSimulationValues([
        ...parsedBelt.values,
        ...parsedLeftQueue.values,
        ...parsedRightQueue.values
      ]);
      const vehicleSeatCounts = new Map();
      parsed.vehicles.forEach(vehicle => {
        vehicleSeatCounts.set(vehicle.colorValue, (vehicleSeatCounts.get(vehicle.colorValue) || 0) + vehicle.capacity);
      });
      const allColors = new Set([...passengerCounts.keys(), ...vehicleSeatCounts.keys()]);
      allColors.forEach(colorValue => {
        const passengerCount = passengerCounts.get(colorValue) || 0;
        const seatCount = vehicleSeatCounts.get(colorValue) || 0;
        if (passengerCount !== seatCount) {
          errors.push(`颜色 ${colorValue} 数量不匹配：乘客 ${passengerCount} / 车辆座位 ${seatCount}`);
        }
      });

      return {
        conveyorCapacity,
        belt: parsedBelt.values,
        leftQueue: parsedLeftQueue.values,
        rightQueue: parsedRightQueue.values,
        vehicles: parsed.vehicles,
        errors
      };
    }

    function getClickableVehicleIds(remainingVehicleIds, vehiclesById) {
      const remaining = new Set(remainingVehicleIds);
      return remainingVehicleIds
        .filter(id => {
          const vehicle = vehiclesById.get(id);
          return vehicle && vehicle.frontVehicleIds.every(frontId => !remaining.has(frontId));
        })
        .sort((a, b) => {
          const vehicleA = vehiclesById.get(a);
          const vehicleB = vehiclesById.get(b);
          return vehicleA.depth - vehicleB.depth
            || vehicleB.backVehicleIds.length - vehicleA.backVehicleIds.length
            || a - b;
        });
    }

    function createVehiclePathProofStep(step, clickableVehicleIds, clickedVehicleId, vehicle, remainingAfterClick) {
      return {
        step,
        clickableVehicleIds: [...clickableVehicleIds],
        clickedVehicleId,
        clearedFrontVehicleIds: [...vehicle.frontVehicleIds],
        unlockedVehicleIds: [...vehicle.backVehicleIds],
        remainingVehicleIds: [...remainingAfterClick]
      };
    }

    function refillVehiclePuzzleBelt(working, conveyorCapacity) {
      while (working.belt.length < conveyorCapacity && (working.leftQueue.length > 0 || working.rightQueue.length > 0)) {
        if (working.leftQueue.length > 0) {
          working.belt.push(working.leftQueue.shift());
        } else {
          working.belt.push(working.rightQueue.shift());
        }
      }
    }

    function settleVehiclePuzzleStep(working, conveyorCapacity) {
      const consumption = new Map();
      const departedVehicleIds = [];
      const warnings = [];
      let guard = 0;
      let moved = true;

      while (moved && guard < 10000) {
        guard += 1;
        moved = false;
        for (let index = 0; index < working.belt.length; index += 1) {
          const colorValue = working.belt[index];
          const slotIndex = findStableSimulationTargetSlot(working.slots, colorValue);
          if (slotIndex === -1) continue;

          const slot = working.slots[slotIndex];
          slot.remaining -= 1;
          consumption.set(slot.vehicleId, (consumption.get(slot.vehicleId) || 0) + 1);
          working.belt.splice(index, 1);
          refillVehiclePuzzleBelt(working, conveyorCapacity);
          if (slot.remaining === 0) {
            departedVehicleIds.push(slot.vehicleId);
            working.slots[slotIndex] = null;
          }
          moved = true;
          break;
        }
      }

      if (guard >= 10000) warnings.push('结算超过安全上限，已停止本步模拟');
      return {
        consumption: [...consumption.entries()].map(([vehicleId, count]) => ({ vehicleId, count })),
        departedVehicleIds,
        warnings
      };
    }

    function getVehiclePuzzleClickableVehicleIds(searchState, vehiclesById) {
      if (!searchState.slots.some(slot => slot === null)) return [];
      return getClickableVehicleIds(searchState.remainingVehicleIds, vehiclesById)
        .sort((a, b) => {
          const vehicleA = vehiclesById.get(a);
          const vehicleB = vehiclesById.get(b);
          const matchingA = searchState.belt.filter(value => value === vehicleA.colorValue).length;
          const matchingB = searchState.belt.filter(value => value === vehicleB.colorValue).length;
          const canDepartA = matchingA >= vehicleA.capacity ? 1 : 0;
          const canDepartB = matchingB >= vehicleB.capacity ? 1 : 0;
          return canDepartB - canDepartA
            || matchingB - matchingA
            || vehicleA.depth - vehicleB.depth
            || vehicleB.backVehicleIds.length - vehicleA.backVehicleIds.length
            || a - b;
        });
    }

    function isVehiclePuzzleSolved(searchState) {
      return searchState.remainingVehicleIds.length === 0
        && searchState.slots.every(slot => slot === null)
        && searchState.belt.length === 0
        && searchState.leftQueue.length === 0
        && searchState.rightQueue.length === 0;
    }

    function isVehiclePuzzleDeadlocked(searchState) {
      return !isVehiclePuzzleSolved(searchState)
        && searchState.slots.length > 0
        && searchState.slots.every(slot => slot !== null);
    }

    function createVehiclePuzzleInitialState(parsed) {
      return {
        remainingVehicleIds: parsed.vehicles.map(vehicle => vehicle.id).sort((a, b) => a - b),
        belt: [...parsed.belt],
        leftQueue: [...parsed.leftQueue],
        rightQueue: [...parsed.rightQueue],
        slots: [null, null, null, null],
        path: [],
        proof: [],
        departedVehicleIds: []
      };
    }

    function cloneVehiclePuzzleSearchState(searchState) {
      return {
        remainingVehicleIds: [...searchState.remainingVehicleIds],
        belt: [...searchState.belt],
        leftQueue: [...searchState.leftQueue],
        rightQueue: [...searchState.rightQueue],
        slots: searchState.slots.map(cloneSimulationSlot),
        path: [...searchState.path],
        proof: [...searchState.proof],
        departedVehicleIds: [...searchState.departedVehicleIds]
      };
    }

    function hashVehiclePuzzleSearchState(searchState) {
      const slots = searchState.slots
        .map(slot => (slot ? `${slot.vehicleId}:${slot.remaining}` : '_'))
        .join(',');
      return [
        searchState.remainingVehicleIds.join(','),
        slots,
        searchState.belt.join(','),
        searchState.leftQueue.join(','),
        searchState.rightQueue.join(',')
      ].join('|');
    }

    function getVehiclePuzzleUnsolvedReasons(searchState, expectedVehicleCount) {
      const reasons = [];
      if (searchState.remainingVehicleIds.length > 0) {
        reasons.push(`停车场仍有未点击车辆：${searchState.remainingVehicleIds.map(id => `#${id}`).join('、')}`);
      }
      const occupiedSlots = searchState.slots.filter(Boolean);
      if (occupiedSlots.length > 0) {
        reasons.push(`最终仍有车辆占位：${occupiedSlots.map(slot => `#${slot.vehicleId}余${slot.remaining}`).join('、')}`);
      }
      if (searchState.belt.length > 0) reasons.push(`最终传送带未清空：${searchState.belt.join(',')}`);
      if (searchState.leftQueue.length > 0) reasons.push(`最终左侧队列未清空：${searchState.leftQueue.join(',')}`);
      if (searchState.rightQueue.length > 0) reasons.push(`最终右侧队列未清空：${searchState.rightQueue.join(',')}`);
      const departedCount = new Set(searchState.departedVehicleIds).size;
      if (departedCount !== expectedVehicleCount) {
        reasons.push(`开走车辆数 ${departedCount}/${expectedVehicleCount}`);
      }
      return reasons;
    }

    function applyVehiclePuzzleClick(searchState, vehicleId, vehiclesById, conveyorCapacity, clickableVehicleIds) {
      const vehicle = vehiclesById.get(vehicleId);
      const nextState = cloneVehiclePuzzleSearchState(searchState);
      const emptySlotIndex = nextState.slots.findIndex(slot => slot === null);
      if (emptySlotIndex === -1) {
        return { nextState: null, error: `点击 #${vehicleId} 失败：没有空车位` };
      }

      nextState.remainingVehicleIds = nextState.remainingVehicleIds
        .filter(id => id !== vehicleId)
        .sort((a, b) => a - b);
      nextState.path.push(vehicleId);
      nextState.slots[emptySlotIndex] = {
        vehicleId: vehicle.id,
        colorValue: vehicle.colorValue,
        capacity: vehicle.capacity,
        remaining: vehicle.capacity
      };

      const settled = settleVehiclePuzzleStep(nextState, conveyorCapacity);
      nextState.departedVehicleIds.push(...settled.departedVehicleIds);
      const proofStep = {
        step: nextState.path.length,
        clickableVehicleIds: [...clickableVehicleIds],
        clickedVehicleId: vehicleId,
        enteredSlot: emptySlotIndex + 1,
        consumption: settled.consumption,
        departedVehicleIds: settled.departedVehicleIds,
        clearedFrontVehicleIds: [...vehicle.frontVehicleIds],
        unlockedVehicleIds: [...vehicle.backVehicleIds],
        remainingVehicleIds: [...nextState.remainingVehicleIds],
        slots: nextState.slots.map(cloneSimulationSlot),
        belt: [...nextState.belt],
        leftQueue: [...nextState.leftQueue],
        rightQueue: [...nextState.rightQueue],
        warnings: settled.warnings
      };
      nextState.proof.push(proofStep);
      return { nextState, proofStep, error: null };
    }

    function validateVehiclePath(state, input) {
      const parsed = parseVehiclePuzzleInput(state, input);
      const clickSequence = parseStableSimulationClickSequence(input && input.clickSequenceText);
      const errors = [...parsed.errors, ...clickSequence.errors];
      if (errors.length > 0) return { status: 'data-error', path: [], proof: [], errors };

      const vehiclesById = new Map(parsed.vehicles.map(vehicle => [vehicle.id, vehicle]));
      const searchState = createVehiclePuzzleInitialState(parsed);
      clickSequence.values.forEach((vehicleId, index) => {
        if (!searchState.remainingVehicleIds.includes(vehicleId)) {
          errors.push(`第 ${index + 1} 步点击 #${vehicleId} 非法：车辆不存在或已被点击`);
          return;
        }
        const clickableVehicleIds = getVehiclePuzzleClickableVehicleIds(searchState, vehiclesById);
        const vehicle = vehiclesById.get(vehicleId);
        const blockingIds = vehicle.frontVehicleIds.filter(frontId => searchState.remainingVehicleIds.includes(frontId));
        if (blockingIds.length > 0) {
          errors.push(`第 ${index + 1} 步点击 #${vehicleId} 非法：前方阻挡 ${blockingIds.map(id => `#${id}`).join('、')} 未解除`);
          return;
        }
        if (!clickableVehicleIds.includes(vehicleId)) {
          errors.push(`第 ${index + 1} 步点击 #${vehicleId} 非法：当前没有空车位或车辆不可点击`);
          return;
        }
        const applied = applyVehiclePuzzleClick(searchState, vehicleId, vehiclesById, parsed.conveyorCapacity, clickableVehicleIds);
        if (!applied.nextState) {
          errors.push(applied.error);
          return;
        }
        Object.assign(searchState, applied.nextState);
        if (applied.proofStep.warnings.length > 0) errors.push(...applied.proofStep.warnings);
      });
      if (errors.length > 0) {
        return {
          status: 'invalid',
          path: clickSequence.values,
          proof: searchState.proof,
          finalBelt: [...searchState.belt],
          finalLeftQueue: [...searchState.leftQueue],
          finalRightQueue: [...searchState.rightQueue],
          finalSlots: searchState.slots.map(cloneSimulationSlot),
          errors
        };
      }
      if (!isVehiclePuzzleSolved(searchState)) {
        errors.push(...getVehiclePuzzleUnsolvedReasons(searchState, parsed.vehicles.length));
        return {
          status: 'invalid',
          path: clickSequence.values,
          proof: searchState.proof,
          finalBelt: [...searchState.belt],
          finalLeftQueue: [...searchState.leftQueue],
          finalRightQueue: [...searchState.rightQueue],
          finalSlots: searchState.slots.map(cloneSimulationSlot),
          errors
        };
      }
      return {
        status: 'valid',
        path: clickSequence.values,
        proof: searchState.proof,
        finalBelt: [...searchState.belt],
        finalLeftQueue: [...searchState.leftQueue],
        finalRightQueue: [...searchState.rightQueue],
        finalSlots: searchState.slots.map(cloneSimulationSlot),
        errors: []
      };
    }

    function countVehiclePuzzleValues(values) {
      const counts = new Map();
      values.forEach(value => counts.set(value, (counts.get(value) || 0) + 1));
      return counts;
    }

    function getVehiclePuzzleServiceableColorValues(searchState, vehiclesById) {
      const serviceable = new Set(
        searchState.slots
          .filter(Boolean)
          .map(slot => slot.colorValue)
      );
      if (searchState.slots.some(slot => slot === null)) {
        getVehiclePuzzleClickableVehicleIds(searchState, vehiclesById)
          .forEach(id => {
            const vehicle = vehiclesById.get(id);
            if (vehicle) serviceable.add(vehicle.colorValue);
          });
      }
      return serviceable;
    }

    function getVehiclePuzzleBlockedDependencyPenalty(searchState, vehiclesById) {
      const serviceable = getVehiclePuzzleServiceableColorValues(searchState, vehiclesById);
      const beltCounts = countVehiclePuzzleValues(searchState.belt);
      const remaining = new Set(searchState.remainingVehicleIds);
      let penalty = 0;

      beltCounts.forEach((count, colorValue) => {
        if (serviceable.has(colorValue)) return;
        const targetVehicles = searchState.remainingVehicleIds
          .map(id => vehiclesById.get(id))
          .filter(vehicle => vehicle && vehicle.colorValue === colorValue);
        if (targetVehicles.length === 0) {
          penalty += count * 1000;
          return;
        }
        const bestUnresolvedDependencyCount = targetVehicles.reduce((best, vehicle) => {
          const unresolved = vehicle.frontVehicleIds
            .filter(frontId => remaining.has(frontId))
            .length;
          return Math.min(best, unresolved);
        }, Number.POSITIVE_INFINITY);
        penalty += count * (bestUnresolvedDependencyCount + 1);
      });

      return penalty;
    }

    function getVehiclePuzzleSlotDemandDistance(searchState) {
      const stream = [...searchState.belt, ...searchState.leftQueue, ...searchState.rightQueue];
      return searchState.slots.reduce((total, slot) => {
        if (!slot) return total;
        let needed = slot.remaining;
        let distance = stream.length + 1000;
        for (let index = 0; index < stream.length; index += 1) {
          if (stream[index] !== slot.colorValue) continue;
          needed -= 1;
          if (needed <= 0) {
            distance = index;
            break;
          }
        }
        return total + distance;
      }, 0);
    }

    function getVehiclePuzzleClickedRemainderDistance(searchState, clickedVehicleId) {
      const slot = searchState.slots.find(item => item && item.vehicleId === clickedVehicleId);
      if (!slot) return 0;
      const stream = [...searchState.belt, ...searchState.leftQueue, ...searchState.rightQueue];
      let needed = slot.remaining;
      for (let index = 0; index < stream.length; index += 1) {
        if (stream[index] !== slot.colorValue) continue;
        needed -= 1;
        if (needed <= 0) return index;
      }
      return stream.length + 1000;
    }

    function getVehiclePuzzleVisibleSlotMatchCount(searchState) {
      const slotColors = new Set(
        searchState.slots
          .filter(Boolean)
          .map(slot => slot.colorValue)
      );
      return searchState.belt.filter(value => slotColors.has(value)).length;
    }

    function getVehiclePuzzleContinuationPenalty(searchState, vehiclesById, conveyorCapacity) {
      if (isVehiclePuzzleSolved(searchState)) return 0;
      const emptySlots = searchState.slots.filter(slot => slot === null).length;
      if (emptySlots > 1) return 0;

      const clickableVehicleIds = getVehiclePuzzleClickableVehicleIds(searchState, vehiclesById);
      if (clickableVehicleIds.length === 0) return 1;
      const hasContinuation = clickableVehicleIds.some(vehicleId => {
        const applied = applyVehiclePuzzleClick(searchState, vehicleId, vehiclesById, conveyorCapacity, clickableVehicleIds);
        return applied.nextState
          && applied.proofStep.warnings.length === 0
          && !isVehiclePuzzleDeadlocked(applied.nextState);
      });
      return hasContinuation ? 0 : 1;
    }

    function scoreVehiclePathSearchState(searchState, vehiclesById, conveyorCapacity) {
      const lastId = searchState.path[searchState.path.length - 1];
      const lastVehicle = vehiclesById.get(lastId);
      const lastProof = searchState.proof[searchState.proof.length - 1];
      const departedCount = new Set(searchState.departedVehicleIds).size;
      const emptySlots = searchState.slots.filter(slot => slot === null).length;
      const remainingPassengers = searchState.belt.length + searchState.leftQueue.length + searchState.rightQueue.length;
      const lastConsumption = lastProof ? lastProof.consumption.reduce((sum, item) => sum + item.count, 0) : 0;
      const blockedDependencyPenalty = getVehiclePuzzleBlockedDependencyPenalty(searchState, vehiclesById);
      const slotDemandDistance = getVehiclePuzzleSlotDemandDistance(searchState);
      const visibleSlotMatches = getVehiclePuzzleVisibleSlotMatchCount(searchState);
      const continuationPenalty = getVehiclePuzzleContinuationPenalty(searchState, vehiclesById, conveyorCapacity);
      return departedCount * 1000000
        + searchState.path.length * 100000
        + (lastProof ? lastProof.departedVehicleIds.length * 50000 : 0)
        + emptySlots * 5000
        + visibleSlotMatches * 2000
        + lastConsumption * 1000
        + (lastVehicle ? lastVehicle.depth * 100 : 0)
        + (lastVehicle ? lastVehicle.backVehicleIds.length * 10 : 0)
        - continuationPenalty * 10000000
        - blockedDependencyPenalty * 10000
        - slotDemandDistance * 100
        - remainingPassengers
        - (lastId || 0) / 1000;
    }

    function createVehiclePuzzleSearchCandidate(searchState, vehicleId, vehiclesById, conveyorCapacity, clickableVehicleIds, blockedDependencyPenaltyBefore) {
      const applied = applyVehiclePuzzleClick(searchState, vehicleId, vehiclesById, conveyorCapacity, clickableVehicleIds);
      if (!applied.nextState || applied.proofStep.warnings.length > 0) return null;
      if (isVehiclePuzzleDeadlocked(applied.nextState)) return null;
      const consumptionCount = applied.proofStep.consumption.reduce((sum, item) => sum + item.count, 0);
      return {
        vehicleId,
        nextState: applied.nextState,
        clickedDeparted: applied.proofStep.departedVehicleIds.includes(vehicleId),
        departedCount: applied.proofStep.departedVehicleIds.length,
        consumptionCount,
        clickedRemainderDistance: getVehiclePuzzleClickedRemainderDistance(applied.nextState, vehicleId),
        targetDependencyGain: blockedDependencyPenaltyBefore - getVehiclePuzzleBlockedDependencyPenalty(applied.nextState, vehiclesById)
      };
    }

    function compareVehiclePuzzleSearchCandidates(a, b, vehiclesById, conveyorCapacity) {
      const vehicleA = vehiclesById.get(a.vehicleId);
      const vehicleB = vehiclesById.get(b.vehicleId);
      return Number(b.clickedDeparted) - Number(a.clickedDeparted)
        || b.targetDependencyGain - a.targetDependencyGain
        || b.departedCount - a.departedCount
        || a.clickedRemainderDistance - b.clickedRemainderDistance
        || b.consumptionCount - a.consumptionCount
        || scoreVehiclePathSearchState(b.nextState, vehiclesById, conveyorCapacity) - scoreVehiclePathSearchState(a.nextState, vehiclesById, conveyorCapacity)
        || (vehicleB ? vehicleB.backVehicleIds.length : 0) - (vehicleA ? vehicleA.backVehicleIds.length : 0)
        || (vehicleB ? vehicleB.depth : 0) - (vehicleA ? vehicleA.depth : 0)
        || a.vehicleId - b.vehicleId;
    }

    function getVehiclePuzzleFrontierDiversityKey(searchState, vehiclesById) {
      const slots = searchState.slots
        .map(slot => (slot ? `${slot.colorValue}:${Math.min(slot.remaining, 3)}` : '_'))
        .sort()
        .join(',');
      return [
        slots,
        getVehiclePuzzleBlockedDependencyPenalty(searchState, vehiclesById),
        searchState.belt.slice(0, 8).join(',')
      ].join('|');
    }

    function selectVehiclePuzzleFrontier(nextFrontier, beamWidth, vehiclesById, conveyorCapacity) {
      const scored = nextFrontier
        .map(searchState => ({ searchState, score: scoreVehiclePathSearchState(searchState, vehiclesById, conveyorCapacity) }))
        .sort((a, b) => b.score - a.score);
      if (scored.length <= beamWidth) return scored.map(item => item.searchState);

      const selected = [];
      const selectedStates = new Set();
      const usedKeys = new Set();
      const diversityQuota = Math.max(1, Math.floor(beamWidth * 0.6));

      scored.forEach(item => {
        if (selected.length >= diversityQuota) return;
        const key = getVehiclePuzzleFrontierDiversityKey(item.searchState, vehiclesById);
        if (usedKeys.has(key)) return;
        usedKeys.add(key);
        selectedStates.add(item.searchState);
        selected.push(item.searchState);
      });

      scored.forEach(item => {
        if (selected.length >= beamWidth || selectedStates.has(item.searchState)) return;
        selectedStates.add(item.searchState);
        selected.push(item.searchState);
      });

      return selected;
    }

    function solveVehiclePath(state, input) {
      const parsed = parseVehiclePuzzleInput(state, input);
      if (parsed.errors.length > 0) {
        return {
          status: 'data-error',
          path: [],
          proof: [],
          errors: parsed.errors,
          search: { expandedStates: 0, beamWidth: 0, branchLimit: 0, truncated: false }
        };
      }

      const beamWidth = parsePositiveInteger(input && input.beamWidth) || 192;
      const branchLimit = parsePositiveInteger(input && input.branchLimit) || 24;
      const vehiclesById = new Map(parsed.vehicles.map(vehicle => [vehicle.id, vehicle]));
      let frontier = [createVehiclePuzzleInitialState(parsed)];
      const seen = new Set(frontier.map(hashVehiclePuzzleSearchState));
      let expandedStates = 0;
      let truncated = false;

      while (frontier.length > 0) {
        const nextFrontier = [];
        let allStatesStuck = true;
        for (const searchState of frontier) {
          if (isVehiclePuzzleSolved(searchState)) {
            return {
              status: 'solved',
              path: searchState.path,
              proof: searchState.proof,
              finalBelt: [...searchState.belt],
              finalLeftQueue: [...searchState.leftQueue],
              finalRightQueue: [...searchState.rightQueue],
              finalSlots: searchState.slots.map(cloneSimulationSlot),
              errors: [],
              search: { expandedStates, beamWidth, branchLimit, truncated }
            };
          }

          const clickableVehicleIds = getVehiclePuzzleClickableVehicleIds(searchState, vehiclesById);
          if (clickableVehicleIds.length === 0) continue;
          allStatesStuck = false;
          const blockedDependencyPenaltyBefore = getVehiclePuzzleBlockedDependencyPenalty(searchState, vehiclesById);
          const candidates = clickableVehicleIds
            .map(vehicleId => createVehiclePuzzleSearchCandidate(
              searchState,
              vehicleId,
              vehiclesById,
              parsed.conveyorCapacity,
              clickableVehicleIds,
              blockedDependencyPenaltyBefore
            ))
            .filter(Boolean)
            .sort((a, b) => compareVehiclePuzzleSearchCandidates(a, b, vehiclesById, parsed.conveyorCapacity));

          if (candidates.length > branchLimit) truncated = true;
          candidates.slice(0, branchLimit).forEach(candidate => {
            const hash = hashVehiclePuzzleSearchState(candidate.nextState);
            if (seen.has(hash)) return;
            seen.add(hash);
            expandedStates += 1;
            nextFrontier.push(candidate.nextState);
          });
        }

        if (nextFrontier.length === 0) {
          const bestState = frontier[0] || createVehiclePuzzleInitialState(parsed);
          return {
            status: truncated ? 'search-failed' : 'proved-unsolvable',
            path: bestState.path,
            proof: bestState.proof,
            finalBelt: [...bestState.belt],
            finalLeftQueue: [...bestState.leftQueue],
            finalRightQueue: [...bestState.rightQueue],
            finalSlots: bestState.slots.map(cloneSimulationSlot),
            errors: allStatesStuck
              ? getVehiclePuzzleUnsolvedReasons(bestState, parsed.vehicles.length)
              : ['搜索资源内未保留可继续状态'],
            search: { expandedStates, beamWidth, branchLimit, truncated }
          };
        }

        if (nextFrontier.length > beamWidth) truncated = true;
        frontier = selectVehiclePuzzleFrontier(nextFrontier, beamWidth, vehiclesById, parsed.conveyorCapacity);
      }

      return {
        status: truncated ? 'search-failed' : 'proved-unsolvable',
        path: [],
        proof: [],
        finalBelt: [],
        finalLeftQueue: [],
        finalRightQueue: [],
        finalSlots: [null, null, null, null],
        errors: ['搜索结束但没有找到覆盖全部车辆的路径'],
        search: { expandedStates, beamWidth, branchLimit, truncated }
      };
    }

    function createPathSolveProgressSnapshot(details) {
      return {
        status: 'running',
        depth: details.depth || 0,
        expandedStates: details.expandedStates || 0,
        frontierLength: details.frontierLength || 0,
        processedStates: details.processedStates || 0,
        nextFrontierLength: details.nextFrontierLength || 0,
        bestPathLength: details.bestPathLength || 0,
        beamWidth: details.beamWidth || 0,
        branchLimit: details.branchLimit || 0,
        truncated: Boolean(details.truncated)
      };
    }

    async function solveVehiclePathAsync(state, input, options = {}) {
      const parsed = parseVehiclePuzzleInput(state, input);
      if (parsed.errors.length > 0) {
        return {
          status: 'data-error',
          path: [],
          proof: [],
          errors: parsed.errors,
          search: { expandedStates: 0, beamWidth: 0, branchLimit: 0, truncated: false }
        };
      }

      const beamWidth = parsePositiveInteger(input && input.beamWidth) || 192;
      const branchLimit = parsePositiveInteger(input && input.branchLimit) || 24;
      const vehiclesById = new Map(parsed.vehicles.map(vehicle => [vehicle.id, vehicle]));
      let frontier = [createVehiclePuzzleInitialState(parsed)];
      const seen = new Set(frontier.map(hashVehiclePuzzleSearchState));
      let expandedStates = 0;
      let truncated = false;
      let depth = 0;
      let bestPathLength = 0;
      let lastProgressAt = 0;
      const onProgress = typeof options.onProgress === 'function' ? options.onProgress : null;
      const shouldCancel = typeof options.shouldCancel === 'function' ? options.shouldCancel : () => false;
      const yieldToBrowser = typeof options.yieldToBrowser === 'function'
        ? options.yieldToBrowser
        : () => Promise.resolve();

      const publishProgress = async (partial, force = false) => {
        if (!onProgress) return;
        const now = Date.now();
        if (!force && now - lastProgressAt < PATH_SOLVE_PROGRESS_INTERVAL_MS) return;
        lastProgressAt = now;
        onProgress(createPathSolveProgressSnapshot({
          depth,
          expandedStates,
          frontierLength: frontier.length,
          bestPathLength,
          beamWidth,
          branchLimit,
          truncated,
          ...partial
        }));
        await yieldToBrowser();
      };

      await publishProgress({ processedStates: 0, nextFrontierLength: 0 }, true);

      while (frontier.length > 0) {
        const nextFrontier = [];
        let allStatesStuck = true;
        let processedStates = 0;
        for (const searchState of frontier) {
          if (shouldCancel()) return null;
          bestPathLength = Math.max(bestPathLength, searchState.path.length);
          if (isVehiclePuzzleSolved(searchState)) {
            return {
              status: 'solved',
              path: searchState.path,
              proof: searchState.proof,
              finalBelt: [...searchState.belt],
              finalLeftQueue: [...searchState.leftQueue],
              finalRightQueue: [...searchState.rightQueue],
              finalSlots: searchState.slots.map(cloneSimulationSlot),
              errors: [],
              search: { expandedStates, beamWidth, branchLimit, truncated }
            };
          }

          const clickableVehicleIds = getVehiclePuzzleClickableVehicleIds(searchState, vehiclesById);
          if (clickableVehicleIds.length === 0) {
            processedStates += 1;
            await publishProgress({ processedStates, nextFrontierLength: nextFrontier.length });
            continue;
          }
          allStatesStuck = false;
          const blockedDependencyPenaltyBefore = getVehiclePuzzleBlockedDependencyPenalty(searchState, vehiclesById);
          const candidates = clickableVehicleIds
            .map(vehicleId => createVehiclePuzzleSearchCandidate(
              searchState,
              vehicleId,
              vehiclesById,
              parsed.conveyorCapacity,
              clickableVehicleIds,
              blockedDependencyPenaltyBefore
            ))
            .filter(Boolean)
            .sort((a, b) => compareVehiclePuzzleSearchCandidates(a, b, vehiclesById, parsed.conveyorCapacity));

          if (candidates.length > branchLimit) truncated = true;
          candidates.slice(0, branchLimit).forEach(candidate => {
            const hash = hashVehiclePuzzleSearchState(candidate.nextState);
            if (seen.has(hash)) return;
            seen.add(hash);
            expandedStates += 1;
            bestPathLength = Math.max(bestPathLength, candidate.nextState.path.length);
            nextFrontier.push(candidate.nextState);
          });
          processedStates += 1;
          await publishProgress({ processedStates, nextFrontierLength: nextFrontier.length });
        }

        if (nextFrontier.length === 0) {
          const bestState = frontier[0] || createVehiclePuzzleInitialState(parsed);
          return {
            status: truncated ? 'search-failed' : 'proved-unsolvable',
            path: bestState.path,
            proof: bestState.proof,
            finalBelt: [...bestState.belt],
            finalLeftQueue: [...bestState.leftQueue],
            finalRightQueue: [...bestState.rightQueue],
            finalSlots: bestState.slots.map(cloneSimulationSlot),
            errors: allStatesStuck
              ? getVehiclePuzzleUnsolvedReasons(bestState, parsed.vehicles.length)
              : ['搜索资源内未保留可继续状态'],
            search: { expandedStates, beamWidth, branchLimit, truncated }
          };
        }

        if (nextFrontier.length > beamWidth) truncated = true;
        frontier = selectVehiclePuzzleFrontier(nextFrontier, beamWidth, vehiclesById, parsed.conveyorCapacity);
        depth += 1;
        await publishProgress({ processedStates: 0, nextFrontierLength: 0 }, true);
      }

      return {
        status: truncated ? 'search-failed' : 'proved-unsolvable',
        path: [],
        proof: [],
        finalBelt: [],
        finalLeftQueue: [],
        finalRightQueue: [],
        finalSlots: [null, null, null, null],
        errors: ['搜索结束但没有找到覆盖全部车辆的路径'],
        search: { expandedStates, beamWidth, branchLimit, truncated }
      };
    }

    function addStableSimulationFittedPassengers(queue, colorValue, count) {
      for (let index = 0; index < count; index += 1) queue.push(colorValue);
    }

    function buildStableSimulationFittedQueue(order, vehiclesById, splits) {
      const splitBySourceIndex = new Map();
      splits.forEach(split => {
        const list = splitBySourceIndex.get(split.sourceIndex) || [];
        list.push(split);
        splitBySourceIndex.set(split.sourceIndex, list);
      });

      const chunks = order.map(vehicleId => {
        const vehicle = vehiclesById.get(vehicleId);
        return { colorValue: vehicle.colorValue, baseCount: vehicle.capacity, extras: [] };
      });

      splitBySourceIndex.forEach((list, sourceIndex) => {
        const source = chunks[sourceIndex];
        const totalRemaining = list.reduce((sum, split) => sum + split.remainingCount, 0);
        source.baseCount -= totalRemaining;
        list.forEach(split => {
          chunks[split.targetIndex].extras.push({
            colorValue: source.colorValue,
            count: split.remainingCount
          });
        });
      });

      const queue = [];
      chunks.forEach(chunk => {
        addStableSimulationFittedPassengers(queue, chunk.colorValue, chunk.baseCount);
        chunk.extras.forEach(extra => addStableSimulationFittedPassengers(queue, extra.colorValue, extra.count));
      });
      return queue;
    }

    function getStableSimulationRoleCount(result, role) {
      const group = result && Array.isArray(result.roleSummary)
        ? result.roleSummary.find(item => item.role === role)
        : null;
      return group ? group.vehicleIds.length : 0;
    }

    function isStableSimulationFitResultValid(result) {
      return result
        && Array.isArray(result.steps)
        && result.errors.length === 0
        && result.steps.every(step => step.enteredSlot !== null && step.warnings.length === 0)
        && result.finalSlots.every(slot => slot === null)
        && result.finalBelt.length === 0
        && result.finalReserveQueue.length === 0;
    }

    function getStableSimulationUnsolvedReasons(result, expectedVehicleCount = null) {
      if (!result || !Array.isArray(result.steps)) return ['未生成模拟结果'];
      const reasons = [];
      if (result.errors.length > 0) reasons.push(...result.errors);
      const warningSteps = result.steps.filter(step => step.warnings.length > 0).map(step => step.step);
      if (warningSteps.length > 0) reasons.push(`存在警告步骤：${warningSteps.join(',')}`);
      if (result.steps.some(step => step.enteredSlot === null)) reasons.push('存在未进入车位的点击');
      if (result.finalSlots.some(slot => slot !== null)) reasons.push('最终仍有车辆占位');
      if (result.finalBelt.length > 0) reasons.push('最终传送带未清空');
      if (result.finalReserveQueue.length > 0) reasons.push('最终补充队列未清空');
      const departedCount = new Set(result.steps.flatMap(step => step.departedVehicleIds)).size;
      if (expectedVehicleCount !== null && departedCount !== expectedVehicleCount) {
        reasons.push(`开走车辆数 ${departedCount}/${expectedVehicleCount}`);
      }
      return reasons;
    }

    function countStableSimulationRoleSummary(roleSummary) {
      const counts = new Map();
      if (!Array.isArray(roleSummary)) return counts;
      roleSummary.forEach(group => {
        if (group && typeof group.role === 'string' && Array.isArray(group.vehicleIds)) {
          counts.set(group.role, group.vehicleIds.length);
        }
      });
      return counts;
    }
