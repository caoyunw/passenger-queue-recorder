<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>乘客队列记录工具</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #172126;
      --muted: #65757d;
      --paper: #f3f1e9;
      --panel: #fffdf7;
      --line: #c9cec8;
      --rail: #1e2b30;
      --rail-soft: #2d3c41;
      --signal: #f2bd43;
      --signal-dark: #785610;
      --ok: #39775d;
      --danger: #b4483f;
      --shadow: 0 14px 30px rgba(31, 43, 48, 0.14);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background-color: var(--paper);
      background-image:
        linear-gradient(rgba(44, 61, 66, 0.055) 1px, transparent 1px),
        linear-gradient(90deg, rgba(44, 61, 66, 0.055) 1px, transparent 1px);
      background-size: 22px 22px;
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    button:focus-visible,
    input:focus-visible,
    textarea:focus-visible,
    select:focus-visible {
      outline: 3px solid var(--signal);
      outline-offset: 3px;
    }

    .app-shell {
      display: grid;
      grid-template-columns: 252px minmax(0, 1fr);
      min-height: 100vh;
    }

    .sidebar {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      padding: 24px 18px 18px;
      color: #f4f1e7;
      background: var(--rail);
      border-right: 4px solid var(--signal);
    }

    .brand-kicker,
    .eyebrow,
    .stage-code,
    .panel-label {
      margin: 0;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .brand-kicker {
      color: var(--signal);
    }

    .brand-title {
      margin: 8px 0 0;
      font-size: 23px;
      line-height: 1.18;
      letter-spacing: 0.04em;
    }

    .brand-subtitle {
      margin: 12px 0 0;
      color: #bec9c6;
      font-size: 13px;
      line-height: 1.7;
    }

    #stageNav {
      display: grid;
      gap: 8px;
      margin-top: 34px;
    }

    .stage-button {
      display: grid;
      grid-template-columns: 34px 1fr;
      gap: 10px;
      align-items: center;
      min-height: 58px;
      padding: 10px;
      color: #d9e0de;
      text-align: left;
      background: transparent;
      border: 1px solid rgba(222, 231, 228, 0.18);
      border-radius: 4px;
      transition: background 160ms ease, border-color 160ms ease, transform 160ms ease;
    }

    .stage-button:hover {
      background: rgba(255, 255, 255, 0.06);
      border-color: rgba(242, 189, 67, 0.54);
      transform: translateX(2px);
    }

    .stage-button.is-active {
      color: #172126;
      background: var(--signal);
      border-color: var(--signal);
    }

    .stage-index {
      display: grid;
      width: 30px;
      height: 30px;
      place-items: center;
      font-size: 12px;
      font-weight: 900;
      border: 1px solid currentColor;
      border-radius: 50%;
    }

    .stage-name {
      display: block;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 0.05em;
    }

    .stage-code {
      display: block;
      margin-top: 3px;
      color: inherit;
      opacity: 0.62;
      font-size: 9px;
    }

    .save-panel {
      margin-top: auto;
      padding-top: 18px;
      border-top: 1px solid rgba(222, 231, 228, 0.2);
    }

    #saveState {
      display: flex;
      gap: 8px;
      align-items: center;
      margin: 0;
      color: #d1dcda;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    #saveState::before {
      width: 9px;
      height: 9px;
      content: "";
      background: var(--signal);
      border-radius: 50%;
      box-shadow: 0 0 0 3px rgba(242, 189, 67, 0.16);
    }

    #saveState.is-saved::before {
      background: #7bcba4;
      box-shadow: 0 0 0 3px rgba(123, 203, 164, 0.16);
    }

    #saveState.is-error::before {
      background: #ef766c;
      box-shadow: 0 0 0 3px rgba(239, 118, 108, 0.16);
    }

    .workspace {
      width: min(1180px, 100%);
      padding: 34px 38px 42px;
    }

    .workspace-header {
      display: flex;
      gap: 24px;
      align-items: end;
      justify-content: space-between;
      padding-bottom: 18px;
      border-bottom: 2px solid var(--ink);
    }

    .eyebrow,
    .panel-label {
      color: var(--signal-dark);
    }

    .workspace-title {
      margin: 7px 0 0;
      font-size: clamp(29px, 4vw, 44px);
      line-height: 1;
      letter-spacing: 0.03em;
    }

    .count-card {
      min-width: 126px;
      padding: 12px 16px;
      text-align: right;
      background: var(--ink);
      color: #fffdf7;
      border-radius: 3px;
      box-shadow: 5px 5px 0 rgba(242, 189, 67, 0.72);
    }

    .count-card span {
      display: block;
      color: #bdcac8;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.12em;
    }

    .count-card strong {
      display: block;
      margin-top: 2px;
      font-size: 34px;
      line-height: 1;
    }

    .work-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 280px;
      gap: 18px;
      margin-top: 22px;
    }

    .panel {
      background: rgba(255, 253, 247, 0.94);
      border: 1px solid var(--line);
      border-radius: 4px;
      box-shadow: var(--shadow);
    }

    .input-panel {
      padding: 20px;
    }

    .help-panel {
      padding: 18px;
      background: #e8ece7;
      box-shadow: none;
    }

    .help-panel h2,
    .sequence-panel h2 {
      margin: 7px 0 0;
      font-size: 17px;
    }

    .help-panel p {
      margin: 12px 0 0;
      color: #56666c;
      font-size: 13px;
      line-height: 1.8;
    }

    .key-list {
      display: grid;
      gap: 9px;
      margin-top: 16px;
    }

    .key-line {
      display: flex;
      gap: 8px;
      align-items: center;
      color: #46555b;
      font-size: 12px;
    }

    kbd {
      min-width: 30px;
      padding: 4px 6px;
      color: #fffdf7;
      text-align: center;
      background: var(--rail);
      border: 1px solid #66777b;
      border-bottom-width: 3px;
      border-radius: 3px;
      font-size: 11px;
      font-weight: 800;
    }

    .color-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(136px, 1fr));
      gap: 10px;
      margin-top: 14px;
    }

    .color-button,
    .add-color-button {
      min-height: 88px;
      padding: 12px 14px;
      text-align: left;
      border: 2px solid rgba(23, 33, 38, 0.48);
      border-radius: 4px;
      box-shadow: 0 4px 0 rgba(23, 33, 38, 0.18);
      transition: transform 120ms ease, box-shadow 120ms ease;
    }

    .color-card {
      display: grid;
      grid-template-rows: minmax(88px, auto) auto;
      gap: 7px;
      min-width: 0;
    }

    .color-button:hover,
    .add-color-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 0 rgba(23, 33, 38, 0.18);
    }

    .color-button:active,
    .add-color-button:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 rgba(23, 33, 38, 0.18);
    }

    .color-button {
      color: #fff;
      background: var(--button-color);
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.36);
    }

    .color-button.uses-dark-text,
    .sequence-chip.uses-dark-text {
      color: var(--ink);
      text-shadow: none;
    }

    .color-button span,
    .add-color-button span {
      display: block;
      font-size: 20px;
      font-weight: 900;
      letter-spacing: 0.06em;
    }

    .color-button small,
    .add-color-button small {
      display: block;
      margin-top: 7px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.09em;
    }

    .add-color-button {
      color: var(--ink);
      background:
        linear-gradient(135deg, rgba(242, 189, 67, 0.22) 25%, transparent 25%) -8px 0 / 16px 16px,
        linear-gradient(225deg, rgba(242, 189, 67, 0.22) 25%, transparent 25%) -8px 0 / 16px 16px,
        #fff9e8;
      border-style: dashed;
    }

    .color-quick-row {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 4px;
    }

    .color-quick-button {
      min-width: 0;
      min-height: 30px;
      padding: 0 4px;
      color: var(--ink);
      background: #fffdf7;
      border: 1px solid rgba(23, 33, 38, 0.42);
      border-radius: 3px;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0;
      box-shadow: 0 2px 0 rgba(23, 33, 38, 0.12);
    }

    .color-quick-button.is-remove {
      color: #fffdf7;
      background: var(--danger);
      border-color: rgba(23, 33, 38, 0.5);
    }

    .color-quick-button:hover {
      transform: translateY(-1px);
    }

    .sequence-panel {
      margin-top: 18px;
      padding: 20px;
    }

    .sequence-strip {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      min-height: 74px;
      margin-top: 16px;
      padding: 12px;
      background: #edf0eb;
      border: 1px dashed #9da8a4;
      border-radius: 4px;
    }

    .sequence-chip {
      display: grid;
      width: 54px;
      height: 54px;
      place-items: center;
      color: #fff;
      background: var(--chip-color);
      border: 3px solid #fff;
      border-radius: 50%;
      box-shadow: 0 0 0 2px var(--ink), 0 4px 0 rgba(23, 33, 38, 0.22);
      font-size: 15px;
      font-weight: 900;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.46);
      transition: transform 120ms ease;
    }

    .sequence-chip:hover {
      transform: translateY(-3px) scale(1.04);
    }

    .empty-sequence {
      align-self: center;
      margin: 0;
      color: #718087;
      font-size: 13px;
    }

    .action-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: space-between;
      margin-top: 18px;
    }

    .action-button {
      min-height: 46px;
      padding: 0 18px;
      border: 1px solid var(--ink);
      border-radius: 3px;
      font-size: 14px;
      font-weight: 900;
      letter-spacing: 0.05em;
    }

    .action-button.secondary {
      color: var(--ink);
      background: #fffdf7;
    }

    .action-button.primary {
      color: #fff;
      background: var(--ink);
    }

    .action-button:disabled {
      cursor: not-allowed;
      opacity: 0.42;
    }

    .config-output {
      max-width: 1080px;
      padding: 28px;
      background: rgba(255, 253, 247, 0.94);
      border: 1px solid var(--line);
      border-left: 7px solid var(--signal);
      box-shadow: var(--shadow);
    }

    .config-output h1 {
      margin: 8px 0 0;
      font-size: clamp(28px, 4vw, 42px);
    }

    .config-output > p {
      margin: 17px 0 0;
      color: var(--muted);
      line-height: 1.8;
    }

    .config-stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 1px;
      margin-top: 24px;
      overflow: hidden;
      background: var(--line);
      border: 1px solid var(--line);
    }

    .config-stat {
      padding: 14px;
      background: #f8f5ed;
    }

    .config-stat span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    .config-stat strong {
      display: block;
      margin-top: 6px;
      font-size: 24px;
    }

    .config-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      margin-top: 20px;
    }

    .config-card {
      padding: 16px;
      background: #fffdf7;
      border: 1px solid var(--line);
      border-top: 5px solid var(--rail);
    }

    .config-card-header,
    .config-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .config-card h2 {
      margin: 0;
      font-size: 18px;
    }

    .config-count {
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    .config-value {
      min-height: 57px;
      margin: 14px 0;
      padding: 12px;
      overflow-wrap: anywhere;
      color: #f7f4e9;
      background: var(--ink);
      border: 1px solid #0e171b;
      font-family: Consolas, "Courier New", monospace;
      font-size: 14px;
      line-height: 1.55;
    }

    .copy-button {
      min-height: 38px;
      padding: 0 14px;
      color: #fff;
      background: var(--rail);
      border: 1px solid var(--ink);
      border-radius: 3px;
      font-size: 13px;
      font-weight: 900;
    }

    .config-footer {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: space-between;
      margin-top: 22px;
      padding-top: 18px;
      border-top: 1px solid var(--line);
    }

    .action-button.danger {
      color: #fff;
      background: #9c2f2f;
      border-color: #6f2020;
    }

    .script-page {
      display: grid;
      gap: 18px;
    }

    .script-reconstruction-grid {
      display: grid;
      grid-template-columns: minmax(420px, 1.35fr) minmax(340px, 0.85fr);
      gap: 18px;
      align-items: start;
    }

    .script-left-stack,
    .script-right-stack {
      display: grid;
      gap: 18px;
      align-items: start;
    }

    .script-right-stack {
      position: sticky;
      top: 18px;
    }

    .script-field-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .script-field {
      display: grid;
      gap: 6px;
      color: #39484d;
      font-size: 13px;
      font-weight: 800;
    }

    .script-input,
    .script-textarea {
      width: 100%;
      color: var(--ink);
      background: #fff;
      border: 1px solid #899793;
      border-radius: 3px;
      font: inherit;
    }

    .script-input {
      min-height: 40px;
      padding: 8px 10px;
    }

    .script-textarea {
      min-height: 132px;
      padding: 10px 12px;
      resize: vertical;
      font-family: "Cascadia Mono", "Consolas", monospace;
      font-size: 13px;
      line-height: 1.55;
    }


    .script-list {
      display: grid;
      gap: 10px;
      margin-top: 12px;
    }

    .script-list-card {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: center;
      padding: 10px;
      background: #fffdf7;
      border: 1px solid var(--line);
    }

    .script-report {
      min-height: 260px;
      max-height: 520px;
      margin: 12px 0 0;
      padding: 14px;
      overflow: auto;
      white-space: pre-wrap;
      background: #fff;
      border: 1px solid var(--line);
      font-family: "Cascadia Mono", "Consolas", monospace;
      font-size: 12px;
      line-height: 1.65;
    }

    @media (max-width: 720px) {
      .config-grid {
        grid-template-columns: 1fr;
      }

      .script-reconstruction-grid,
      .script-field-grid {
        grid-template-columns: 1fr;
      }

      .script-right-stack {
        position: static;
      }
    }

    dialog {
      width: min(430px, calc(100vw - 32px));
      padding: 0;
      color: var(--ink);
      background: #fffdf7;
      border: 2px solid var(--ink);
      border-radius: 4px;
      box-shadow: 10px 10px 0 rgba(23, 33, 38, 0.25);
    }

    dialog::backdrop {
      background: rgba(23, 33, 38, 0.58);
    }

    .dialog-form {
      padding: 22px;
    }

    .dialog-form h2 {
      margin: 7px 0 0;
      font-size: 26px;
    }

    .dialog-note {
      margin: 9px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .dialog-field {
      display: grid;
      gap: 7px;
      margin-top: 18px;
      color: #39484d;
      font-size: 13px;
      font-weight: 800;
    }

    .dialog-field input[type="text"] {
      width: 100%;
      padding: 10px 11px;
      color: var(--ink);
      background: #fff;
      border: 1px solid #899793;
      border-radius: 3px;
    }

    .dialog-field input[type="color"] {
      width: 100%;
      height: 44px;
      padding: 4px;
      background: #fff;
      border: 1px solid #899793;
      border-radius: 3px;
    }

    #colorError {
      min-height: 20px;
      margin: 10px 0 0;
      color: var(--danger);
      font-size: 13px;
      font-weight: 800;
    }

    .dialog-actions {
      display: flex;
      gap: 9px;
      justify-content: flex-end;
      margin-top: 14px;
    }

    @media (max-width: 760px) {
      .app-shell {
        display: block;
      }

      .sidebar {
        min-height: auto;
        padding: 18px 16px 14px;
        border-right: 0;
        border-bottom: 4px solid var(--signal);
      }

      .brand-subtitle {
        display: none;
      }

      #stageNav {
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
        margin-top: 16px;
      }

      .stage-button {
        flex: 1 1 132px;
        min-height: 48px;
        padding: 8px;
      }

      .stage-index {
        width: 27px;
        height: 27px;
      }

      .save-panel {
        margin-top: 14px;
        padding-top: 12px;
      }

      .workspace {
        padding: 24px 16px 34px;
      }

      .work-grid {
        grid-template-columns: 1fr;
      }

      .help-panel {
        order: -1;
      }

      .color-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div>
        <p class="brand-kicker">BUS LEVEL / QUEUE LOG</p>
        <h1 class="brand-title">乘客队列<br>记录工作台</h1>
        <p class="brand-subtitle">按流程录入三个区域的乘客颜色，状态将在每次操作后自动保存。</p>
      </div>

      <nav id="stageNav" aria-label="录入流程">
        <button class="stage-button is-active" type="button" data-stage="conveyor" aria-current="step">
          <span class="stage-index">01</span>
          <span><span class="stage-name">传送带</span><small class="stage-code">CONVEYOR</small></span>
        </button>
        <button class="stage-button" type="button" data-stage="left">
          <span class="stage-index">02</span>
          <span><span class="stage-name">左侧队列</span><small class="stage-code">LEFT QUEUE</small></span>
        </button>
        <button class="stage-button" type="button" data-stage="right">
          <span class="stage-index">03</span>
          <span><span class="stage-name">右侧队列</span><small class="stage-code">RIGHT QUEUE</small></span>
        </button>
        <button class="stage-button" type="button" data-stage="configs">
          <span class="stage-index">04</span>
          <span><span class="stage-name">全部配置</span><small class="stage-code">CONFIGS</small></span>
        </button>
        <button class="stage-button" type="button" data-stage="simulation">
          <span class="stage-index">05</span>
          <span><span class="stage-name">立即结算模拟</span><small class="stage-code">STABLE SIM</small></span>
        </button>
      </nav>

      <div class="save-panel">
        <p id="saveState" role="status" aria-live="polite">状态已载入</p>
      </div>
    </aside>

    <main id="workspace" class="workspace"></main>
  </div>

  <dialog id="addColorDialog" aria-labelledby="addColorTitle">
    <form class="dialog-form" method="dialog">
      <p class="eyebrow">COLOR MAPPING</p>
      <h2 id="addColorTitle">新增颜色映射</h2>
      <p class="dialog-note">下一可用映射值：<strong id="nextColorValue">4</strong></p>

      <label class="dialog-field">
        颜色名称
        <input id="colorName" name="colorName" type="text" autocomplete="off" placeholder="例如：绿色">
      </label>

      <label class="dialog-field">
        颜色值
        <input id="colorHex" name="colorHex" type="color" value="#32a852">
      </label>

      <p id="colorError" role="alert"></p>

      <div class="dialog-actions">
        <button class="action-button secondary" type="button" data-action="cancel-color">取消</button>
        <button class="action-button primary" type="submit">保存颜色</button>
      </div>
    </form>
  </dialog>

  <script>
    const STORAGE_KEY = 'passenger-queue-recorder-state-v5';
    const SECTIONS = ['conveyor', 'left', 'right'];
    const STAGES = [...SECTIONS, 'configs', 'simulation'];
    const STATE_KEYS = ['colors', 'queues', 'histories', 'simulation', 'activeStage'];
    const COLOR_KEYS = ['name', 'value', 'hex'];
    const SIMULATION_KEYS = ['levelName', 'conveyorCapacity', 'passengerQueueText', 'vehicleTableText', 'clickSequenceText', 'result', 'errors'];
    const VEHICLE_CAPACITIES = [4, 6, 10];
    const HEX_PATTERN = /^#[0-9a-fA-F]{6}$/;
    const VEHICLE_CSV_COLOR_TO_QUEUE_COLOR = [3, 4, 5, 6, 1, 2, 9, 7, 8, 11, 10];
    const DEFAULT_COLORS = [
      { name: '红色', value: 1, hex: '#e54c4c' },
      { name: '黄色', value: 2, hex: '#f3bd3d' },
      { name: '蓝色', value: 3, hex: '#3478f6' },
      { name: '绿色', value: 4, hex: '#32a852' },
      { name: '粉色', value: 5, hex: '#ec71a5' },
      { name: '紫色', value: 6, hex: '#8b5cf6' },
      { name: '天蓝色', value: 7, hex: '#58bde9' },
      { name: '棕色', value: 8, hex: '#8b5a3c' },
      { name: '橙色', value: 9, hex: '#f97316' },
      { name: '黑色', value: 10, hex: '#202529' },
      { name: '白色', value: 11, hex: '#f7f7f2' }
    ];

    function createEmptySections() {
      return { conveyor: [], left: [], right: [] };
    }

    function createEmptySimulation() {
      return {
        levelName: '',
        conveyorCapacity: '',
        passengerQueueText: '',
        vehicleTableText: '',
        clickSequenceText: '',
        result: null,
        errors: []
      };
    }

    function createInitialState() {
      return {
        colors: DEFAULT_COLORS.map(color => ({ ...color })),
        queues: createEmptySections(),
        histories: createEmptySections(),
        simulation: createEmptySimulation(),
        activeStage: 'conveyor'
      };
    }

    function hasSection(state, section) {
      return Boolean(state
        && typeof state === 'object'
        && state.queues
        && state.histories
        && SECTIONS.includes(section)
        && Array.isArray(state.queues[section])
        && Array.isArray(state.histories[section]));
    }

    function updateSection(state, section, nextQueue) {
      if (!hasSection(state, section)) return state;

      return {
        ...state,
        queues: {
          ...state.queues,
          [section]: nextQueue
        },
        histories: {
          ...state.histories,
          [section]: [...state.histories[section], [...state.queues[section]]]
        }
      };
    }

    function appendValue(state, section, value) {
      if (!hasSection(state, section) || !isMappedValue(state, value)) return state;
      return updateSection(state, section, [...state.queues[section], value]);
    }

    function hasBatchValues(state, values) {
      return isDenseArray(values)
        && values.length > 0
        && values.every(value => isMappedValue(state, value));
    }

    function appendBatchValues(state, section, values) {
      if (!hasSection(state, section) || !hasBatchValues(state, values)) return state;
      return updateSection(state, section, [...state.queues[section], ...values]);
    }

    function removeBatchValues(state, section, value, count) {
      if (!hasSection(state, section)
        || !isMappedValue(state, value)
        || !Number.isInteger(count)
        || count < 1) {
        return state;
      }

      let remaining = count;
      const nextQueue = [...state.queues[section]];
      for (let index = nextQueue.length - 1; index >= 0 && remaining > 0; index -= 1) {
        if (nextQueue[index] === value) {
          nextQueue.splice(index, 1);
          remaining -= 1;
        }
      }

      if (nextQueue.length === state.queues[section].length) return state;
      return updateSection(state, section, nextQueue);
    }

    function removeAt(state, section, index) {
      if (!hasSection(state, section)
        || !Number.isInteger(index)
        || index < 0
        || index >= state.queues[section].length) {
        return state;
      }

      return updateSection(state, section, state.queues[section].filter((_, itemIndex) => itemIndex !== index));
    }

    function undo(state, section) {
      if (!hasSection(state, section) || state.histories[section].length === 0) return state;

      const history = state.histories[section];
      return {
        ...state,
        queues: {
          ...state.queues,
          [section]: [...history.at(-1)]
        },
        histories: {
          ...state.histories,
          [section]: history.slice(0, -1)
        }
      };
    }

    function addColor(state, name, hex) {
      if (!state
        || !Array.isArray(state.colors)
        || state.colors.some(color => !color || !Number.isSafeInteger(color.value) || color.value <= 0)
        || typeof name !== 'string'
        || name.trim() === ''
        || typeof hex !== 'string'
        || !HEX_PATTERN.test(hex)) {
        return state;
      }

      const maxValue = state.colors.reduce((max, color) => Math.max(max, color.value), 0);
      if (maxValue >= Number.MAX_SAFE_INTEGER) return state;

      return {
        ...state,
        colors: [
          ...state.colors,
          { name: name.trim(), value: maxValue + 1, hex }
        ]
      };
    }

    function getConfigs(state) {
      const conveyor = state.queues.conveyor.join(',');
      const left = state.queues.left.join(',');
      const right = state.queues.right.join(',');
      return {
        conveyor,
        left,
        right,
        combined: [...state.queues.conveyor, ...state.queues.left, ...state.queues.right].join(',')
      };
    }

    function startNextLevel(state) {
      return {
        colors: state.colors.map(color => ({ ...color })),
        queues: createEmptySections(),
        histories: createEmptySections(),
        simulation: state.simulation,
        activeStage: 'conveyor'
      };
    }

    function resetEverything() {
      return createInitialState();
    }

    function getColorName(state, value) {
      const color = state.colors.find(item => item.value === value);
      return color ? color.name : `映射${value}`;
    }

    function parsePositiveInteger(value) {
      if (typeof value !== 'string' && typeof value !== 'number') return null;
      const text = String(value).trim();
      if (!/^\d+$/.test(text)) return null;
      const number = Number(text);
      return Number.isSafeInteger(number) && number > 0 ? number : null;
    }

    function parseNonNegativeInteger(value) {
      if (typeof value !== 'string' && typeof value !== 'number') return null;
      const text = String(value).trim();
      if (!/^\d+$/.test(text)) return null;
      const number = Number(text);
      return Number.isSafeInteger(number) && number >= 0 ? number : null;
    }

    function isScriptColorValue(state, value) {
      return isMappedValue(state, value);
    }

    function getScriptColorName(state, value) {
      if (isScriptColorValue(state, value)) return getColorName(state, value);
      return `颜色${value}`;
    }

    function formatConsumption(state, consumption) {
      const parts = [...consumption.entries()]
        .filter(([, count]) => count > 0)
        .map(([colorValue, count]) => `${getScriptColorName(state, colorValue)}x${count}`);
      return parts.length ? parts.join('、') : '无';
    }

    function parseScriptIdList(value) {
      if (typeof value !== 'string' || value.trim() === '') return { values: [], errors: [] };
      const values = [];
      const errors = [];
      value.split(',').map(item => item.trim()).filter(Boolean).forEach(item => {
        const id = parsePositiveInteger(item);
        if (id === null) {
          errors.push(`依赖车辆 id「${item}」不是正整数`);
          return;
        }
        values.push(id);
      });
      return { values, errors };
    }

    function splitCsvLine(line) {
      const cells = [];
      let cell = '';
      let inQuotes = false;

      for (let index = 0; index < line.length; index += 1) {
        const char = line[index];
        if (char === '"') {
          if (inQuotes && line[index + 1] === '"') {
            cell += '"';
            index += 1;
          } else {
            inQuotes = !inQuotes;
          }
        } else if (char === ',' && !inQuotes) {
          cells.push(cell);
          cell = '';
        } else {
          cell += char;
        }
      }

      cells.push(cell);
      return cells.map(item => item.replace(/^\uFEFF/, '').trim());
    }

    function splitScriptTableRow(line) {
      const tabCells = line.split('\t').map(cell => cell.replace(/^\uFEFF/, '').trim());
      if (tabCells.length > 1) return tabCells;
      if (line.includes(',')) {
        const cells = splitCsvLine(line);
        return cells.length > 6 ? [...cells.slice(0, 5), cells.slice(5).join(',')] : cells;
      }
      return line.trim().split(/\s+/).map(cell => cell.replace(/^\uFEFF/, '').trim());
    }

    function mapVehicleCsvColorValue(value) {
      return Number.isSafeInteger(value) && value >= 0 && value < VEHICLE_CSV_COLOR_TO_QUEUE_COLOR.length
        ? VEHICLE_CSV_COLOR_TO_QUEUE_COLOR[value]
        : null;
    }

    function parseScriptVehicleTable(text) {
      if (typeof text !== 'string') return { vehicles: [], errors: ['车辆表必须是文本'] };

      const vehicles = [];
      const errors = [];
      const seenIds = new Set();
      const lines = text.replace(/\r/g, '').split('\n');

      lines.forEach((line, lineIndex) => {
        if (line.trim() === '') return;
        const isCsvRow = !line.includes('\t') && line.includes(',');
        const cells = splitScriptTableRow(line);
        const lineNumber = lineIndex + 1;
        const maybeHeader = lineNumber === 1 && parsePositiveInteger(cells[0]) === null;
        if (maybeHeader) return;

        const rowErrors = [];
        if (cells.length < 4) rowErrors.push('字段不足，至少需要车辆id、车颜色、车座位、深度');

        const id = parsePositiveInteger(cells[0]);
        const rawColorValue = parseNonNegativeInteger(cells[1]);
        const colorValue = rawColorValue !== null && isCsvRow ? mapVehicleCsvColorValue(rawColorValue) : rawColorValue;
        const capacity = parsePositiveInteger(cells[2]);
        const depth = parseNonNegativeInteger(cells[3]);
        const front = parseScriptIdList(cells[4] || '');
        const back = parseScriptIdList(cells[5] || '');

        if (id === null) rowErrors.push('车辆id必须是正整数');
        if (id !== null && seenIds.has(id)) rowErrors.push(`车辆id ${id} 重复`);
        if (rawColorValue === null) rowErrors.push('车颜色必须是非负整数映射值');
        if (rawColorValue !== null && colorValue === null) rowErrors.push('CSV 车颜色必须是 0-10 的车辆颜色映射值');
        if (!VEHICLE_CAPACITIES.includes(capacity)) rowErrors.push('车座位必须是 4、6 或 10');
        if (depth === null) rowErrors.push('深度必须是非负整数');
        rowErrors.push(...front.errors, ...back.errors);

        if (rowErrors.length > 0) {
          errors.push(`第 ${lineNumber} 行：${rowErrors.join('；')}`);
          return;
        }

        seenIds.add(id);
        vehicles.push({
          id,
          colorValue,
          capacity,
          depth,
          frontVehicleIds: front.values,
          backVehicleIds: back.values
        });
      });

      return { vehicles, errors };
    }

    function parseStableSimulationClickSequence(text) {
      if (typeof text !== 'string' || text.trim() === '') return { values: [], errors: [] };
      const values = [];
      const errors = [];
      text.split(',').map(item => item.trim()).filter(Boolean).forEach(item => {
        const id = parsePositiveInteger(item);
        if (id === null) {
          errors.push(`点击车辆 id「${item}」不是正整数`);
          return;
        }
        values.push(id);
      });
      return { values, errors };
    }

    function parseStableSimulationPassengerQueue(state, text) {
      if (typeof text !== 'string' || text.trim() === '') return { values: [], errors: [] };
      const values = [];
      const errors = [];
      text.split(',').forEach((rawItem, index) => {
        const item = rawItem.trim();
        if (item === '') {
          errors.push(`乘客队列第 ${index + 1} 项为空`);
          return;
        }

        const value = parseNonNegativeInteger(item);
        if (value === null) {
          errors.push(`乘客队列 token「${item}」不是非负整数`);
          return;
        }

        values.push(value);
        if (!isScriptColorValue(state, value)) {
          errors.push(`乘客颜色 ${value} 不存在`);
        }
      });
      return { values, errors };
    }

    function parseStableSimulationInput(state, input) {
      const conveyorCapacity = parsePositiveInteger(input && input.conveyorCapacity);
      const parsedPassengerQueue = parseStableSimulationPassengerQueue(state, input && input.passengerQueueText);
      const passengerQueue = parsedPassengerQueue.values;
      const vehicleText = input && typeof input.vehicleTableText === 'string' ? input.vehicleTableText : '';
      const parsedVehicles = parseScriptVehicleTable(vehicleText);
      const vehicles = parsedVehicles.vehicles.filter(vehicle => isScriptColorValue(state, vehicle.colorValue));
      const clickSequence = parseStableSimulationClickSequence(input && input.clickSequenceText);
      const errors = [...parsedPassengerQueue.errors, ...parsedVehicles.errors, ...clickSequence.errors];

      if (conveyorCapacity === null) errors.push('传送带容量必须是正整数');
      if (conveyorCapacity !== null && passengerQueue.length < conveyorCapacity) errors.push('乘客队列数量不能少于传送带容量');
      parsedVehicles.vehicles
        .filter(vehicle => !isScriptColorValue(state, vehicle.colorValue))
        .forEach(vehicle => errors.push(`车辆 ${vehicle.id} 的颜色映射 ${vehicle.colorValue} 不存在`));
      const vehicleIds = new Set(vehicles.map(vehicle => vehicle.id));
      clickSequence.values.forEach(id => {
        if (!vehicleIds.has(id)) errors.push(`点击车辆 ${id} 不存在于车辆表`);
      });

      return {
        conveyorCapacity,
        passengerQueue,
        belt: conveyorCapacity === null ? [] : passengerQueue.slice(0, conveyorCapacity),
        reserveQueue: conveyorCapacity === null ? [] : passengerQueue.slice(conveyorCapacity),
        vehicles,
        clickSequence: clickSequence.values,
        errors
      };
    }

    function cloneSimulationSlot(slot) {
      return slot ? { ...slot } : null;
    }

    function formatStableSimulationVehicle(state, vehiclesById, vehicleId) {
      const vehicle = vehiclesById.get(vehicleId);
      if (!vehicle) return `#${vehicleId}`;
      return `#${vehicle.id}${getScriptColorName(state, vehicle.colorValue)}${vehicle.capacity}`;
    }

    function findStableSimulationTargetSlot(slots, colorValue) {
      return slots.findIndex(slot => slot && slot.colorValue === colorValue && slot.remaining > 0);
    }

    function settleStableSimulationStep(working) {
      const consumption = new Map();
      const departedVehicleIds = [];
      const warnings = [];
      let guard = 0;
      let moved = true;

      while (moved && guard < 10000) {
        guard += 1;
        moved = false;
        for (let index = 0; index < working.belt.length; index += 1) {
          const colorValue = working.belt[index];
          const slotIndex = findStableSimulationTargetSlot(working.slots, colorValue);
          if (slotIndex === -1) continue;

          const slot = working.slots[slotIndex];
          slot.remaining -= 1;
          consumption.set(slot.vehicleId, (consumption.get(slot.vehicleId) || 0) + 1);
          working.belt.splice(index, 1);
          if (working.reserveQueue.length > 0) working.belt.push(working.reserveQueue.shift());
          if (slot.remaining === 0) {
            departedVehicleIds.push(slot.vehicleId);
            working.slots[slotIndex] = null;
          }
          moved = true;
          break;
        }
      }

      if (guard >= 10000) warnings.push('结算超过安全上限，已停止本步模拟');
      return {
        consumption: [...consumption.entries()].map(([vehicleId, count]) => ({ vehicleId, count })),
        departedVehicleIds,
        warnings
      };
    }

    function runStableSimulation(state, input) {
      const parsed = parseStableSimulationInput(state, input);
      if (parsed.errors.length > 0) {
        return {
          steps: [],
          summary: [],
          finalBelt: parsed.belt,
          finalReserveQueue: parsed.reserveQueue,
          finalSlots: [null, null, null, null],
          errors: parsed.errors
        };
      }

      const vehiclesById = new Map(parsed.vehicles.map(vehicle => [vehicle.id, vehicle]));
      const working = {
        belt: [...parsed.belt],
        reserveQueue: [...parsed.reserveQueue],
        slots: [null, null, null, null]
      };
      const steps = [];
      const allDepartedIds = [];
      const clickedVehicleIds = new Set();

      parsed.clickSequence.forEach((vehicleId, index) => {
        const vehicle = vehiclesById.get(vehicleId);
        const warnings = [];
        let enteredSlot = null;
        if (clickedVehicleIds.has(vehicleId)) {
          warnings.push(`车辆 ${vehicleId} 重复点击：已被点击`);
        } else {
          clickedVehicleIds.add(vehicleId);
          const emptySlotIndex = working.slots.findIndex(slot => slot === null);
          if (emptySlotIndex === -1) {
            warnings.push(`车辆 ${vehicleId} 点击失败：没有空车位`);
          } else {
            enteredSlot = emptySlotIndex + 1;
            working.slots[emptySlotIndex] = {
              vehicleId: vehicle.id,
              colorValue: vehicle.colorValue,
              capacity: vehicle.capacity,
              remaining: vehicle.capacity
            };
          }
        }

        const settled = settleStableSimulationStep(working);
        warnings.push(...settled.warnings);
        allDepartedIds.push(...settled.departedVehicleIds);
        steps.push({
          step: index + 1,
          clickedVehicleId: vehicleId,
          enteredSlot,
          consumption: settled.consumption,
          departedVehicleIds: settled.departedVehicleIds,
          slots: working.slots.map(cloneSimulationSlot),
          belt: [...working.belt],
          reserveQueueRemaining: working.reserveQueue.length,
          warnings
        });
      });

      const occupied = working.slots.filter(Boolean);
      const remainingPassengerCounts = new Map();
      [...working.belt, ...working.reserveQueue].forEach(value => {
        remainingPassengerCounts.set(value, (remainingPassengerCounts.get(value) || 0) + 1);
      });
      const summary = [
        `总点击数：${parsed.clickSequence.length}`,
        `成功进车数：${steps.filter(step => step.enteredSlot !== null).length}`,
        `开走车辆数：${allDepartedIds.length}`,
        `未开走占位车辆：${occupied.map(slot => formatStableSimulationVehicle(state, vehiclesById, slot.vehicleId)).join('、') || '无'}`,
        `剩余乘客：${formatConsumption(state, remainingPassengerCounts)}`,
        `警告步骤：${steps.filter(step => step.warnings.length > 0).map(step => step.step).join(',') || '无'}`
      ];

      return {
        steps,
        summary,
        finalBelt: [...working.belt],
        finalReserveQueue: [...working.reserveQueue],
        finalSlots: working.slots.map(cloneSimulationSlot),
        errors: []
      };
    }

    function setStableSimulationInput(state, input) {
      if (!isValidState(state) || !input || typeof input !== 'object') return state;
      const nextFields = {
        levelName: typeof input.levelName === 'string' ? input.levelName.trim() : state.simulation.levelName,
        conveyorCapacity: typeof input.conveyorCapacity === 'string' ? input.conveyorCapacity.trim() : state.simulation.conveyorCapacity,
        passengerQueueText: typeof input.passengerQueueText === 'string' ? input.passengerQueueText.trim() : state.simulation.passengerQueueText,
        vehicleTableText: typeof input.vehicleTableText === 'string' ? input.vehicleTableText.trim() : state.simulation.vehicleTableText,
        clickSequenceText: typeof input.clickSequenceText === 'string' ? input.clickSequenceText.trim() : state.simulation.clickSequenceText
      };
      const inputChanged = nextFields.levelName !== state.simulation.levelName
        || nextFields.conveyorCapacity !== state.simulation.conveyorCapacity
        || nextFields.passengerQueueText !== state.simulation.passengerQueueText
        || nextFields.vehicleTableText !== state.simulation.vehicleTableText
        || nextFields.clickSequenceText !== state.simulation.clickSequenceText;
      return {
        ...state,
        simulation: {
          ...state.simulation,
          ...nextFields,
          result: inputChanged ? null : state.simulation.result,
          errors: inputChanged ? [] : state.simulation.errors
        }
      };
    }

    function runStableSimulationState(state) {
      if (!isValidState(state)) return state;
      const result = runStableSimulation(state, state.simulation);
      return {
        ...state,
        simulation: {
          ...state.simulation,
          result: result.errors.length > 0 ? null : result,
          errors: result.errors
        }
      };
    }

    function clearStableSimulation(state) {
      if (!isValidState(state)) return state;
      return { ...state, simulation: createEmptySimulation() };
    }

    function getStableSimulationClickTokens(text) {
      return typeof text === 'string' && text.trim() !== ''
        ? text.split(',').map(token => token.trim()).filter(Boolean)
        : [];
    }

    function setStableSimulationClickTokens(state, tokens, runAfterChange = true) {
      const nextState = setStableSimulationInput(state, {
        clickSequenceText: tokens.join(',')
      });
      return runAfterChange && tokens.length > 0
        ? runStableSimulationState(nextState)
        : nextState;
    }

    function appendStableSimulationClick(state, vehicleId) {
      if (!isValidState(state) || parsePositiveInteger(vehicleId) === null) return state;
      const tokens = getStableSimulationClickTokens(state.simulation.clickSequenceText);
      tokens.push(String(vehicleId));
      return runStableSimulationState(setStableSimulationInput(state, {
        clickSequenceText: tokens.join(',')
      }));
    }

    function undoStableSimulationClick(state) {
      if (!isValidState(state)) return state;
      const tokens = getStableSimulationClickTokens(state.simulation.clickSequenceText);
      if (tokens.length === 0) return state;
      tokens.pop();
      return setStableSimulationClickTokens(state, tokens, true);
    }

    function deleteStableSimulationClickAt(state, index) {
      if (!isValidState(state) || !Number.isInteger(index) || index < 0) return state;
      const tokens = getStableSimulationClickTokens(state.simulation.clickSequenceText);
      if (index >= tokens.length) return state;
      tokens.splice(index, 1);
      return setStableSimulationClickTokens(state, tokens, true);
    }

    function clearStableSimulationClicks(state) {
      if (!isValidState(state)) return state;
      return {
        ...state,
        simulation: {
          ...state.simulation,
          clickSequenceText: '',
          result: null,
          errors: []
        }
      };
    }

    function getStableSimulationVehicleOptions(currentState) {
      const parsed = parseScriptVehicleTable(currentState.simulation.vehicleTableText);
      const vehicles = parsed.vehicles
        .filter(vehicle => isScriptColorValue(currentState, vehicle.colorValue))
        .sort((a, b) => a.id - b.id);
      const errors = [
        ...parsed.errors,
        ...parsed.vehicles
          .filter(vehicle => !isScriptColorValue(currentState, vehicle.colorValue))
          .map(vehicle => `车辆 ${vehicle.id} 的颜色映射 ${vehicle.colorValue} 不存在`)
      ];
      return { vehicles, errors };
    }

    function formatStableSimulationSlot(state, vehiclesById, slot, index) {
      if (!slot) return `${index + 1}:空`;
      return `${index + 1}:${formatStableSimulationVehicle(state, vehiclesById, slot.vehicleId)} 剩${slot.remaining}`;
    }

    function formatStableSimulationConsumption(state, vehiclesById, consumption) {
      return consumption.length
        ? consumption.map(item => `上客 ${item.count}（${formatStableSimulationVehicle(state, vehiclesById, item.vehicleId)}）`).join('、')
        : '无';
    }

    function getStableSimulationReportText(state) {
      if (!isValidState(state)) return '# 立即结算模拟\n\n状态无效';
      const title = state.simulation.levelName.trim() || '未命名关卡';
      const result = state.simulation.result;
      const parsedVehicles = parseScriptVehicleTable(state.simulation.vehicleTableText).vehicles;
      const vehiclesById = new Map(parsedVehicles.map(vehicle => [vehicle.id, vehicle]));
      const lines = [
        `# ${title} 立即结算模拟`,
        '',
        '## 输入',
        `传送带容量：${state.simulation.conveyorCapacity || '未填写'}`,
        `点击顺序：${state.simulation.clickSequenceText || '未填写'}`,
        '',
        '## 步骤日志',
        '步骤\t点击车辆\t进入车位\t上客统计\t开走车辆\t车位状态\t传送带\t补充队列剩余\t警告'
      ];

      if (state.simulation.errors.length > 0) {
        lines.push(`错误\t${state.simulation.errors.join('；')}`);
      } else if (result && result.steps.length > 0) {
        result.steps.forEach(step => {
          lines.push([
            step.step,
            formatStableSimulationVehicle(state, vehiclesById, step.clickedVehicleId),
            step.enteredSlot === null ? '进车失败' : `进车位 ${step.enteredSlot}`,
            formatStableSimulationConsumption(state, vehiclesById, step.consumption),
            step.departedVehicleIds.length > 0
              ? `开走 ${step.departedVehicleIds.map(id => formatStableSimulationVehicle(state, vehiclesById, id)).join('、')}`
              : '无',
            step.slots.map((slot, index) => formatStableSimulationSlot(state, vehiclesById, slot, index)).join(' | '),
            step.belt.join(',') || '空',
            step.reserveQueueRemaining,
            step.warnings.join('；') || '无'
          ].join('\t'));
        });
      } else if (result) {
        lines.push('无\t已运行，0 步');
      } else {
        lines.push('无\t尚未运行模拟');
      }

      lines.push('', '## 总览');
      if (result) lines.push(...result.summary);
      if (result) {
        lines.push(`最终车位：${result.finalSlots.some(Boolean)
          ? result.finalSlots.map((slot, index) => formatStableSimulationSlot(state, vehiclesById, slot, index)).join(' | ')
          : '空'}`);
      }
      if (!result && state.simulation.errors.length === 0) lines.push('尚未运行模拟');
      return lines.join('\n');
    }

    function isMappedValue(state, value) {
      return Boolean(state
        && Array.isArray(state.colors)
        && Number.isSafeInteger(value)
        && value > 0
        && state.colors.some(color => color && color.value === value));
    }

    function isDenseArray(array) {
      if (!Array.isArray(array) || Reflect.ownKeys(array).length !== array.length + 1) return false;

      for (let index = 0; index < array.length; index += 1) {
        if (!Object.prototype.hasOwnProperty.call(array, index)) return false;
      }

      return true;
    }

    function isValidQueue(queue, mappedValues) {
      return isDenseArray(queue)
        && queue.every(value => Number.isSafeInteger(value) && value > 0 && mappedValues.has(value));
    }

    function hasExactKeys(candidate, expectedKeys) {
      return candidate
        && typeof candidate === 'object'
        && !Array.isArray(candidate)
        && Object.keys(candidate).length === expectedKeys.length
        && expectedKeys.every(key => Object.prototype.hasOwnProperty.call(candidate, key));
    }

    function isValidSections(sections, mappedValues, validateHistory) {
      return hasExactKeys(sections, SECTIONS)
        && SECTIONS.every(section => validateHistory
          ? isDenseArray(sections[section])
            && sections[section].every(queue => isValidQueue(queue, mappedValues))
          : isValidQueue(sections[section], mappedValues));
    }

    function isValidSimulationResult(result) {
      return result === null || (result
        && typeof result === 'object'
        && Array.isArray(result.steps)
        && Array.isArray(result.summary)
        && Array.isArray(result.finalBelt)
        && Array.isArray(result.finalReserveQueue)
        && Array.isArray(result.finalSlots)
        && result.finalSlots.length === 4);
    }

    function isValidSimulation(simulation) {
      return hasExactKeys(simulation, SIMULATION_KEYS)
        && typeof simulation.levelName === 'string'
        && typeof simulation.conveyorCapacity === 'string'
        && typeof simulation.passengerQueueText === 'string'
        && typeof simulation.vehicleTableText === 'string'
        && typeof simulation.clickSequenceText === 'string'
        && isValidSimulationResult(simulation.result)
        && isDenseArray(simulation.errors)
        && simulation.errors.every(error => typeof error === 'string');
    }

    function isValidState(candidate) {
      if (!hasExactKeys(candidate, STATE_KEYS)
        || !isDenseArray(candidate.colors)
        || candidate.colors.length === 0) {
        return false;
      }

      const mappedValues = new Set();
      const hasValidColors = candidate.colors.every(color => {
        const isValid = hasExactKeys(color, COLOR_KEYS)
          && typeof color.name === 'string'
          && color.name.trim() !== ''
          && Number.isSafeInteger(color.value)
          && color.value > 0
          && !mappedValues.has(color.value)
          && typeof color.hex === 'string'
          && HEX_PATTERN.test(color.hex);

        if (isValid) mappedValues.add(color.value);
        return isValid;
      });

      return hasValidColors
        && isValidSections(candidate.queues, mappedValues, false)
        && isValidSections(candidate.histories, mappedValues, true)
        && isValidSimulation(candidate.simulation)
        && STAGES.includes(candidate.activeStage);
    }

    function normalizeSimulationForCurrentVersion(simulation) {
      return simulation && typeof simulation === 'object'
        ? { ...createEmptySimulation(), ...simulation }
        : createEmptySimulation();
    }

    function normalizeLoadedState(candidate) {
      if (!candidate || typeof candidate !== 'object') return createInitialState();
      const loadableKeys = new Set([...STATE_KEYS, 'parking', 'script']);
      if (!Object.keys(candidate).every(key => loadableKeys.has(key))) return createInitialState();
      const candidateWithCurrentData = {
        colors: candidate.colors,
        queues: candidate.queues,
        histories: candidate.histories,
        simulation: normalizeSimulationForCurrentVersion(candidate.simulation),
        activeStage: STAGES.includes(candidate.activeStage) ? candidate.activeStage : 'conveyor'
      };
      return isValidState(candidateWithCurrentData) ? candidateWithCurrentData : createInitialState();
    }

    function loadState() {

      } catch {

      }
    }

      renderStableSimulationCurrentState(workspace.querySelector('.stable-simulation-current'));
      renderStableSimulationStepList(workspace.querySelector('.stable-simulation-step-list'));
      workspace.querySelector('.script-report').textContent = report;
    }

    function fallbackCopyText(text) {
      const textarea = document.createElement('textarea');
      textarea.value = text;
      textarea.setAttribute('readonly', '');
      textarea.style.position = 'fixed';
      textarea.style.left = '-9999px';
      document.body.append(textarea);

      try {
        textarea.select();
        if (!document.execCommand('copy')) throw new Error('Clipboard fallback failed.');
      } finally {
        textarea.remove();
      }
    }

    async function copyText(text, button) {
      try {
        if (navigator.clipboard && typeof navigator.clipboard.writeText === 'function') {
          try {
            await navigator.clipboard.writeText(text);
          } catch (error) {
            fallbackCopyText(text);
          }
        } else {
          fallbackCopyText(text);
        }

        const previousLabel = button.textContent;
        button.textContent = '已复制';
        window.setTimeout(() => {
          if (button.isConnected) button.textContent = previousLabel;
        }, 1200);
        return true;
      } catch (error) {
        button.textContent = '复制失败';
        return false;
      }
    }

    function readFileAsText(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.addEventListener('load', () => resolve(String(reader.result || '')));
        reader.addEventListener('error', () => reject(reader.error || new Error('CSV 读取失败')));
        reader.readAsText(file, 'UTF-8');
      });
    }

    function render() {
      renderNavigation();
      if (SECTIONS.includes(state.activeStage)) {
        renderEntryStage();
      } else if (state.activeStage === 'configs') {
        renderConfigsStage();
      } else if (state.activeStage === 'simulation') {
        renderSimulationStage();
      } else {
        workspace.innerHTML = '<section class="panel input-panel"><p class="empty-sequence">未知阶段</p></section>';
      }
    }

    function openAddColorDialog() {
      colorName.value = '';
      colorHex.value = '#32a852';
      colorError.textContent = '';
      nextColorValue.textContent = String(getNextColorValue());
      addColorDialog.showModal();
      colorName.focus();
    }

    function getStableSimulationInputFromDom() {
      const readField = field => {
        const element = workspace.querySelector(`.simulation-input[data-simulation-field="${field}"]`);
        return element instanceof HTMLInputElement || element instanceof HTMLTextAreaElement
          ? element.value
          : '';
      };
      return {
        levelName: readField('levelName'),
        conveyorCapacity: readField('conveyorCapacity'),
        passengerQueueText: readField('passengerQueueText'),
        vehicleTableText: readField('vehicleTableText'),
        clickSequenceText: readField('clickSequenceText')
      };
    }

    stageNav.addEventListener('click', event => {
      const button = event.target.closest('.stage-button[data-stage]');
      if (!button) return;
      updateState({ ...state, activeStage: button.dataset.stage });
    });

    workspace.addEventListener('click', event => {
      const target = event.target.closest('button');
      if (!target) return;

      if (target.matches('.color-button[data-value]')) {
        updateState(appendValue(state, state.activeStage, Number(target.dataset.value)));
      } else if (target.matches('.color-quick-button[data-value][data-delta]')) {
        const value = Number(target.dataset.value);
        const delta = Number(target.dataset.delta);
        if (delta > 0) {
          updateState(appendBatchValues(state, state.activeStage, Array(delta).fill(value)));
        } else {
          updateState(removeBatchValues(state, state.activeStage, value, Math.abs(delta)));
        }
      } else if (target.matches('.sequence-chip[data-index]')) {
        updateState(removeAt(state, state.activeStage, Number(target.dataset.index)));
      } else if (target.matches('[data-action="undo"]')) {
        updateState(undo(state, state.activeStage));
      } else if (target.matches('[data-action="next"]')) {
        const nextStage = STAGES[STAGES.indexOf(state.activeStage) + 1];
        if (nextStage) updateState({ ...state, activeStage: nextStage });
      } else if (target.matches('[data-action="add-color"]')) {
        openAddColorDialog();
      } else if (target.matches('[data-action="copy-config"][data-config-key]')) {
        void copyText(getConfigs(state)[target.dataset.configKey], target);
      } else if (target.matches('[data-action="next-level"]')) {
        updateState(startNextLevel(state));
      } else if (target.matches('[data-action="reset-everything"]')
        && window.confirm('确定要清空全部队列和自定义颜色吗？')) {
        updateState(resetEverything());
      } else if (target.matches('[data-action="append-stable-simulation-click"][data-vehicle-id]')) {
        updateState(appendStableSimulationClick(
          setStableSimulationInput(state, getStableSimulationInputFromDom()),
          Number(target.dataset.vehicleId)
        ));
      } else if (target.matches('[data-action="run-stable-simulation"]')) {
        updateState(runStableSimulationState(setStableSimulationInput(state, getStableSimulationInputFromDom())));
      } else if (target.matches('[data-action="copy-stable-simulation-report"]')) {
        void copyText(getStableSimulationReportText(setStableSimulationInput(state, getStableSimulationInputFromDom())), target);
      } else if (target.matches('[data-action="undo-stable-simulation-click"]')) {
        updateState(undoStableSimulationClick(setStableSimulationInput(state, getStableSimulationInputFromDom())));
      } else if (target.matches('[data-action="delete-stable-simulation-step"][data-step-index]')) {
        updateState(deleteStableSimulationClickAt(
          setStableSimulationInput(state, getStableSimulationInputFromDom()),
          Number(target.dataset.stepIndex)
        ));
      } else if (target.matches('[data-action="clear-stable-simulation-clicks"]')
        && window.confirm('确定要清空点击车辆记录吗？基础输入会保留。')) {
        updateState(clearStableSimulationClicks(setStableSimulationInput(state, getStableSimulationInputFromDom())));
      } else if (target.matches('[data-action="clear-stable-simulation"]')
        && window.confirm('确定要清空立即结算模拟输入和结果吗？')) {
        updateState(clearStableSimulation(state));
      }
    });

    workspace.addEventListener('change', event => {
      const target = event.target;
      if ((target instanceof HTMLInputElement || target instanceof HTMLTextAreaElement)
        && target.matches('.simulation-input[data-simulation-field]')) {
        updateState(setStableSimulationInput(state, getStableSimulationInputFromDom()));
      } else if (target instanceof HTMLInputElement && target.matches('#simulationVehicleCsvFile') && target.files && target.files[0]) {
        void readFileAsText(target.files[0]).then(text => {
          const textarea = workspace.querySelector('.simulation-input[data-simulation-field="vehicleTableText"]');
          if (textarea instanceof HTMLTextAreaElement) textarea.value = text;
          updateState(setStableSimulationInput(state, {
            ...getStableSimulationInputFromDom(),
            vehicleTableText: text
          }));
        }).catch(error => {
          const textarea = workspace.querySelector('.simulation-input[data-simulation-field="vehicleTableText"]');
          if (textarea instanceof HTMLTextAreaElement) {
            textarea.value = error && error.message ? error.message : 'CSV 读取失败';
          }
        });
      }
    });

    addColorDialog.querySelector('[data-action="cancel-color"]').addEventListener('click', () => {
      addColorDialog.close();
    });

    addColorForm.addEventListener('submit', event => {
      event.preventDefault();
      if (colorName.value.trim() === '') {
        colorError.textContent = '请输入颜色名称。';
        colorName.focus();
        return;
      }

      const nextState = addColor(state, colorName.value, colorHex.value);
      if (nextState === state) {
        colorError.textContent = '颜色保存失败，请检查输入。';
        return;
      }

      addColorDialog.close();
      updateState(nextState);
    });

    document.addEventListener('keydown', event => {
      if (addColorDialog.open
        || !SECTIONS.includes(state.activeStage)
        || (event.target instanceof Element && event.target.closest('input, textarea, select'))) {
        return;
      }

      if (event.ctrlKey && event.key.toLowerCase() === 'z') {
        event.preventDefault();
        updateState(undo(state, state.activeStage));
        return;
      }

      if (!event.ctrlKey && !event.metaKey && !event.altKey && /^[0-9]$/.test(event.key)) {
        updateState(appendValue(state, state.activeStage, Number(event.key)));
      }
    });

    window.QueueRecorderApp = Object.freeze({
      getState: () => state,
      updateState,
      render,
      copyText
    });

    render();
  </script>
</body>
</html>
