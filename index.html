<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>乘客队列记录工具</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #172126;
      --muted: #65757d;
      --paper: #f3f1e9;
      --panel: #fffdf7;
      --line: #c9cec8;
      --rail: #1e2b30;
      --rail-soft: #2d3c41;
      --signal: #f2bd43;
      --signal-dark: #785610;
      --ok: #39775d;
      --danger: #b4483f;
      --shadow: 0 14px 30px rgba(31, 43, 48, 0.14);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background-color: var(--paper);
      background-image:
        linear-gradient(rgba(44, 61, 66, 0.055) 1px, transparent 1px),
        linear-gradient(90deg, rgba(44, 61, 66, 0.055) 1px, transparent 1px);
      background-size: 22px 22px;
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    button:focus-visible,
    input:focus-visible,
    textarea:focus-visible,
    select:focus-visible {
      outline: 3px solid var(--signal);
      outline-offset: 3px;
    }

    .app-shell {
      display: grid;
      grid-template-columns: 252px minmax(0, 1fr);
      min-height: 100vh;
    }

    .sidebar {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      padding: 24px 18px 18px;
      color: #f4f1e7;
      background: var(--rail);
      border-right: 4px solid var(--signal);
    }

    .brand-kicker,
    .eyebrow,
    .stage-code,
    .panel-label {
      margin: 0;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .brand-kicker {
      color: var(--signal);
    }

    .brand-title {
      margin: 8px 0 0;
      font-size: 23px;
      line-height: 1.18;
      letter-spacing: 0.04em;
    }

    .brand-subtitle {
      margin: 12px 0 0;
      color: #bec9c6;
      font-size: 13px;
      line-height: 1.7;
    }

    #stageNav {
      display: grid;
      gap: 8px;
      margin-top: 34px;
    }

    .stage-button {
      display: grid;
      grid-template-columns: 34px 1fr;
      gap: 10px;
      align-items: center;
      min-height: 58px;
      padding: 10px;
      color: #d9e0de;
      text-align: left;
      background: transparent;
      border: 1px solid rgba(222, 231, 228, 0.18);
      border-radius: 4px;
      transition: background 160ms ease, border-color 160ms ease, transform 160ms ease;
    }

    .stage-button:hover {
      background: rgba(255, 255, 255, 0.06);
      border-color: rgba(242, 189, 67, 0.54);
      transform: translateX(2px);
    }

    .stage-button.is-active {
      color: #172126;
      background: var(--signal);
      border-color: var(--signal);
    }

    .stage-index {
      display: grid;
      width: 30px;
      height: 30px;
      place-items: center;
      font-size: 12px;
      font-weight: 900;
      border: 1px solid currentColor;
      border-radius: 50%;
    }

    .stage-name {
      display: block;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 0.05em;
    }

    .stage-code {
      display: block;
      margin-top: 3px;
      color: inherit;
      opacity: 0.62;
      font-size: 9px;
    }

    .save-panel {
      margin-top: auto;
      padding-top: 18px;
      border-top: 1px solid rgba(222, 231, 228, 0.2);
    }

    #saveState {
      display: flex;
      gap: 8px;
      align-items: center;
      margin: 0;
      color: #d1dcda;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    #saveState::before {
      width: 9px;
      height: 9px;
      content: "";
      background: var(--signal);
      border-radius: 50%;
      box-shadow: 0 0 0 3px rgba(242, 189, 67, 0.16);
    }

    #saveState.is-saved::before {
      background: #7bcba4;
      box-shadow: 0 0 0 3px rgba(123, 203, 164, 0.16);
    }

    #saveState.is-error::before {
      background: #ef766c;
      box-shadow: 0 0 0 3px rgba(239, 118, 108, 0.16);
    }

    .workspace {
      width: min(1180px, 100%);
      padding: 34px 38px 42px;
    }

    .workspace-header {
      display: flex;
      gap: 24px;
      align-items: end;
      justify-content: space-between;
      padding-bottom: 18px;
      border-bottom: 2px solid var(--ink);
    }

    .eyebrow,
    .panel-label {
      color: var(--signal-dark);
    }

    .workspace-title {
      margin: 7px 0 0;
      font-size: clamp(29px, 4vw, 44px);
      line-height: 1;
      letter-spacing: 0.03em;
    }

    .count-card {
      min-width: 126px;
      padding: 12px 16px;
      text-align: right;
      background: var(--ink);
      color: #fffdf7;
      border-radius: 3px;
      box-shadow: 5px 5px 0 rgba(242, 189, 67, 0.72);
    }

    .count-card span {
      display: block;
      color: #bdcac8;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.12em;
    }

    .count-card strong {
      display: block;
      margin-top: 2px;
      font-size: 34px;
      line-height: 1;
    }

    .work-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 280px;
      gap: 18px;
      margin-top: 22px;
    }

    .panel {
      background: rgba(255, 253, 247, 0.94);
      border: 1px solid var(--line);
      border-radius: 4px;
      box-shadow: var(--shadow);
    }

    .input-panel {
      padding: 20px;
    }

    .help-panel {
      padding: 18px;
      background: #e8ece7;
      box-shadow: none;
    }

    .help-panel h2,
    .sequence-panel h2 {
      margin: 7px 0 0;
      font-size: 17px;
    }

    .help-panel p {
      margin: 12px 0 0;
      color: #56666c;
      font-size: 13px;
      line-height: 1.8;
    }

    .key-list {
      display: grid;
      gap: 9px;
      margin-top: 16px;
    }

    .key-line {
      display: flex;
      gap: 8px;
      align-items: center;
      color: #46555b;
      font-size: 12px;
    }

    kbd {
      min-width: 30px;
      padding: 4px 6px;
      color: #fffdf7;
      text-align: center;
      background: var(--rail);
      border: 1px solid #66777b;
      border-bottom-width: 3px;
      border-radius: 3px;
      font-size: 11px;
      font-weight: 800;
    }

    .color-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(136px, 1fr));
      gap: 10px;
      margin-top: 14px;
    }

    .color-button,
    .add-color-button {
      min-height: 88px;
      padding: 12px 14px;
      text-align: left;
      border: 2px solid rgba(23, 33, 38, 0.48);
      border-radius: 4px;
      box-shadow: 0 4px 0 rgba(23, 33, 38, 0.18);
      transition: transform 120ms ease, box-shadow 120ms ease;
    }

    .color-card {
      display: grid;
      grid-template-rows: minmax(88px, auto) auto;
      gap: 7px;
      min-width: 0;
    }

    .color-button:hover,
    .add-color-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 0 rgba(23, 33, 38, 0.18);
    }

    .color-button:active,
    .add-color-button:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 rgba(23, 33, 38, 0.18);
    }

    .color-button {
      color: #fff;
      background: var(--button-color);
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.36);
    }

    .color-button.uses-dark-text,
    .sequence-chip.uses-dark-text {
      color: var(--ink);
      text-shadow: none;
    }

    .color-button span,
    .add-color-button span {
      display: block;
      font-size: 20px;
      font-weight: 900;
      letter-spacing: 0.06em;
    }

    .color-button small,
    .add-color-button small {
      display: block;
      margin-top: 7px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.09em;
    }

    .add-color-button {
      color: var(--ink);
      background:
        linear-gradient(135deg, rgba(242, 189, 67, 0.22) 25%, transparent 25%) -8px 0 / 16px 16px,
        linear-gradient(225deg, rgba(242, 189, 67, 0.22) 25%, transparent 25%) -8px 0 / 16px 16px,
        #fff9e8;
      border-style: dashed;
    }

    .color-quick-row {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 4px;
    }

    .color-quick-button {
      min-width: 0;
      min-height: 30px;
      padding: 0 4px;
      color: var(--ink);
      background: #fffdf7;
      border: 1px solid rgba(23, 33, 38, 0.42);
      border-radius: 3px;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0;
      box-shadow: 0 2px 0 rgba(23, 33, 38, 0.12);
    }

    .color-quick-button.is-remove {
      color: #fffdf7;
      background: var(--danger);
      border-color: rgba(23, 33, 38, 0.5);
    }

    .color-quick-button:hover {
      transform: translateY(-1px);
    }

    .sequence-panel {
      margin-top: 18px;
      padding: 20px;
    }

    .sequence-strip {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      min-height: 74px;
      margin-top: 16px;
      padding: 12px;
      background: #edf0eb;
      border: 1px dashed #9da8a4;
      border-radius: 4px;
    }

    .sequence-chip {
      display: grid;
      width: 54px;
      height: 54px;
      place-items: center;
      color: #fff;
      background: var(--chip-color);
      border: 3px solid #fff;
      border-radius: 50%;
      box-shadow: 0 0 0 2px var(--ink), 0 4px 0 rgba(23, 33, 38, 0.22);
      font-size: 15px;
      font-weight: 900;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.46);
      transition: transform 120ms ease;
    }

    .sequence-chip:hover {
      transform: translateY(-3px) scale(1.04);
    }

    .empty-sequence {
      align-self: center;
      margin: 0;
      color: #718087;
      font-size: 13px;
    }

    .action-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: space-between;
      margin-top: 18px;
    }

    .action-button {
      min-height: 46px;
      padding: 0 18px;
      border: 1px solid var(--ink);
      border-radius: 3px;
      font-size: 14px;
      font-weight: 900;
      letter-spacing: 0.05em;
    }

    .action-button.secondary {
      color: var(--ink);
      background: #fffdf7;
    }

    .action-button.primary {
      color: #fff;
      background: var(--ink);
    }

    .action-button:disabled {
      cursor: not-allowed;
      opacity: 0.42;
    }

    .config-output {
      max-width: 1080px;
      padding: 28px;
      background: rgba(255, 253, 247, 0.94);
      border: 1px solid var(--line);
      border-left: 7px solid var(--signal);
      box-shadow: var(--shadow);
    }

    .config-output h1 {
      margin: 8px 0 0;
      font-size: clamp(28px, 4vw, 42px);
    }

    .config-output > p {
      margin: 17px 0 0;
      color: var(--muted);
      line-height: 1.8;
    }

    .config-stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 1px;
      margin-top: 24px;
      overflow: hidden;
      background: var(--line);
      border: 1px solid var(--line);
    }

    .config-stat {
      padding: 14px;
      background: #f8f5ed;
    }

    .config-stat span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    .config-stat strong {
      display: block;
      margin-top: 6px;
      font-size: 24px;
    }

    .config-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      margin-top: 20px;
    }

    .config-card {
      padding: 16px;
      background: #fffdf7;
      border: 1px solid var(--line);
      border-top: 5px solid var(--rail);
    }

    .config-card-header,
    .config-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .config-card h2 {
      margin: 0;
      font-size: 18px;
    }

    .config-count {
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    .config-value {
      min-height: 57px;
      margin: 14px 0;
      padding: 12px;
      overflow-wrap: anywhere;
      color: #f7f4e9;
      background: var(--ink);
      border: 1px solid #0e171b;
      font-family: Consolas, "Courier New", monospace;
      font-size: 14px;
      line-height: 1.55;
    }

    .copy-button {
      min-height: 38px;
      padding: 0 14px;
      color: #fff;
      background: var(--rail);
      border: 1px solid var(--ink);
      border-radius: 3px;
      font-size: 13px;
      font-weight: 900;
    }

    .config-footer {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: space-between;
      margin-top: 22px;
      padding-top: 18px;
      border-top: 1px solid var(--line);
    }

    .action-button.danger {
      color: #fff;
      background: #9c2f2f;
      border-color: #6f2020;
    }

    .parking-page {
      display: grid;
      gap: 18px;
    }

    .parking-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
    }

    .parking-slot {
      min-height: 184px;
      padding: 16px;
      background: #fffdf7;
      border: 1px solid var(--line);
      border-top: 6px solid var(--rail);
      box-shadow: 0 5px 0 rgba(23, 33, 38, 0.12);
    }

    .parking-slot.is-occupied {
      color: #fff;
      background:
        linear-gradient(135deg, rgba(255, 255, 255, 0.16), rgba(255, 255, 255, 0)),
        var(--slot-color);
      border-color: rgba(23, 33, 38, 0.52);
      border-top-color: var(--ink);
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.36);
    }

    .parking-slot.is-occupied.uses-dark-text {
      color: var(--ink);
      text-shadow: none;
    }

    .parking-slot.is-empty {
      display: grid;
      place-items: center;
      color: var(--muted);
      background: #f2efe6;
      border-style: dashed;
    }

    .parking-slot h3 {
      margin: 0;
      font-size: 18px;
    }

    .parking-slot.is-occupied .slot-label,
    .parking-slot.is-occupied .remaining-field {
      color: inherit;
    }

    .slot-label {
      display: block;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.08em;
    }

    .parking-controls {
      display: grid;
      grid-template-columns: minmax(180px, 1fr) 2fr;
      gap: 14px;
      align-items: end;
    }

    .vehicle-pick-grid,
    .saved-game-list {
      display: grid;
      gap: 10px;
      margin-top: 14px;
    }

    .vehicle-pick-grid {
      grid-template-columns: repeat(auto-fit, minmax(156px, 1fr));
    }

    .vehicle-pick-card {
      padding: 12px;
      color: #fff;
      background: var(--vehicle-color);
      border: 2px solid rgba(23, 33, 38, 0.42);
      border-radius: 4px;
      box-shadow: 0 4px 0 rgba(23, 33, 38, 0.18);
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.36);
    }

    .vehicle-pick-card.uses-dark-text {
      color: var(--ink);
      text-shadow: none;
    }

    .vehicle-pick-card strong {
      display: block;
      margin-bottom: 10px;
      font-size: 18px;
      letter-spacing: 0.05em;
    }

    .vehicle-capacity-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .vehicle-capacity-button {
      min-height: 36px;
      color: var(--ink);
      background: rgba(255, 253, 247, 0.92);
      border: 1px solid rgba(23, 33, 38, 0.44);
      border-radius: 3px;
      font-weight: 900;
    }

    .saved-game-card {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: center;
      padding: 12px;
      background: #fffdf7;
      border: 1px solid var(--line);
    }

    .remaining-input,
    .game-name-input,
    .parking-note {
      width: 100%;
      color: var(--ink);
      background: #fff;
      border: 1px solid #899793;
      border-radius: 3px;
      font: inherit;
    }

    .remaining-input {
      min-height: 42px;
      padding: 8px 10px;
    }

    .game-name-input {
      min-height: 42px;
      padding: 8px 10px;
      margin-top: 10px;
    }

    .game-name-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-top: 10px;
    }

    .capacity-row,
    .slot-actions,
    .parking-footer {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .remaining-field {
      display: grid;
      gap: 7px;
      margin-top: 14px;
      color: #39484d;
      font-size: 13px;
      font-weight: 800;
    }

    .parking-note {
      min-height: 74px;
      padding: 10px 12px;
      resize: vertical;
    }

    .parking-log-table {
      width: 100%;
      margin-top: 12px;
      border-collapse: collapse;
      font-size: 13px;
    }

    .parking-log-table th,
    .parking-log-table td {
      padding: 9px 8px;
      text-align: left;
      border: 1px solid var(--line);
      vertical-align: top;
    }

    .parking-log-table th {
      color: #fff;
      background: var(--ink);
      font-size: 12px;
      letter-spacing: 0.05em;
    }

    .parking-log-table td {
      background: #fffdf7;
    }

    .script-page {
      display: grid;
      gap: 18px;
    }

    .script-grid {
      display: grid;
      grid-template-columns: minmax(280px, 0.95fr) minmax(360px, 1.35fr);
      gap: 18px;
      align-items: start;
    }

    .script-reconstruction-grid {
      display: grid;
      grid-template-columns: minmax(420px, 1.35fr) minmax(340px, 0.85fr);
      gap: 18px;
      align-items: start;
    }

    .script-left-stack,
    .script-right-stack {
      display: grid;
      gap: 18px;
      align-items: start;
    }

    .script-right-stack {
      position: sticky;
      top: 18px;
    }

    .script-field-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .script-field {
      display: grid;
      gap: 6px;
      color: #39484d;
      font-size: 13px;
      font-weight: 800;
    }

    .script-input,
    .script-textarea,
    .script-note {
      width: 100%;
      color: var(--ink);
      background: #fff;
      border: 1px solid #899793;
      border-radius: 3px;
      font: inherit;
    }

    .script-input {
      min-height: 40px;
      padding: 8px 10px;
    }

    .script-textarea {
      min-height: 132px;
      padding: 10px 12px;
      resize: vertical;
      font-family: "Cascadia Mono", "Consolas", monospace;
      font-size: 13px;
      line-height: 1.55;
    }

    .script-note {
      min-height: 68px;
      padding: 10px 12px;
      resize: vertical;
    }

    .script-layout-stage {
      position: relative;
      display: grid;
      place-items: center;
      min-height: 260px;
      margin-top: 12px;
      overflow: hidden;
      background: #2f3335;
      border: 3px solid var(--ink);
      box-shadow: inset 0 0 0 3px rgba(255, 255, 255, 0.78);
    }

    .script-image-wrap {
      position: relative;
      display: inline-block;
      max-width: 100%;
      line-height: 0;
    }

    .script-screenshot {
      display: block;
      max-width: 100%;
      height: auto;
      user-select: none;
    }

    .script-layout-empty {
      padding: 28px;
      color: #e8ecea;
      text-align: center;
    }

    .script-hotspot-marker {
      position: absolute;
      transform: translate(-50%, -50%);
      display: grid;
      place-items: center;
      gap: 2px;
      min-width: 42px;
      padding: 2px 4px;
      color: #fff;
      background: rgba(242, 189, 67, 0.2);
      border: 2px solid var(--signal);
      border-radius: 4px;
      font-size: 12px;
      font-weight: 900;
      line-height: 1.1;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.65);
      cursor: pointer;
    }

    .script-hotspot-marker:hover {
      background: rgba(242, 189, 67, 0.42);
    }

    .script-hotspot-marker.is-active {
      z-index: 2;
      background: rgba(242, 189, 67, 0.62);
      border-color: #fffdf7;
      box-shadow: 0 0 0 3px var(--signal), 0 0 0 6px rgba(0, 0, 0, 0.35);
    }

    .script-hotspot-marker.needs-id {
      background: rgba(170, 46, 54, 0.42);
      border-style: dashed;
    }

    .script-hotspot-marker.is-editing {
      border-style: dashed;
    }

    .script-hotspot-marker.is-saved {
      background: rgba(54, 128, 92, 0.36);
      border-color: #58d188;
    }

    .script-hotspot-marker.is-selected {
      background: rgba(54, 128, 92, 0.72);
      box-shadow: 0 0 0 3px #58d188, 0 0 0 6px rgba(0, 0, 0, 0.35);
    }

    .hotspot-marker-index {
      padding: 1px 5px;
      color: var(--ink);
      background: var(--signal);
      border-radius: 999px;
      text-shadow: none;
    }

    .hotspot-marker-vehicle {
      white-space: nowrap;
    }

    .hotspot-marker-check {
      display: inline-grid;
      place-items: center;
      width: 18px;
      height: 18px;
      color: var(--ink);
      background: #58d188;
      border-radius: 999px;
      text-shadow: none;
    }

    .script-list {
      display: grid;
      gap: 10px;
      margin-top: 12px;
    }

    .script-active-hotspot-note {
      padding: 8px 10px;
      margin: 0;
      background: #fff8dd;
      border: 1px solid rgba(242, 189, 67, 0.9);
      color: var(--muted);
    }

    .script-list-card {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: center;
      padding: 10px;
      background: #fffdf7;
      border: 1px solid var(--line);
    }

    .script-list-card.is-active {
      background: #fff8dd;
      border-color: var(--signal);
      box-shadow: 0 0 0 3px rgba(242, 189, 67, 0.22);
    }

    .script-hotspot-fields {
      display: grid;
      grid-template-columns: repeat(5, minmax(54px, 1fr));
      gap: 8px;
      margin-top: 8px;
    }

    .script-hotspot-fields input {
      width: 100%;
      min-height: 34px;
      padding: 6px;
      border: 1px solid #899793;
    }

    .script-hotspot-fields input:disabled {
      color: var(--muted);
      background: #ebe7dd;
      cursor: not-allowed;
    }

    .script-slots {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin-top: 12px;
    }

    .script-slot {
      min-height: 138px;
      padding: 12px;
      background: #fffdf7;
      border: 1px solid var(--line);
      border-top: 5px solid var(--rail);
    }

    .script-slot.is-empty {
      display: grid;
      place-items: center;
      color: var(--muted);
      background: #f2efe6;
      border-style: dashed;
    }

    .script-slot h3 {
      margin: 0 0 10px;
      font-size: 16px;
    }

    .script-pending {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    .script-report {
      min-height: 260px;
      max-height: 520px;
      margin: 12px 0 0;
      padding: 14px;
      overflow: auto;
      white-space: pre-wrap;
      background: #fff;
      border: 1px solid var(--line);
      font-family: "Cascadia Mono", "Consolas", monospace;
      font-size: 12px;
      line-height: 1.65;
    }

    .script-error-list {
      margin: 10px 0 0;
      padding-left: 20px;
      color: var(--danger);
      font-size: 13px;
    }

    @media (max-width: 720px) {
      .config-grid {
        grid-template-columns: 1fr;
      }

      .parking-grid,
      .parking-controls,
      .script-grid,
      .script-reconstruction-grid,
      .script-field-grid,
      .script-slots {
        grid-template-columns: 1fr;
      }

      .script-right-stack {
        position: static;
      }
    }

    dialog {
      width: min(430px, calc(100vw - 32px));
      padding: 0;
      color: var(--ink);
      background: #fffdf7;
      border: 2px solid var(--ink);
      border-radius: 4px;
      box-shadow: 10px 10px 0 rgba(23, 33, 38, 0.25);
    }

    dialog::backdrop {
      background: rgba(23, 33, 38, 0.58);
    }

    .dialog-form {
      padding: 22px;
    }

    .dialog-form h2 {
      margin: 7px 0 0;
      font-size: 26px;
    }

    .dialog-note {
      margin: 9px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .dialog-field {
      display: grid;
      gap: 7px;
      margin-top: 18px;
      color: #39484d;
      font-size: 13px;
      font-weight: 800;
    }

    .dialog-field input[type="text"] {
      width: 100%;
      padding: 10px 11px;
      color: var(--ink);
      background: #fff;
      border: 1px solid #899793;
      border-radius: 3px;
    }

    .dialog-field input[type="color"] {
      width: 100%;
      height: 44px;
      padding: 4px;
      background: #fff;
      border: 1px solid #899793;
      border-radius: 3px;
    }

    #colorError {
      min-height: 20px;
      margin: 10px 0 0;
      color: var(--danger);
      font-size: 13px;
      font-weight: 800;
    }

    .dialog-actions {
      display: flex;
      gap: 9px;
      justify-content: flex-end;
      margin-top: 14px;
    }

    @media (max-width: 760px) {
      .app-shell {
        display: block;
      }

      .sidebar {
        min-height: auto;
        padding: 18px 16px 14px;
        border-right: 0;
        border-bottom: 4px solid var(--signal);
      }

      .brand-subtitle {
        display: none;
      }

      #stageNav {
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
        margin-top: 16px;
      }

      .stage-button {
        flex: 1 1 132px;
        min-height: 48px;
        padding: 8px;
      }

      .stage-index {
        width: 27px;
        height: 27px;
      }

      .save-panel {
        margin-top: 14px;
        padding-top: 12px;
      }

      .workspace {
        padding: 24px 16px 34px;
      }

      .work-grid {
        grid-template-columns: 1fr;
      }

      .help-panel {
        order: -1;
      }

      .color-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div>
        <p class="brand-kicker">BUS LEVEL / QUEUE LOG</p>
        <h1 class="brand-title">乘客队列<br>记录工作台</h1>
        <p class="brand-subtitle">按流程录入三个区域的乘客颜色，状态将在每次操作后自动保存。</p>
      </div>

      <nav id="stageNav" aria-label="录入流程">
        <button class="stage-button is-active" type="button" data-stage="conveyor" aria-current="step">
          <span class="stage-index">01</span>
          <span><span class="stage-name">传送带</span><small class="stage-code">CONVEYOR</small></span>
        </button>
        <button class="stage-button" type="button" data-stage="left">
          <span class="stage-index">02</span>
          <span><span class="stage-name">左侧队列</span><small class="stage-code">LEFT QUEUE</small></span>
        </button>
        <button class="stage-button" type="button" data-stage="right">
          <span class="stage-index">03</span>
          <span><span class="stage-name">右侧队列</span><small class="stage-code">RIGHT QUEUE</small></span>
        </button>
        <button class="stage-button" type="button" data-stage="configs">
          <span class="stage-index">04</span>
          <span><span class="stage-name">全部配置</span><small class="stage-code">CONFIGS</small></span>
        </button>
        <button class="stage-button" type="button" data-stage="parking">
          <span class="stage-index">05</span>
          <span><span class="stage-name">车位记录</span><small class="stage-code">PARKING LOG</small></span>
        </button>
        <button class="stage-button" type="button" data-stage="script">
          <span class="stage-index">06</span>
          <span><span class="stage-name">剧本还原</span><small class="stage-code">SCRIPT LAB</small></span>
        </button>
      </nav>

      <div class="save-panel">
        <p id="saveState" role="status" aria-live="polite">状态已载入</p>
      </div>
    </aside>

    <main id="workspace" class="workspace"></main>
  </div>

  <dialog id="addColorDialog" aria-labelledby="addColorTitle">
    <form class="dialog-form" method="dialog">
      <p class="eyebrow">COLOR MAPPING</p>
      <h2 id="addColorTitle">新增颜色映射</h2>
      <p class="dialog-note">下一可用映射值：<strong id="nextColorValue">4</strong></p>

      <label class="dialog-field">
        颜色名称
        <input id="colorName" name="colorName" type="text" autocomplete="off" placeholder="例如：绿色">
      </label>

      <label class="dialog-field">
        颜色值
        <input id="colorHex" name="colorHex" type="color" value="#32a852">
      </label>

      <p id="colorError" role="alert"></p>

      <div class="dialog-actions">
        <button class="action-button secondary" type="button" data-action="cancel-color">取消</button>
        <button class="action-button primary" type="submit">保存颜色</button>
      </div>
    </form>
  </dialog>

  <script>
    const STORAGE_KEY = 'passenger-queue-recorder-state-v5';
    const SECTIONS = ['conveyor', 'left', 'right'];
    const STAGES = [...SECTIONS, 'configs', 'parking', 'script'];
    const STATE_KEYS = ['colors', 'queues', 'histories', 'parking', 'script', 'activeStage'];
    const COLOR_KEYS = ['name', 'value', 'hex'];
    const PARKING_KEYS = ['slots', 'logs', 'nextVehicleId', 'savedGames', 'nextGameId', 'pending'];
    const VEHICLE_KEYS = ['id', 'colorValue', 'capacity', 'remaining', 'enteredStep'];
    const PENDING_KEYS = ['selectedVehicle', 'enteredSlot', 'departedVehicles', 'occupancyDurations'];
    const LOG_KEYS = ['step', 'selectedVehicle', 'enteredSlot', 'slots', 'departedVehicles', 'occupancyDurations', 'note'];
    const SAVED_GAME_KEYS = ['id', 'name', 'savedAt', 'slots', 'logs'];
    const SCRIPT_KEYS = ['levelName', 'queuesText', 'vehicleTableText', 'vehicles', 'vehicleErrors', 'screenshotDataUrl', 'hotspots', 'nextHotspotId', 'activeHotspotId', 'slots', 'batches', 'pending', 'savedLevels', 'nextLevelId', 'ocrStatus', 'ocrError'];
    const SCRIPT_QUEUE_TEXT_KEYS = ['conveyor', 'left', 'right'];
    const SCRIPT_VEHICLE_KEYS = ['id', 'colorValue', 'capacity', 'depth', 'frontVehicleIds', 'backVehicleIds'];
    const SCRIPT_HOTSPOT_KEYS = ['id', 'vehicleId', 'xPercent', 'yPercent', 'widthPercent', 'heightPercent', 'source', 'confidence', 'status'];
    const SCRIPT_SLOT_KEYS = ['vehicleId', 'colorValue', 'capacity', 'remaining', 'enteredBatch'];
    const SCRIPT_BATCH_KEYS = ['batch', 'selectedVehicleIds', 'enteredSlots', 'slotSnapshots', 'departedVehicleIds', 'note'];
    const SCRIPT_ENTERED_SLOT_KEYS = ['vehicleId', 'slot'];
    const SCRIPT_SLOT_SNAPSHOT_KEYS = ['slot', 'vehicleId', 'remaining', 'capacity'];
    const SCRIPT_PENDING_KEYS = ['selectedVehicleIds', 'enteredSlots', 'departedVehicleIds'];
    const SCRIPT_LEVEL_KEYS = ['id', 'name', 'savedAt', 'data'];
    const VEHICLE_CAPACITIES = [4, 6, 10];
    const HEX_PATTERN = /^#[0-9a-fA-F]{6}$/;
    const DEFAULT_COLORS = [
      { name: '红色', value: 1, hex: '#e54c4c' },
      { name: '黄色', value: 2, hex: '#f3bd3d' },
      { name: '蓝色', value: 3, hex: '#3478f6' },
      { name: '绿色', value: 4, hex: '#32a852' },
      { name: '粉色', value: 5, hex: '#ec71a5' },
      { name: '紫色', value: 6, hex: '#8b5cf6' },
      { name: '天蓝色', value: 7, hex: '#58bde9' },
      { name: '棕色', value: 8, hex: '#8b5a3c' },
      { name: '橙色', value: 9, hex: '#f97316' },
      { name: '黑色', value: 10, hex: '#202529' },
      { name: '白色', value: 11, hex: '#f7f7f2' }
    ];

    function createEmptySections() {
      return { conveyor: [], left: [], right: [] };
    }

    function createEmptyParking() {
      return {
        slots: [null, null, null, null],
        logs: [],
        nextVehicleId: 1,
        savedGames: [],
        nextGameId: 1,
        pending: {
          selectedVehicle: '',
          enteredSlot: '',
          departedVehicles: [],
          occupancyDurations: []
        }
      };
    }

    function createEmptyScript() {
      return {
        levelName: '',
        queuesText: { conveyor: '', left: '', right: '' },
        vehicleTableText: '',
        vehicles: [],
        vehicleErrors: [],
        screenshotDataUrl: '',
        hotspots: [],
        nextHotspotId: 1,
        activeHotspotId: null,
        slots: [null, null, null, null],
        batches: [],
        pending: {
          selectedVehicleIds: [],
          enteredSlots: [],
          departedVehicleIds: []
        },
        savedLevels: [],
        nextLevelId: 1,
        ocrStatus: 'idle',
        ocrError: ''
      };
    }

    function createInitialState() {
      return {
        colors: DEFAULT_COLORS.map(color => ({ ...color })),
        queues: createEmptySections(),
        histories: createEmptySections(),
        parking: createEmptyParking(),
        script: createEmptyScript(),
        activeStage: 'conveyor'
      };
    }

    function hasSection(state, section) {
      return Boolean(state
        && typeof state === 'object'
        && state.queues
        && state.histories
        && SECTIONS.includes(section)
        && Array.isArray(state.queues[section])
        && Array.isArray(state.histories[section]));
    }

    function updateSection(state, section, nextQueue) {
      if (!hasSection(state, section)) return state;

      return {
        ...state,
        queues: {
          ...state.queues,
          [section]: nextQueue
        },
        histories: {
          ...state.histories,
          [section]: [...state.histories[section], [...state.queues[section]]]
        }
      };
    }

    function appendValue(state, section, value) {
      if (!hasSection(state, section) || !isMappedValue(state, value)) return state;
      return updateSection(state, section, [...state.queues[section], value]);
    }

    function hasBatchValues(state, values) {
      return isDenseArray(values)
        && values.length > 0
        && values.every(value => isMappedValue(state, value));
    }

    function appendBatchValues(state, section, values) {
      if (!hasSection(state, section) || !hasBatchValues(state, values)) return state;
      return updateSection(state, section, [...state.queues[section], ...values]);
    }

    function removeBatchValues(state, section, value, count) {
      if (!hasSection(state, section)
        || !isMappedValue(state, value)
        || !Number.isInteger(count)
        || count < 1) {
        return state;
      }

      let remaining = count;
      const nextQueue = [...state.queues[section]];
      for (let index = nextQueue.length - 1; index >= 0 && remaining > 0; index -= 1) {
        if (nextQueue[index] === value) {
          nextQueue.splice(index, 1);
          remaining -= 1;
        }
      }

      if (nextQueue.length === state.queues[section].length) return state;
      return updateSection(state, section, nextQueue);
    }

    function removeAt(state, section, index) {
      if (!hasSection(state, section)
        || !Number.isInteger(index)
        || index < 0
        || index >= state.queues[section].length) {
        return state;
      }

      return updateSection(state, section, state.queues[section].filter((_, itemIndex) => itemIndex !== index));
    }

    function undo(state, section) {
      if (!hasSection(state, section) || state.histories[section].length === 0) return state;

      const history = state.histories[section];
      return {
        ...state,
        queues: {
          ...state.queues,
          [section]: [...history.at(-1)]
        },
        histories: {
          ...state.histories,
          [section]: history.slice(0, -1)
        }
      };
    }

    function addColor(state, name, hex) {
      if (!state
        || !Array.isArray(state.colors)
        || state.colors.some(color => !color || !Number.isSafeInteger(color.value) || color.value <= 0)
        || typeof name !== 'string'
        || name.trim() === ''
        || typeof hex !== 'string'
        || !HEX_PATTERN.test(hex)) {
        return state;
      }

      const maxValue = state.colors.reduce((max, color) => Math.max(max, color.value), 0);
      if (maxValue >= Number.MAX_SAFE_INTEGER) return state;

      return {
        ...state,
        colors: [
          ...state.colors,
          { name: name.trim(), value: maxValue + 1, hex }
        ]
      };
    }

    function getConfigs(state) {
      const conveyor = state.queues.conveyor.join(',');
      const left = state.queues.left.join(',');
      const right = state.queues.right.join(',');
      return {
        conveyor,
        left,
        right,
        combined: [...state.queues.conveyor, ...state.queues.left, ...state.queues.right].join(',')
      };
    }

    function startNextLevel(state) {
      return {
        colors: state.colors.map(color => ({ ...color })),
        queues: createEmptySections(),
        histories: createEmptySections(),
        parking: {
          slots: state.parking.slots.map(slot => slot ? { ...slot } : null),
          logs: state.parking.logs.map(log => ({
            ...log,
            slots: [...log.slots]
          })),
          nextVehicleId: state.parking.nextVehicleId,
          savedGames: state.parking.savedGames.map(game => ({
            ...game,
            slots: [...game.slots],
            logs: game.logs.map(log => ({ ...log, slots: [...log.slots] }))
          })),
          nextGameId: state.parking.nextGameId,
          pending: {
            ...state.parking.pending,
            departedVehicles: [...state.parking.pending.departedVehicles],
            occupancyDurations: [...state.parking.pending.occupancyDurations]
          }
        },
        script: {
          ...cloneScriptWorkspace(state.script),
          savedLevels: state.script.savedLevels.map(level => cloneJson(level)),
          nextLevelId: state.script.nextLevelId
        },
        activeStage: 'conveyor'
      };
    }

    function resetEverything() {
      return createInitialState();
    }

    function getColorName(state, value) {
      const color = state.colors.find(item => item.value === value);
      return color ? color.name : `映射${value}`;
    }

    function formatVehicle(state, vehicle) {
      return `${getColorName(state, vehicle.colorValue)}${vehicle.capacity}`;
    }

    function formatSlot(state, vehicle) {
      return vehicle ? `${formatVehicle(state, vehicle)}剩${vehicle.remaining}` : '空';
    }

    function resetParkingPending(parking) {
      return {
        ...parking,
        pending: {
          selectedVehicle: '',
          enteredSlot: '',
          departedVehicles: [],
          occupancyDurations: []
        }
      };
    }

    function appendPendingText(current, next) {
      return current ? `${current},${next}` : next;
    }

    function addVehicle(state, colorValue, capacity) {
      if (!isValidState(state)
        || !isMappedValue(state, colorValue)
        || !VEHICLE_CAPACITIES.includes(capacity)) {
        return state;
      }

      const slotIndex = state.parking.slots.findIndex(slot => slot === null);
      if (slotIndex === -1) return state;

      const vehicle = {
        id: state.parking.nextVehicleId,
        colorValue,
        capacity,
        remaining: capacity,
        enteredStep: state.parking.logs.length + 1
      };

      const vehicleLabel = formatVehicle(state, vehicle);
      const entryLabel = `${vehicleLabel}->${slotIndex + 1}`;
      const slots = state.parking.slots.map((slot, index) => index === slotIndex ? vehicle : slot);
      return {
        ...state,
        parking: {
          ...state.parking,
          slots,
          nextVehicleId: state.parking.nextVehicleId + 1,
          pending: {
            ...state.parking.pending,
            selectedVehicle: appendPendingText(state.parking.pending.selectedVehicle, vehicleLabel),
            enteredSlot: appendPendingText(state.parking.pending.enteredSlot, entryLabel)
          }
        }
      };
    }

    function updateVehicleRemaining(state, slotIndex, remaining) {
      if (!isValidState(state)
        || !Number.isInteger(slotIndex)
        || slotIndex < 0
        || slotIndex >= 4
        || !Number.isInteger(remaining)) {
        return state;
      }

      const vehicle = state.parking.slots[slotIndex];
      if (!vehicle || remaining < 0 || remaining > vehicle.capacity) return state;

      return {
        ...state,
        parking: {
          ...state.parking,
          slots: state.parking.slots.map((slot, index) => index === slotIndex ? { ...vehicle, remaining } : slot)
        }
      };
    }

    function departVehicle(state, slotIndex) {
      if (!isValidState(state)
        || !Number.isInteger(slotIndex)
        || slotIndex < 0
        || slotIndex >= 4) {
        return state;
      }

      const vehicle = state.parking.slots[slotIndex];
      if (!vehicle) return state;

      const departureStep = state.parking.logs.length + 1;
      const occupiedSteps = departureStep - vehicle.enteredStep + 1;
      const vehicleLabel = formatVehicle(state, vehicle);
      return {
        ...state,
        parking: {
          ...state.parking,
          slots: state.parking.slots.map((slot, index) => index === slotIndex ? null : slot),
          pending: {
            ...state.parking.pending,
            departedVehicles: [...state.parking.pending.departedVehicles, vehicleLabel],
            occupancyDurations: [
              ...state.parking.pending.occupancyDurations,
              `${vehicleLabel}：${vehicle.enteredStep}→${departureStep}，共${occupiedSteps}步`
            ]
          }
        }
      };
    }

    function recordParkingStep(state, note) {
      if (!isValidState(state) || typeof note !== 'string') return state;

      const log = {
        step: state.parking.logs.length + 1,
        selectedVehicle: state.parking.pending.selectedVehicle,
        enteredSlot: state.parking.pending.enteredSlot,
        slots: state.parking.slots.map(slot => formatSlot(state, slot)),
        departedVehicles: state.parking.pending.departedVehicles.join('、'),
        occupancyDurations: state.parking.pending.occupancyDurations.join('、'),
        note: note.trim()
      };

      return {
        ...state,
        parking: {
          ...resetParkingPending(state.parking),
          logs: [...state.parking.logs, log]
        }
      };
    }

    function deleteParkingLog(state, logIndex) {
      if (!isValidState(state)
        || !Number.isInteger(logIndex)
        || logIndex < 0
        || logIndex >= state.parking.logs.length) {
        return state;
      }

      return {
        ...state,
        parking: {
          ...state.parking,
          logs: state.parking.logs
            .filter((_, index) => index !== logIndex)
            .map((log, index) => ({ ...log, step: index + 1 }))
        }
      };
    }

    function clearParking(state) {
      if (!isValidState(state)) return state;
      return {
        ...state,
        parking: {
          ...createEmptyParking(),
          savedGames: state.parking.savedGames.map(game => ({
            ...game,
            slots: [...game.slots],
            logs: game.logs.map(log => ({ ...log, slots: [...log.slots] }))
          })),
          nextGameId: state.parking.nextGameId
        }
      };
    }

    function formatParkingLogsText(logs) {
      const header = '批次\t本批次选择车辆\t进入车位顺序\t1号车位\t2号车位\t3号车位\t4号车位\t开走车辆\t占位时长\t备注';
      const rows = logs.map(log => [
        log.step,
        log.selectedVehicle,
        log.enteredSlot,
        ...log.slots,
        log.departedVehicles,
        log.occupancyDurations,
        log.note
      ].join('\t'));
      return [header, ...rows].join('\n');
    }

    function getParkingLogText(state) {
      return formatParkingLogsText(state.parking.logs);
    }

    function formatParkingGameName(levelOrName, attempt) {
      if (typeof attempt === 'undefined') {
        return typeof levelOrName === 'string' ? levelOrName.trim() : '';
      }

      const level = String(levelOrName).trim();
      const round = String(attempt).trim();
      if (level === '' && round === '') return '';
      return `第${level || '?'}关第${round || '?'}局`;
    }

    function saveParkingGame(state, levelOrName, attempt) {
      if (!isValidState(state) || state.parking.logs.length === 0) return state;

      const name = formatParkingGameName(levelOrName, attempt);

      const savedGame = {
        id: state.parking.nextGameId,
        name: name.trim() || `第 ${state.parking.nextGameId} 局`,
        savedAt: new Date().toISOString(),
        slots: state.parking.slots.map(slot => formatSlot(state, slot)),
        logs: state.parking.logs.map(log => ({ ...log, slots: [...log.slots] }))
      };

      return {
        ...state,
        parking: {
          ...state.parking,
          savedGames: [...state.parking.savedGames, savedGame],
          nextGameId: state.parking.nextGameId + 1
        }
      };
    }

    function loadParkingGame(state, gameId) {
      if (!isValidState(state) || !Number.isSafeInteger(gameId)) return state;
      const game = state.parking.savedGames.find(item => item.id === gameId);
      if (!game) return state;

      return {
        ...state,
        parking: {
          ...state.parking,
          slots: [null, null, null, null],
          logs: game.logs.map(log => ({ ...log, slots: [...log.slots] })),
          nextVehicleId: state.parking.nextVehicleId,
          pending: {
            selectedVehicle: '',
            enteredSlot: '',
            departedVehicles: [],
            occupancyDurations: []
          }
        }
      };
    }

    function deleteParkingGame(state, gameId) {
      if (!isValidState(state) || !Number.isSafeInteger(gameId)) return state;
      return {
        ...state,
        parking: {
          ...state.parking,
          savedGames: state.parking.savedGames.filter(game => game.id !== gameId)
        }
      };
    }

    function getSavedParkingGameText(state, gameId) {
      if (!isValidState(state) || !Number.isSafeInteger(gameId)) return '';
      const game = state.parking.savedGames.find(item => item.id === gameId);
      return game ? formatParkingLogsText(game.logs) : '';
    }

    function cloneJson(value) {
      return JSON.parse(JSON.stringify(value));
    }

    function parsePositiveInteger(value) {
      if (typeof value !== 'string' && typeof value !== 'number') return null;
      const text = String(value).trim();
      if (!/^\d+$/.test(text)) return null;
      const number = Number(text);
      return Number.isSafeInteger(number) && number > 0 ? number : null;
    }

    function parseScriptIdList(value) {
      if (typeof value !== 'string' || value.trim() === '') return { values: [], errors: [] };
      const values = [];
      const errors = [];
      value.split(',').map(item => item.trim()).filter(Boolean).forEach(item => {
        const id = parsePositiveInteger(item);
        if (id === null) {
          errors.push(`依赖车辆 id「${item}」不是正整数`);
          return;
        }
        values.push(id);
      });
      return { values, errors };
    }

    function splitScriptTableRow(line) {
      const cells = line.split('\t').map(cell => cell.trim());
      return cells.length > 1 ? cells : line.trim().split(/\s+/).map(cell => cell.trim());
    }

    function parseScriptVehicleTable(text) {
      if (typeof text !== 'string') return { vehicles: [], errors: ['车辆表必须是文本'] };

      const vehicles = [];
      const errors = [];
      const seenIds = new Set();
      const lines = text.replace(/\r/g, '').split('\n');

      lines.forEach((line, lineIndex) => {
        if (line.trim() === '') return;
        const cells = splitScriptTableRow(line);
        const lineNumber = lineIndex + 1;
        const maybeHeader = lineNumber === 1 && parsePositiveInteger(cells[0]) === null;
        if (maybeHeader) return;

        const rowErrors = [];
        if (cells.length < 4) rowErrors.push('字段不足，至少需要车辆id、车颜色、车座位、深度');

        const id = parsePositiveInteger(cells[0]);
        const colorValue = parsePositiveInteger(cells[1]);
        const capacity = parsePositiveInteger(cells[2]);
        const depth = parsePositiveInteger(cells[3]);
        const front = parseScriptIdList(cells[4] || '');
        const back = parseScriptIdList(cells[5] || '');

        if (id === null) rowErrors.push('车辆id必须是正整数');
        if (id !== null && seenIds.has(id)) rowErrors.push(`车辆id ${id} 重复`);
        if (colorValue === null) rowErrors.push('车颜色必须是正整数映射值');
        if (!VEHICLE_CAPACITIES.includes(capacity)) rowErrors.push('车座位必须是 4、6 或 10');
        if (depth === null) rowErrors.push('深度必须是正整数');
        rowErrors.push(...front.errors, ...back.errors);

        if (rowErrors.length > 0) {
          errors.push(`第 ${lineNumber} 行：${rowErrors.join('；')}`);
          return;
        }

        seenIds.add(id);
        vehicles.push({
          id,
          colorValue,
          capacity,
          depth,
          frontVehicleIds: front.values,
          backVehicleIds: back.values
        });
      });

      return { vehicles, errors };
    }

    function importScriptVehicleTable(state, text) {
      if (!isValidState(state) || typeof text !== 'string') return state;
      const parsed = parseScriptVehicleTable(text);
      const vehicles = parsed.vehicles.filter(vehicle => isMappedValue(state, vehicle.colorValue));
      const colorErrors = parsed.vehicles
        .filter(vehicle => !isMappedValue(state, vehicle.colorValue))
        .map(vehicle => `车辆 ${vehicle.id} 的颜色映射 ${vehicle.colorValue} 不存在`);
      return {
        ...state,
        script: {
          ...state.script,
          vehicleTableText: text,
          vehicles,
          vehicleErrors: [...parsed.errors, ...colorErrors]
        }
      };
    }

    function parseScriptQueueText(text) {
      if (typeof text !== 'string' || text.trim() === '') return [];
      return text.split(',')
        .map(item => Number(item.trim()))
        .filter(value => Number.isSafeInteger(value) && value > 0);
    }

    function setScriptQueuesText(state, queuesText) {
      if (!isValidState(state) || !queuesText || typeof queuesText !== 'object') return state;
      return {
        ...state,
        script: {
          ...state.script,
          queuesText: {
            conveyor: typeof queuesText.conveyor === 'string' ? queuesText.conveyor.trim() : state.script.queuesText.conveyor,
            left: typeof queuesText.left === 'string' ? queuesText.left.trim() : state.script.queuesText.left,
            right: typeof queuesText.right === 'string' ? queuesText.right.trim() : state.script.queuesText.right
          }
        }
      };
    }

    function syncScriptQueuesFromCurrent(state) {
      if (!isValidState(state)) return state;
      const configs = getConfigs(state);
      return setScriptQueuesText(state, {
        conveyor: configs.conveyor,
        left: configs.left,
        right: configs.right
      });
    }

    function clampPercent(value, fallback) {
      return Number.isFinite(value) ? Math.min(100, Math.max(0, value)) : fallback;
    }

    function normalizeHotspotInput(state, input) {
      if (!input || typeof input !== 'object') return null;
      const vehicleId = input.vehicleId === 0 || input.vehicleId === '0'
        ? 0
        : parsePositiveInteger(input.vehicleId);
      if (vehicleId === null) return null;
      if (vehicleId === 0 && input.source !== 'ocr') return null;
      return {
        vehicleId,
        xPercent: clampPercent(Number(input.xPercent), 50),
        yPercent: clampPercent(Number(input.yPercent), 50),
        widthPercent: Math.min(100, Math.max(1, Number(input.widthPercent) || 8)),
        heightPercent: Math.min(100, Math.max(1, Number(input.heightPercent) || 8)),
        source: input.source === 'ocr' ? 'ocr' : 'manual',
        confidence: Number.isFinite(Number(input.confidence)) ? Number(input.confidence) : null,
        status: input.status === 'saved' ? 'saved' : 'editing'
      };
    }

    function addScriptHotspot(state, input) {
      if (!isValidState(state)) return state;
      const hotspot = normalizeHotspotInput(state, input);
      if (!hotspot) return state;
      const hotspotId = state.script.nextHotspotId;
      return {
        ...state,
        script: {
          ...state.script,
          hotspots: [...state.script.hotspots, { id: hotspotId, ...hotspot }],
          nextHotspotId: hotspotId + 1,
          activeHotspotId: hotspotId
        }
      };
    }

    function updateScriptHotspot(state, hotspotId, updates) {
      if (!isValidState(state) || !Number.isSafeInteger(hotspotId) || !updates || typeof updates !== 'object') return state;
      const hasHotspot = state.script.hotspots.some(hotspot => hotspot.id === hotspotId);
      if (!hasHotspot) return state;
      return {
        ...state,
        script: {
          ...state.script,
          hotspots: state.script.hotspots.map(hotspot => {
            if (hotspot.id !== hotspotId) return hotspot;
            const merged = normalizeHotspotInput(state, { ...hotspot, ...updates });
            return merged ? { id: hotspot.id, ...merged } : hotspot;
          }),
          activeHotspotId: hotspotId
        }
      };
    }

    function deleteScriptHotspot(state, hotspotId) {
      if (!isValidState(state) || !Number.isSafeInteger(hotspotId)) return state;
      const hotspots = state.script.hotspots.filter(hotspot => hotspot.id !== hotspotId);
      return {
        ...state,
        script: {
          ...state.script,
          hotspots,
          activeHotspotId: state.script.activeHotspotId === hotspotId
            ? (hotspots[0] ? hotspots[0].id : null)
            : state.script.activeHotspotId
        }
      };
    }

    function setScriptActiveHotspot(state, hotspotId) {
      if (!isValidState(state)) return state;
      if (hotspotId === null) {
        return {
          ...state,
          script: {
            ...state.script,
            activeHotspotId: null
          }
        };
      }
      if (!Number.isSafeInteger(hotspotId) || !state.script.hotspots.some(hotspot => hotspot.id === hotspotId)) {
        return state;
      }
      return {
        ...state,
        script: {
          ...state.script,
          activeHotspotId: hotspotId
        }
      };
    }

    function findScriptHotspotAt(state, xPercent, yPercent) {
      if (!isValidState(state) || !Number.isFinite(xPercent) || !Number.isFinite(yPercent)) return null;
      for (let index = state.script.hotspots.length - 1; index >= 0; index -= 1) {
        const hotspot = state.script.hotspots[index];
        const halfWidth = hotspot.widthPercent / 2;
        const halfHeight = hotspot.heightPercent / 2;
        if (xPercent >= hotspot.xPercent - halfWidth
          && xPercent <= hotspot.xPercent + halfWidth
          && yPercent >= hotspot.yPercent - halfHeight
          && yPercent <= hotspot.yPercent + halfHeight) {
          return { ...hotspot };
        }
      }
      return null;
    }

    function applyScriptOcrDetections(state, detections) {
      if (!isValidState(state) || !Array.isArray(detections)) return state;
      return detections.reduce((nextState, detection) => addScriptHotspot(nextState, {
        vehicleId: detection && Number.isSafeInteger(Number(detection.vehicleId)) ? Number(detection.vehicleId) : 0,
        xPercent: detection ? Number(detection.xPercent) : 50,
        yPercent: detection ? Number(detection.yPercent) : 50,
        widthPercent: detection ? Number(detection.widthPercent) : 8,
        heightPercent: detection ? Number(detection.heightPercent) : 8,
        source: 'ocr',
        confidence: detection ? Number(detection.confidence) : null
      }), state);
    }

    function getScriptVehicle(state, vehicleId) {
      return state.script.vehicles.find(vehicle => vehicle.id === vehicleId) || null;
    }

    function selectScriptVehicle(state, vehicleId) {
      if (!isValidState(state) || !Number.isSafeInteger(vehicleId) || vehicleId <= 0) return state;
      const vehicle = getScriptVehicle(state, vehicleId);
      if (!vehicle || state.script.slots.some(slot => slot && slot.vehicleId === vehicleId)) return state;
      const slotIndex = state.script.slots.findIndex(slot => slot === null);
      if (slotIndex === -1) return state;

      const slotVehicle = {
        vehicleId: vehicle.id,
        colorValue: vehicle.colorValue,
        capacity: vehicle.capacity,
        remaining: vehicle.capacity,
        enteredBatch: state.script.batches.length + 1
      };

      return {
        ...state,
        script: {
          ...state.script,
          slots: state.script.slots.map((slot, index) => index === slotIndex ? slotVehicle : slot),
          pending: {
            ...state.script.pending,
            selectedVehicleIds: [...state.script.pending.selectedVehicleIds, vehicle.id],
            enteredSlots: [...state.script.pending.enteredSlots, { vehicleId: vehicle.id, slot: slotIndex + 1 }]
          }
        }
      };
    }

    function selectScriptVehicleAt(state, xPercent, yPercent) {
      const hotspot = findScriptHotspotAt(state, xPercent, yPercent);
      if (!hotspot) return state;
      const focusedState = setScriptActiveHotspot(state, hotspot.id);
      return hotspot.status === 'saved' && hotspot.vehicleId > 0
        ? selectScriptVehicle(focusedState, hotspot.vehicleId)
        : focusedState;
    }

    function updateScriptSlotRemaining(state, slotIndex, remaining) {
      if (!isValidState(state)
        || !Number.isInteger(slotIndex)
        || slotIndex < 0
        || slotIndex >= 4
        || !Number.isInteger(remaining)) {
        return state;
      }

      const vehicle = state.script.slots[slotIndex];
      if (!vehicle || remaining < 0 || remaining > vehicle.capacity) return state;
      return {
        ...state,
        script: {
          ...state.script,
          slots: state.script.slots.map((slot, index) => index === slotIndex ? { ...vehicle, remaining } : slot)
        }
      };
    }

    function departScriptSlot(state, slotIndex) {
      if (!isValidState(state)
        || !Number.isInteger(slotIndex)
        || slotIndex < 0
        || slotIndex >= 4) {
        return state;
      }

      const vehicle = state.script.slots[slotIndex];
      if (!vehicle) return state;
      return {
        ...state,
        script: {
          ...state.script,
          slots: state.script.slots.map((slot, index) => index === slotIndex ? null : slot),
          pending: {
            ...state.script.pending,
            departedVehicleIds: [...state.script.pending.departedVehicleIds, vehicle.vehicleId]
          }
        }
      };
    }

    function recordScriptBatch(state, note) {
      if (!isValidState(state) || typeof note !== 'string') return state;
      const batch = {
        batch: state.script.batches.length + 1,
        selectedVehicleIds: [...state.script.pending.selectedVehicleIds],
        enteredSlots: state.script.pending.enteredSlots.map(entry => ({ ...entry })),
        slotSnapshots: state.script.slots.map((slot, index) => slot
          ? { slot: index + 1, vehicleId: slot.vehicleId, remaining: slot.remaining, capacity: slot.capacity }
          : { slot: index + 1, vehicleId: null, remaining: null, capacity: null }),
        departedVehicleIds: [...state.script.pending.departedVehicleIds],
        note: note.trim()
      };

      return {
        ...state,
        script: {
          ...state.script,
          batches: [...state.script.batches, batch],
          pending: {
            selectedVehicleIds: [],
            enteredSlots: [],
            departedVehicleIds: []
          }
        }
      };
    }

    function formatScriptVehicle(state, vehicleOrId) {
      const vehicle = typeof vehicleOrId === 'number' ? getScriptVehicle(state, vehicleOrId) : vehicleOrId;
      if (!vehicle) return `#${vehicleOrId}`;
      return `#${vehicle.id}${getColorName(state, vehicle.colorValue)}${vehicle.capacity}`;
    }

    function formatScriptSlot(state, slot) {
      return slot ? `${formatScriptVehicle(state, slot.vehicleId)}剩${slot.remaining}` : '空';
    }

    function getScriptQueueValues(state) {
      const hasScriptText = SCRIPT_QUEUE_TEXT_KEYS.some(key => state.script.queuesText[key].trim() !== '');
      if (!hasScriptText) return [...state.queues.conveyor, ...state.queues.left, ...state.queues.right];
      return [
        ...parseScriptQueueText(state.script.queuesText.conveyor),
        ...parseScriptQueueText(state.script.queuesText.left),
        ...parseScriptQueueText(state.script.queuesText.right)
      ];
    }

    function addConsumption(consumption, colorValue, count) {
      if (count <= 0) return;
      consumption.set(colorValue, (consumption.get(colorValue) || 0) + count);
    }

    function formatConsumption(state, consumption) {
      const parts = [...consumption.entries()]
        .filter(([, count]) => count > 0)
        .map(([colorValue, count]) => `${getColorName(state, colorValue)}x${count}`);
      return parts.length ? parts.join('、') : '无';
    }

    function getScriptAnalysis(state) {
      if (!isValidState(state)) return { timelineRows: [], summary: [], issues: ['状态无效'] };
      const remainingByVehicle = new Map();
      const consumedByVehicle = new Map();
      const departedIds = new Set();
      const selectedIds = new Set();
      const queueCounts = new Map();
      getScriptQueueValues(state).forEach(value => queueCounts.set(value, (queueCounts.get(value) || 0) + 1));
      const timelineRows = [];
      const issues = [...state.script.vehicleErrors];

      state.script.batches.forEach(batch => {
        const batchConsumption = new Map();
        const rowIssues = [];
        batch.selectedVehicleIds.forEach(id => selectedIds.add(id));

        batch.slotSnapshots.forEach(snapshot => {
          if (!snapshot.vehicleId) return;
          const vehicle = getScriptVehicle(state, snapshot.vehicleId);
          if (!vehicle) {
            rowIssues.push(`#${snapshot.vehicleId} 不在车辆表中`);
            return;
          }
          const previousRemaining = remainingByVehicle.has(vehicle.id)
            ? remainingByVehicle.get(vehicle.id)
            : vehicle.capacity;
          const delta = previousRemaining - snapshot.remaining;
          if (delta > 0) {
            addConsumption(batchConsumption, vehicle.colorValue, delta);
            consumedByVehicle.set(vehicle.id, (consumedByVehicle.get(vehicle.id) || 0) + delta);
            const available = queueCounts.get(vehicle.colorValue) || 0;
            if (available < delta) {
              rowIssues.push(`${getColorName(state, vehicle.colorValue)}乘客不足：需要 ${delta}，剩余 ${available}`);
              queueCounts.set(vehicle.colorValue, 0);
            } else {
              queueCounts.set(vehicle.colorValue, available - delta);
            }
          } else if (delta < 0) {
            rowIssues.push(`${formatScriptVehicle(state, vehicle)}剩余座位增加，可能需要手动修正`);
          }
          remainingByVehicle.set(vehicle.id, snapshot.remaining);
        });

        batch.departedVehicleIds.forEach(id => {
          departedIds.add(id);
          const remaining = remainingByVehicle.get(id);
          if (remaining > 0) rowIssues.push(`${formatScriptVehicle(state, id)}未满但标记开走`);
        });

        timelineRows.push({
          batch: batch.batch,
          selected: batch.selectedVehicleIds.map(id => formatScriptVehicle(state, id)).join(',') || '无',
          entered: batch.enteredSlots.map(entry => `${formatScriptVehicle(state, entry.vehicleId)}->${entry.slot}`).join(',') || '无',
          consumption: formatConsumption(state, batchConsumption),
          slots: batch.slotSnapshots.map(snapshot => snapshot.vehicleId
            ? `${snapshot.slot}:${formatScriptVehicle(state, snapshot.vehicleId)}剩${snapshot.remaining}`
            : `${snapshot.slot}:空`).join(' | '),
          departed: batch.departedVehicleIds.map(id => formatScriptVehicle(state, id)).join(',') || '无',
          issues: rowIssues.join('；'),
          note: batch.note
        });
        issues.push(...rowIssues.map(issue => `第 ${batch.batch} 批：${issue}`));
      });

      const normalVehicles = [...departedIds]
        .filter(id => (remainingByVehicle.get(id) || 0) === 0)
        .map(id => formatScriptVehicle(state, id));
      const truckVehicles = [...remainingByVehicle.entries()]
        .filter(([id, remaining]) => remaining > 0 && !departedIds.has(id) && (consumedByVehicle.get(id) || 0) > 0)
        .map(([id]) => formatScriptVehicle(state, id));
      const obstacleVehicles = [...selectedIds]
        .filter(id => (consumedByVehicle.get(id) || 0) === 0 && !departedIds.has(id))
        .map(id => formatScriptVehicle(state, id));
      const summary = [
        `正常车：${normalVehicles.join('、') || '无'}`,
        `卡车：${truckVehicles.join('、') || '无'}`,
        `障碍车：${obstacleVehicles.join('、') || '无'}`,
        `剩余乘客估算：${formatConsumption(state, queueCounts)}`
      ];

      return { timelineRows, summary, issues };
    }

    function getScriptReportText(state) {
      const analysis = getScriptAnalysis(state);
      const lines = [
        '批次时间线',
        '批次\t本批选择车辆\t进入车位\t吃客反推\t车位状态\t开走车辆\t警告\t备注',
        ...analysis.timelineRows.map(row => [
          row.batch,
          row.selected,
          row.entered,
          row.consumption,
          row.slots,
          row.departed,
          row.issues,
          row.note
        ].join('\t')),
        '',
        '设计摘要',
        ...analysis.summary,
        '',
        '校验提示',
        ...(analysis.issues.length ? analysis.issues : ['未发现明显不一致'])
      ];
      return lines.join('\n');
    }

    function cloneScriptWorkspace(script) {
      return {
        levelName: script.levelName,
        queuesText: { ...script.queuesText },
        vehicleTableText: script.vehicleTableText,
        vehicles: script.vehicles.map(vehicle => ({
          ...vehicle,
          frontVehicleIds: [...vehicle.frontVehicleIds],
          backVehicleIds: [...vehicle.backVehicleIds]
        })),
        vehicleErrors: [...script.vehicleErrors],
        screenshotDataUrl: script.screenshotDataUrl,
        hotspots: script.hotspots.map(hotspot => ({ ...hotspot })),
        nextHotspotId: script.nextHotspotId,
        activeHotspotId: script.activeHotspotId,
        slots: script.slots.map(slot => slot ? { ...slot } : null),
        batches: script.batches.map(batch => ({
          ...batch,
          selectedVehicleIds: [...batch.selectedVehicleIds],
          enteredSlots: batch.enteredSlots.map(entry => ({ ...entry })),
          slotSnapshots: batch.slotSnapshots.map(snapshot => ({ ...snapshot })),
          departedVehicleIds: [...batch.departedVehicleIds]
        })),
        pending: {
          selectedVehicleIds: [...script.pending.selectedVehicleIds],
          enteredSlots: script.pending.enteredSlots.map(entry => ({ ...entry })),
          departedVehicleIds: [...script.pending.departedVehicleIds]
        },
        ocrStatus: script.ocrStatus,
        ocrError: script.ocrError
      };
    }

    function clearScriptWorkspace(state) {
      if (!isValidState(state)) return state;
      return {
        ...state,
        script: {
          ...createEmptyScript(),
          savedLevels: state.script.savedLevels.map(level => cloneJson(level)),
          nextLevelId: state.script.nextLevelId
        }
      };
    }

    function saveScriptLevel(state, name) {
      if (!isValidState(state)) return state;
      const levelName = typeof name === 'string' && name.trim() !== ''
        ? name.trim()
        : state.script.levelName.trim() || `第 ${state.script.nextLevelId} 关`;
      const savedLevel = {
        id: state.script.nextLevelId,
        name: levelName,
        savedAt: new Date().toISOString(),
        data: cloneScriptWorkspace({ ...state.script, levelName })
      };
      return {
        ...state,
        script: {
          ...state.script,
          levelName,
          savedLevels: [...state.script.savedLevels, savedLevel],
          nextLevelId: state.script.nextLevelId + 1
        }
      };
    }

    function loadScriptLevel(state, levelId) {
      if (!isValidState(state) || !Number.isSafeInteger(levelId)) return state;
      const level = state.script.savedLevels.find(item => item.id === levelId);
      if (!level) return state;
      return {
        ...state,
        script: {
          ...cloneJson(level.data),
          savedLevels: state.script.savedLevels.map(item => cloneJson(item)),
          nextLevelId: state.script.nextLevelId
        }
      };
    }

    function deleteScriptLevel(state, levelId) {
      if (!isValidState(state) || !Number.isSafeInteger(levelId)) return state;
      return {
        ...state,
        script: {
          ...state.script,
          savedLevels: state.script.savedLevels.filter(level => level.id !== levelId)
        }
      };
    }

    function setScriptScreenshot(state, dataUrl) {
      if (!isValidState(state) || typeof dataUrl !== 'string') return state;
      return { ...state, script: { ...state.script, screenshotDataUrl: dataUrl } };
    }

    function setScriptLevelName(state, levelName) {
      if (!isValidState(state) || typeof levelName !== 'string') return state;
      return { ...state, script: { ...state.script, levelName: levelName.trim() } };
    }

    function setScriptOcrStatus(state, status, error = '') {
      if (!isValidState(state) || !['idle', 'loading', 'done', 'error'].includes(status)) return state;
      return { ...state, script: { ...state.script, ocrStatus: status, ocrError: String(error || '') } };
    }

    function applyScriptOcrWords(state, words, imageWidth, imageHeight) {
      if (!isValidState(state) || !Array.isArray(words) || !imageWidth || !imageHeight) return state;
      return words.reduce((nextState, word) => {
        const text = String(word.text || '').replace(/\D/g, '');
        const vehicleId = parsePositiveInteger(text);
        const box = word.bbox || {};
        if (vehicleId === null || !Number.isFinite(box.x0) || !Number.isFinite(box.y0) || !Number.isFinite(box.x1) || !Number.isFinite(box.y1)) {
          return nextState;
        }
        const xPercent = ((box.x0 + box.x1) / 2 / imageWidth) * 100;
        const yPercent = ((box.y0 + box.y1) / 2 / imageHeight) * 100;
        const widthPercent = Math.max(4, ((box.x1 - box.x0) / imageWidth) * 160);
        const heightPercent = Math.max(4, ((box.y1 - box.y0) / imageHeight) * 180);
        return addScriptHotspot(nextState, {
          vehicleId,
          xPercent,
          yPercent,
          widthPercent,
          heightPercent,
          source: 'ocr',
          confidence: Number(word.confidence)
        });
      }, state);
    }

    function isMappedValue(state, value) {
      return Boolean(state
        && Array.isArray(state.colors)
        && Number.isSafeInteger(value)
        && value > 0
        && state.colors.some(color => color && color.value === value));
    }

    function isDenseArray(array) {
      if (!Array.isArray(array) || Reflect.ownKeys(array).length !== array.length + 1) return false;

      for (let index = 0; index < array.length; index += 1) {
        if (!Object.prototype.hasOwnProperty.call(array, index)) return false;
      }

      return true;
    }

    function isValidQueue(queue, mappedValues) {
      return isDenseArray(queue)
        && queue.every(value => Number.isSafeInteger(value) && value > 0 && mappedValues.has(value));
    }

    function hasExactKeys(candidate, expectedKeys) {
      return candidate
        && typeof candidate === 'object'
        && !Array.isArray(candidate)
        && Object.keys(candidate).length === expectedKeys.length
        && expectedKeys.every(key => Object.prototype.hasOwnProperty.call(candidate, key));
    }

    function isValidSections(sections, mappedValues, validateHistory) {
      return hasExactKeys(sections, SECTIONS)
        && SECTIONS.every(section => validateHistory
          ? isDenseArray(sections[section])
            && sections[section].every(queue => isValidQueue(queue, mappedValues))
          : isValidQueue(sections[section], mappedValues));
    }

    function isValidVehicle(vehicle, mappedValues) {
      return vehicle === null || (hasExactKeys(vehicle, VEHICLE_KEYS)
        && Number.isSafeInteger(vehicle.id)
        && vehicle.id > 0
        && Number.isSafeInteger(vehicle.colorValue)
        && mappedValues.has(vehicle.colorValue)
        && VEHICLE_CAPACITIES.includes(vehicle.capacity)
        && Number.isInteger(vehicle.remaining)
        && vehicle.remaining >= 0
        && vehicle.remaining <= vehicle.capacity
        && Number.isSafeInteger(vehicle.enteredStep)
        && vehicle.enteredStep > 0);
    }

    function isValidParking(parking, mappedValues) {
      return hasExactKeys(parking, PARKING_KEYS)
        && isDenseArray(parking.slots)
        && parking.slots.length === 4
        && parking.slots.every(slot => isValidVehicle(slot, mappedValues))
        && isDenseArray(parking.logs)
        && parking.logs.every((log, index) => hasExactKeys(log, LOG_KEYS)
          && Number.isSafeInteger(log.step)
          && log.step === index + 1
          && typeof log.selectedVehicle === 'string'
          && typeof log.enteredSlot === 'string'
          && isDenseArray(log.slots)
          && log.slots.length === 4
          && log.slots.every(slot => typeof slot === 'string')
          && typeof log.departedVehicles === 'string'
          && typeof log.occupancyDurations === 'string'
          && typeof log.note === 'string')
        && Number.isSafeInteger(parking.nextVehicleId)
        && parking.nextVehicleId > 0
        && isDenseArray(parking.savedGames)
        && parking.savedGames.every(game => hasExactKeys(game, SAVED_GAME_KEYS)
          && Number.isSafeInteger(game.id)
          && game.id > 0
          && typeof game.name === 'string'
          && game.name.trim() !== ''
          && typeof game.savedAt === 'string'
          && isDenseArray(game.slots)
          && game.slots.length === 4
          && game.slots.every(slot => typeof slot === 'string')
          && isDenseArray(game.logs)
          && game.logs.every((log, index) => hasExactKeys(log, LOG_KEYS)
            && Number.isSafeInteger(log.step)
            && log.step === index + 1
            && typeof log.selectedVehicle === 'string'
            && typeof log.enteredSlot === 'string'
            && isDenseArray(log.slots)
            && log.slots.length === 4
            && log.slots.every(slot => typeof slot === 'string')
            && typeof log.departedVehicles === 'string'
            && typeof log.occupancyDurations === 'string'
            && typeof log.note === 'string'))
        && Number.isSafeInteger(parking.nextGameId)
        && parking.nextGameId > 0
        && hasExactKeys(parking.pending, PENDING_KEYS)
        && typeof parking.pending.selectedVehicle === 'string'
        && typeof parking.pending.enteredSlot === 'string'
        && isDenseArray(parking.pending.departedVehicles)
        && parking.pending.departedVehicles.every(vehicle => typeof vehicle === 'string')
        && isDenseArray(parking.pending.occupancyDurations)
        && parking.pending.occupancyDurations.every(duration => typeof duration === 'string');
    }

    function isValidScriptVehicle(vehicle, mappedValues) {
      return hasExactKeys(vehicle, SCRIPT_VEHICLE_KEYS)
        && Number.isSafeInteger(vehicle.id)
        && vehicle.id > 0
        && Number.isSafeInteger(vehicle.colorValue)
        && mappedValues.has(vehicle.colorValue)
        && VEHICLE_CAPACITIES.includes(vehicle.capacity)
        && Number.isSafeInteger(vehicle.depth)
        && vehicle.depth > 0
        && isDenseArray(vehicle.frontVehicleIds)
        && vehicle.frontVehicleIds.every(id => Number.isSafeInteger(id) && id > 0)
        && isDenseArray(vehicle.backVehicleIds)
        && vehicle.backVehicleIds.every(id => Number.isSafeInteger(id) && id > 0);
    }

    function isValidScriptHotspot(hotspot) {
      return hasExactKeys(hotspot, SCRIPT_HOTSPOT_KEYS)
        && Number.isSafeInteger(hotspot.id)
        && hotspot.id > 0
        && Number.isSafeInteger(hotspot.vehicleId)
        && hotspot.vehicleId >= 0
        && Number.isFinite(hotspot.xPercent)
        && hotspot.xPercent >= 0
        && hotspot.xPercent <= 100
        && Number.isFinite(hotspot.yPercent)
        && hotspot.yPercent >= 0
        && hotspot.yPercent <= 100
        && Number.isFinite(hotspot.widthPercent)
        && hotspot.widthPercent > 0
        && hotspot.widthPercent <= 100
        && Number.isFinite(hotspot.heightPercent)
        && hotspot.heightPercent > 0
        && hotspot.heightPercent <= 100
        && ['manual', 'ocr'].includes(hotspot.source)
        && (hotspot.confidence === null || Number.isFinite(hotspot.confidence))
        && ['editing', 'saved'].includes(hotspot.status);
    }

    function isValidScriptSlot(slot, mappedValues) {
      return slot === null || (hasExactKeys(slot, SCRIPT_SLOT_KEYS)
        && Number.isSafeInteger(slot.vehicleId)
        && slot.vehicleId > 0
        && Number.isSafeInteger(slot.colorValue)
        && mappedValues.has(slot.colorValue)
        && VEHICLE_CAPACITIES.includes(slot.capacity)
        && Number.isInteger(slot.remaining)
        && slot.remaining >= 0
        && slot.remaining <= slot.capacity
        && Number.isSafeInteger(slot.enteredBatch)
        && slot.enteredBatch > 0);
    }

    function isValidScriptEnteredSlot(entry) {
      return hasExactKeys(entry, SCRIPT_ENTERED_SLOT_KEYS)
        && Number.isSafeInteger(entry.vehicleId)
        && entry.vehicleId > 0
        && Number.isInteger(entry.slot)
        && entry.slot >= 1
        && entry.slot <= 4;
    }

    function isValidScriptSlotSnapshot(snapshot) {
      return hasExactKeys(snapshot, SCRIPT_SLOT_SNAPSHOT_KEYS)
        && Number.isInteger(snapshot.slot)
        && snapshot.slot >= 1
        && snapshot.slot <= 4
        && ((snapshot.vehicleId === null && snapshot.remaining === null && snapshot.capacity === null)
          || (Number.isSafeInteger(snapshot.vehicleId)
            && snapshot.vehicleId > 0
            && Number.isInteger(snapshot.remaining)
            && snapshot.remaining >= 0
            && VEHICLE_CAPACITIES.includes(snapshot.capacity)
            && snapshot.remaining <= snapshot.capacity));
    }

    function isValidScriptBatch(batch, index) {
      return hasExactKeys(batch, SCRIPT_BATCH_KEYS)
        && Number.isSafeInteger(batch.batch)
        && batch.batch === index + 1
        && isDenseArray(batch.selectedVehicleIds)
        && batch.selectedVehicleIds.every(id => Number.isSafeInteger(id) && id > 0)
        && isDenseArray(batch.enteredSlots)
        && batch.enteredSlots.every(isValidScriptEnteredSlot)
        && isDenseArray(batch.slotSnapshots)
        && batch.slotSnapshots.length === 4
        && batch.slotSnapshots.every(isValidScriptSlotSnapshot)
        && isDenseArray(batch.departedVehicleIds)
        && batch.departedVehicleIds.every(id => Number.isSafeInteger(id) && id > 0)
        && typeof batch.note === 'string';
    }

    function isValidScriptWorkspaceData(data, mappedValues) {
      return data
        && typeof data === 'object'
        && hasExactKeys(data, SCRIPT_KEYS.filter(key => key !== 'savedLevels' && key !== 'nextLevelId'))
        && typeof data.levelName === 'string'
        && hasExactKeys(data.queuesText, SCRIPT_QUEUE_TEXT_KEYS)
        && SCRIPT_QUEUE_TEXT_KEYS.every(key => typeof data.queuesText[key] === 'string')
        && typeof data.vehicleTableText === 'string'
        && isDenseArray(data.vehicles)
        && data.vehicles.every(vehicle => isValidScriptVehicle(vehicle, mappedValues))
        && isDenseArray(data.vehicleErrors)
        && data.vehicleErrors.every(error => typeof error === 'string')
        && typeof data.screenshotDataUrl === 'string'
        && isDenseArray(data.hotspots)
