        summary,
        roleSummary,
        pathSummary,
        layerSummary: pathAnnotatedResult.layerSummary,
        keyPathVehicles: pathAnnotatedResult.keyPathVehicles,
        deepDependencyVehicles: pathAnnotatedResult.deepDependencyVehicles,
        layoutFreedom,
        finalBelt: [...working.belt],
        finalReserveQueue: [...working.reserveQueue],
        finalSlots: working.slots.map(cloneSimulationSlot),
        errors: []
      };
    }

    function setStableSimulationInput(state, input) {
      if (!isValidState(state) || !input || typeof input !== 'object') return state;
      const nextFields = {
        levelName: typeof input.levelName === 'string' ? input.levelName.trim() : state.simulation.levelName,
        conveyorCapacity: typeof input.conveyorCapacity === 'string' ? input.conveyorCapacity.trim() : state.simulation.conveyorCapacity,
        passengerQueueText: typeof input.passengerQueueText === 'string' ? input.passengerQueueText.trim() : state.simulation.passengerQueueText,
        vehicleTableText: typeof input.vehicleTableText === 'string' ? input.vehicleTableText.trim() : state.simulation.vehicleTableText,
        clickSequenceText: typeof input.clickSequenceText === 'string' ? input.clickSequenceText.trim() : state.simulation.clickSequenceText
      };
      const inputChanged = nextFields.levelName !== state.simulation.levelName
        || nextFields.conveyorCapacity !== state.simulation.conveyorCapacity
        || nextFields.passengerQueueText !== state.simulation.passengerQueueText
        || nextFields.vehicleTableText !== state.simulation.vehicleTableText
        || nextFields.clickSequenceText !== state.simulation.clickSequenceText;
      return {
        ...state,
        simulation: {
          ...state.simulation,
          ...nextFields,
          result: inputChanged ? null : state.simulation.result,
          errors: inputChanged ? [] : state.simulation.errors
        }
      };
    }

    function clampPercent(value) {
      return Number.isFinite(value) ? Math.min(100, Math.max(0, value)) : null;
    }

    function setStableSimulationScreenshot(state, dataUrl) {
      if (!isValidState(state) || typeof dataUrl !== 'string') return state;
      return {
        ...state,
        simulation: {
          ...state.simulation,
          screenshotDataUrl: dataUrl
        }
      };
    }

    function addStableSimulationHotspot(state, input) {
      if (!isValidState(state) || !input || typeof input !== 'object') return state;
      const vehicleId = parseVehicleId(input.vehicleId);
      const xPercent = clampPercent(Number(input.xPercent));
      const yPercent = clampPercent(Number(input.yPercent));
      if (vehicleId === null || xPercent === null || yPercent === null) return state;

      const hotspot = {
        id: state.simulation.nextHotspotId,
        vehicleId,
        xPercent,
        yPercent
      };
      return {
        ...state,
        simulation: {
          ...state.simulation,
          hotspots: [...state.simulation.hotspots, hotspot],
          nextHotspotId: state.simulation.nextHotspotId + 1
        }
      };
    }

    function deleteStableSimulationHotspot(state, hotspotId) {
      if (!isValidState(state) || !Number.isSafeInteger(hotspotId)) return state;
      return {
        ...state,
        simulation: {
          ...state.simulation,
          hotspots: state.simulation.hotspots.filter(hotspot => hotspot.id !== hotspotId)
        }
      };
    }

    function runStableSimulationState(state) {
      if (!isValidState(state)) return state;
      const result = runStableSimulation(state, state.simulation);
      return {
        ...state,
        simulation: {
          ...state.simulation,
          result: result.errors.length > 0 ? null : result,
          errors: result.errors
        }
      };
    }

    function clearStableSimulation(state) {
      if (!isValidState(state)) return state;
      return { ...state, simulation: createEmptySimulation() };
    }

    function setQueueFitInput(state, input) {
      if (!isValidState(state) || !input || typeof input !== 'object') return state;
      const nextFields = {
        levelName: typeof input.levelName === 'string' ? input.levelName.trim() : state.queueFit.levelName,
        conveyorCapacity: typeof input.conveyorCapacity === 'string' ? input.conveyorCapacity.trim() : state.queueFit.conveyorCapacity,
        passengerQueueText: typeof input.passengerQueueText === 'string' ? input.passengerQueueText.trim() : state.queueFit.passengerQueueText,
        vehicleTableText: typeof input.vehicleTableText === 'string' ? input.vehicleTableText.trim() : state.queueFit.vehicleTableText,
        targetRecordFilename: typeof input.targetRecordFilename === 'string' ? input.targetRecordFilename.trim() : state.queueFit.targetRecordFilename,
        targetRecordText: typeof input.targetRecordText === 'string' ? input.targetRecordText.trim() : state.queueFit.targetRecordText
      };
      const inputChanged = nextFields.levelName !== state.queueFit.levelName
        || nextFields.conveyorCapacity !== state.queueFit.conveyorCapacity
        || nextFields.passengerQueueText !== state.queueFit.passengerQueueText
        || nextFields.vehicleTableText !== state.queueFit.vehicleTableText
        || nextFields.targetRecordFilename !== state.queueFit.targetRecordFilename
        || nextFields.targetRecordText !== state.queueFit.targetRecordText;
      return {
        ...state,
        queueFit: {
          ...state.queueFit,
          ...nextFields,
          fittedPassengerQueueText: inputChanged ? '' : state.queueFit.fittedPassengerQueueText,
          fittedClickSequenceText: inputChanged ? '' : state.queueFit.fittedClickSequenceText,
          score: inputChanged ? 0 : state.queueFit.score,
          roleSummary: inputChanged ? [] : state.queueFit.roleSummary,
          errors: inputChanged ? [] : state.queueFit.errors
        }
      };
    }

    function runQueueFitState(state) {
      if (!isValidState(state)) return state;
      const fitted = fitStableSimulationPassengerQueue(state, state.queueFit);
      return {
        ...state,
        queueFit: {
          ...state.queueFit,
          fittedPassengerQueueText: fitted.errors.length > 0 ? '' : fitted.passengerQueueText,
          fittedClickSequenceText: fitted.errors.length > 0 ? '' : fitted.clickSequenceText,
          score: fitted.errors.length > 0 ? 0 : fitted.score,
          roleSummary: fitted.errors.length > 0 ? [] : fitted.roleSummary,
          errors: fitted.errors
        }
      };
    }

    function clearQueueFit(state) {
      if (!isValidState(state)) return state;
      return { ...state, queueFit: createEmptyQueueFit() };
    }

    function getStableSimulationClickTokens(text) {
      return typeof text === 'string' && text.trim() !== ''
        ? text.split(',').map(token => token.trim()).filter(Boolean)
        : [];
    }

    function setStableSimulationClickTokens(state, tokens, runAfterChange = true) {
      const nextState = setStableSimulationInput(state, {
        clickSequenceText: tokens.join(',')
      });
      return runAfterChange && tokens.length > 0
        ? runStableSimulationState(nextState)
        : nextState;
    }

    function appendStableSimulationClick(state, vehicleId) {
      if (!isValidState(state) || parseVehicleId(vehicleId) === null) return state;
      const tokens = getStableSimulationClickTokens(state.simulation.clickSequenceText);
      tokens.push(String(vehicleId));
      return runStableSimulationState(setStableSimulationInput(state, {
        clickSequenceText: tokens.join(',')
      }));
    }

    function appendStableSimulationHotspotClick(state, hotspotId) {
      if (!isValidState(state) || !Number.isSafeInteger(hotspotId)) return state;
      const hotspot = state.simulation.hotspots.find(item => item.id === hotspotId);
      return hotspot ? appendStableSimulationClick(state, hotspot.vehicleId) : state;
    }

    function undoStableSimulationClick(state) {
      if (!isValidState(state)) return state;
      const tokens = getStableSimulationClickTokens(state.simulation.clickSequenceText);
      if (tokens.length === 0) return state;
      tokens.pop();
      return setStableSimulationClickTokens(state, tokens, true);
    }

    function deleteStableSimulationClickAt(state, index) {
      if (!isValidState(state) || !Number.isInteger(index) || index < 0) return state;
      const tokens = getStableSimulationClickTokens(state.simulation.clickSequenceText);
      if (index >= tokens.length) return state;
      tokens.splice(index, 1);
      return setStableSimulationClickTokens(state, tokens, true);
    }

    function clearStableSimulationClicks(state) {
      if (!isValidState(state)) return state;
      return {
        ...state,
        simulation: {
          ...state.simulation,
          clickSequenceText: '',
          result: null,
          errors: []
        }
      };
    }

    function getStableSimulationVehicleOptions(currentState) {
      const parsed = parseScriptVehicleTable(currentState.simulation.vehicleTableText);
      const vehicles = parsed.vehicles
        .filter(vehicle => isScriptColorValue(currentState, vehicle.colorValue))
        .sort((a, b) => a.id - b.id);
      const errors = [
        ...parsed.errors,
        ...parsed.vehicles
          .filter(vehicle => !isScriptColorValue(currentState, vehicle.colorValue))
          .map(vehicle => `车辆 ${vehicle.id} 的颜色映射 ${vehicle.colorValue} 不存在`)
      ];
      return { vehicles, errors };
    }

    function formatStableSimulationSlot(state, vehiclesById, slot, index) {
      if (!slot) return `${index + 1}:空`;
      return `${index + 1}:${formatStableSimulationVehicle(state, vehiclesById, slot.vehicleId)} 剩${slot.remaining}`;
    }

    function formatStableSimulationConsumption(state, vehiclesById, consumption) {
      return consumption.length
        ? consumption.map(item => `上客 ${item.count}（${formatStableSimulationVehicle(state, vehiclesById, item.vehicleId)}）`).join('、')
        : '无';
    }

    function formatStableSimulationRoleSummary(state, vehiclesById, roleSummary) {
      if (!Array.isArray(roleSummary) || roleSummary.length === 0) return '无';
      return roleSummary
        .map(group => `${group.role}：${group.vehicleIds.map(id => formatStableSimulationVehicle(state, vehiclesById, id)).join('、')}`)
        .join('；');
    }

    function formatStableSimulationPathSummary(state, vehiclesById, pathSummary) {
      if (!Array.isArray(pathSummary) || pathSummary.length === 0) return '无';
      return pathSummary
        .map(group => `${group.role}：${group.vehicleIds.map(id => formatStableSimulationVehicle(state, vehiclesById, id)).join('、')}`)
        .join('；');
    }

    function formatStableSimulationLayerSummary(state, vehiclesById, layerSummary) {
      if (!Array.isArray(layerSummary) || layerSummary.length === 0) return '无';
      return layerSummary
        .map(group => `${group.layerLabel}：${group.vehicleIds.map(id => formatStableSimulationVehicle(state, vehiclesById, id)).join('、')}`)
        .join('；');
    }

    function formatStableSimulationKeyPathVehicles(state, vehiclesById, vehicles) {
      if (!Array.isArray(vehicles) || vehicles.length === 0) return '无';
      return vehicles
        .map(vehicle => `${formatStableSimulationVehicle(state, vehiclesById, vehicle.vehicleId)}（后方${vehicle.backCount}）`)
        .join('、');
    }

    function formatStableSimulationDeepDependencyVehicles(state, vehiclesById, vehicles) {
      if (!Array.isArray(vehicles) || vehicles.length === 0) return '无';
      return vehicles
        .map(vehicle => `${formatStableSimulationVehicle(state, vehiclesById, vehicle.vehicleId)}（深度${vehicle.depth}/前方${vehicle.frontCount}）`)
        .join('、');
    }

    function formatStableSimulationSwappableGroups(state, vehiclesById, layoutFreedom) {
      const groups = layoutFreedom && Array.isArray(layoutFreedom.swappableGroups) ? layoutFreedom.swappableGroups : [];
      if (groups.length === 0) return '无';
      return groups
        .map(group => `${group.vehicleIds.map(id => formatStableSimulationVehicle(state, vehiclesById, id)).join(' ↔ ')}（${group.reason}）`)
        .join('；');
    }

    function formatStableSimulationFreeVehicles(state, vehiclesById, layoutFreedom) {
      const vehicleIds = layoutFreedom && Array.isArray(layoutFreedom.freelyPlaceableVehicleIds)
        ? layoutFreedom.freelyPlaceableVehicleIds
        : [];
      return vehicleIds.length > 0 ? vehicleIds.map(id => formatStableSimulationVehicle(state, vehiclesById, id)).join('、') : '无';
    }

    function formatStableSimulationRigidVehicles(state, vehiclesById, layoutFreedom) {
      const vehicles = layoutFreedom && Array.isArray(layoutFreedom.rigidVehicles) ? layoutFreedom.rigidVehicles : [];
      if (vehicles.length === 0) return '无';
      return vehicles
        .map(vehicle => `${formatStableSimulationVehicle(state, vehiclesById, vehicle.vehicleId)}（${vehicle.reason}）`)
        .join('、');
    }

    function getStableSimulationReportText(state) {
      if (!isValidState(state)) return '# 立即结算模拟\n\n状态无效';
      const title = state.simulation.levelName.trim() || '未命名关卡';
      const result = state.simulation.result;
      const parsedVehicles = parseScriptVehicleTable(state.simulation.vehicleTableText).vehicles;
      const vehiclesById = new Map(parsedVehicles.map(vehicle => [vehicle.id, vehicle]));
      const lines = [
        `# ${title} 立即结算模拟`,
        '',
        '## 输入',
        `传送带容量：${state.simulation.conveyorCapacity || '未填写'}`,
        `点击顺序：${state.simulation.clickSequenceText || '未填写'}`,
        '',
        '## 步骤日志',
        '步骤\t点击车辆\t分层车辆id\t结算角色\t路径角色\t进入车位\t上客统计\t开走车辆\t车位状态\t传送带\t补充队列剩余\t警告'
      ];

      if (state.simulation.errors.length > 0) {
        lines.push(`错误\t${state.simulation.errors.join('；')}`);
      } else if (result && result.steps.length > 0) {
        result.steps.forEach(step => {
          lines.push([
            step.step,
            formatStableSimulationVehicle(state, vehiclesById, step.clickedVehicleId),
            step.layeredVehicleId || `L?:#${step.clickedVehicleId}`,
            step.role || '未标注',
            step.pathRole || '未标注',
            step.enteredSlot === null ? '进车失败' : `进车位 ${step.enteredSlot}`,
            formatStableSimulationConsumption(state, vehiclesById, step.consumption),
            step.departedVehicleIds.length > 0
              ? `开走 ${step.departedVehicleIds.map(id => formatStableSimulationVehicle(state, vehiclesById, id)).join('、')}`
              : '无',
            step.slots.map((slot, index) => formatStableSimulationSlot(state, vehiclesById, slot, index)).join(' | '),
            step.belt.join(',') || '空',
            step.reserveQueueRemaining,
            step.warnings.join('；') || '无'
          ].join('\t'));
        });
      } else if (result) {
        lines.push('无\t已运行，0 步');
      } else {
        lines.push('无\t尚未运行模拟');
      }

      lines.push('', '## 总览');
      if (result) lines.push(...result.summary);
      if (result) {
        lines.push(`最终车位：${result.finalSlots.some(Boolean)
          ? result.finalSlots.map((slot, index) => formatStableSimulationSlot(state, vehiclesById, slot, index)).join(' | ')
          : '空'}`);
      }
      if (!result && state.simulation.errors.length === 0) lines.push('尚未运行模拟');
      return lines.join('\n');
    }

    function getSafeStableSimulationFilenamePart(value) {
      const name = String(value || '').trim()
        .replace(/[<>:"/\\|?*\u0000-\u001F]/g, '_')
        .replace(/\s+/g, ' ');
      return name || '未命名关卡';
    }

    function getStableSimulationMarkdownFilename(state) {
      if (!isValidState(state)) return '立即结算模拟.md';
      return `${getSafeStableSimulationFilenamePart(state.simulation.levelName)}-立即结算模拟.md`;
    }

    function isMappedValue(state, value) {
      return Boolean(state
        && Array.isArray(state.colors)
        && Number.isSafeInteger(value)
        && value > 0
        && state.colors.some(color => color && color.value === value));
    }

    function isDenseArray(array) {
      if (!Array.isArray(array) || Reflect.ownKeys(array).length !== array.length + 1) return false;

      for (let index = 0; index < array.length; index += 1) {
        if (!Object.prototype.hasOwnProperty.call(array, index)) return false;
      }

      return true;
    }

    function isValidQueue(queue, mappedValues) {
      return isDenseArray(queue)
        && queue.every(value => Number.isSafeInteger(value) && value > 0 && mappedValues.has(value));
    }

    function hasExactKeys(candidate, expectedKeys) {
      return candidate
        && typeof candidate === 'object'
        && !Array.isArray(candidate)
        && Object.keys(candidate).length === expectedKeys.length
        && expectedKeys.every(key => Object.prototype.hasOwnProperty.call(candidate, key));
    }

    function isValidSections(sections, mappedValues, validateHistory) {
      return hasExactKeys(sections, SECTIONS)
        && SECTIONS.every(section => validateHistory
          ? isDenseArray(sections[section])
            && sections[section].every(queue => isValidQueue(queue, mappedValues))
          : isValidQueue(sections[section], mappedValues));
    }

    function isValidSimulationResult(result) {
      return result === null || (result
        && typeof result === 'object'
        && Array.isArray(result.steps)
        && Array.isArray(result.summary)
        && Array.isArray(result.finalBelt)
        && Array.isArray(result.finalReserveQueue)
        && Array.isArray(result.finalSlots)
        && result.finalSlots.length === 4);
    }

    function isValidSimulationHotspot(hotspot) {
      return hasExactKeys(hotspot, SIMULATION_HOTSPOT_KEYS)
        && Number.isSafeInteger(hotspot.id)
        && hotspot.id > 0
        && Number.isSafeInteger(hotspot.vehicleId)
        && hotspot.vehicleId >= 0
        && Number.isFinite(hotspot.xPercent)
        && hotspot.xPercent >= 0
        && hotspot.xPercent <= 100
        && Number.isFinite(hotspot.yPercent)
        && hotspot.yPercent >= 0
        && hotspot.yPercent <= 100;
    }

    function isValidSimulation(simulation) {
      return hasExactKeys(simulation, SIMULATION_KEYS)
        && typeof simulation.levelName === 'string'
        && typeof simulation.conveyorCapacity === 'string'
        && typeof simulation.passengerQueueText === 'string'
        && typeof simulation.vehicleTableText === 'string'
        && typeof simulation.clickSequenceText === 'string'
        && typeof simulation.screenshotDataUrl === 'string'
        && isDenseArray(simulation.hotspots)
        && simulation.hotspots.every(isValidSimulationHotspot)
        && Number.isSafeInteger(simulation.nextHotspotId)
        && simulation.nextHotspotId > 0
        && isValidSimulationResult(simulation.result)
        && isDenseArray(simulation.errors)
        && simulation.errors.every(error => typeof error === 'string');
    }

    function isValidQueueFit(queueFit) {
      return hasExactKeys(queueFit, QUEUE_FIT_KEYS)
        && typeof queueFit.levelName === 'string'
        && typeof queueFit.conveyorCapacity === 'string'
        && typeof queueFit.passengerQueueText === 'string'
        && typeof queueFit.vehicleTableText === 'string'
        && typeof queueFit.targetRecordFilename === 'string'
        && typeof queueFit.targetRecordText === 'string'
        && typeof queueFit.fittedPassengerQueueText === 'string'
        && typeof queueFit.fittedClickSequenceText === 'string'
        && Number.isFinite(queueFit.score)
        && isDenseArray(queueFit.roleSummary)
        && queueFit.roleSummary.every(group => group
          && typeof group === 'object'
          && typeof group.role === 'string'
          && isDenseArray(group.vehicleIds)
          && group.vehicleIds.every(vehicleId => Number.isSafeInteger(vehicleId) && vehicleId >= 0))
        && isDenseArray(queueFit.errors)
        && queueFit.errors.every(error => typeof error === 'string');
    }

    function isValidState(candidate) {
      if (!hasExactKeys(candidate, STATE_KEYS)
        || !isDenseArray(candidate.colors)
        || candidate.colors.length === 0) {
        return false;
      }

      const mappedValues = new Set();
      const hasValidColors = candidate.colors.every(color => {
        const isValid = hasExactKeys(color, COLOR_KEYS)
          && typeof color.name === 'string'
          && color.name.trim() !== ''
          && Number.isSafeInteger(color.value)
          && color.value > 0
          && !mappedValues.has(color.value)
          && typeof color.hex === 'string'
          && HEX_PATTERN.test(color.hex);

        if (isValid) mappedValues.add(color.value);
        return isValid;
      });

      return hasValidColors
        && isValidSections(candidate.queues, mappedValues, false)
        && isValidSections(candidate.histories, mappedValues, true)
        && isValidSimulation(candidate.simulation)
        && isValidQueueFit(candidate.queueFit)
        && STAGES.includes(candidate.activeStage);
    }

    function normalizeSimulationForCurrentVersion(simulation) {
      return simulation && typeof simulation === 'object'
        ? { ...createEmptySimulation(), ...simulation }
        : createEmptySimulation();
    }

    function normalizeQueueFitForCurrentVersion(queueFit) {
      if (!queueFit || typeof queueFit !== 'object') return createEmptyQueueFit();
      const normalized = { ...createEmptyQueueFit(), ...queueFit };
      normalized.roleSummary = Array.isArray(queueFit.roleSummary) ? queueFit.roleSummary : [];
      normalized.errors = Array.isArray(queueFit.errors) ? queueFit.errors : [];
      normalized.score = Number.isFinite(queueFit.score) ? queueFit.score : 0;
      return normalized;
    }

    function normalizeLoadedState(candidate) {
      if (!candidate || typeof candidate !== 'object') return createInitialState();
      const loadableKeys = new Set([...STATE_KEYS, 'parking', 'script']);
      if (!Object.keys(candidate).every(key => loadableKeys.has(key))) return createInitialState();
      const candidateWithCurrentData = {
        colors: candidate.colors,
        queues: candidate.queues,
        histories: candidate.histories,
        simulation: normalizeSimulationForCurrentVersion(candidate.simulation),
        queueFit: normalizeQueueFitForCurrentVersion(candidate.queueFit),
        activeStage: STAGES.includes(candidate.activeStage) ? candidate.activeStage : 'conveyor'
      };
      return isValidState(candidateWithCurrentData) ? candidateWithCurrentData : createInitialState();
    }

    function loadState() {
      try {
        const storedState = JSON.parse(localStorage.getItem(STORAGE_KEY));
        return normalizeLoadedState(storedState);
      } catch {
        return createInitialState();
      }
    }

    function saveState(nextState) {
      if (!isValidState(nextState)) return false;

      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(nextState));
        return true;
      } catch {
        return false;
      }
    }

      return (red * 299 + green * 587 + blue * 114) / 1000 > 170;

        );

          const isClicked = clickedVehicleIds.has(hotspot.vehicleId);
          const marker = document.createElement('button');

          marker.dataset.hotspotId = String(hotspot.id);
          marker.style.left = `${hotspot.xPercent}%`;
          marker.style.top = `${hotspot.yPercent}%`;
          marker.textContent = isClicked ? '✓' : `#${hotspot.vehicleId}`;
          marker.title = isClicked ? `车辆 #${hotspot.vehicleId} 已记录` : `记录车辆 #${hotspot.vehicleId}`;
          marker.disabled = isClicked;
          marker.setAttribute('aria-label', marker.title);
          wrap.append(marker);
        });

        stageContainer.append(wrap);
      }

    function getStableSimulationRecordLevelLabel(levelKey) {
      return levelKey ? `第${levelKey}关` : '未识别关卡';
    }

    function createStableSimulationRecordMarkdown(filename, text) {
      return {
        filename,
        text,
        levelKey: getStableSimulationRecordLevelKey(filename, text),
        error: ''
      };
    }

    function createStableSimulationRecordVehicleTable(filename, text) {
      return {
        filename,
        text,
        levelKey: getStableSimulationRecordLevelKey(filename, text)
      };
    }

    function createStableSimulationRecordExportError(filename, message, levelKey = '', vehicleTableSource = '', sourceWarning = '') {
      return {
        filename: getStableSimulationAnnotatedRecordFilename(filename),
        text: '',
        steps: [],
        roleSummary: [],
        pathSummary: [],
        layerSummary: [],
        keyPathVehicles: [],
        deepDependencyVehicles: [],
        levelKey,
        vehicleTableSource,
        sourceWarning,
        errors: [message]
      };
    }

    function getStableSimulationRecordVehicleSource(record, fallbackVehicleTableText = '') {
      const fallbackText = typeof fallbackVehicleTableText === 'string' ? fallbackVehicleTableText : '';
      const levelKey = record && record.levelKey ? record.levelKey : '';
      const matchedTables = levelKey
        ? stableSimulationRecordVehicleTables.filter(table => table.levelKey === levelKey)
        : [];

      if (matchedTables.length > 0) {
        return {
          text: matchedTables[0].text,
          name: matchedTables[0].filename,
          warning: matchedTables.length > 1
            ? `${getStableSimulationRecordLevelLabel(levelKey)}有 ${matchedTables.length} 份 CSV，已使用 ${matchedTables[0].filename}`
            : ''
        };
      }

      if (!levelKey && stableSimulationRecordMarkdowns.length <= 1 && stableSimulationRecordVehicleTables.length === 1) {
        const onlyTable = stableSimulationRecordVehicleTables[0];
        return {
          text: onlyTable.text,
          name: onlyTable.filename,
          warning: `旧 MD 未识别关卡号，已使用唯一导入的 ${onlyTable.filename}`
        };
      }

      if (stableSimulationRecordVehicleTables.length > 0) {
        return {
          text: '',
          name: '未匹配到车辆表 CSV',
          warning: levelKey
            ? `未找到${getStableSimulationRecordLevelLabel(levelKey)}对应的 CSV`
            : '旧 MD 未识别关卡号，未自动套用其它关卡 CSV'
        };
      }

      if (fallbackText.trim()) {
        return {
          text: fallbackText,
          name: '上方车辆数据表文本',
          warning: levelKey
            ? `未导入${getStableSimulationRecordLevelLabel(levelKey)} CSV，已回退使用上方文本`
            : '旧 MD 未识别关卡号，已回退使用上方文本'
        };
      }

      return {
        text: '',
        name: '未提供车辆数据表',
        warning: levelKey
          ? `未导入${getStableSimulationRecordLevelLabel(levelKey)} CSV，路径/分层按缺省数据标注`
          : '旧 MD 未识别关卡号，路径/分层按缺省数据标注'
      };
    }

    function rebuildStableSimulationRecordExports() {
      const simulationInput = getStableSimulationInputFromDom();
      stableSimulationRecordExports = stableSimulationRecordMarkdowns.map(record => {
        const source = getStableSimulationRecordVehicleSource(record, simulationInput.vehicleTableText);
        if (record.error) {
          return createStableSimulationRecordExportError(
            record.filename,
            record.error,
            record.levelKey,
            source.name,
            source.warning
          );
        }

        const annotated = annotateStableSimulationReportMarkdown(record.filename, record.text, source.text, state);
        return {
          ...annotated,
          levelKey: record.levelKey,
          vehicleTableSource: source.name,
          sourceWarning: source.warning
        };
      });
    }

    function formatStableSimulationRecordVehicleTableStatus() {
      const parts = [];
      if (stableSimulationRecordVehicleTables.length > 0) {
        const tableLabels = stableSimulationRecordVehicleTables.map(table => (
          `${table.filename}（${getStableSimulationRecordLevelLabel(table.levelKey)}）`
        ));
        parts.push(`已导入车辆数据表 CSV：${tableLabels.join('、')}`);
      } else {
        parts.push('未导入车辆数据表 CSV；旧 MD 会回退使用上方车辆数据表文本。');

      if (stableSimulationRecordVehicleTableErrors.length > 0) {
        parts.push(`CSV 读取失败：${stableSimulationRecordVehicleTableErrors.join('；')}`);
      }

      return parts.join('；');
    }

    function fallbackCopyText(text) {
      const textarea = document.createElement('textarea');
      textarea.value = text;
      textarea.setAttribute('readonly', '');
      textarea.style.position = 'fixed';
      textarea.style.left = '-9999px';
      document.body.append(textarea);

      try {
        textarea.select();
        if (!document.execCommand('copy')) throw new Error('Clipboard fallback failed.');
      } finally {
        textarea.remove();
      }
    }

    async function copyText(text, button) {
      try {
        if (navigator.clipboard && typeof navigator.clipboard.writeText === 'function') {
          try {
            await navigator.clipboard.writeText(text);
          } catch (error) {
            fallbackCopyText(text);
          }
        } else {
          fallbackCopyText(text);
        }

        const previousLabel = button.textContent;
        button.textContent = '已复制';
        window.setTimeout(() => {
          if (button.isConnected) button.textContent = previousLabel;
        }, 1200);
        return true;
      } catch (error) {
        button.textContent = '复制失败';
        return false;
      }
    }

    function downloadTextFile(filename, text, mimeType = 'text/plain;charset=utf-8') {
      const blob = new Blob([text], { type: mimeType });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = filename;
      link.style.display = 'none';
      document.body.append(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
    }

    function readFileAsDataUrl(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.addEventListener('load', () => resolve(String(reader.result || '')));
        reader.addEventListener('error', () => reject(reader.error || new Error('图片读取失败')));
        reader.readAsDataURL(file);
      });
    }

    function readFileAsText(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.addEventListener('load', () => resolve(String(reader.result || '')));
        reader.addEventListener('error', () => reject(reader.error || new Error('CSV 读取失败')));
        reader.readAsText(file, 'UTF-8');
      });
    }

      };
      return {
        levelName: readField('levelName'),
        conveyorCapacity: readField('conveyorCapacity'),
        passengerQueueText: readField('passengerQueueText'),
        vehicleTableText: readField('vehicleTableText'),
        targetRecordFilename: state.queueFit.targetRecordFilename,
        targetRecordText: readField('targetRecordText')
      };
    }

    stageNav.addEventListener('click', event => {
      const button = event.target.closest('.stage-button[data-stage]');
      if (!button) return;
      updateState({ ...state, activeStage: button.dataset.stage });
    });

    workspace.addEventListener('click', event => {
      const screenshotWrap = event.target.closest('.stable-simulation-screenshot-wrap[data-screenshot-stage]');
      if (screenshotWrap && state.activeStage === 'simulation' && !event.target.closest('button')) {
        const idInput = workspace.querySelector('#simulationManualVehicleId');
        const vehicleId = idInput ? idInput.value : '';
        const rect = screenshotWrap.getBoundingClientRect();
        if (rect.width > 0 && rect.height > 0) {
          updateState(addStableSimulationHotspot(
            setStableSimulationInput(state, getStableSimulationInputFromDom()),
            {
              vehicleId,
              xPercent: ((event.clientX - rect.left) / rect.width) * 100,
              yPercent: ((event.clientY - rect.top) / rect.height) * 100
            }
          ));
        }
        return;
      }

      const target = event.target.closest('button');
      if (!target) return;

      if (target.matches('.color-button[data-value]')) {
        updateState(appendValue(state, state.activeStage, Number(target.dataset.value)));
      } else if (target.matches('.color-quick-button[data-value][data-delta]')) {
        const value = Number(target.dataset.value);
        const delta = Number(target.dataset.delta);
        if (delta > 0) {
          updateState(appendBatchValues(state, state.activeStage, Array(delta).fill(value)));
        } else {
          updateState(removeBatchValues(state, state.activeStage, value, Math.abs(delta)));
        }
      } else if (target.matches('.sequence-chip[data-index]')) {
        updateState(removeAt(state, state.activeStage, Number(target.dataset.index)));
      } else if (target.matches('[data-action="undo"]')) {
        updateState(undo(state, state.activeStage));
      } else if (target.matches('[data-action="next"]')) {
        const nextStage = STAGES[STAGES.indexOf(state.activeStage) + 1];
        if (nextStage) updateState({ ...state, activeStage: nextStage });
      } else if (target.matches('[data-action="add-color"]')) {
        openAddColorDialog();
      } else if (target.matches('[data-action="copy-config"][data-config-key]')) {
        void copyText(getConfigs(state)[target.dataset.configKey], target);
      } else if (target.matches('[data-action="next-level"]')) {
        updateState(startNextLevel(state));
      } else if (target.matches('[data-action="reset-everything"]')
        && window.confirm('确定要清空全部队列和自定义颜色吗？')) {
        updateState(resetEverything());
      } else if (target.matches('[data-action="append-stable-simulation-click"][data-vehicle-id]')) {
        updateState(appendStableSimulationClick(
          setStableSimulationInput(state, getStableSimulationInputFromDom()),
          Number(target.dataset.vehicleId)
        ));
      } else if (target.matches('[data-action="append-stable-simulation-hotspot-click"][data-hotspot-id]')) {
        updateState(appendStableSimulationHotspotClick(
          setStableSimulationInput(state, getStableSimulationInputFromDom()),
          Number(target.dataset.hotspotId)
        ));
      } else if (target.matches('[data-action="download-stable-simulation-record-md"][data-record-index]')) {
        const recordIndex = parseNonNegativeInteger(target.dataset.recordIndex);
        const record = recordIndex === null ? null : stableSimulationRecordExports[recordIndex];
        if (record && record.errors.length === 0) {
          downloadTextFile(record.filename, record.text, 'text/markdown;charset=utf-8');
        }
      } else if (target.matches('[data-action="download-stable-simulation-record-md-all"]')) {
        stableSimulationRecordExports
          .filter(record => record.errors.length === 0)
          .forEach(record => downloadTextFile(record.filename, record.text, 'text/markdown;charset=utf-8'));
      } else if (target.matches('[data-action="run-stable-simulation"]')) {
        updateState(runStableSimulationState(setStableSimulationInput(state, getStableSimulationInputFromDom())));
      } else if (target.matches('[data-action="copy-stable-simulation-report"]')) {
        void copyText(getStableSimulationReportText(setStableSimulationInput(state, getStableSimulationInputFromDom())), target);
      } else if (target.matches('[data-action="download-stable-simulation-md"]')) {
        const reportState = setStableSimulationInput(state, getStableSimulationInputFromDom());
        downloadTextFile(
          getStableSimulationMarkdownFilename(reportState),
          getStableSimulationReportText(reportState),
          'text/markdown;charset=utf-8'
        );
      } else if (target.matches('[data-action="undo-stable-simulation-click"]')) {
        updateState(undoStableSimulationClick(setStableSimulationInput(state, getStableSimulationInputFromDom())));
      } else if (target.matches('[data-action="delete-stable-simulation-step"][data-step-index]')) {
        updateState(deleteStableSimulationClickAt(
          setStableSimulationInput(state, getStableSimulationInputFromDom()),
          Number(target.dataset.stepIndex)
        ));
      } else if (target.matches('[data-action="delete-stable-simulation-hotspot"][data-hotspot-id]')) {
        updateState(deleteStableSimulationHotspot(
          setStableSimulationInput(state, getStableSimulationInputFromDom()),
          Number(target.dataset.hotspotId)
        ));
      } else if (target.matches('[data-action="clear-stable-simulation-clicks"]')
        && window.confirm('确定要清空点击车辆记录吗？基础输入会保留。')) {
        updateState(clearStableSimulationClicks(setStableSimulationInput(state, getStableSimulationInputFromDom())));
      } else if (target.matches('[data-action="clear-stable-simulation"]')
        && window.confirm('确定要清空立即结算模拟输入和结果吗？')) {
        updateState(clearStableSimulation(state));
      } else if (target.matches('[data-action="run-queue-fit"]')) {
        updateState(runQueueFitState(setQueueFitInput(state, getQueueFitInputFromDom())));
      } else if (target.matches('[data-action="copy-queue-fit-passenger"]')) {
        void copyText(state.queueFit.fittedPassengerQueueText, target);
      } else if (target.matches('[data-action="copy-queue-fit-clicks"]')) {
        void copyText(state.queueFit.fittedClickSequenceText, target);
      } else if (target.matches('[data-action="clear-queue-fit"]')
        && window.confirm('确定要清空拟合队列输入和结果吗？')) {
        updateState(clearQueueFit(state));
      }
    });

    workspace.addEventListener('change', event => {
      const target = event.target;
      if ((target instanceof HTMLInputElement || target instanceof HTMLTextAreaElement)
        && target.matches('.simulation-input[data-simulation-field]')) {
        const field = target.dataset.simulationField;
        updateState(setStableSimulationInput(state, getStableSimulationInputFromDom()));
        if (field === 'vehicleTableText' && stableSimulationRecordMarkdowns.length > 0 && stableSimulationRecordVehicleTables.length === 0) {
          rebuildStableSimulationRecordExports();
          renderStableSimulationRecordExports(workspace.querySelector('.stable-simulation-md-export-list'));
        }
      } else if (target instanceof HTMLInputElement && target.matches('#simulationVehicleCsvFile') && target.files && target.files[0]) {
        void readFileAsText(target.files[0]).then(text => {
          const textarea = workspace.querySelector('.simulation-input[data-simulation-field="vehicleTableText"]');
          if (textarea instanceof HTMLTextAreaElement) textarea.value = text;
          updateState(setStableSimulationInput(state, {
            ...getStableSimulationInputFromDom(),
            vehicleTableText: text
          }));
        }).catch(error => {
          const textarea = workspace.querySelector('.simulation-input[data-simulation-field="vehicleTableText"]');
          if (textarea instanceof HTMLTextAreaElement) {
            textarea.value = error && error.message ? error.message : 'CSV 读取失败';
          }
        });
      } else if ((target instanceof HTMLInputElement || target instanceof HTMLTextAreaElement)
        && target.matches('.queue-fit-input[data-queue-fit-field]')) {
        updateState(setQueueFitInput(state, getQueueFitInputFromDom()));
      } else if (target instanceof HTMLInputElement && target.matches('#queueFitVehicleCsvFile') && target.files && target.files[0]) {
        void readFileAsText(target.files[0]).then(text => {
          const textarea = workspace.querySelector('.queue-fit-input[data-queue-fit-field="vehicleTableText"]');
          if (textarea instanceof HTMLTextAreaElement) textarea.value = text;
          updateState(setQueueFitInput(state, {
            ...getQueueFitInputFromDom(),
            vehicleTableText: text
          }));
        }).catch(error => {
          const textarea = workspace.querySelector('.queue-fit-input[data-queue-fit-field="vehicleTableText"]');
          if (textarea instanceof HTMLTextAreaElement) {
            textarea.value = error && error.message ? error.message : 'CSV 读取失败';
          }
        });
      } else if (target instanceof HTMLInputElement && target.matches('#queueFitRecordMdFile') && target.files && target.files[0]) {
        const file = target.files[0];
        void readFileAsText(file).then(text => {
          const textarea = workspace.querySelector('.queue-fit-input[data-queue-fit-field="targetRecordText"]');
          if (textarea instanceof HTMLTextAreaElement) textarea.value = text;
          updateState(setQueueFitInput(state, {
            ...getQueueFitInputFromDom(),
            targetRecordFilename: file.name,
            targetRecordText: text
          }));
        }).catch(error => {
          const textarea = workspace.querySelector('.queue-fit-input[data-queue-fit-field="targetRecordText"]');
          if (textarea instanceof HTMLTextAreaElement) {
            textarea.value = error && error.message ? error.message : 'MD 读取失败';
          }
        });
      } else if (target instanceof HTMLInputElement && target.matches('#simulationRecordVehicleCsvFile') && target.files && target.files.length > 0) {
        const files = [...target.files];
        void Promise.all(files.map(file => readFileAsText(file)
          .then(text => ({
            table: createStableSimulationRecordVehicleTable(file.name, text),
            error: ''
          }))
          .catch(error => ({
            table: null,
            error: `${file.name}：${error && error.message ? error.message : 'CSV 读取失败'}`
          })))).then(results => {
          stableSimulationRecordVehicleTables = results
            .filter(result => result.table)
            .map(result => result.table);
          stableSimulationRecordVehicleTableErrors = results
            .filter(result => result.error)
            .map(result => result.error);
          rebuildStableSimulationRecordExports();
          renderStableSimulationRecordExports(workspace.querySelector('.stable-simulation-md-export-list'));
        });
      } else if (target instanceof HTMLInputElement && target.matches('#simulationRecordMdFiles') && target.files && target.files.length > 0) {
        const files = [...target.files];
        void Promise.all(files.map(file => readFileAsText(file)
          .then(text => createStableSimulationRecordMarkdown(file.name, text))
          .catch(error => ({
            filename: file.name,
            text: '',
            levelKey: getStableSimulationRecordLevelKey(file.name),
            error: error && error.message ? error.message : 'MD 读取失败'
          })))).then(records => {
          stableSimulationRecordMarkdowns = records;
          rebuildStableSimulationRecordExports();
          renderStableSimulationRecordExports(workspace.querySelector('.stable-simulation-md-export-list'));
        });
      } else if (target instanceof HTMLInputElement && target.matches('#simulationScreenshotFile') && target.files && target.files[0]) {
        void readFileAsDataUrl(target.files[0]).then(dataUrl => {
          updateState(setStableSimulationScreenshot(
            setStableSimulationInput(state, getStableSimulationInputFromDom()),
            dataUrl
          ));
        }).catch(error => {
          window.alert(error && error.message ? error.message : '图片读取失败');
        });
      }
    });

    addColorDialog.querySelector('[data-action="cancel-color"]').addEventListener('click', () => {
      addColorDialog.close();
    });

    addColorForm.addEventListener('submit', event => {
      event.preventDefault();
      if (colorName.value.trim() === '') {
        colorError.textContent = '请输入颜色名称。';
        colorName.focus();
        return;
      }

      const nextState = addColor(state, colorName.value, colorHex.value);
      if (nextState === state) {
        colorError.textContent = '颜色保存失败，请检查输入。';
        return;
      }

      addColorDialog.close();
      updateState(nextState);
    });

    document.addEventListener('keydown', event => {
      if (addColorDialog.open
        || !SECTIONS.includes(state.activeStage)
        || (event.target instanceof Element && event.target.closest('input, textarea, select'))) {
        return;
      }

      if (event.ctrlKey && event.key.toLowerCase() === 'z') {
        event.preventDefault();
        updateState(undo(state, state.activeStage));
        return;
      }

      if (!event.ctrlKey && !event.metaKey && !event.altKey && /^[0-9]$/.test(event.key)) {
        updateState(appendValue(state, state.activeStage, Number(event.key)));
      }
    });

    window.QueueRecorderApp = Object.freeze({
      getState: () => state,
      updateState,
      render,
      copyText
    });

    render();
  </script>
</body>
</html>
